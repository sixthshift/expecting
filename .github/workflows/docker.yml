# Builds the image and publishes it to GitHub's registry as
# ghcr.io/<owner>/<repo> on every push to main (tagged latest, by the new
# version and by commit) and every v* tag (tagged by version). Pull requests
# build without pushing.
# The test and e2e jobs gate the image: nothing ships that does not pass
# `bun run check`, `bun run test`, `bun run lint` and `bun run e2e` on the same
# Bun the image runs.
# A push to main also bumps package.json's version before the build, by what
# the commits since the last tag ask for (scripts/version.ts, Conventional
# Commits). The image carries that version, and the bumped package.json is
# committed back to main with a matching v tag once the image is published —
# `[skip ci]` so the bot's own commit does not start this again — and the tag
# is published as a GitHub release, its notes written by scripts/version.ts
# from the commits since the last one (GitHub's generator lists pull requests,
# and this repo pushes straight to main), with GitHub's compare link after them.
# The bump also writes the household's notes, content/releases/<version>.md,
# which the image bundles and the release commit carries.
# docker/docker-compose.yml pulls the latest tag. test/docker/workflow.test.ts
# asserts this contract.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# One release at a time: two runs bumping and pushing at once would race for
# the version and for main.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

# Each job has a limit a few times its usual length, so a hang fails the run
# within the hour instead of holding main's queue for Actions' default six.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run lint

  # The built app in a real browser: every page loads without an error.
  # Beside the test job, not after it, so the gate takes the longer of the two.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The image, a half per platform, each built on a runner of its own kind:
  # amd64 on ubuntu-latest, arm64 natively on GitHub's arm runner rather than
  # under emulation, which hung mid-build more than once. Each half is pushed
  # by its digest, untagged; the image job joins them under the tags.
  build:
    needs: [test, e2e]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/version.ts reads the commits since the last v* tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Writes the new version into package.json so the build inlines it, and
      # outputs it, with the path of the release notes it wrote. Only on a push
      # to main: a pull request and a hand-made tag build the version already
      # committed. It's worked out from the commits, so both halves and the
      # image job get the same one.
      - id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run version:next
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # For the labels: the image's version among them.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # priority beats latest's, so the image's own version label and
            # the summary read 1.2.3 rather than "latest".
            type=raw,value=${{ steps.bump.outputs.version }},priority=1000,enable=${{ steps.bump.outputs.version != '' }}
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # By digest, untagged: the image job puts both halves under the tags.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Inlined beside the version, so Settings and every error say which commit is running.
          build-args: EXPECTING_COMMIT=${{ github.sha }}
          # A cache each, so the two halves don't write over each other's.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: keep the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The two halves joined into one image under its tags (nothing is rebuilt:
  # it writes the index), then the version committed and released. Not for a
  # pull request, which builds without publishing.
  image:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The bump commit and its tag go back to main.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The same version the halves were built with, and its notes, to commit and release.
      - id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run version:next
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # priority beats latest's, so the image's own version label and
            # the summary read 1.2.3 rather than "latest".
            type=raw,value=${{ steps.bump.outputs.version }},priority=1000,enable=${{ steps.bump.outputs.version != '' }}
            type=semver,pattern={{version}}
            type=sha
      - id: join
        name: join the halves under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
      # Last, so a version is only spent on an image that published.
      - name: commit the version and tag it
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The household's notes for the release are a new file, so they are added by name. The first
          # release keeps package.json's version, so there may be nothing to commit, only to tag.
          git add package.json content/releases
          git diff --cached --quiet || git commit -m "chore(release): v$VERSION [skip ci]"
          # Annotated, and both refs named on the push: --follow-tags alone
          # silently leaves a lightweight tag behind on the runner.
          git tag -a "v$VERSION" -m "expecting v$VERSION"
          git push origin HEAD:main "refs/tags/v$VERSION"
      - name: publish the release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          NOTES: ${{ steps.bump.outputs.notes }}
        # --generate-notes adds GitHub's compare link after the notes file.
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file "$NOTES" --generate-notes --verify-tag
