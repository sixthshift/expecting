# Scaffolded by the `devcontainer` skill.
#
# No db service: expecting stores data in SQLite via bun:sqlite, inside the
# workspace — there is no database process to run. If the project ever moves to
# Postgres, re-run the skill rather than hand-adding a service here.
services:
  dev:
    container_name: expecting-dev
    # Run tini as PID 1. `sleep infinity` has no SIGCHLD handler, so every
    # orphaned child (esbuild, bun, headless_shell) reparented to it became a
    # permanent zombie — ~190 of them after a few days. tini reaps them and
    # still forwards signals, so the clean shutdown below is preserved.
    init: true
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      # Keep node_modules in a container-private volume so the host (macOS)
      # and this Debian container don't fight over one bind-mounted dir:
      # native binaries are platform-specific, and `bun install` only
      # materializes the current platform's. post-start.sh repopulates it.
      - expecting-node-modules:/workspace/node_modules
      - claude-config:/root/.claude
      - codex-config:/root/.codex
      # Import the host Codex login without exposing the rest of its local
      # sessions, settings, or platform-specific state.
      - ~/.codex/auth.json:/run/host-codex-auth.json:ro
      # Commit identity + signing config. SSH keys are deliberately NOT
      # mounted — git auth uses SSH agent forwarding (VS Code forwards
      # SSH_AUTH_SOCK automatically when ssh-agent runs on the host).
      - ~/.gitconfig:/root/.gitconfig:ro
    env_file:
      # Relative to the compose project dir, which for a single-file setup is
      # this file's own directory. (Projects using the merge pattern put the
      # root compose file first, making the project dir the repo root — those
      # need `.devcontainer/.env` instead.)
      - .env
    environment:
      - NODE_ENV=development
      - TZ=Australia/Sydney
    ports:
      - '9966:9966' # Expecting dev server, expecting's port everywhere
      # Drizzle Studio listens on 4983 in the container; published on 4985 so
      # it does not collide with garnish and tally, which both take 4983.
      - '4985:4983' # Drizzle Studio
    # Optional: the machine-wide Traefik (LocalWorkspace/devproxy) routes
    # http://expecting.localhost on port 80 to the published 9966 above. Without
    # it these do nothing, and expecting.localhost:9966 or localhost:9966 still
    # work: browsers send any *.localhost name to this machine, and Vite
    # accepts those hosts by default.
    labels:
      traefik.enable: 'true'
      traefik.http.routers.expecting.rule: Host(`expecting.localhost`)
      traefik.http.services.expecting.loadbalancer.server.port: '9966'
    # The start hook lives here, not in devcontainer.json's `postStartCommand`,
    # because only the compose command fires on a plain `docker compose up`.
    # `exec` so the idle process is the container's main process (PID 2 under
    # tini) and stops cleanly, rather than a bash wrapper that swallows signals.
    command: bash -c 'bash /workspace/.devcontainer/post-start.sh; exec sleep infinity'
    working_dir: /workspace

volumes:
  expecting-node-modules:
    driver: local
  claude-config:
    driver: local
  codex-config:
    driver: local
