<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The installed app's icon, the same for everyone whatever the theme:
       lucide's Baby (lucide-react 0.511.0), white on a tile from baby blue to
       baby pink (sky 400 to blossom 400 in src/styles/theme/palette.css).
       icon-192.png, icon-512.png, icon-maskable-512.png and
       apple-touch-icon.png are rendered from it. The browser tab's icon is
       favicon*.svg, in the chosen theme. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84afd1"/>
      <stop offset="1" stop-color="#e08ca8"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5.5" fill="url(#g)"/>
  <g transform="translate(2.4 2.4) scale(.8)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/>
    <path d="M15 12h.01"/>
    <path d="M19.38 6.813A9 9 0 0 1 20.8 10.2a2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>
