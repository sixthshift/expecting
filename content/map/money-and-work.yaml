- id: car-seat
  title: The car seat
  type: moment
  topic: gear
  ask: What car seat do we need to bring the baby home?
  aliases:
    - car seat
    - capsule
    - infant restraint
    - AS/NZS 1754
    - rear-facing
    - fitting station
    - baby capsule
    - infant car seat
    - car seat fitting
  weeks: [ 30, 37 ]
  priority: 1
  stakes: high
  covers:
    - must meet AS/NZS 1754; babies up to 6 months of age must be in an approved rear-facing car seat, by law
    - rear-facing for as long as they fit, not just to 6 months
    - fitted correctly, by the instructions or an authorised fitter; never in front of an airbag
    - no swaddling in the seat
    - rear-facing and compliant
    - fitted and checked before labour
    - the car seat is on the hospital's going-home checklist (transport and baby car seat arranged)
  sources:
    - title: Pregnancy, Birth and Baby — Car and road safety for babies and children
      url: https://www.pregnancybirthbaby.org.au/car-safety-for-babies
    - title: Kidsafe NSW — Child car seats
