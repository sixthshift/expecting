- id: portable-cot
  title: Portable and folding cots
  type: guide
  topic: gear
  ask: Can the baby sleep in a portacot?
  aliases: [ portacot, travel cot, folding cot, porta cot ]
  weeks: [ 30, 42 ]
  priority: 3
  stakes: medium
  covers:
    - must meet the mandatory standard; check the label or manual
    - only the mattress it came with, never an extra one; mesh intact, locks working, assembled to the instructions
    - a weight limit, usually 15 kg; no bedding with exposed elastic
    - fine for sleeping, not only travel, while it's in good repair
  sources:
