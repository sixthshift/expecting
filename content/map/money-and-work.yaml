- id: second-hand-baby-gear
  title: Second-hand baby gear and recalls
  type: can-i
  topic: gear
  ask: Is it OK to buy baby things second-hand?
  aliases: [ second hand, hand-me-downs, marketplace, recalls, Product Safety Australia, used cot, used mattress ]
  weeks: [ 20, 38 ]
  priority: 1
  stakes: high
  covers:
    - "yes for most things, and it can reduce costs, as long as the item is safe: full instructions, all parts, sturdy and stable, no rough repairs, no damage or accident history"
    - check the Product Safety Australia recalls list by product and model before using or buying
    - cots and portacots must meet their standard even second-hand; the instructions note it and it is often on a label
    - a used mattress is fine if firm, flat, clean, undamaged and the right size; no rough repairs, no flaking old paint
    - "car seats: a separate, stricter answer"
  sources:
