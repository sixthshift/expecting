  notes: "Shown by `babies: more`. The allowance's own page refused to load; cite it once it does."

- id: stillborn-baby-payment
  title: The Stillborn Baby Payment
  type: payment
  topic: loss
  ask: Is there a payment after a stillbirth?
  aliases: [ Stillborn Baby Payment, stillbirth payment ]
  priority: 3
  stakes: medium
  covers:
    - a one-off $4,482.12 for a stillborn baby, under an income test or with FTB Part A eligibility
    - "or Parental Leave Pay instead, if you pass its tests: you choose between them"
    - leave from work and employer-paid leave can't be cancelled by the employer because of a stillbirth
  sources:
