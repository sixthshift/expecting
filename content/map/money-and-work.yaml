  type: decision
  topic: paperwork
  ask: Long day care, family day care, a nanny or the grandparents?
  aliases: [ long day care, family day care, nanny, au pair, occasional care, grandparent care, in home care ]
  weeks: [ 12, 30 ]
  who: together
  priority: 1
  stakes: medium
  covers:
    - "long day care: centre-based, from 6 weeks, long hours, subsidised, quality-rated, the longest waits"
    - "family day care: an educator's home, smaller groups, flexible hours, subsidised, registered under the same national rules"
    - "nannies and au pairs: unregulated, in your home, no subsidy (In Home Care is a narrow exception)"
