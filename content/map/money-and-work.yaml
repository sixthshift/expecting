# Money, leave, work, government and paperwork, and gear.
# Every figure below (rates, income limits, days of leave, thresholds) is the
# 2026–27 value or the value for a child born from 1 July 2026, and most of them
# change each 1 July (Medicare Safety Net thresholds each 1 January). Writers
# check them against the source on the day they write.

# ---------------------------------------------------------------------------
# Government payments
# ---------------------------------------------------------------------------

- id: parental-leave-pay
  title: Parental Leave Pay
  type: payment
  topic: money
  ask: What is Parental Leave Pay and how much do we get?
  aliases: [ PLP, paid parental leave, PPL, government maternity pay, Centrelink parental leave ]
  weeks: [ 20, 42 ]
  priority: 1
  stakes: high
  covers:
    - the government's payment while you care for a newborn, claimed through Services Australia (in many cases your employer delivers it); not your employer's own leave
    - for a child born from 1 July 2026 a family gets up to 130 days (26 weeks of weekdays); 120 for a child born from 1 July 2025
    - paid at the national minimum wage, $200.94 a day ($1,004.70 a 5-day week) in 2026–27, taxable
    - the rate follows the financial year the days are taken in, not the birth date
    - needs the work test, the income test, residence rules and the birth registered or applied for
    - you can't work on a Parental Leave Pay day
    - "twins or more: one set of days, for one child"
    - can be taken before, during or after employer-paid leave, annual leave or long service leave
  sources:
    - title: Services Australia — Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/parental-leave-pay
    - title: Services Australia — How much Parental Leave Pay you can get
      url: https://www.servicesaustralia.gov.au/how-much-parental-leave-pay-you-can-get
    - title: Services Australia — Paid Parental Leave scheme changes
      url: https://www.servicesaustralia.gov.au/paid-parental-leave-scheme-changes
    - title: Services Australia — Claiming timeframes for Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/claiming-timeframes-for-parental-leave-pay
  related: [ parental-leave-pay-claim, parental-leave-pay-work-test, parental-leave-pay-income-test, partner-reserved-days, parental-leave-pay-sharing, parental-leave-pay-superannuation, unpaid-parental-leave ]
  notes: Changes yearly. The daily rate changes each 1 July with the minimum wage; the number of days stepped up on 1 July 2024 (110), 2025 (120) and 2026 (130). Tailor by `work` for each parent.

- id: parental-leave-pay-claim
  title: Claim Parental Leave Pay before the birth
  type: payment
  topic: money
  ask: When can we claim Parental Leave Pay?
  aliases: [ pre-birth claim, claim PLP, Apply for Family Assistance, myGov claim ]
  weeks: [ 27, 36 ]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - claim up to 3 months before the due date, in myGov under Apply for Family Assistance (including Paid Parental Leave)
    - claiming early lets you choose the start date and gives an employer time to register and opt in
    - after the birth, add the baby's details and proof of birth within 56 days
    - to be paid from the birth date, claim and give proof of birth within 14 weeks or 100 days of it
    - the first parent must claim within 52 weeks of the birth; the other has 2 years; all days used within 2 years
    - the same claim covers Family Tax Benefit
    - a pre-birth claim submitted before 1 July 2026 shows 120 days until proof of birth confirms a birth from 1 July 2026, then 130
  sources:
    - title: Services Australia — Claiming timeframes for Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/claiming-timeframes-for-parental-leave-pay
    - title: Services Australia — How to claim Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/how-to-claim-parental-leave-pay
  related: [ parental-leave-pay, proof-of-birth, mygov-and-centrelink-setup, family-tax-benefit-claim ]
  exists: content/items/parental-leave-pay-claim.md

- id: parental-leave-pay-work-test
  title: The work test for Parental Leave Pay
  type: payment
  topic: money
  ask: Do I qualify for Parental Leave Pay if I've only worked part-time, or changed jobs?
  aliases: [ work test, 330 hours, 10 of 13 months, eligibility for PLP ]
  weeks: [ 16, 30 ]
  priority: 1
  stakes: high
  covers:
    - worked 10 of the 13 months before the birth, at least 330 hours in those 10 months (about a day a week)
    - no gap of more than 12 weeks between work days
    - several employers, paid leave and self-employment all count
    - the birth mother must pass it; for a partner to get days, both the partner and the birth mother must pass it
    - exceptions for pregnancy-related illness, complications, premature birth and dangerous jobs
  sources:
    - title: Services Australia — Work requirements for Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/work-requirements-for-parental-leave-pay
    - title: Services Australia — Meeting the work test
      url: https://www.servicesaustralia.gov.au/meeting-work-test-for-parental-leave-pay
    - title: Services Australia — Exceptions to the work test
      url: https://www.servicesaustralia.gov.au/exceptions-to-work-test-for-parental-leave-pay
  related: [ parental-leave-pay, parental-leave-pay-self-employed, parental-leave-pay-income-test ]
  notes: The 13 months is counted back from the birth, so a late-pregnancy job change or a long unpaid break can fail it; say so plainly, early.

- id: parental-leave-pay-income-test
  title: The income test for Parental Leave Pay
  type: payment
  topic: money
  ask: Do we earn too much for Parental Leave Pay?
  aliases: [ income limit, adjusted taxable income, family income test ]
  weeks: [ 16, 30 ]
  priority: 1
  stakes: high
  covers:
    - individual adjusted taxable income of $186,487 or less in 2025–26 (the financial year before the birth or the claim, whichever is earlier)
    - "if over that, a family test: $386,525 or less for you and your partner together"
    - each claiming parent is tested in their own right; one can qualify when the other doesn't
    - a single parent's income is tested against the family limit
  sources:
    - title: Services Australia — Meeting the income test for Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/meeting-income-test-for-parental-leave-pay
  related: [ parental-leave-pay, parental-leave-pay-work-test ]
  notes: Changes yearly, each 1 July. Which financial year is tested depends on the claim date, which is a reason to claim before the birth if income is rising.

- id: partner-reserved-days
  title: The partner's reserved Parental Leave Pay days
  type: payment
  topic: partner
  ask: How much Parental Leave Pay does the partner get?
  aliases: [ reserved days, use it or lose it, partner leave pay, dad's leave pay ]
  weeks: [ 26, 34 ]
  who: partner
  priority: 1
  stakes: high
  covers:
    - for a child born from 1 July 2026, 20 of the 130 days are reserved for the partner (15 from 1 July 2025, 10 from 1 July 2024)
    - the days are reserved for the partner to use; you decide together how to use the rest
    - the partner claims in their own name and must pass the work and income tests
    - up to 20 days can be taken at the same time as the other parent
  sources:
    - title: Services Australia — How much Parental Leave Pay you can get
      url: https://www.servicesaustralia.gov.au/how-much-parental-leave-pay-you-can-get
    - title: Services Australia — Work requirements for Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/work-requirements-for-parental-leave-pay
    - title: Services Australia — Meeting the income test for Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/meeting-income-test-for-parental-leave-pay
  related: [ parental-leave-pay, parental-leave-pay-sharing, partner-parental-leave ]
  exists: content/items/partner-reserved-days.md
  notes: Changes yearly by birth date.

- id: parental-leave-pay-sharing
  title: Sharing Parental Leave Pay between you
  type: payment
  topic: money
  ask: How do we split the Parental Leave Pay days between us?
  aliases: [ share PLP, approve sharing, days at the same time, concurrent days ]
  weeks: [ 26, 36 ]
  who: together
  priority: 1
  stakes: medium
  covers:
    - the birth mother claims first and approves sharing in myGov when the partner claims
    - claim only the days you'll take yourself; the rest can be shared or left in the balance
    - days can be a single block, several blocks or single days, within 2 years of the birth
    - up to 20 days can be taken together; more with an exemption
    - nominated days can be changed later
  sources:
    - title: Services Australia — Sharing your Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/sharing-your-parental-leave-pay
    - title: Services Australia — How to choose and share your days
      url: https://www.servicesaustralia.gov.au/how-to-choose-and-share-your-parental-leave-pay-days
  related: [ partner-reserved-days, parental-leave-pay-days-together, parental-leave-pay-employer-delivered ]
  notes: A decision in all but name. The app's `work` answers for each parent decide who can claim.

- id: parental-leave-pay-days-together
  title: Taking more Parental Leave Pay days together
  type: payment
  topic: money
  ask: Can we both be on leave pay at the same time for longer than 20 days?
  aliases: [ exemption, caesarean exemption, twins, NICU, concurrent leave ]
  weeks: [ 30, 42 ]
  who: together
  priority: 3
  stakes: medium
  covers:
    - the limit of 20 days together (10 for a child born before 1 July 2025) can be lifted
    - "automatic grounds: a multiple birth, a stillbirth or death"
    - "with evidence: a caesarean or a complication at birth, a baby in hospital 14 days or more, a child's or parent's medical condition"
    - ask in the claim or by calling the families line later
  sources:
    - title: Services Australia — Exemptions to the limit for taking days at the same time
      url: https://www.servicesaustralia.gov.au/exemptions-to-limit-for-taking-days-parental-leave-pay-same-time
  related: [ parental-leave-pay-sharing ]
  notes: Tailor by `birth` (a planned caesarean is a ground) and `babies`.

- id: parental-leave-pay-employer-delivered
  title: Who pays the Parental Leave Pay, and the tax on it
  type: payment
  topic: money
  ask: Does my employer pay the leave pay or does Centrelink?
  aliases: [ employer delivered, continuous block, 8 weeks, PAYG, 15 per cent tax ]
  weeks: [ 27, 36 ]
  priority: 2
  stakes: medium
  covers:
    - the employer delivers it if you've worked for them a year, the first block is at least 8 weeks of weekdays and starts within a year of the birth
    - otherwise Services Australia pays fortnightly in arrears; always for the self-employed
    - the employer must register with Services Australia before you claim to opt in when not required
    - changing nominated days can move payment from the employer to Services Australia
    - "taxable: Services Australia withholds 15% unless you ask for more; an employer withholds at your usual rate"
    - no super from the employer on these days (the ATO pays it instead)
  sources:
    - title: Services Australia — Getting your Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/getting-your-parental-leave-pay
    - title: Services Australia — Paid Parental Leave scheme for employers
      url: https://www.servicesaustralia.gov.au/paid-parental-leave-scheme-for-employers
  related: [ parental-leave-pay, parental-leave-pay-claim, parental-leave-pay-superannuation, budgeting-for-leave ]
  notes: Tailor by `work` and `paidLeave`. The 15% default often under-withholds at higher incomes; warn about tax time.

- id: parental-leave-pay-superannuation
  title: Super on Parental Leave Pay
  type: payment
  topic: money
  ask: Do we get superannuation on Parental Leave Pay?
  aliases: [ PPLSC, super on leave pay, ATO super contribution ]
  weeks: [ 27, 42 ]
  priority: 2
  stakes: low
  covers:
    - for a child born from 1 July 2025, the ATO pays 12% super on Parental Leave Pay, with interest, as a lump sum after the financial year ends
    - nothing to claim; it goes to the fund your super already goes to
    - keep name and address matching across the ATO, Services Australia and the fund
    - "shared days: each parent's contribution goes to their own fund"
  sources:
    - title: ATO — Paid Parental Leave Superannuation Contribution
      url: https://www.ato.gov.au/individuals-and-families/super-for-individuals-and-families/super/growing-and-keeping-track-of-your-super/how-to-save-more-in-your-super/government-super-contributions/paid-parental-leave-superannuation-contribution
    - title: Services Australia — Paid Parental Leave scheme changes
      url: https://www.servicesaustralia.gov.au/paid-parental-leave-scheme-changes
  related: [ parental-leave-pay, wills-and-guardianship ]
  notes: The rate follows the super guarantee; the first payments were due in 2026–27.

- id: parental-leave-pay-self-employed
  title: Parental Leave Pay when you're self-employed
  type: payment
  topic: work
  ask: Can I get Parental Leave Pay if I run my own business?
  aliases: [ sole trader, ABN, contractor leave pay, self-employed maternity leave ]
  weeks: [ 16, 36 ]
  priority: 2
  stakes: high
  covers:
    - "yes: hours worked for reward count toward the work test, even at a loss, including partnerships and trusts"
    - Services Australia pays you directly
    - you can't work on a Parental Leave Pay day, including on the business
    - there is no unpaid parental leave entitlement to request; the leave is whatever you arrange
    - an independent contractor is not an employee and gets no Fair Work parental leave
  sources:
    - title: Services Australia — Self-employed parents and the work test
      url: https://www.servicesaustralia.gov.au/self-employed-parents-work-test-for-parental-leave-pay
    - title: Services Australia — What can affect your Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/what-affects-your-parental-leave-pay
    - title: Fair Work Ombudsman — Independent contractors
      url: https://www.fairwork.gov.au/find-help-for/independent-contractors
  related: [ parental-leave-pay-work-test, parental-leave-pay-employer-delivered, unpaid-parental-leave ]
  notes: "Shown by `work: self-employed`. The \"more than one hour is work\" rule bites for people who answer email."

- id: newborn-supplement-and-upfront-payment
  title: The Newborn Upfront Payment and Newborn Supplement
  type: payment
  topic: money
  ask: Is there still a baby bonus?
  aliases: [ baby bonus, newborn payment, Newborn Supplement, lump sum for a baby ]
  weeks: [ 27, 42 ]
  priority: 2
  stakes: medium
  covers:
    - "a lump sum of $708 plus up to 13 weeks of extra Family Tax Benefit Part A: up to $2,125.76 for a first child, $709.80 for later ones"
    - only if nobody gets Parental Leave Pay for this child, so most working households choose between the two
    - "no separate claim: it comes with the Family Tax Benefit claim, which can be lodged 3 months before the due date"
    - not taxable; paid the way your FTB is paid
  sources:
    - title: Services Australia — Newborn Upfront Payment and Newborn Supplement
      url: https://www.servicesaustralia.gov.au/newborn-upfront-payment-and-newborn-supplement
    - title: Services Australia — How much you can get
      url: https://www.servicesaustralia.gov.au/how-much-newborn-upfront-payment-and-newborn-supplement-you-can-get
    - title: Services Australia — How to claim
      url: https://www.servicesaustralia.gov.au/how-to-claim-newborn-upfront-payment-and-newborn-supplement
  related: [ parental-leave-pay, family-tax-benefit-a, family-tax-benefit-claim ]
  notes: Changes yearly. The Baby Bonus people remember ended in 2014; this is what replaced it. Which is better depends on income and the work test; a household that fails the PLP work test should know this exists.

- id: family-tax-benefit-a
  title: Family Tax Benefit Part A
  type: payment
  topic: money
  ask: Will we get Family Tax Benefit?
  aliases: [ FTB A, FTB Part A, family payment, Centrelink family tax benefit ]
  weeks: [ 27, 42 ]
  priority: 1
  stakes: medium
  covers:
    - paid per child, by family income; maximum $235.48 a fortnight for a child 0–12, base rate $75.60
    - full rate up to $69,131 family income, tapering by 20 cents in the dollar, then by 30 cents over $123,078 until nil
    - a yearly supplement after balancing, up to $970.90 a child in 2026–27
    - the child must meet immunisation requirements or the rate is cut
    - the maximum rate brings a Health Care Card automatically
  sources:
    - title: Services Australia — Family Tax Benefit
      url: https://www.servicesaustralia.gov.au/family-tax-benefit
    - title: Services Australia — FTB Part A payment rates
      url: https://www.servicesaustralia.gov.au/family-tax-benefit-part-payment-rates?context=22151
    - title: Services Australia — Income test for FTB Part A
      url: https://www.servicesaustralia.gov.au/income-test-for-family-tax-benefit-part?context=22151
    - title: Services Australia — Health Care Card
      url: https://www.servicesaustralia.gov.au/health-care-card
  related: [ family-tax-benefit-b, family-tax-benefit-claim, immunisation-requirements-for-payments, newborn-supplement-and-upfront-payment, medicare-safety-net ]
  notes: Changes yearly, each 1 July. Many two-income households get nothing; say so rather than leave them guessing.

- id: family-tax-benefit-b
  title: Family Tax Benefit Part B
  type: payment
  topic: money
  ask: Is there a payment for a family with one income while one of us is home?
  aliases: [ FTB B, FTB Part B, single income family payment ]
  weeks: [ 27, 42 ]
  priority: 2
  stakes: medium
  covers:
    - for couples with one main income and a child under 13, or single parents
    - nothing if the higher earner is over $124,327
    - the lower earner can earn $7,154 before it tapers by 20 cents in the dollar; cuts out at $35,661 while the youngest is under 5
    - up to $200.34 a fortnight while the youngest is under 5, plus a yearly supplement up to $478.15 in 2026–27
    - not paid on days Parental Leave Pay is paid
  sources:
    - title: Services Australia — Income test for FTB Part B
      url: https://www.servicesaustralia.gov.au/income-test-for-family-tax-benefit-part-b
    - title: Services Australia — FTB Part B payment rates
      url: https://www.servicesaustralia.gov.au/family-tax-benefit-part-b-payment-rates?context=22151
  related: [ family-tax-benefit-a, family-tax-benefit-claim, parental-leave-pay, budgeting-for-leave ]
  notes: Changes yearly. The parent on leave is the "secondary earner" for the year, which is why it often starts once leave pay stops.

- id: family-tax-benefit-claim
  title: Claiming Family Tax Benefit
  type: payment
  topic: money
  ask: How and when do we claim Family Tax Benefit?
  aliases: [ claim FTB, fortnightly or lump sum, income estimate, balancing ]
  weeks: [ 27, 42 ]
  priority: 1
  stakes: high
  covers:
    - claim as early as 3 months before the due date, in the same myGov claim as Parental Leave Pay
    - "fortnightly: claim within 52 weeks of the birth and give an income estimate; a lump sum: by 30 June of the following financial year"
    - payment choices (all, base rate, or nothing until balancing) to avoid an overpayment debt
    - balanced after the end of the financial year; 12 months from the end of it to confirm income or claim a lump sum
    - proof of birth finishes the claim
  sources:
    - title: Services Australia — How to claim Family Tax Benefit
      url: https://www.servicesaustralia.gov.au/how-to-claim-family-tax-benefit
    - title: Services Australia — Payment choices for FTB
      url: https://www.servicesaustralia.gov.au/payment-choices-for-ftb
    - title: Services Australia — Time limits for lump sum claims and confirming income
      url: https://www.servicesaustralia.gov.au/time-limits-for-submitting-lump-sum-claims-and-confirming-income-for-family-tax-benefit
  related: [ family-tax-benefit-a, family-tax-benefit-b, parental-leave-pay-claim, proof-of-birth, mygov-and-centrelink-setup ]
  notes: Stakes high because the lump-sum deadline and the 52-week deadline are hard, and the overpayment debt is a real surprise in year one.

- id: child-care-subsidy
  title: The Child Care Subsidy
  type: payment
  topic: money
  ask: How much will childcare actually cost us after the subsidy?
  aliases: [ CCS, childcare rebate, childcare subsidy percentage, 3 Day Guarantee, activity test ]
  weeks: [ 12, 42 ]
  priority: 1
  stakes: high
  covers:
    - paid straight to an approved service to cut the fees; the percentage falls with family income from 90% up to $88,520, by 1% per $5,000, to nil at $538,520
    - from 5 January 2026 every eligible family gets at least 72 hours a fortnight of subsidised care; up to 100 with more recognised activity
    - your percentage applies to your hourly fee or the hourly rate cap, whichever is lower
    - "only approved care: centre-based day care, family day care, outside school hours care, in home care"
    - 5% is withheld each fortnight against an overpayment; the child must meet immunisation requirements
  sources:
    - title: Services Australia — Child Care Subsidy
      url: https://www.servicesaustralia.gov.au/child-care-subsidy
    - title: Services Australia — Your income can affect Child Care Subsidy
      url: https://www.servicesaustralia.gov.au/your-income-can-affect-child-care-subsidy
    - title: Services Australia — Hours of subsidised child care
      url: https://www.servicesaustralia.gov.au/hours-subsidised-child-care-for-child-care-subsidy
    - title: Services Australia — Who can get Child Care Subsidy
      url: https://www.servicesaustralia.gov.au/who-can-get-child-care-subsidy
  related: [ child-care-subsidy-claim, childcare-types, childcare-waitlists, immunisation-requirements-for-payments ]
  notes: Changes yearly (the family income thresholds and hourly rate caps usually change each 1 July). From 5 January 2026 every eligible family gets at least 72 hours a fortnight; older articles describe the old rules. StartingBlocks has a calculator.

- id: child-care-subsidy-claim
  title: Claiming the Child Care Subsidy before care starts
  type: payment
  topic: money
  ask: When should we apply for the Child Care Subsidy?
  aliases: [ claim CCS, confirm enrolment, Complying Written Arrangement, backdated 28 days ]
  weeks: [ 30, 42 ]
  priority: 2
  stakes: high
  covers:
    - "claim in myGov before the first day of care: it can only be backdated to a CCS fortnight starting no more than 28 days before the claim"
    - until it's approved you pay full fees
    - the service lodges an enrolment and you confirm it online; the child must attend within 26 weeks or it lapses
    - each person liable for the fees claims in their own right
    - 14% care (2 nights a fortnight) and residence rules
  sources:
    - title: Services Australia — How to claim Child Care Subsidy
      url: https://www.servicesaustralia.gov.au/how-to-claim-child-care-subsidy
    - title: Services Australia — Confirm enrolment for Child Care Subsidy
      url: https://www.servicesaustralia.gov.au/confirm-enrolment-for-child-care-subsidy
  related: [ child-care-subsidy, childcare-waitlists ]
  notes: "Shown by `childcare: yes`. The care itself starts after the birth; the heads-up here is that the claim must be in before day one."

- id: immunisation-requirements-for-payments
  title: Immunisation and your payments
  type: payment
  topic: paperwork
  ask: Do the baby's vaccinations affect our Centrelink payments?
  aliases: [ no jab no pay, immunisation requirements, Australian Immunisation Register, AIR, catch-up schedule ]
  weeks: [ 36, 42 ]
  priority: 2
  stakes: high
  covers:
    - Family Tax Benefit Part A and the Child Care Subsidy need the child up to date with the childhood schedule, on a catch-up, or with a medical exemption on the register
    - FTB Part A is cut by up to $36.54 a fortnight per child; CCS stops after 63 days and needs a new claim
    - checked automatically against the Australian Immunisation Register using the child's Medicare number; nothing to send
    - the baby is added to the register when enrolled in Medicare
  sources:
    - title: Services Australia — What are immunisation requirements (Family Tax Benefit)
      url: https://www.servicesaustralia.gov.au/what-are-immunisation-requirements?context=22151
    - title: Services Australia — Australian Immunisation Register
      url: https://www.servicesaustralia.gov.au/australian-immunisation-register
  related: [ family-tax-benefit-a, child-care-subsidy, medicare-enrol-baby ]
  notes: The penalty amount changes yearly. The baby's own schedule (6 weeks, 4 months, 6 months) belongs to the postpartum content; here it's the money.

- id: mygov-and-centrelink-setup
  title: Setting up myGov and Centrelink before the claim
  type: payment
  topic: paperwork
  ask: What do I need set up before I can claim anything?
  aliases: [ myGov, Customer Reference Number, CRN, link Centrelink, prove identity, Express Plus Centrelink ]
  weeks: [ 20, 27 ]
  priority: 1
  stakes: medium
  covers:
    - a myGov account linked to Centrelink and to Medicare, for each parent who will claim or approve sharing
    - a Centrelink Customer Reference Number, which can be issued online after proving identity in myGov
    - some identity checks still need a service centre visit; do it before week 27, not in the week you want to claim
    - the Express Plus Centrelink app for tracking the claim and uploading proof of birth
    - the partner needs their own linked account to approve shared Parental Leave Pay days
  sources:
    - title: Services Australia — Before the birth of your baby
      url: https://www.servicesaustralia.gov.au/before-birth-your-baby
    - title: Services Australia — Setting up online accounts for Centrelink
      url: https://www.servicesaustralia.gov.au/setting-up-online-accounts-for-centrelink
    - title: Services Australia — How to prove your identity with Centrelink
      url: https://www.servicesaustralia.gov.au/how-to-prove-your-identity-with-centrelink
  related: [ parental-leave-pay-claim, family-tax-benefit-claim, medicare-own-card ]
  notes: Both parents, so `who` is left open. A long-standing household often has one parent who has never dealt with Centrelink.

- id: medicare-enrol-baby
  title: Enrolling the baby in Medicare
  type: payment
  topic: paperwork
  ask: How do we get the baby on Medicare and get their Medicare card?
  aliases: [ baby Medicare card, Newborn Child Declaration, enrol newborn, add baby to Medicare card ]
  weeks: [ 36, 42 ]
  priority: 1
  stakes: high
  covers:
    - as soon as possible after the birth; the baby can go on both parents' cards (two cards at most)
    - the Newborn Child Declaration from the hospital's Parent Pack, signed by the doctor or midwife, does it, in the Centrelink claim or on its own in the Medicare online account
    - a new card arrives in 3 to 4 weeks; a digital card is immediate in the myGov app
    - enrolment also adds the baby to the Australian Immunisation Register and can register them for My Health Record and the Safety Net family
    - lost the declaration? the birth certificate instead
  sources:
    - title: Services Australia — Enrolling your baby in Medicare
      url: https://www.servicesaustralia.gov.au/enrolling-your-baby-medicare
    - title: Pregnancy, Birth and Baby — Adding your new baby to Medicare
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/adding-your-newborn-to-medicare
  related: [ proof-of-birth, medicare-own-card, immunisation-requirements-for-payments, medicare-safety-net, my-health-record-for-baby ]
  notes: An after-the-birth task; the weeks are the heads-up. Private patients need the number for the baby's own hospital bills too.

- id: medicare-own-card
  title: Your own Medicare card before the baby comes
  type: payment
  topic: paperwork
  ask: I'm still on my parents' Medicare card. Does that matter?
  aliases: [ own Medicare card, transfer Medicare card, copy to partner's card, two Medicare cards ]
  weeks: [ 20, 34 ]
  priority: 3
  stakes: medium
  covers:
    - you must be on your own card before you can enrol the baby
    - online in the Medicare account, or by form; the card takes 3 to 4 weeks, the digital one is immediate
    - a person can be on at most two cards, so the baby can be on both parents' cards
    - check the Safety Net registration when the card changes
  sources:
    - title: Services Australia — Have your own Medicare card and number
      url: https://www.servicesaustralia.gov.au/have-your-own-medicare-card-and-number-if-youre-15-or-older-and-enrolled-medicare
    - title: Services Australia — Before the birth of your baby
      url: https://www.servicesaustralia.gov.au/before-birth-your-baby
  related: [ medicare-enrol-baby, medicare-safety-net ]

- id: medicare-safety-net
  title: The Medicare Safety Net
  type: payment
  topic: money
  ask: Is there a cap on what we pay out of pocket for scans and specialists?
  aliases:
    - safety net
    - Extended Medicare Safety Net
    - EMSN
    - register as a family
    - gap
    - out of pocket
    - extended Medicare safety net
  weeks: [ 6, 42 ]
  priority: 2
  stakes: medium
  covers:
    - "out-of-hospital costs only: GP, obstetrician's rooms, scans and bloods, not the hospital stay"
    - "2026 thresholds: $594.40 gap for everyone (then 100% of the schedule fee), $2,699.10 out of pocket (then 80% back), $861.20 for concession and FTB A families"
    - counted per calendar year, 1 January to 31 December, so a pregnancy spanning two years counts twice
    - register as a couple or family (a form or a call), once; add the baby when enrolling them
    - only verified, fully paid accounts count
    - once out-of-hospital costs pass a threshold in a calendar year, Medicare pays more of each bill
    - register as a family so both parents' bills count together, singles are registered automatically
    - obstetrician consultations and scans count, hospital bills do not
    - thresholds reset on 1 January
  sources:
    - title: Services Australia — Medicare Safety Nets
      url: https://www.servicesaustralia.gov.au/medicare-safety-nets
    - title: Services Australia — What are the thresholds
      url: https://www.servicesaustralia.gov.au/what-are-medicare-safety-nets-thresholds
    - title: Services Australia — How to register for Medicare Safety Nets
      url: https://www.servicesaustralia.gov.au/how-to-register-for-medicare-safety-nets
    - title: Pregnancy, Birth and Baby — Private health insurance and pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/private-health-insurance-and-pregnancy
  related:
    - cost-of-having-a-baby
    - private-health-waiting-periods
    - medicare-enrol-baby
    - what-medicare-covers
    - obstetrician-out-of-pocket-costs
  notes: Thresholds change each 1 January. A private-obstetrician pregnancy usually crosses the extended threshold; registering as a family early is the whole task. Medicare for the scans and the obstetrician's fees themselves are in tests and care. Thresholds change each year; the entry must say to check the current figure, not quote one.
  who: together

- id: dad-and-partner-pay
  title: Dad and Partner Pay is gone
  type: card
  topic: partner
  ask: Is there a separate two weeks' pay for dads?
  aliases: [ Dad and Partner Pay, DAPP, dad's two weeks ]
  who: partner
  priority: 3
  stakes: low
  covers:
    - the two-week Dad and Partner Pay ended for births from 1 July 2023 and claims closed 30 June 2024
    - it was folded into Parental Leave Pay, where the partner now has reserved days instead
    - older articles, friends and some employers still describe the old scheme
  sources:
    - title: Services Australia — Dad and Partner Pay
      url: https://www.servicesaustralia.gov.au/dad-and-partner-pay
  related: [ partner-reserved-days, parental-leave-pay ]

- id: parenting-payment
  title: Parenting Payment
  type: payment
  topic: money
  ask: Is there income support if neither of us is working?
  aliases: [ Parenting Payment, income support for parents, Centrelink parenting ]
  weeks: [ 36, 42 ]
  priority: 3
  stakes: medium
  covers:
    - the main income support payment for a young child's main carer, under income and asset tests
    - separate from Family Tax Benefit and Parental Leave Pay, and only claimable after the birth
    - first payment usually within two weeks of the decision; waiting periods can apply
  sources:
    - title: Services Australia — Parenting Payment
      url: https://www.servicesaustralia.gov.au/parenting-payment
  related: [ family-tax-benefit-a, parental-leave-pay ]
  notes: "Shown when `work: not-working` for the carrying parent. Rates change twice a year."

- id: multiple-birth-allowance
  title: Multiple Birth Allowance
  type: payment
  topic: money
  ask: Is there extra help for triplets or more?
  aliases: [ triplets payment, multiple birth allowance ]
  weeks: [ 27, 42 ]
  priority: 3
  stakes: medium
  covers:
    - for triplets, quadruplets or more, checked automatically with the Family Tax Benefit claim
    - twins don't qualify, and Parental Leave Pay is for one child only, but the Newborn Supplement is paid per child
  sources:
