- id: cot-and-safe-sleep-standards
  title: A safe cot
  type: guide
  topic: gear
  ask: What makes a cot safe, and which standard should it meet?
  aliases: [ cot, AS/NZS 2172, safe cot, cot mattress, cot bumpers, safe sleep, infant sleep products standard ]
  weeks: [ 24, 38 ]
  priority: 1
  stakes: high
  covers:
    - cots sold in Australia, new or second-hand, must meet the mandatory standard (AS/NZS 2172:2003); the instructions note it and it is often on a label, but second-hand cots do not require safety labels (PBB)
    - one firm, flat mattress fitting within 20 mm of the sides; no bumpers, pillows or soft bedding
    - no gaps, toeholds or protrusions; the right depth with the base at its lowest
    - the baby sleeps in their own cot or bassinet in the parents' room for the first 6 to 12 months, on their back, face uncovered
    - never a cot of unknown standard, however handsome
  sources:
    - title: Red Nose — What is a safe cot?
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/newborn-to-1-year/what-is-a-safe-cot/
    - title: Pregnancy, Birth and Baby — Cots
      url: https://www.pregnancybirthbaby.org.au/babies/sleep-and-settling/cots
    - title: Pregnancy, Birth and Baby — Safe sleep for babies
      url: https://www.pregnancybirthbaby.org.au/babies/sleep-and-settling/safe-sleep-for-babies
    - title: Red Nose — Is it safe to use a second-hand mattress?
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/pregnancy-to-birth/is-it-safe-to-use-a-second-hand-mattress/
  related: [ bassinet, portable-cot, second-hand-baby-gear ]
  notes: The safe-sleep practice (back, face clear, smoke-free) is after-the-birth content; here it's the product. Product Safety Australia's standards pages refused automated fetches; Red Nose refers to mandatory standards for infant sleep products without a date, and PBB says there is no current safety standard for bassinets in Australia; the 19 January 2026 start date is unchecked until a Product Safety Australia page loads.

- id: bassinet
  title: A bassinet for the first months
  type: guide
  topic: gear
  ask: Is a bassinet safe, and when do we move the baby to the cot?
  aliases: [ bassinet, bassinette, moses basket, co-sleeper, smart bassinet, bedside sleeper ]
  weeks: [ 28, 38 ]
  priority: 2
  stakes: high
  covers:
    - sides at least 300 mm above the mattress base, breathable mesh on all four sides, a firm flat mattress no thicker than 75 mm that fits exactly
    - no padded sides, trims or ribbons; no cardboard bassinets
    - from 19 January 2026 bassinets are covered by mandatory standards
    - move to a cot at the first sign of rolling, around 4 months
    - "smart bassinets that rock or swing: the same rules, plus the maker's limits"
  sources:
    - title: Red Nose — What is a safe bassinet?
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/pregnancy-to-birth/what-is-a-safe-bassinet/
