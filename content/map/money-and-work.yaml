- id: what-you-need-for-the-baby
  title: What you actually need before the birth
  type: guide
  topic: gear
  ask: What do we have to have ready, and what can wait?
  aliases: [ newborn checklist, baby essentials, nursery list, what to buy ]
  weeks: [ 24, 36 ]
  who: together
  priority: 2
  stakes: low
  covers:
    - "the four that can't wait: a fitted car seat, a safe place to sleep with a fitting mattress, nappies and wipes, a way to feed (and the plan B)"
    - clothes by season and laundry, not by the shop's list; maternity pads for the parent
    - "what can wait until you know: the pram, a carrier, a monitor, the change table"
    - borrowing and second-hand for almost all of it; the standards for the few that matter
    - "the non-gear: frozen meals, online groceries, the numbers saved"
