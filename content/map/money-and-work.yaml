- id: cost-of-having-a-baby
  title: "What having a baby costs: public or private"
  type: guide
  topic: money
  ask: How much does it cost to have a baby in Australia?
  aliases: [ cost of pregnancy, public vs private cost, out of pocket pregnancy, gap fees, hospital bill ]
  weeks: [ 4, 16 ]
  who: together
  priority: 1
  stakes: high
  covers:
    - "public patient in a public hospital, birth centre or public homebirth program, with a Medicare card: most pregnancy care costs are covered by Medicare; sometimes an out-of-pocket cost where the full cost isn't covered (some antenatal tests, such as NIPT)"
    - "private: Medicare pays 75% of the schedule fee in hospital and the fund the other 25% if your policy covers it, but doctors can charge above the schedule (the gap, with no cap), and hospital costs, any excess or co-payment, and the baby's nursery care are charged separately"
    - "private patient in a public hospital: no single room guaranteed, still the fees"
    - "what to ask for: informed financial consent and an estimate of costs, preferably in writing, before admission; the Medicare Safety Net (more back from Medicare once you spend above a certain amount in a calendar year)"
  sources:
    - title: Pregnancy, Birth and Baby — What is the difference between public and private care in pregnancy?
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/what-is-the-difference-between-public-and-private-care-in-pregnancy
    - title: Pregnancy, Birth and Baby — Medicare during pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/medicare-during-pregnancy
    - title: privatehealth.gov.au — Out of pocket costs
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/out_of_pocket.htm
    - title: Pregnancy, Birth and Baby — Private health insurance and pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/private-health-insurance-and-pregnancy
  related: [ private-health-waiting-periods, medicare-safety-net, budgeting-for-leave, adding-baby-to-private-health-cover ]
  notes: Border with tests and care, which owns the models of care decision, Medicare for scans and the obstetrician's fee schedule; this entry is the household budget view and links there. Tailor by `care` and `cover`.

- id: private-health-waiting-periods
  title: Private health cover and the 12-month wait
  type: guide
  topic: money
  ask: We've just taken out health insurance. Does it cover this pregnancy?
  aliases: [ waiting period pregnancy, 12 month wait obstetrics, Gold cover, hospital cover tiers, Lifetime Health Cover, Medicare Levy Surcharge ]
  weeks: [ 1, 8 ]
  who: together
  priority: 1
  stakes: high
  covers:
    - the maximum waiting period for pregnancy and birth is 12 months, and it runs from when the cover (or the upgrade) started; a baby due inside it means going public or paying
    - only Gold policies must include pregnancy and birth; Silver and Bronze may exclude or restrict it
    - the Lifetime Health Cover loading from the 1 July after your 31st birthday, the Medicare Levy Surcharge above the income threshold and the rebate are the reasons people hold cover anyway
    - cover for the baby is a separate question
  sources:
    - title: privatehealth.gov.au — Waiting periods
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/waiting_periods.htm
    - title: privatehealth.gov.au — Product tiers
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/producttiers.htm
    - title: privatehealth.gov.au — Government surcharges and incentives
      url: https://www.privatehealth.gov.au/health_insurance/surcharges_incentives/index.htm
    - title: Pregnancy, Birth and Baby — Private health insurance and pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/private-health-insurance-and-pregnancy
  related: [ cost-of-having-a-baby, adding-baby-to-private-health-cover, medicare-safety-net ]
  notes: Really a preconception item; in a pregnancy-only app it lands in week 1 as "too late to start, but here's what you have". The `cover` question's "unsure" answer should point here. Surcharge thresholds change yearly.

- id: budgeting-for-leave
  title: Budgeting for the leave
  type: guide
  topic: money
  ask: How do we plan our money for a year on one income?
  aliases: [ budget for maternity leave, income on leave, cash flow, how long can we afford ]
  weeks: [ 16, 30 ]
  who: together
  priority: 1
  stakes: medium
  covers:
    - "lay the income out week by week: employer-paid leave, the 130 days of Parental Leave Pay at $1,004.70 a week before tax, annual and long service leave, then nothing"
    - "what starts and stops: FTB Part B only after leave pay days end, FTB Part A by income, the Child Care Subsidy when care starts"
    - "the quiet costs of leave: super stops except the ATO's contribution, 15% withholding may under-tax, the fund premium rises for a family policy"
    - fixed costs to renegotiate before the income drops; Moneysmart's budget planner
  sources:
    - title: Moneysmart — How to do a budget
      url: https://moneysmart.gov.au/budgeting/how-to-do-a-budget
    - title: Moneysmart — Budget planner
      url: https://moneysmart.gov.au/budgeting/budget-planner
    - title: Services Australia — How much Parental Leave Pay you can get
      url: https://www.servicesaustralia.gov.au/how-much-parental-leave-pay-you-can-get
  related: [ parental-leave-pay, employer-paid-parental-leave, family-tax-benefit-b, child-care-subsidy, parental-leave-pay-employer-delivered ]
  notes: "Changes yearly (the rate). Tailor by `paidLeave` and `work` for each parent. A candidate for a Drawer tool later: a leave calculator."

