  aliases: [ daycare waitlist, waiting list, StartingBlocks, childcare places ]
  weeks: [ 12, 30 ]
  priority: 1
  stakes: high
  covers:
    - many centres have waiting lists, so join the lists of the centres you may wish your child to attend well before you think you will need care
    - join the lists of several centres, not just the first choice
    - StartingBlocks lists services, their quality rating and a subsidy calculator
  sources:
