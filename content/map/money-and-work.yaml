- id: unpaid-parental-leave
  title: "Unpaid parental leave: the 12 months you're entitled to"
  type: payment
  topic: work
  ask: How much leave can I take from work?
  aliases: [ maternity leave, NES parental leave, 12 months leave, unpaid leave, continuous parental leave ]
  weeks: [ 12, 30 ]
  priority: 1
  stakes: high
  covers:
    - under the National Employment Standards each parent can take up to 12 months' unpaid leave, and request up to 12 more
    - eligible after 12 months with the employer before the due date; casuals if regular and systematic for 12 months with an expectation of more
    - one continuous period, starting up to 6 weeks before the due date (earlier if the employer agrees) and ending within 24 months of the birth
    - both parents can take it, including at the same time
    - paid leave entitlements don't usually accrue on unpaid leave; long service leave depends on the state
  sources:
    - title: Fair Work Ombudsman — Parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave
    - title: Fair Work Ombudsman — Types of parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/types-of-parental-leave
    - title: Fair Work Ombudsman — Applying for parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
    - title: Fair Work Ombudsman — Accruing and taking other leave during parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/accruing-and-taking-other-leave-during-parental-leave
  related: [ employer-leave-notice, extending-parental-leave, flexible-unpaid-parental-leave, employer-paid-parental-leave, parental-leave-pay, partner-parental-leave ]
  notes: "Shown by `work: employee`. The 12-months-of-service rule is the one that catches people who changed jobs while pregnant."

- id: employer-leave-notice
  title: Telling your employer about parental leave
  type: payment
  topic: work
  ask: When do I have to tell work I'm taking leave?
  aliases: [ 10 weeks notice, 4 weeks notice, written notice, leave dates ]
  weeks: [ 24, 34 ]
  priority: 1
  stakes: high
  covers:
    - "at least 10 weeks before the leave starts, in writing: how much and the start and end dates"
    - "at least 4 weeks before: confirm or change the dates"
    - the employer can ask for evidence such as a medical certificate with the due date
    - if 10 weeks isn't possible, as soon as you can; the leave is still yours
    - flexible days need 10 weeks' notice of how many and 4 weeks' notice of which days
  sources:
    - title: Fair Work Ombudsman — Applying for parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
  related: [ unpaid-parental-leave, telling-your-employer, partner-parental-leave, parental-leave-pay-claim ]
  exists: content/items/employer-leave-notice.md

- id: telling-your-employer
  title: Telling work you're pregnant
  type: guide
  topic: work
  ask: When do I have to tell my employer I'm pregnant?
  aliases: [ announce pregnancy at work, tell my boss, when to tell work ]
  weeks: [ 8, 20 ]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - no legal duty to tell until the 10-week leave notice, though a safe-job transfer or sick leave may need a certificate earlier
    - treating you differently because you're pregnant is unlawful adverse action under the Fair Work Act
    - "what to ask: the workplace's own paid leave policy, how leave pay is delivered, flexible work later"
    - "practical timing: after the 12-week scan is common; earlier if the job has hazards"
  sources:
    - title: Fair Work Ombudsman — Protection from discrimination at work
      url: https://www.fairwork.gov.au/employee-entitlements/protections-at-work/protection-from-discrimination-at-work
    - title: Fair Work Ombudsman — Entitlements while pregnant
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/entitlements-while-pregnant
    - title: Pregnancy, Birth and Baby — Working during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/working-during-pregnancy
  related: [ employer-leave-notice, safe-job-and-no-safe-job-leave, pregnancy-discrimination-at-work, employer-paid-parental-leave ]
  notes: Directive only about the paperwork; the "when to tell people" feelings belong to relationships.

- id: employer-paid-parental-leave
  title: Your employer's own paid parental leave
  type: payment
  topic: work
  ask: Does my workplace pay maternity leave on top of the government's?
  aliases: [ company maternity leave, employer paid leave, enterprise agreement parental leave, paid primary carer leave ]
  weeks: [ 16, 28 ]
  priority: 1
  stakes: high
  covers:
    - comes from an agreement, employment contract or workplace policy, and the rules depend on it; ask the employer first
    - Parental Leave Pay can be taken before, during or after employer funded leave, and a person can get both during the leave period
    - can't be refused or cancelled because of a stillbirth or death
  sources:
    - title: Fair Work Ombudsman — Payment during parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/payment-during-parental-leave
    - title: Services Australia — Claiming timeframes for Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/claiming-timeframes-for-parental-leave-pay
  related: [ parental-leave-pay, unpaid-parental-leave, budgeting-for-leave, parental-leave-pay-employer-delivered ]
  notes: The `paidLeave` question exists for this; a "yes" changes the order of pay and the start date of the government claim.

- id: extending-parental-leave
  title: Extending parental leave to two years
  type: payment
  topic: work
  ask: Can I take longer than 12 months off?
  aliases: [ second year of leave, extend maternity leave, 24 months, request further leave ]
  weeks: [ 30, 42 ]
  priority: 2
  stakes: medium
  covers:
    - within the first 12 months, extend up to 12 total with 4 weeks' notice before the current end date
    - beyond 12 months, a written request for up to 12 more; the employer must answer in writing within 21 days and can only refuse on reasonable business grounds after discussing it
    - total no more than 24 months from the birth, and each parent has their own 24 months
    - disputes can go to the Fair Work Commission
  sources:
    - title: Fair Work Ombudsman — Extending parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/extending-parental-leave
  related: [ unpaid-parental-leave, returning-to-work, flexible-work-request ]
  notes: Decided after the birth; mapped here so the first notice can leave room for it.

- id: flexible-unpaid-parental-leave
  title: Flexible parental leave days
  type: payment
  topic: work
  ask: Can I take my leave as single days instead of one block?
  aliases: [ flexible days, 130 flexible days, single days of leave, part-time return ]
  weeks: [ 24, 36 ]
  priority: 2
  stakes: medium
  covers:
    - up to 130 of the 12 months can be single days or short blocks (120 for a child born before 1 July 2026), unpaid
    - taken any time within 24 months of the birth, including before the birth up to 6 weeks out
    - 10 weeks' notice of the total and 4 weeks' notice of the dates
    - no keeping in touch days on flexible leave
  sources:
    - title: Fair Work Ombudsman — Types of parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/types-of-parental-leave
    - title: Fair Work Ombudsman — Applying for parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
  related: [ unpaid-parental-leave, parental-leave-pay-sharing, keeping-in-touch-days, partner-parental-leave ]
  notes: Changes by birth date, mirroring the Parental Leave Pay days.

- id: safe-job-and-no-safe-job-leave
  title: A safe job, or no-safe-job leave
  type: payment
  topic: work
  ask: What if my job isn't safe while I'm pregnant?
  aliases: [ safe job, no safe job leave, light duties, hazards at work, workplace risk pregnancy ]
  weeks: [ 4, 40 ]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - every pregnant employee, including casuals and those under 12 months' service, can be moved to a safe job on the same hours and pay
    - evidence a reasonable person would accept; the employer may require a medical certificate
    - "no safe job available: paid no-safe-job leave at base rate if you're entitled to parental leave, unpaid if not"
    - the transfer lasts until it's safe to go back or the pregnancy ends; you return to the original job after leave
    - safety concerns go to the state work health and safety regulator
  sources:
    - title: Fair Work Ombudsman — Entitlements while pregnant
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/entitlements-while-pregnant
    - title: Pregnancy, Birth and Baby — Working during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/working-during-pregnancy
  related: [ working-close-to-the-due-date, pregnancy-discrimination-at-work, returning-to-work ]
  notes: What counts as a hazard (chemicals, lifting, shift work, radiation) is for the activities "Can I…?" area; this is the entitlement.

- id: working-close-to-the-due-date
  title: Working in the last six weeks
  type: can-i
  topic: work
  ask: Can I keep working right up to my due date?
  aliases: [ work until due date, last 6 weeks, medical certificate fit for work, directed to start leave ]
  weeks: [ 30, 40 ]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "yes, if you're fit: the employer can ask for a medical certificate within 7 days saying so once you're inside 6 weeks of the due date"
    - no certificate, or not fit, and the employer can require leave to start
    - a certificate saying fit but not for this job means a safe job or no-safe-job leave
    - leave can start up to 6 weeks before the due date, or earlier by agreement
  sources:
    - title: Fair Work Ombudsman — Entitlements while pregnant
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/entitlements-while-pregnant
    - title: Fair Work Ombudsman — Types of parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/types-of-parental-leave
  related: [ safe-job-and-no-safe-job-leave, employer-leave-notice, unpaid-parental-leave ]

- id: special-maternity-leave
  title: Unpaid special parental leave
  type: payment
  topic: work
  ask: Is there leave for a pregnancy-related illness, separate from my parental leave?
  aliases: [ special maternity leave, pregnancy illness leave, hyperemesis leave ]
  weeks: [ 4, 40 ]
  who: carrying
  priority: 3
  stakes: medium
  covers:
    - unpaid leave for an employee unfit for work because of a pregnancy-related illness, or a pregnancy loss after 12 weeks that isn't a stillbirth
    - it doesn't come off the 12 months of parental leave
    - needs the same eligibility as unpaid parental leave; paid personal leave can be used first
    - the employer can ask for a medical certificate
  sources:
    - title: Fair Work Ombudsman — Entitlements while pregnant
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/entitlements-while-pregnant
  related: [ unpaid-parental-leave, safe-job-and-no-safe-job-leave, leave-after-loss ]

- id: keeping-in-touch-days
  title: Keeping in touch days
  type: payment
  topic: work
  ask: Can I go into work for a day while I'm on leave without ending it?
  aliases: [ KIT days, keeping in touch, 10 days, training day on maternity leave ]
  weeks: [ 34, 42 ]
  priority: 3
  stakes: low
  covers:
    - up to 10 paid days of work during the first 12 months of continuous leave, and 10 more in an extended period, by agreement
    - "for anything that helps the return: training, planning days, a handover"
    - paid as normal, and leave accrues on them; the leave period doesn't end
    - not on flexible leave days; not within 14 days of the birth unless you ask
  sources:
    - title: Fair Work Ombudsman — Keeping in touch days
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/keeping-in-touch-days
  related: [ unpaid-parental-leave, returning-to-work, parental-leave-pay ]
  notes: A day worked is also a day you can't be paid Parental Leave Pay for; say so.

- id: returning-to-work
  title: Going back to work
  type: guide
  topic: work
  ask: Do I get my old job back after leave?
  aliases: [ return to work, same job, redundancy on maternity leave, breastfeeding at work, expressing at work ]
  weeks: [ 34, 42 ]
  priority: 2
  stakes: high
  covers:
    - the right to return to the job you had before leave, or before a safe-job transfer or reduced hours; a replacement doesn't change that
    - a fixed-term contract that ends during leave does
    - significant changes to the job during leave must be discussed with you; a job that no longer exists may be a redundancy
    - breastfeeding and expressing at work are protected; breaks and a private space are best practice
    - ending leave early needs the employer's agreement; an employer can only call you back if you no longer care for the child, with 4 weeks' notice and not within 6 weeks of the birth
  sources:
    - title: Fair Work Ombudsman — Returning to work from parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/after-parental-leave/returning-to-work-from-parental-leave
    - title: Fair Work Ombudsman — Ending parental leave early
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/ending-parental-leave-early
    - title: Fair Work Ombudsman — Replacement employees
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/replacement-employees
    - title: Pregnancy, Birth and Baby — Returning to work
      url: https://www.pregnancybirthbaby.org.au/womens-health/wellbeing-and-lifestyle/returning-to-work
  related: [ flexible-work-request, extending-parental-leave, keeping-in-touch-days, childcare-types, child-care-subsidy-claim ]
  notes: The emotional side of going back belongs to mental health; this is the entitlement and the admin (childcare claim before day one).

- id: flexible-work-request
  title: Asking for flexible work
  type: payment
  topic: work
  ask: Can I come back part-time or work from home?
  aliases: [ flexible working arrangements, part-time after baby, work from home request, 21 days, reasonable business grounds ]
  weeks: [ 30, 42 ]
  priority: 2
  stakes: high
  covers:
    - "a legal right to ask, in writing with reasons, if you've been there 12 months (casuals: regular and systematic) and are pregnant or a parent of a child of school age or younger"
    - the employer must reply in writing within 21 days and can only refuse on reasonable business grounds after genuinely trying to agree an alternative
    - part-time, different hours, job share, working from home all count
    - unresolved disputes can go to the Fair Work Commission; templates on the Fair Work site
  sources:
    - title: Fair Work Ombudsman — Flexible working arrangements
      url: https://www.fairwork.gov.au/employment-conditions/flexibility-in-the-workplace/flexible-working-arrangements
    - title: Fair Work Ombudsman — Flexible work after parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/after-parental-leave/flexible-work-after-parental-leave
  related: [ returning-to-work, extending-parental-leave, pregnancy-discrimination-at-work ]
  notes: Both parents can ask; the partner asking is the under-used one.

- id: partner-parental-leave
  title: The partner's leave from work
  type: guide
  topic: partner
  ask: How much time off does the partner get, and how do they arrange it?
  aliases: [ paternity leave, partner leave, dad's leave, secondary carer leave, two weeks off ]
  weeks: [ 20, 34 ]
  who: partner
  priority: 1
  stakes: high
  covers:
    - the same 10-week and 4-week notice, and the same 12-months-of-service rule
    - "the money: the 20 reserved Parental Leave Pay days, up to 20 days paid at the same time as the other parent, plus any employer-paid partner leave, annual leave or flexible days"
    - a casual partner is eligible for unpaid leave only if working regularly and systematically for at least 12 months, with a reasonable expectation of continuing work
  sources:
    - title: Fair Work Ombudsman — Parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave
    - title: Fair Work Ombudsman — Applying for parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
    - title: Services Australia — How much Parental Leave Pay you can get
      url: https://www.servicesaustralia.gov.au/how-much-parental-leave-pay-you-can-get
  related: [ partner-reserved-days, employer-leave-notice, unpaid-parental-leave, flexible-unpaid-parental-leave, parental-leave-pay-sharing ]
  notes: Tailor by `work.partner` and `paidLeave.partner`. The app's leaveStart date for the partner drives their notice deadlines.

- id: casual-employees-parental-leave
  title: Parental leave as a casual
  type: payment
  topic: work
  ask: I'm a casual. Do I get parental leave at all?
  aliases: [ casual maternity leave, regular and systematic, casual employee rights ]
  weeks: [ 12, 30 ]
  priority: 2
  stakes: high
  covers:
    - unpaid parental leave and a flexible work request if you've worked regularly and systematically for 12 months and would reasonably have kept going
    - the right to a safe job regardless of service
    - no paid leave to draw on, so Parental Leave Pay is usually the only income
    - the work test counts casual hours like any other
  sources:
    - title: Fair Work Ombudsman — Casual employees
      url: https://www.fairwork.gov.au/starting-employment/types-of-employees/casual-employees
    - title: Fair Work Ombudsman — Applying for parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
  related: [ unpaid-parental-leave, parental-leave-pay-work-test, safe-job-and-no-safe-job-leave ]
  notes: The facts file has no "casual" answer under `work`; consider adding one, since the plan differs.

- id: pregnancy-discrimination-at-work
  title: Pregnancy discrimination at work
  type: guide
  topic: work
  ask: Can they demote me, cut my hours or let me go because I'm pregnant?
  aliases: [ discrimination, adverse action, sacked while pregnant, demoted on maternity leave, general protections ]
  weeks: [ 4, 42 ]
  priority: 2
  stakes: high
  covers:
    - "the Fair Work Act bans adverse action for pregnancy, family responsibilities and breastfeeding: dismissal, demotion, cut hours, refused hiring"
    - the right to return to the same job and to request flexible work are entitlements, and penalising their use is also adverse action
    - the Sex Discrimination Act's positive duty on employers
    - "where to go: the Fair Work Ombudsman, the Fair Work Commission (strict time limits after a dismissal), the Australian Human Rights Commission"
  sources:
    - title: Fair Work Ombudsman — Protection from discrimination at work
      url: https://www.fairwork.gov.au/employee-entitlements/protections-at-work/protection-from-discrimination-at-work
  related: [ telling-your-employer, safe-job-and-no-safe-job-leave, returning-to-work, flexible-work-request ]
  notes: The Human Rights Commission's pregnancy-and-work pages refused automated fetches; cite them once they load. Keep the 21-day dismissal application limit if the Commission's page is cited.

- id: leave-after-loss
  title: Leave from work after a loss
  type: payment
  topic: loss
  ask: What leave is there if the baby dies, or we lose the pregnancy?
  aliases: [ compassionate leave miscarriage, stillbirth leave, bereavement leave ]
  priority: 3
  stakes: medium
  covers:
    - paid compassionate leave for a miscarriage (before 20 weeks) or a stillbirth, for both parents
    - after a stillbirth or a death in the first 24 months, up to 12 months' unpaid parental leave still stands and the employer can't cancel it; you can cancel it with 4 weeks' notice
    - employer-paid parental leave can't be withdrawn because of it
    - unpaid special parental leave for a loss after 12 weeks that isn't a stillbirth
  sources:
    - title: Fair Work Ombudsman — Stillbirth, premature birth or death of a child
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/stillbirth-premature-birth-or-death-of-a-child
    - title: Fair Work Ombudsman — Accruing and taking other leave during parental leave
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/accruing-and-taking-other-leave-during-parental-leave
  related: [ stillborn-baby-payment, special-maternity-leave ]
  notes: Reached only from the loss path, never shown on the timeline. Written in the loss area's voice.

# ---------------------------------------------------------------------------
# Paperwork
# ---------------------------------------------------------------------------

- id: registering-the-birth
  title: Registering the birth
  type: payment
  topic: paperwork
  ask: How do we register the baby's birth, and by when?
  aliases: [ birth registration, register baby, Births Deaths and Marriages, BDM, 60 days, birth registration statement ]
  weeks: [ 36, 42 ]
  who: together
  priority: 1
  stakes: high
  covers:
    - the parents register it, not the hospital, with the state or territory registry where the baby is born; free
    - within 60 days in every state and territory (the ACT allows 6 months); late is still accepted
    - Parental Leave Pay requires the birth registered or applied for; proof of birth for Medicare enrolment can be the Newborn Child Declaration or a birth certificate; a birth certificate is needed for ID such as a passport
    - online forms in NSW, Queensland and the ACT; registration records the baby's name, so decide the name first
    - the ACT's Newborn Enrolment Trial registers through myGov from two Canberra hospitals
  sources:
    - title: myGov — Register your baby's birth and get their birth certificate
      url: https://my.gov.au/en/services/raising-kids/having-a-baby/when-your-baby-is-born/register-your-baby-s-birth-and-get-their-birth-certificate
    - title: NSW Government — Register the birth of your baby
      url: https://www.nsw.gov.au/family-and-relationships/births/register-a-birth
    - title: Births, Deaths and Marriages Victoria — Register a birth
      url: https://www.bdm.vic.gov.au/births/register-a-birth
    - title: Queensland Government — Register a birth
      url: https://www.qld.gov.au/law/births-deaths-marriages-and-divorces/birth-registration-and-adoption-records/register-a-birth
    - title: WA Government — Birth registration and certificates
      url: https://www.wa.gov.au/service/justice/civil-law/birth-registration-and-certificates
    - title: Access Canberra — Birth registration
      url: https://www.accesscanberra.act.gov.au/births-relationships-and-deaths/births/birth-registration
    - title: Services Australia — Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/parental-leave-pay
  related: [ birth-certificate, proof-of-birth, parental-leave-pay, baby-passport, medicare-enrol-baby ]
  notes: Tailor by `state`; one passage per state with its registry's link and form. The SA, Tasmanian and NT registry pages refused automated fetches (Cloudflare); the myGov page's 60 days covers them until their own pages load. An after-the-birth deadline, counted in days from the birth.

- id: birth-certificate
  title: The birth certificate
  type: payment
  topic: paperwork
  ask: Do we need to order a birth certificate, and what does it cost?
  aliases: [ birth certificate, commemorative certificate, digital birth certificate, order certificate ]
  weeks: [ 36, 42 ]
  priority: 2
  stakes: medium
  covers:
    - registration is the law; the certificate is optional but is the baby's primary ID for a passport, school and bank accounts
    - order it with the registration, for a fee set by each state; Victoria issues a free digital one as well
    - commemorative certificates are souvenirs, not ID
    - it's also the fallback proof of birth for Centrelink and Medicare if the Newborn Child Declaration is lost
  sources:
    - title: NSW Government — Register the birth of your baby
      url: https://www.nsw.gov.au/family-and-relationships/births/register-a-birth
    - title: Births, Deaths and Marriages Victoria — Register a birth
      url: https://www.bdm.vic.gov.au/births/register-a-birth
    - title: Access Canberra — Apply for a birth certificate
      url: https://www.accesscanberra.act.gov.au/births-relationships-and-deaths/births/apply-for-a-birth-certificate
  related: [ registering-the-birth, baby-passport, proof-of-birth ]
  notes: Fees change yearly and differ by state; don't quote them, link them.

- id: proof-of-birth
  title: The Parent Pack and proof of birth
  type: payment
  topic: paperwork
  ask: What's the form the hospital gives us, and what do we do with it?
  aliases: [ Newborn Child Declaration, Parent Pack, proof of birth, doctor or midwife declaration, 56 days ]
  weeks: [ 36, 42 ]
  priority: 1
  stakes: high
  covers:
    - the hospital or midwife gives a Parent Pack with a Newborn Child Declaration; the doctor or midwife completes the Proof of Birth declaration on the back page
    - it is proof of birth for the pre-birth claim (within 56 days), a new claim, and Medicare enrolment; it can't be reissued
    - add your CRN and Medicare number on the back page
    - "lost it: a birth certificate, or a letter from the doctor or midwife who attended, including a home birth"
    - it is not itself a claim and not a birth registration
  sources:
    - title: Services Australia — When your baby arrives
      url: https://www.servicesaustralia.gov.au/when-your-baby-arrives
    - title: Services Australia — Proving your child's birth or adoption
      url: https://www.servicesaustralia.gov.au/proving-your-childs-birth-or-adoption
    - title: Services Australia — Claiming timeframes for Parental Leave Pay
      url: https://www.servicesaustralia.gov.au/claiming-timeframes-for-parental-leave-pay
  related: [ parental-leave-pay-claim, family-tax-benefit-claim, medicare-enrol-baby, registering-the-birth ]
  notes: One of the two things to check before leaving hospital, with the car seat. Belongs in the hospital bag item's paperwork line.

- id: baby-passport
  title: A passport for the baby
  type: guide
  topic: paperwork
  ask: How do we get the baby a passport?
  aliases: [ child passport, baby passport photo, parental consent passport, travel with newborn ]
  weeks: [ 38, 42 ]
  priority: 3
  stakes: medium
  covers:
    - needs the full birth certificate naming both parents, proof of citizenship, two photos to the guidelines and a guarantor who has known the child a year
    - every person with parental responsibility consents, witnessed, on the form; without it, court orders or a slow special-circumstances assessment
    - lodged in person at a participating post office; valid 5 years for under-16s
    - "allow weeks: order the certificate first"
  sources:
    - title: Australian Passport Office — Child passport
      url: https://www.passports.gov.au/child-passport
    - title: Australian Passport Office — Parental consent
      url: https://www.passports.gov.au/consent
  related: [ birth-certificate, registering-the-birth ]
  notes: Only for households planning travel in the first year; fees change each January. The photo of a newborn with eyes open is the famous hurdle.

- id: wills-and-guardianship
  title: Wills, guardianship and who gets your super
  type: guide
  topic: paperwork
  ask: Do we need a will now, and how do we name a guardian?
  aliases: [ will, guardian for the baby, testamentary guardian, enduring power of attorney, binding death benefit nomination, intestate ]
  weeks: [ 20, 36 ]
  who: together
  priority: 2
  stakes: high
  covers:
    - having a child is the standard trigger to make or update a will; dying without one leaves the state's formula to decide
    - a will can name a guardian for the child, and should name an executor
    - "super and its life insurance sit outside the will: make a binding nomination with each fund, which lapses every 3 years unless non-lapsing"
    - enduring powers of attorney and guardianship for yourselves
    - public trustees and online will services for simple estates; a lawyer for anything blended or complex
  sources:
    - title: Moneysmart — Wills and powers of attorney
      url: https://moneysmart.gov.au/wills-and-powers-of-attorney
    - title: Moneysmart — Life insurance cover
      url: https://moneysmart.gov.au/how-life-insurance-works/life-cover
  related: [ life-insurance-and-income-protection, parental-leave-pay-superannuation ]
  notes: State law differs on wills and guardianship; link each state's public trustee rather than describe the rules. Keep the tone practical, not morbid.

- id: life-insurance-and-income-protection
  title: Life insurance and income protection
  type: guide
  topic: money
  ask: Should we get life insurance now there's a baby coming?
  aliases: [ life cover, income protection, TPD, insurance through super, how much cover ]
  weeks: [ 16, 36 ]
  who: together
  priority: 2
  stakes: medium
  covers:
    - life cover matters when someone depends on your income; most people already have some through super, often less than a family needs
    - "how much: what the family would need to pay off and live on, less what super, savings and leave balances would provide"
    - income protection replaces part of your pay if you can't work; check waiting and benefit periods, and whether pregnancy is excluded
    - nominate a beneficiary or the trustee decides; fewer than half of members have
    - disclose the pregnancy honestly when applying
  sources:
    - title: Moneysmart — Life insurance cover
      url: https://moneysmart.gov.au/how-life-insurance-works/life-cover
    - title: Moneysmart — Income protection insurance
      url: https://moneysmart.gov.au/how-life-insurance-works/income-protection-insurance
  related: [ wills-and-guardianship, budgeting-for-leave ]
  notes: Not advice; point at the Moneysmart calculator and a licensed adviser.

- id: adding-baby-to-private-health-cover
  title: Adding the baby to your health fund
  type: payment
  topic: money
  ask: When do we have to add the baby to our private health insurance?
  aliases: [ family policy, add newborn to health fund, single parent family cover, baby cover from birth ]
  weeks: [ 30, 42 ]
  priority: 2
  stakes: high
  covers:
    - a baby isn't covered by a singles or couples policy; funds ask you to move to a family policy, commonly 1 to 3 months before the birth, some up to 12 months before so congenital conditions are covered
    - most funds cover a newborn from birth without waiting periods only if added within their deadline, often counted in weeks from the birth; miss it and waiting periods apply
    - a baby born in a private hospital may be admitted in their own right (special care nursery), which is where the gap appears
    - tell the fund of any change in family circumstances; family policies may have no extra premium for children
  sources:
    - title: Pregnancy, Birth and Baby — Private health insurance and pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/private-health-insurance-and-pregnancy
    - title: privatehealth.gov.au — Managing your policy
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/managing_your_policy.htm
  related: [ private-health-waiting-periods, cost-of-having-a-baby, medicare-enrol-baby ]
  notes: "Shown by `cover: yes`. The time limit is the fund's own rule, not law, and the loaded pages give no single figure; the writer must say \"check your fund's deadline\" and may quote a fund's PDS as an example. A task with a deadline from the birth."

- id: my-health-record-for-baby
  title: My Health Record and the baby's health record book
  type: guide
  topic: paperwork
  ask: What is the baby's blue book, and should we set up My Health Record?
  aliases: [ blue book, child health record, infant health record, My Health Record newborn, red book, green book ]
  weeks: [ 36, 42 ]
  priority: 3
  stakes: low
  covers:
    - the state's paper child health record comes in the hospital's pack; take it to every check and immunisation
    - My Health Record for the baby can be created from the Newborn Child Declaration at Medicare enrolment
    - the parent's own record holds the pregnancy's test results if their providers upload
  sources:
    - title: Pregnancy, Birth and Baby — Your baby's infant health record
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/infant-health-record
    - title: Pregnancy, Birth and Baby — My Health Record
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/my-health-record
    - title: Services Australia — Enrolling your baby in Medicare
      url: https://www.servicesaustralia.gov.au/enrolling-your-baby-medicare
  related: [ medicare-enrol-baby ]
  notes: Tailor the book's name by `state` (blue in NSW and Qld, green in Victoria, and so on); verify each.

