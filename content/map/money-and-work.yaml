    - title: King Edward Memorial Hospital — Going home
      url: https://www.kemh.health.wa.gov.au/Pregnancy-and-Birth/After-your-pregnancy/Going-home
  related:
    - baby-capsule-hire
    - second-hand-car-seat
    - second-hand-baby-gear
    - going-home
    - hospital-bag
  exists: content/items/car-seat.md
  who: partner

- id: second-hand-car-seat
  title: A second-hand car seat
  type: can-i
  topic: gear
  ask: Can we use a hand-me-down car seat?
  aliases: [ used car seat, borrowed capsule, old car seat, car seat expiry ]
  weeks: [ 28, 37 ]
  priority: 2
  stakes: high
  covers:
    - "only if you know its history: never crashed, undamaged, under 10 years old, with its label showing AS/NZS 1754 and the instructions"
    - a seat that has been in a crash is thrown away
    - check the recalls list before using it
    - a borrowed capsule from a hire scheme is the safer version of the same idea
  sources:
    - title: Pregnancy, Birth and Baby — Car and road safety for babies and children
      url: https://www.pregnancybirthbaby.org.au/car-safety-for-babies
  related: [ car-seat, baby-capsule-hire, second-hand-baby-gear ]

- id: baby-capsule-hire
  title: Hiring a baby capsule
  type: guide
  topic: gear
  ask: Should we buy a capsule or hire one?
  aliases: [ capsule hire, Kidsafe hire, infant carrier hire, car seat hire ]
  weeks: [ 30, 36 ]
  priority: 2
  stakes: medium
  covers:
    - a capsule is outgrown in about 6 months; Kidsafe and some hospitals and councils hire them, with fitting by an accredited fitter included
    - long-term capsule hire and short-term seat hire, often 3 or 6 months; book before the due date
    - the alternative is a convertible seat from birth, which stays rear-facing to about 4 years
  sources:
    - title: Kidsafe Queensland — Child car seat hire
      url: https://www.kidsafeqld.com.au/road-safety/child-restraint-hire
    - title: Mater Mothers — Kidsafe
      url: https://matermothers.org.au/hospitals/services/kidsafe
    - title: Kidsafe SA
      url: https://www.kidsafesa.com.au/road-safety/child-restraint-hire/
  related: [ car-seat, second-hand-car-seat ]
  notes: "Tailor by `state`: each Kidsafe is its own body with its own prices and booking line. Prices change; link, don't quote."

- id: pram
  title: The pram and the safety standard
  type: guide
  topic: gear
  ask: What should we check when buying a pram?
  aliases: [ pram, stroller, AS/NZS 2088, five-point harness, tether strap, pram cover ]
  weeks: [ 24, 36 ]
  priority: 2
  stakes: medium
  covers:
    - "prams and strollers sold in Australia, new or second-hand, must meet the mandatory standard based on AS/NZS 2088: a 5-point harness, a tether strap, working brakes, warning labels"
    - under 6 months only in a pram or a stroller that reclines to at least 130 degrees
    - "never cover the pram with a dry cloth or plastic in the heat: it traps heat and cuts airflow; shade, a damp muslin checked every 20 minutes, or timing"
    - "second-hand: check the harness, brakes, folding locks and the label"
  sources:
    - title: Pregnancy, Birth and Baby — Prams and strollers
