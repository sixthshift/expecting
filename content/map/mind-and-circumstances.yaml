    - "your doctor explains the risks and benefits of the treatment options, including how stopping a medicine might affect your mental health, so you can make an informed decision together"
    - "the Royal Women's: safe and effective treatment options exist in pregnancy and while breastfeeding"
    - "who to ask: your doctor or midwife, early on (when planning a pregnancy or as soon as you are pregnant); your doctor may refer you to a perinatal mental health team"
