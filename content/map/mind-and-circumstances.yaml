  ask: "Is my stress harming the baby?"
  aliases: [stressed, overwhelmed, work stress, burnout, cortisol]
  weeks: [1, 42]
  priority: 1
  stakes: medium
  covers:
    - "everyday stress is normal; it becomes a problem when it is constant, overwhelming and you can't cope (PBB)"
    - "the guilt loop: worrying that worry harms the baby; what PBB actually says (too much, chronic stress can affect you both; it is the chronic kind that matters)"
    - "common triggers PBB names, including a previous bad pregnancy or loss"
    - "talk to your midwife or doctor if it is significant; the help entry"
  sources:
