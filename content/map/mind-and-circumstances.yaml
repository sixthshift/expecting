# --- Partners' mental health ---

- id: partner-perinatal-depression
  title: Depression and anxiety in dads and partners
  type: symptom
  topic: partner
  ask: "Can the partner get antenatal depression too?"
  aliases: [paternal depression, dads depression, partner anxiety, perinatal depression in men, fathers and depression]
  weeks: [1, 42]
  who: partner
  priority: 1
  stakes: high
  covers:
    - "depression affects 1 in 10 fathers from the first trimester through the baby's first year; anxiety 1 in 6 during the pregnancy and about 1 in 5 after (PBB)"
    - "it can look different in men: short-tempered, resentful or angry, socially withdrawn, using alcohol or drugs to escape or cope, physical signs such as headaches and muscle tension, as well as low, flat or numb mood (PANDA, Gidget)"
    - "barriers PANDA names: men can find it harder to reach out because of feelings of shame, cultural stigma and other barriers"
    - "recognising the signs in yourself or your partner is how it gets found: they are often missed or dismissed as a normal part of life with a new baby (PBB)"
    - "PANDA 1300 726 306 has male counsellors; almost 1 in 10 PANDA callers are men"
    - "crisis: Lifeline 13 11 14, 000"
  sources:
    - title: Pregnancy, Birth and Baby — Fathers and depression
      url: https://www.pregnancybirthbaby.org.au/parenting-and-family/partners/fathers-and-depression
    - title: PANDA — Perinatal anxiety and depression in dads, signs and symptoms
      url: https://www.panda.org.au/articles/perinatal-anxiety-and-depression-in-dads-signs-and-symptoms
