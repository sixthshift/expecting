    - "what it shows instead: a quiet page with the support lines (Red Nose 1300 308 307 24/7, PANDA, Lifeline), the partner's note, and the three or four next-step entries below"
    - "it asks nothing it doesn't need: the week it happened is already known; a name for the baby is optional"
    - "the next steps it offers, in order: what happens to your body now; the medical choices if they are still open; time off work; the certificate and ways to remember; telling people; the partner's grief; trying again, when you are ready"
    - "the admin it quietly handles: claims and bookings in the Planner are shelved, not deleted; a note on which ones to cancel (classes, private cover changes) and which still apply (bereavement leave, Parental Leave Pay rules for stillbirth are the money agent's)"
    - "later: a way to mark the due date and anniversaries gently, and a restart for a pregnancy after loss that carries the history"
