- id: after-the-birth-mood-heads-up
  title: Your mood after the birth, what to expect
  type: guide
  topic: mental-health
  ask: "What's the difference between baby blues and postnatal depression?"
  aliases: [baby blues, postnatal depression, PND, postnatal anxiety, day three, fourth trimester mood]
  weeks: [34, 42]
  priority: 1
  stakes: high
  covers:
    - "baby blues: up to 80 per cent of new mothers (the Royal Women's); usually 3 to 5 days after the birth, tearful, anxious or overwhelmed, and usually passes quickly on its own (PBB)"
    - "postnatal depression and anxiety: persistent, more than two weeks, interferes with daily life; you will be screened again after the birth (EPDS)"
    - "why it is in the pregnancy Library: learn the signs now, both of you; signs are often missed or dismissed as a normal part of life with a new baby (PBB)"
    - "the partner's job: notice changes and check in gently, encourage her to speak with a GP or midwife; the PANDA helpline is open to support people too"
    - "the postnatal version proper belongs to the after-the-birth pillar when it is built"
  sources:
