# The mind, relationships, the partner, loss, and special circumstances.
# Every source URL below was fetched on 2026-10-28/29 and read. Pages on panda.org.au,
# beyondblue.org.au and healthdirect.gov.au render by JavaScript: curl gets an empty
# shell, so open them in a browser when writing. COPE (cope.org.au) refuses automated
# fetches (403) and Raising Children too; neither is cited. sands.org.au now redirects
# to rednose.org.au: Sands is part of Red Nose Grief and Loss.
#
# Voice for this file: gentle, never cheerful after bad news, nothing clinical decided
# here ("ask your midwife or OB"), and every "call now" ends at a phone number.

# ---------------------------------------------------------------------------
# Mental health
# ---------------------------------------------------------------------------

- id: antenatal-depression
  title: Depression during pregnancy
  type: symptom
  topic: mental-health
  ask: "I feel low all the time. Is this just pregnancy?"
  aliases: [antenatal depression, prenatal depression, perinatal depression, feeling low, hopeless, numb, PNDA]
  weeks: [1, 42]
  priority: 1
  stakes: high
  covers:
    - "up to 1 in 10 people have depression during pregnancy (PBB); the Royal Women's puts depression or anxiety together at about 15 per cent"
    - "the signs: low mood or numbness, no pleasure in things, withdrawing, sleep and appetite changes, recurring negative thoughts, wanting to escape"
    - "the line between a bad week and depression: symptoms that persist for 2 weeks or more and interrupt daily life"
    - "shame and guilt keep people quiet because they are 'supposed to be joyful' (the Royal Women's); it is not something you control"
    - "untreated illness affects you and the baby; safe and effective treatments exist in pregnancy"
    - "where to start: your GP or midwife, the PANDA helpline 1300 726 306, Beyond Blue 1300 22 4636"
    - "call now: thoughts of self-harm or suicide, Lifeline 13 11 14, 000 in danger"
  sources:
    - title: Pregnancy, Birth and Baby — Depression and pregnancy
      url: https://www.pregnancybirthbaby.org.au/womens-health/mental-health/depression-and-pregnancy
    - title: The Royal Women's Hospital — Mental health & pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/mental-health-pregnancy
    - title: Beyond Blue — Pregnancy (antenatal depression and anxiety)
      url: https://www.beyondblue.org.au/mental-health/parenting/pregnancy
    - title: PANDA — Support for expecting parents
      url: https://www.panda.org.au/get-support/support-expecting-a-baby
  related: [antenatal-anxiety, perinatal-mental-health-help, mental-health-screening-epds, mental-health-medication, partner-perinatal-depression]
  notes: "Never score or diagnose. The app's mood log rule (two low weeks suggests talking to someone and shows PANDA) hangs off this entry."

- id: antenatal-anxiety
  title: Anxiety during pregnancy
  type: symptom
  topic: mental-health
  ask: "I can't stop worrying about the baby. Is that normal?"
  aliases: [antenatal anxiety, panic attacks, constant worry, on edge, racing heart, OCD in pregnancy, perinatal anxiety]
  weeks: [1, 42]
  priority: 1
  stakes: high
  covers:
    - "some anxiety is a normal reaction to pregnancy; as many as 30 per cent of pregnant women feel some level of it (the Royal Women's)"
    - "when it is more: worry that interrupts thoughts or daily tasks, panic attacks, tension, a tight chest, trouble falling asleep"
    - "it can start in pregnancy or worsen an existing disorder (GAD, OCD, panic, social anxiety, PTSD)"
    - "people assume it is a normal part of pregnancy and don't ask for help (PBB)"
    - "treated well with psychological therapies: CBT, relaxation, mindfulness; medication sometimes, decided with your doctor"
    - "the simple self-help the sources give: breathing, bedtime routine, limiting unhelpful social media (Gidget)"
    - "where to start: GP or midwife, PANDA 1300 726 306"
  sources:
    - title: Pregnancy, Birth and Baby — Anxiety and pregnancy
      url: https://www.pregnancybirthbaby.org.au/womens-health/mental-health/anxiety-and-pregnancy
    - title: The Royal Women's Hospital — Anxiety & pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/mental-health-pregnancy/anxiety-pregnancy
    - title: Gidget Foundation — Tips for managing anxiety and stress for new and expectant parents
      url: https://www.gidgetfoundation.org.au/fact-sheets/tips-for-managing-anxiety-and-stress-for-new-and-expectant-parents
  related: [antenatal-depression, worry-and-sleep, intrusive-thoughts, tokophobia, perinatal-mental-health-help]

- id: perinatal-mental-health-help
  title: Where to get help for your mental health
  type: guide
  topic: mental-health
  ask: "Who do I actually call if I'm not coping?"
  aliases: [PANDA, Gidget Foundation, Beyond Blue, Lifeline, helpline, counsellor, psychologist, mental health care plan]
  weeks: [1, 42]
  priority: 1
  stakes: high
  covers:
    - "PANDA National Helpline 1300 726 306, 7 days, for expecting and new parents and their support people; not a crisis line"
    - "Gidget Foundation: free perinatal psychology (up to 10 Medicare bulk-billed sessions a year) at Gidget Houses or by telehealth; needs a GP referral and a Mental Health Care Plan"
    - "Beyond Blue 1300 22 4636, 24/7"
    - "your GP can assess, treat and refer to a psychologist or psychiatrist; depending on the services where you live, your doctor may refer you to a perinatal mental health team"
    - "PANDA's online checklist ('How are you going?') if you are not sure it is 'bad enough'"
    - "crisis: Lifeline 13 11 14 (24/7), 13YARN 13 92 76 for Aboriginal and Torres Strait Islander people, 000 in immediate danger"
    - "the partner can call too, about you or about themselves"
  sources:
    - title: PANDA — home (National Helpline)
      url: https://www.panda.org.au/
    - title: PANDA — Mental health checklist
      url: https://www.panda.org.au/checklists
    - title: Gidget Foundation — How to access counselling
      url: https://www.gidgetfoundation.org.au/fact-sheets/how-to-access-counselling
    - title: Gidget Foundation — Start Talking telehealth
      url: https://www.gidgetfoundation.org.au/support/start-talking-telehealth
    - title: Pregnancy, Birth and Baby — Who can I call for information and advice?
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/pregnancy-helpline-numbers
    - title: Lifeline — Get help
      url: https://www.lifeline.org.au/get-help
    - title: 13YARN
      url: https://www.13yarn.org.au/
    - title: PANDA — Support for dads
      url: https://www.panda.org.au/get-support/support-dads
  related: [antenatal-depression, antenatal-anxiety, partner-mental-health-support, loss-support-services]
  notes: "Helpline hours change: PANDA's own site says 7 days; Gidget's pages still quote older weekday hours. Confirm on panda.org.au when writing. This is the entry the call button and the mood log point at."

- id: mental-health-screening-epds
  title: The mood questions at your appointments
  type: guide
  topic: mental-health
  ask: "Why is the midwife asking me how I'm feeling with a questionnaire?"
  aliases: [EPDS, Edinburgh Postnatal Depression Scale, Edinburgh scale, mental health screening, psychosocial assessment, mood questionnaire]
  weeks: [8, 42]
  priority: 2
  stakes: medium
  covers:
    - "during pregnancy and again after the birth, most women in Australia are screened for depression (the Royal Women's)"
    - "the usual tool is the Edinburgh Postnatal Depression Scale (EPDS), a short questionnaire with a standard scoring guide, used in pregnancy as well as after"
    - "it is a screen, not a diagnosis; a high score means a conversation and a referral, not a label"
    - "answer honestly: it is how the hospital finds the people it can help, and the questions include one about self-harm"
    - "partners are not routinely screened, which is why the partner's own signs are in this Library"
  sources:
    - title: The Royal Women's Hospital — Mental health & pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/mental-health-pregnancy
    - title: Gidget Foundation — Screening and assessment for PNDA
      url: https://www.gidgetfoundation.org.au/health-professionals/screening-and-assessment-for-pnda
    - title: Gidget Foundation — Emotional wellbeing screening program
      url: https://www.gidgetfoundation.org.au/support/emotional-wellbeing-screening-progam
  related: [antenatal-depression, antenatal-anxiety, partner-perinatal-depression]
  notes: "The authoritative text is the COPE National Perinatal Mental Health Guideline and the Department of Health Pregnancy Care Guidelines; both sites blocked automated fetches, so the writer should open them in a browser to confirm the recommended timing of the EPDS in pregnancy before stating it."

