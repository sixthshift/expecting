- id: tokophobia
  title: Fear of giving birth
  type: guide
  topic: mental-health
  ask: "I'm terrified of the birth. Is that normal, and what can I do?"
  aliases: [tokophobia, fear of childbirth, scared of labour, birth anxiety, afraid of pain]
  weeks: [12, 42]
  priority: 2
  stakes: medium
  covers:
    - "it is common to feel anxious about pain, interventions or harm to the baby; for a very small number it becomes overwhelming, which is tokophobia (PBB)"
    - "what helps per PBB: knowing what to expect, a flexible birth plan, knowing the pain-relief options in advance, and that you can change your mind"
    - "talk to your midwife or doctor; counselling and a referral exist for the severe kind"
    - "a previous traumatic birth or sexual assault can be behind it; both have their own entries"
    - "the partner can help by coming to the classes and knowing the plan"
  sources:
    - title: Pregnancy, Birth and Baby — Fear of childbirth
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/fear-of-childbirth
  related: [previous-trauma-and-pregnancy, pregnancy-after-birth-trauma, birth-support-person, antenatal-anxiety]
  notes: "Pain relief options and the birth plan itself are the labour agent's; this entry is the fear."

- id: previous-trauma-and-pregnancy
  title: When pregnancy brings old trauma back
  type: guide
  topic: mental-health
  ask: "Examinations and the birth are bringing back things I'd rather not think about. What can I ask for?"
  aliases: [trauma-informed care, sexual assault survivor, childhood abuse, PTSD, triggers, examinations]
  weeks: [1, 42]
  priority: 2
  stakes: high
  covers:
    - "pregnancy, antenatal checks, vaginal examinations, birth and breastfeeding can trigger memories of earlier abuse; loss of control over your body is a common trigger (Gidget)"
    - "you can ask for trauma-informed care: being asked before you are touched, choices explained, neutral language, no judgement (PBB)"
    - "you do not have to tell the whole story; you can tell your midwife what you need (who examines you, a support person present, stopping when you say)"
    - "write your needs into the birth plan and the hospital notes; prepare a list before appointments"
    - "where the sources send you: the Royal Women's names sexual assault survivors as needing particular support; 1800RESPECT 1800 737 732 for past sexual assault too; PANDA; Gidget"
  sources:
    - title: Pregnancy, Birth and Baby — What is trauma-informed care?
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-rights/what-is-trauma-informed-care
    - title: Gidget Foundation — Parenting after childhood sexual abuse
      url: https://www.gidgetfoundation.org.au/fact-sheets/parenting-after-childhood-sexual-abuse
    - title: Gidget Foundation — Complex trauma during the perinatal period
      url: https://www.gidgetfoundation.org.au/fact-sheets/complex-trauma-during-the-perinatal-period
    - title: The Royal Women's Hospital — Anxiety & pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/mental-health-pregnancy/anxiety-pregnancy
  related: [tokophobia, birth-trauma, pregnancy-after-birth-trauma, domestic-violence-in-pregnancy]

