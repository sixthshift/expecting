- id: running
  title: Running
  type: can-i
  topic: activities
  ask: Can I keep running?
  aliases: [running, jogging, parkrun, treadmill, marathon, fun run, half marathon]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes if you ran before, at an easier pace; don't start running in pregnancy"
    - keep it conversational; stop for the usual warning signs
    - expect to slow and shorten as the bump grows; pelvic floor and joints take more load
    - no events or racing; skip hot days
    - the Royal Women's lists running as high impact to avoid, PBB lists jogging as fine
  sources:
    - title: Pregnancy, Birth and Baby — Exercising during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/exercising-during-pregnancy
    - title: Better Health Channel — Pregnancy and exercise
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
    - title: The Royal Women's Hospital — Active pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/active-pregnancy
  related: [exercise-in-pregnancy, exercise-intensity-and-heart-rate, hot-weather]
  notes: Contested. Better Health and PBB allow jogging for the already-active; the Royal Women's page tells everyone to avoid high-impact activities including running. Give the "if you already run" verdict and say why the sources differ.

- id: swimming
  title: Swimming and aqua classes
  type: can-i
  topic: activities
  ask: Can I swim while pregnant?
  aliases: [swimming, laps, aquarobics, aqua natal, water aerobics, pool, ocean swimming, snorkelling]
  who: carrying
  priority: 1
  stakes: low
  covers:
    - "verdict: yes, one of the best choices; water carries the weight"
    - avoid heated pools, spas and hydrotherapy pools that are hot
    - snorkelling is fine; scuba is not
    - stop swimming once your waters have broken (ask your midwife)
