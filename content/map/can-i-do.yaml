  related: [travel-insurance, boats-and-ferries, overseas-travel]
  notes: MotherSafe says "most restrict beyond 28 weeks"; many lines in practice use 24 weeks (unsourced here). Say "check the line" and avoid a single number, or source a line's policy page.

- id: boats-and-ferries
  title: Boats and ferries
  type: can-i
  topic: travel
  ask: Can I go out on a boat?
