- id: sex
  title: Sex in pregnancy
  type: can-i
  topic: body
  ask: Can we still have sex?
  aliases: [sex, intercourse, making love, orgasm, sex drive, libido, positions, oral sex, sex toys, anal sex, does sex hurt the baby, sex and miscarriage]
  who: together
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes at any stage unless your care provider has said not to"
    - the baby is protected by the uterus, muscles, fluid and the mucus plug; it can't feel or know
    - orgasm can bring tightenings and movement; not labour in a healthy pregnancy
    - "when to stop: placenta praevia or low-lying placenta, bleeding, waters broken, cervical stitch or short cervix, risk of preterm labour"
    - condoms and STI tests with a new or casual partner
    - "positions from 28 weeks: side-lying, hands and knees, on top; not flat on your back"
    - desire goes up and down by trimester; both of you get a say
    - see a doctor after sex for bleeding, cramps, discharge, fever, sharp pain
    - "late pregnancy: sex may help ripen the cervix, won't start labour early"
  sources:
    - title: Pregnancy, Birth and Baby — Sex during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/sex-during-pregnancy
    - title: Pregnancy, Birth and Baby — Common myths about pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/common-myths-about-pregnancy
  related: [sleeping-on-your-back, bleeding-after-sex]
  notes: Oral sex and blown air (air embolism) is a classic question; no Australian source we loaded addresses it, so either leave it out or source it before writing. "Sex to bring on labour" belongs to the labour file; link, don't write.

- id: bleeding-after-sex
