- id: insect-repellent
  title: Insect repellent
  type: can-i
  topic: body
  ask: Can I use DEET or picaridin while pregnant?
  aliases: [insect repellent, DEET, picaridin, Aerogard, Bushman, mosquito repellent, mozzie spray, Ross River virus, Japanese encephalitis, dengue, mosquito coils, citronella]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes; mosquito-borne disease is the bigger risk and APVMA-approved repellents are safe in pregnancy"
    - DEET poorly crosses the placenta; medium strength gives the same protection as high, skip 80 per cent
    - picaridin is the alternative
    - Ross River, Barmah Forest, Murray Valley and Japanese encephalitis are Australian risks; JE vaccine (JEspect) if high risk
    - long sleeves, screens, nets, dusk-to-dawn indoors
    - PBB's travel page says use a spray not a roll-on after the first trimester; no other source says this
  sources:
    - title: healthdirect — Mosquito bites
      url: https://www.healthdirect.gov.au/accidents-and-injuries/bites-and-stings/mosquito-bites
