  related: [overseas-travel, insect-repellent, zika, travel-vaccines]
  notes: Which antimalarial is a medicines-file question; this entry says "some yes, some no, a travel doctor decides".

- id: altitude
  title: Altitude
  type: can-i
  topic: travel
  ask: Can I go to high altitude, like Cusco or a Himalayan trek?
  aliases: [altitude, high altitude, altitude sickness, Machu Picchu, Cusco, La Paz, Everest base camp, Nepal trek, Kilimanjaro, Mount Kosciuszko, ski resort altitude, 2,500 metres]
  who: carrying
  priority: 3
  stakes: high
  covers:
    - "verdict: avoid trips above about 2,500 metres; less oxygen for the baby and pregnancy makes altitude sickness likelier"
    - don't exercise above 2,000 metres until acclimatised (PBB); MotherSafe flags over 2,500; Better Health over 3,000
    - the sightseeing city at altitude (Cusco, La Paz) is the common case; flying straight in is the worst version
    - nothing in Australia reaches these heights; Kosciuszko is fine
  sources:
    - title: Pregnancy, Birth and Baby — Exercising during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/exercising-during-pregnancy
    - title: MotherSafe (Royal Hospital for Women) — Travel in pregnancy
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/Factsheets/TravelInPregFeb23.pdf
    - title: Better Health Channel — Pregnancy and travel
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-travel
  related: [overseas-travel, skiing, walking, flying]
  notes: The three Australian sources give three thresholds (2,000, 2,500, 3,000 m). Give the range and the reasoning, not a single number.

- id: cruise-ships
  title: Cruises
  type: can-i
  topic: travel
  ask: Can I go on a cruise?
  aliases: [cruise, cruise ship, P&O, Carnival, Royal Caribbean, cruise pregnancy limit, 24 weeks cruise, ship doctor, seasickness, norovirus on cruise]
  weeks: [1, 28]
  who: together
  priority: 2
  stakes: high
  covers:
    - "verdict: most lines refuse passengers beyond about 24 to 28 weeks at any point of the voyage; check the line's rule before booking"
    - the ship's medical centre is not a maternity unit; days from a hospital at sea; evacuation costs
    - insurance must cover cruising specifically, and pregnancy
    - motion sickness, falls on a moving ship, gastro and respiratory outbreaks
    - short ferries and harbour boats are fine
  sources:
