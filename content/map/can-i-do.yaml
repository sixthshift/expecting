- id: camping-and-the-bush
  title: Camping, the bush and mosquitoes at home
  type: can-i
  topic: travel
  ask: Can I go camping while pregnant?
  aliases: [camping, bush, bushwalking overnight, tent, caravan, river camping, Japanese encephalitis, Ross River, mozzies, sleeping on the ground]
  who: carrying
  priority: 3
  stakes: medium
  covers:
    - "verdict: yes with mosquito precautions and a plan for getting out; near rivers and piggeries in JE-affected states ask about the vaccine"
