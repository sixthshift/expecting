  who: carrying
  priority: 3
  stakes: medium
  covers:
    - "verdict: purely cosmetic surgery waits; skin tags, warts and benign lesions are fine; a skin cancer comes out, ideally in the second trimester"
    - local anaesthetic with adrenaline is the concern in bigger procedures
    - varicose vein treatment waits; the veins often settle after birth anyway
