- id: zika
  title: Zika
  type: can-i
  topic: travel
  ask: Which countries have Zika, and can we go?
  aliases: [Zika, Zika virus, microcephaly, Zika countries, Fiji Zika, Bali Zika, Pacific Zika, Zika and trying to conceive, Zika and partner, six months]
  who: together
  priority: 1
  stakes: high
  covers:
    - "verdict: consider delaying travel to Zika areas while pregnant; the Department of Health's advice"
    - "what it does: microcephaly and other severe abnormalities; mostly symptomless in the adult"
    - spread by mosquitoes and sexually; condoms during sex while in the affected region
    - "the partner who travels alone, or anyone back from a Zika area who is pregnant or has a pregnant partner: see a doctor about testing and preventing transmission; planning a pregnancy, wait six months after leaving the area"
    - "where: healthdirect points to the US CDC for the up-to-date list and to Smartraveller for travel advice; parts of Asia and the Pacific Islands are included"
    - "if you must go: full mosquito precautions, see the repellent entry"
  sources:
    - title: healthdirect — Zika virus
      url: https://www.healthdirect.gov.au/conditions/viral-infections/zika-virus
    - title: Smartraveller — Advice for pregnant travellers
