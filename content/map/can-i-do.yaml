- id: long-drives
  title: Long drives and road trips
  type: can-i
  topic: travel
  ask: Can I do a long drive, and can I drive myself late in pregnancy?
  aliases: [long drive, road trip, driving while pregnant, driving late in pregnancy, driving to hospital, steering wheel and bump, airbag, car sickness, how long in the car, driving in labour]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes; stop every two hours, limit to five or six hours a day, and wear the belt properly"
    - sit well back from the wheel and dashboard; tilt the wheel away from the bump; airbags stay on
    - "clots: the same rules as flying on long sits"
    - "any collision, even minor: see a doctor the same day"
    - driving yourself late on is fine until it isn't comfortable or safe; don't drive yourself in labour
    - "motion sickness: second trimester is easier; ask before taking travel sickness tablets"
  sources:
    - title: Pregnancy, Birth and Baby — Travel and pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/travel-and-pregnancy
