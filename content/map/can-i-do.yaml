  related: [seatbelt-position, dvt-and-compression-stockings, falls-and-knocks, remote-travel-in-australia]
  notes: "\"Don't drive yourself in labour\" is practical advice, not in these sources. Travel sickness medicines are the medicines file's."

- id: seatbelt-position
  title: Wearing a seatbelt with a bump
  type: can-i
  topic: travel
  ask: How do I wear a seatbelt over the bump?
  aliases: [seatbelt, seat belt, lap belt, sash, seatbelt over bump, pregnancy seatbelt adjuster, is a seatbelt safe when pregnant, airbag and pregnancy]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "verdict: always wear it; lap belt low across the hips under the bump, sash between the breasts and above the bump, never across the belly"
    - not wearing it correctly is a named risk factor for injury in pregnancy
    - seat well back from the wheel and dash to reduce airbag impact
    - after any crash, see a doctor; Rh-negative, say so
  sources:
    - title: Pregnancy, Birth and Baby — Injuries during pregnancy
