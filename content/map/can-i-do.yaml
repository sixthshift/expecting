- id: roller-coasters
  title: Roller coasters and theme park rides
  type: can-i
  topic: activities
  ask: Can I go on rides at the theme park?
  aliases: [roller coaster, theme park, Dreamworld, Movie World, Luna Park, show rides, water slide, Ferris wheel, bumper cars, go-karts, rides while pregnant]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: skip the fast ones; sudden stops, jolts and restraints across the abdomen are the collision-and-sudden-movement category PBB says to avoid"
    - the ride signs say "not for pregnant guests" and operators will refuse you; that's the park's rule, not just caution
    - the slow rides (Ferris wheel, trains, carousels) are fine; heat and queues are the real day's problem
    - no Australian health source addresses rides by name; this is the fall-and-impact principle applied
  sources:
    - title: Pregnancy, Birth and Baby — Things to avoid during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/things-to-avoid-during-pregnancy
    - title: Pregnancy, Birth and Baby — Injuries during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy
  related: [falls-and-knocks, contact-sports, skydiving, hot-weather]
  notes: Unsourced as a named question in Australia; US bodies advise avoiding. Say so plainly.

- id: microwaves-and-devices
  title: Phones, wifi, microwaves and laptops
  type: can-i
  topic: activities
  ask: Is my phone, the wifi or the microwave bad for the baby?
  aliases: [mobile phone, phone on belly, wifi, 5G, EMF, radiation from phone, microwave oven, laptop on belly, headphones on bump, Bluetooth, induction cooktop, power lines, electric blanket EMF]
  who: carrying
  priority: 2
  stakes: low
  covers:
    - "verdict: no; ARPANSA's review found no or little association between radiofrequency exposure and pregnancy outcomes, and microwave ovens in working order have no established health effect"
    - these are non-ionising; the x-ray entry is the one with real doses
    - a phone on the bump is fine; headphones on the bump are for you, the baby hears your voice better anyway
    - a damaged microwave door seal is the only microwave advice worth giving
  sources:
