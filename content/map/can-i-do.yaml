- id: falls-and-knocks
  title: A fall or a knock to the bump
  type: can-i
  topic: activities
  ask: I fell over or got hit in the stomach, what do I do?
  aliases: [fall, fell over, tripped, knock to the belly, blow to the stomach, bump to the bump, car accident, abdominal trauma, placental abruption]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "verdict: any fall or blow to the abdomen gets checked, even if you feel fine"
    - placental abruption is the main risk; monitoring for at least four hours is common
    - "go to hospital if the baby is moving less than normal, or there is vaginal bleeding or abdominal pain"
    - "contractions or fluid leaking: contact your doctor (or urgent care; 000 in an emergency)"
    - "after an abdominal injury: pain, a firm or tightening uterus or bleeding means call 000; any abdominal injury, go to the nearest hospital"
    - "Rh-negative: say so, anti-D may be needed"
  sources:
    - title: Pregnancy, Birth and Baby — Injuries during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy
    - title: Better Health Channel — Pregnancy and travel
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-travel
  related: [contact-sports, seatbelt-position, horse-riding, roller-coasters]
  notes: Sits near the symptoms file. Kept here because the question is "I did a thing, now what", and the activity entries all point to it.

