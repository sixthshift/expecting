      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/skinhaircareandcosmetictreatmentsapril2021.pdf
  related: [working-while-pregnant, standing-up-quickly, heavy-lifting]

- id: heavy-lifting
  title: Heavy lifting
  type: can-i
  topic: work
  ask: How much can I lift, at work and at home?
  aliases: [heavy lifting, lifting, how much can I lift, lifting toddler, carrying groceries, moving house, moving boxes, furniture, warehouse, nursing lifts, manual handling]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: if it seems too heavy, it is; ask for help. No Australian source gives a kilogram limit"
    - looser ligaments, a shifted centre of gravity and a pelvic floor under load
    - "the technique: close to the body, bend the knees, no twisting, no breath-holding"
    - "toddlers: squat, let them climb to you, sit to cuddle"
    - "moving house: pack, don't carry; book the removalists"
    - occupational heavy lifting is a reason for adjusted duties
  sources:
    - title: SafeWork NSW — Pregnancy
      url: https://www.safework.nsw.gov.au/safety-starts-here/physical-safety-at-work-the-basics/pregnancy
    - title: Pregnancy, Birth and Baby — Working during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/working-during-pregnancy
    - title: Better Health Channel — Pregnancy and exercise
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
  related: [weights, standing-all-day, working-while-pregnant, reaching-above-your-head]
  notes: People want a number. Don't give one; the Australian sources don't, and the research "over 10 kg" figure is not guidance.

- id: shift-work
  title: Night shifts and long hours
  type: can-i
  topic: work
  ask: Can I keep doing night shifts?
  aliases: [shift work, night shift, nights, rostering, long hours, overtime, fatigue at work, FIFO, 12-hour shifts]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: ask for a review; SafeWork NSW lists shift work and exhausting work among the risks the employer must reassess"
    - fatigue, sleep and nausea are the practical problems; the evidence on outcomes is mixed
    - request day shifts, shorter shifts or more breaks as the pregnancy goes on
    - driving home tired is a real risk
  sources:
    - title: SafeWork NSW — Pregnancy
      url: https://www.safework.nsw.gov.au/safety-starts-here/physical-safety-at-work-the-basics/pregnancy
    - title: Pregnancy, Birth and Baby — Working during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/working-during-pregnancy
  related: [working-while-pregnant, standing-all-day, long-drives]

- id: chemicals-at-work
  title: Chemicals at work
  type: can-i
  topic: work
  ask: I work with chemicals, what do I need to know?
  aliases: [chemicals at work, solvents, lab work, laboratory, anaesthetic gases, cytotoxic drugs, chemotherapy handling, vet nurse, cleaner, painter, mechanic, agricultural chemicals, safety data sheet, SDS]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - "verdict: tell your employer early; chemical and biological hazards are the main reason for a safe-job transfer"
    - safety data sheets name reproductive hazards; ask for them
    - ventilation, gloves, hand-washing before eating, safe storage; masks don't stop most vapours
    - "the ones to flag specifically: solvents, cytotoxic drugs, anaesthetic gases, lead, pesticides"
    - "hairdressers and nail technicians: see that entry"
  sources:
    - title: Pregnancy, Birth and Baby — Working during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/working-during-pregnancy
