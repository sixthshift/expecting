  aliases: [spotting after sex, bleeding after intercourse, cervical ectropion, pink discharge after sex]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: tell your care team; often a sensitive cervix (ectropion), but bleeding is always reported"
    - you may be told to pause sex even once it stops
    - heavy bleeding, pain or fluid is urgent
  sources:
    - title: Pregnancy, Birth and Baby — Sex during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/sex-during-pregnancy
  related: [sex]
  notes: "Border with symptoms (bleeding in pregnancy). Kept narrow: the after-sex case only."

