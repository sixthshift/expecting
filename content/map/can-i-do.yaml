  related: [working-while-pregnant, hairdressing-and-nail-salon-work, radiation-at-work, painting-and-renovating]
  notes: The specific hazard list (cytotoxics, anaesthetic gases) is not in these pages; cite Safe Work Australia or a state hospital policy before naming them.

- id: hairdressing-and-nail-salon-work
  title: Working as a hairdresser or nail technician
  type: can-i
  topic: work
  ask: I'm a hairdresser, is the salon safe for me?
  aliases: [hairdresser, nail technician, beauty therapist, salon work, salon fumes, spray tan technician, dye at work]
  who: carrying
  priority: 3
  stakes: medium
  covers:
    - "verdict: yes; studies of hairdressers show no significant increase in birth defects or complications"
    - gloves, open windows, wash hands before eating, store and dispose of chemicals safely
    - masks don't stop vapours; ventilation does
    - avoid long shifts on your feet
    - "spray tan technicians: nose plugs or mask"
  sources:
    - title: Pregnancy, Birth and Baby — Hair care during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/hair-care-during-pregnancy
    - title: MotherSafe (Royal Hospital for Women) — Skin care, hair care and cosmetic treatments in pregnancy and breastfeeding
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/skinhaircareandcosmetictreatmentsapril2021.pdf
  related: [hair-dye, nail-salons, chemicals-at-work, standing-all-day]

- id: radiation-at-work
  title: X-rays and radiation at work
  type: can-i
  topic: work
  ask: I work with x-rays, can I keep doing my job?
  aliases: [radiographer, radiation at work, dental nurse, vet x-rays, theatre nurse, nuclear medicine, dosimeter, 1 mSv, industrial radiography, airline crew cosmic radiation]
  who: carrying
  priority: 3
  stakes: high
  covers:
    - "verdict: yes with controls; the dose to the unborn child must stay under 1 mSv for the rest of the pregnancy"
    - tell your employer as soon as you know so duties and monitoring can change
    - "your badge over-reads the fetal dose (ARPANSA: unlikely to exceed 25 per cent of the badge)"
    - "aircrew: cosmic radiation counts; the same 1 mSv public limit applies"
  sources:
    - title: ARPANSA — Occupational exposure, management of pregnant workers
      url: https://www.arpansa.gov.au/understanding-radiation/sources-radiation/occupational-exposure/occupational-exposure-management
