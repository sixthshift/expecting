- id: exercise-lying-on-your-back
  title: Exercising on your back
  type: can-i
  topic: activities
  ask: Why can't I exercise lying on my back, and from when?
  aliases: [supine, lying flat, bench press, bridges, lying on back exercise, 16 weeks]
  weeks: [16, 42]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: avoid from about 16 weeks; the uterus presses on the big vein returning blood to the heart"
    - makes you faint and can cut blood flow to the baby
    - substitute side-lying, inclined or hands-and-knees versions
    - the same reason behind side-sleeping from 28 weeks
  sources:
    - title: Pregnancy, Birth and Baby — Playing sport during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/playing-sport-during-pregnancy
    - title: The Royal Women's Hospital — Active pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/active-pregnancy
    - title: MotherSafe (Royal Hospital for Women) — Diet and exercise before, during and after pregnancy
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/dietexercise2020.pdf
  related: [sleeping-on-your-back, abdominal-exercises, massage]
  notes: Sources give 16 weeks (Royal Women's, MotherSafe, PBB sport), "after the first trimester" (PBB yoga) and 28 weeks (PBB exercise). Say 16 weeks and explain the spread.

- id: cycling
  title: Cycling
  type: can-i
  topic: activities
  ask: Can I ride my bike while pregnant?
  aliases: [cycling, bike, bicycle, commuting by bike, mountain biking, spin class, stationary bike, exercise bike, e-bike]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: stationary bike and spin, yes; road and trail riding, it's the fall that matters"
    - PBB and RANZCOG list cycling with horse riding and skiing as fall risks; Better Health allows outdoor cycling
    - balance shifts with the bump, and traffic is the other rider
    - "if you keep riding: flat, familiar routes, upright bike, stop when balance feels off"
  sources:
