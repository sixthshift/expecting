  related: [medical-x-rays-and-ct, dental-x-rays, flying, working-while-pregnant]

- id: working-with-children
  title: Working with children and infections
  type: can-i
  topic: work
  ask: I work in childcare, what infections should I worry about?
  aliases: [childcare worker, early childhood, teacher, nurse, paediatric nurse, CMV, cytomegalovirus, slapped cheek, parvovirus, chickenpox exposure, hand foot and mouth, nappies, kissing kids]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - "verdict: keep working; hand hygiene is the protection, and CMV is the one nobody tells you about"
    - "CMV: wash hands after nappies, wiping noses and handling toys; don't share food, cups or dummies; don't kiss young children on the lips"
    - "chickenpox: if you're not immune and are exposed, call the same day; immunoglobulin within 10 days"
    - "parvovirus (slapped cheek) and others: tell your midwife about outbreaks at work"
    - the employer's risk assessment can move you during an outbreak
  sources:
    - title: Pregnancy, Birth and Baby — Cytomegalovirus (CMV) during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/cytomegalovirus-cmv-during-pregnancy
    - title: Pregnancy, Birth and Baby — Chickenpox and pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/chickenpox-and-pregnancy
  related: [working-while-pregnant, vaccines-in-pregnancy, farm-animals-and-lambing]
  notes: Border with the tests-and-care file, which may own CMV, chickenpox and parvovirus as conditions. This entry is the workplace angle only; parvovirus is unsourced here.

- id: computer-screens
  title: Screens, laptops and office work
  type: can-i
  topic: work
  ask: Is a laptop on my lap or a day at the screen a problem?
  aliases: [computer screen, laptop on lap, desk job, office work, sitting all day, VDU, monitor radiation, ergonomics, carpal tunnel]
  who: carrying
  priority: 3
  stakes: low
  covers:
    - "verdict: no; screens don't emit anything that reaches the baby. The real issues are sitting still, posture and wrists"
    - move every hour, feet up, chair and desk adjusted as the bump grows
    - laptop heat on the thighs is comfort, not risk
    - carpal tunnel is common; the Royal Women's has a factsheet
  sources:
    - title: ARPANSA — Effects of radiofrequency electromagnetic field exposure on adverse pregnancy outcomes
      url: https://www.arpansa.gov.au/effects-radiofrequency-electromagnetic-field-exposure-adverse-pregnancy-outcomes-human-observational-studies
    - title: Pregnancy, Birth and Baby — Working during pregnancy
