- id: scuba-diving
  title: Scuba diving
  type: can-i
  topic: activities
  ask: Can I scuba dive while pregnant?
  aliases: [scuba, diving, dive trip, Great Barrier Reef dive, decompression, the bends, free diving, snorkelling]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - "verdict: no, at any depth and any week; the baby has no protection from decompression sickness"
    - PBB and the Royal Women's list scuba among activities to avoid; snorkelling is fine
    - Better Health's "reasonably safe to 18 metres" line contradicts the others; follow RANZCOG and PBB
    - airlines also refuse flight within 24 hours of a dive
  sources:
    - title: Pregnancy, Birth and Baby — Exercising during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/exercising-during-pregnancy
