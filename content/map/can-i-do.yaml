- id: dental-work
  title: Dental work
  type: can-i
  topic: care
  ask: Can I have a filling, a root canal or a tooth out while pregnant?
  aliases: [dentist, dental check-up, filling, root canal, tooth extraction, wisdom teeth, local anaesthetic at dentist, amalgam, dental infection, bleeding gums, gum disease, pregnancy gingivitis, free dental]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes, all of it, at any stage; untreated gum disease and infection are the bigger risk"
    - book a check-up early in pregnancy; second trimester is the comfortable chair
    - local anaesthetic is fine; most antibiotics are fine; paracetamol for pain, not ibuprofen
    - gums bleed and swell with hormones; keep brushing gently; vomiting and tooth erosion (rinse, wait 30 minutes to brush)
    - elective things (whitening, implants) wait
    - tell the receptionist and the dentist you're pregnant
    - public dental is free for Health Care Card holders in most states
  sources:
    - title: Pregnancy, Birth and Baby — Looking after your teeth during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/looking-after-your-teeth-during-pregnancy
    - title: MotherSafe (Royal Hospital for Women) — Dental treatment in pregnancy and breastfeeding
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/DentaltreatmentpregbreastNov2020.pdf
  related: [dental-x-rays, teeth-whitening, cosmetic-surgery]
  notes: Public dental eligibility differs by state; the money file may own it. Amalgam removal is not addressed by these sources.

- id: dental-x-rays
  title: Dental x-rays
  type: can-i
  topic: care
  ask: Can I have a dental x-ray?
  aliases: [dental x-ray, OPG, bitewing, lead apron, x-ray at the dentist]
  who: carrying
  priority: 2
  stakes: low
  covers:
    - "verdict: yes when needed; the dose to the baby is insignificant and a lead apron is standard"
    - PBB's general "x-rays not recommended, especially first trimester" line is about abdominal imaging; dental is the exception it names
    - tell the dentist so they can decide if it can wait
  sources:
    - title: MotherSafe (Royal Hospital for Women) — Dental treatment in pregnancy and breastfeeding
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/DentaltreatmentpregbreastNov2020.pdf
    - title: Pregnancy, Birth and Baby — Things to avoid during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/things-to-avoid-during-pregnancy
  related: [dental-work, medical-x-rays-and-ct]

- id: medical-x-rays-and-ct
  title: X-rays, CT scans and MRI
  type: can-i
  topic: care
  ask: Can I have an x-ray or a CT scan while pregnant?
  aliases: [x-ray, CT scan, CAT scan, MRI, nuclear medicine, radiation dose, mSv, chest x-ray, broken bone x-ray, I had an x-ray before I knew, contrast dye]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - "verdict: a needed x-ray away from the abdomen is fine; CT of the abdomen or pelvis is avoided unless necessary; MRI has no radiation and is used after the first trimester"
    - "doses: chest x-ray up to 0.1 mSv, CT up to 8 mSv, background 2 mSv a year; harm depends on dose, stage and body part"
    - one x-ray before you knew you were pregnant is very unlikely to have caused harm; tell your doctor and they can estimate the dose
    - always say you are or might be pregnant; ask if ultrasound or MRI can substitute
    - "nuclear medicine and breastfeeding later: ask"
  sources:
    - title: Pregnancy, Birth and Baby — Radiation exposure during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/radiation-exposure-during-pregnancy
    - title: healthdirect — X-rays
      url: https://www.healthdirect.gov.au/procedures/diagnostic-tests-and-scans/x-rays
    - title: healthdirect — CT scan
      url: https://www.healthdirect.gov.au/procedures/diagnostic-tests-and-scans/ct-scan
    - title: healthdirect — Magnetic resonance imaging (MRI)
      url: https://www.healthdirect.gov.au/procedures/diagnostic-tests-and-scans/magnetic-resonance-imaging-mri
  related: [dental-x-rays, radiation-at-work, airport-scanners, falls-and-knocks]
  notes: Border with tests-and-care (which owns pregnancy ultrasounds). This is the "I need imaging for something else" question.

- id: vaccines-in-pregnancy
  title: Which vaccines can I have?
  type: can-i
  topic: care
  ask: Which vaccines are safe in pregnancy, and which do I have to avoid?
  aliases: [vaccines, vaccination, live vaccines, MMR, chickenpox vaccine, varicella, HPV vaccine, Gardasil, COVID vaccine, shingles vaccine, BCG, tetanus, hepatitis B vaccine, I had a vaccine before I knew, 28 days]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "verdict: flu, whooping cough and RSV are routinely recommended, in their windows; other non-live vaccines (COVID, hep B) are not routine but can be given when the benefit outweighs the risk; live vaccines no (MMR, varicella, BCG, live JE), and yellow fever only if travel is unavoidable"
    - live vaccines are given before pregnancy with 28 days' wait; one given before you knew is a hypothetical risk, not a reason for alarm
    - "HPV: pause the course, finish after birth"
    - "COVID: not routinely recommended, but a dose can be considered from 20 weeks; no need for another if already vaccinated"
    - tell every vaccinator you're pregnant
  sources:
    - title: Pregnancy, Birth and Baby — Vaccinations and pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/vaccinations-and-pregnancy
    - title: Australian Immunisation Handbook — Vaccination for women who are planning pregnancy, pregnant or breastfeeding
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
  related: [travel-vaccines, working-with-children]
  exists: content/items/flu-vaccine.md
  notes: The flu, whooping cough and RSV items already exist (flu-vaccine, whooping-cough-vaccine, rsv-vaccine); this entry is the general rule and the live/non-live line. The tests-and-care file may want it; agreed border.

- id: massage
  title: Massage
  type: can-i
  topic: care
  ask: Can I have a massage, and does it have to be a "pregnancy massage"?
  aliases: [massage, pregnancy massage, prenatal massage, remedial massage, deep tissue, foot massage, reflexology, hot stone, massage chair, partner massage, pressure points]
  who: carrying
  priority: 1
  stakes: low
  covers:
    - "verdict: yes, from a therapist trained in pregnancy; side-lying or supported, never flat on your back or front in the second half"
    - no abdominal massage; gentle legs (clot risk); certain pressure points avoided
    - the "first trimester massage causes miscarriage" idea is a myth the therapy industry keeps alive; PBB gives no such rule
    - "evidence: eases back and leg pain, stress, sleep; and labour pain"
    - hot stones are a heat question; reflexology has limited evidence
    - a partner can learn the labour massage
  sources:
    - title: Pregnancy, Birth and Baby — Pregnancy massage
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/pregnancy-massage
    - title: Pregnancy, Birth and Baby — Complementary therapy during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/complementary-therapy-during-pregnancy
    - title: healthdirect — Massage therapy
      url: https://www.healthdirect.gov.au/treatments-and-self-care/massage-therapy
  related: [sleeping-on-your-back, chiropractic-and-osteopathy, acupuncture, essential-oils]
  notes: Don't assert the first-trimester myth is false without a source; PBB simply doesn't impose a first-trimester rule. Perineal massage is the labour file's.

- id: chiropractic-and-osteopathy
  title: Chiropractors, osteopaths and physios
  type: can-i
  topic: care
  ask: Can I see a chiropractor or osteopath for my back?
  aliases: [chiropractor, chiro, osteopath, osteo, spinal manipulation, Webster technique, physio, physiotherapist, women's health physio, pelvic girdle pain, back pain treatment]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: physiotherapy is the first call; chiropractic and osteopathy may ease back and pelvic pain but safety evidence is limited and manipulation has had reported harms"
    - check AHPRA registration; tell them you're pregnant; they should assess before any manipulation
    - no evidence for "turning a breech baby" claims; that's a labour question
    - a women's health physio for pelvic floor, pelvic girdle pain and abdominal separation
  sources:
    - title: Pregnancy, Birth and Baby — Complementary therapy during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/complementary-therapy-during-pregnancy
    - title: Pregnancy, Birth and Baby — Injuries during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy
  related: [massage, acupuncture, exercise-in-pregnancy]
  notes: The Webster/breech claim is not addressed by these sources; say "no evidence here" rather than "disproven".

- id: acupuncture
  title: Acupuncture and acupressure
  type: can-i
  topic: care
  ask: Can I have acupuncture for nausea or back pain?
  aliases: [acupuncture, acupressure, Sea-Bands, dry needling, Chinese medicine, TCM, forbidden points, moxibustion]
  who: carrying
  priority: 2
  stakes: low
  covers:
    - "verdict: yes from a trained, registered practitioner who knows you're pregnant; some points are avoided"
    - some evidence for nausea, back and pelvic pain, and labour pain; mild bruising is the usual side effect
    - "healthdirect flags a possible miscarriage risk in the first trimester: discuss with your doctor first"
    - Chinese herbal medicine is a different question (medicines file)
    - acupuncture to start labour and moxibustion for breech are the labour file's
  sources:
    - title: Pregnancy, Birth and Baby — Complementary therapy during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/complementary-therapy-during-pregnancy
    - title: healthdirect — Acupuncture
      url: https://www.healthdirect.gov.au/treatments-and-self-care/acupuncture
    - title: Pregnancy, Birth and Baby — Things to avoid during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/things-to-avoid-during-pregnancy
  related: [massage, chiropractic-and-osteopathy, essential-oils]

- id: other-complementary-therapies
  title: Hypnotherapy, reflexology, naturopathy and the rest
  type: can-i
  topic: care
  ask: Are hypnobirthing, reflexology or naturopathy worth it, and are they safe?
  aliases: [hypnotherapy, hypnobirthing, reflexology, naturopathy, homeopathy, kinesiology, biofeedback, TENS, Bowen, reiki, complementary therapy, alternative medicine, private health extras]
  who: carrying
  priority: 3
  stakes: low
  covers:
    - "verdict: mostly harmless, mostly unproven; the risk is delaying real care or paying for nothing"
    - "hypnotherapy: safe, may help labour pain; TENS: safe in all trimesters; reflexology: probably safe, weak evidence; naturopathy and homeopathy: no reliable evidence"
    - questions to ask a practitioner (PBB's list); AHPRA registration
    - many are no longer claimable on private health extras
  sources:
    - title: Pregnancy, Birth and Baby — Complementary therapy during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/complementary-therapy-during-pregnancy
  related: [acupuncture, massage, chiropractic-and-osteopathy]
  notes: Herbal supplements and teas are the drink and medicines files'. Hypnobirthing as labour preparation is the labour file's; link.

- id: blood-donation
  title: Giving blood and plasma
  type: can-i
  topic: care
  ask: Can I still donate blood?
  aliases: [blood donation, donate blood, plasma donation, Lifeblood, Red Cross, giving blood, iron levels, donating after birth]
  who: carrying
  priority: 3
  stakes: low
  covers:
    - "verdict: no, not during pregnancy; Lifeblood defers you to protect your iron and circulation"
    - "after birth: nine months, and further restrictions while breastfeeding"
    - "trying to conceive: Lifeblood suggests a break to build iron"
    - the partner can donate; the household's blood is still useful
  sources:
    - title: Australian Red Cross Lifeblood — I am pregnant. Can I donate?
      url: https://www.lifeblood.com.au/faq/eligibility/pregnancy-and-reproductive-health/pregnancy
