- id: travel-insurance
  title: Travel insurance and pregnancy
  type: can-i
  topic: travel
  ask: Will travel insurance cover me if something goes wrong with the pregnancy?
  aliases: [travel insurance, pregnancy cover, insurance week limit, 23 weeks, 32 weeks, IVF pregnancy insurance, newborn cover, reciprocal health care, medical evacuation, cruise insurance]
  weeks: [1, 36]
  who: together
  priority: 1
  stakes: high
  covers:
    - "verdict: buy it, and read the pregnancy clause; some policies only cover you until week 32"
    - "what to check: multiples, IVF, pre-existing complications, the baby if born early, medical evacuation, cruises"
    - reciprocal health care agreements with some countries exist; check Services Australia for what they cover
    - "within Australia: Medicare covers care, insurance still covers cancellation"
    - "a task: confirm pregnancy cover in writing before paying for the trip"
  sources:
