- id: cat-litter
  title: Cat litter and toxoplasmosis
  type: can-i
  topic: activities
  ask: Do I have to stop changing the cat's litter?
  aliases: [cat litter, litter tray, toxoplasmosis, toxo, cat poo, cats and pregnancy, get rid of the cat, kitten, outdoor cat, sandpit]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "verdict: hand the litter tray to your partner; if you must, gloves, daily changes and wash well"
    - toxoplasmosis crosses the placenta; earlier infection is rarer but worse (eyes, brain, hearing), later is likelier and milder
    - the cat stays; it's the faeces, so the litter tray is emptied daily
    - discourage the cat from hunting (a bell helps), feed cooked or store-bought food
    - the other routes are raw meat, unwashed veg and soil; see gardening
    - a blood test diagnoses it; see your doctor or midwife if you've had direct contact or have symptoms
    - "flu-like symptoms: tell your midwife"
  sources:
    - title: Pregnancy, Birth and Baby — Toxoplasmosis
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/toxoplasmosis
    - title: healthdirect — Toxoplasmosis
      url: https://www.healthdirect.gov.au/conditions/parasite-and-fungal-infections/toxoplasmosis
    - title: Pregnancy, Birth and Baby — Common myths about pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/common-myths-about-pregnancy
  related: [gardening, pets, farm-animals-and-lambing]
  notes: The "oocysts take 24 hours to sporulate" point is the reason daily changing works; it isn't on the PBB page, so source it (SA Health perinatal guideline, cited by PBB) before writing it. Raw meat and unwashed vegetables are the food file's; link.

