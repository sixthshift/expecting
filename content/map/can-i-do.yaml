- id: weights
  title: Weights and strength training
  type: can-i
  topic: activities
  ask: Can I lift weights or keep doing strength training?
  aliases: [weights, weightlifting, strength training, resistance training, gym, dumbbells, squats, deadlifts, Olympic lifting, powerlifting, pump class]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes for light-to-moderate weights with more reps; no heavy or maximal lifting"
    - breathe out on effort; no breath-holding or straining (Valsalva)
    - nothing that strains the abdomen or pelvic floor
    - no lifts lying flat on a bench after 16 weeks
    - PBB and Better Health both list heavy weightlifting among things to avoid
  sources:
    - title: Pregnancy, Birth and Baby — Exercising during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/exercising-during-pregnancy
    - title: Better Health Channel — Pregnancy and exercise
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
    - title: Pregnancy, Birth and Baby — Things to avoid during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/things-to-avoid-during-pregnancy
  related: [heavy-lifting, abdominal-exercises, exercise-lying-on-your-back]
  notes: The sources say "avoid weightlifting" and "resistance training with light weights" in the same breath. Draw the line at heavy or maximal loads and breath-holding, not at dumbbells.

- id: abdominal-exercises
  title: Sit-ups, crunches and planks
  type: can-i
  topic: activities
  ask: Can I do sit-ups or ab work while pregnant?
  aliases: [sit-ups, crunches, planks, core, abs, abdominal separation, diastasis recti, pelvic tilt]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: no sit-ups or crunches; yes to gentle core bracing on hands and knees"
    - crunches are done on your back and can worsen abdominal separation
    - the Royal Women's drawing-in exercise, building to 10-second holds
    - stop any ab work if a midline bulge appears
  sources:
