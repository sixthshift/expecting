  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes unless your doctor says otherwise; the employer must reassess risks once they know, and again as pregnancy progresses"
    - "the hazards that change things: chemicals, radiation, infections, heavy lifting, long standing, shift work, heat, work travel"
    - the right to a safe job at the same pay, or no-safe-job leave; a medical certificate may be asked for
    - stop and ask if a task makes you dizzy, sore or unwell
    - "carpal tunnel, swelling, fatigue: the ordinary adjustments"
  sources:
    - title: Pregnancy, Birth and Baby — Working during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/working-during-pregnancy
    - title: SafeWork NSW — Pregnancy
      url: https://www.safework.nsw.gov.au/safety-starts-here/physical-safety-at-work-the-basics/pregnancy
  related: [standing-all-day, heavy-lifting, chemicals-at-work, radiation-at-work, shift-work, working-with-children]
  notes: Leave, notice periods, pay and discrimination law are the money-and-work file's. This entry is the physical-safety hub only.

- id: standing-all-day
  title: Standing all day
  type: can-i
  topic: work
  ask: My job is on my feet all day, is that a problem?
  aliases: [standing all day, on my feet, retail, hospitality, nursing, teaching, hairdressing, swollen feet, varicose veins, sitting all day]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: fine with breaks; long standing without them worsens swelling, varicose veins, back pain and faintness"
    - "SafeWork NSW: sit and raise your feet after standing, stretch after sitting; the employer adjusts the rota"
    - "MotherSafe (for salon workers): avoid prolonged standing and long hours"
    - compression stockings, supportive shoes, calf raises
    - "sitting all day has its own answer: move every hour"
  sources:
    - title: SafeWork NSW — Pregnancy
      url: https://www.safework.nsw.gov.au/safety-starts-here/physical-safety-at-work-the-basics/pregnancy
    - title: The Royal Women's Hospital — Common concerns in early pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/common-concerns-in-early-pregnancy
