- id: hot-weather
  title: Heatwaves and hot days
  type: can-i
  topic: body
  ask: Is the heat dangerous for the baby, and what do I do on a 40-degree day?
  aliases: [heatwave, hot weather, 40 degrees, summer, overheating, heat exhaustion, heatstroke, dehydration, humidity, outdoor work in heat]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "verdict: you run hotter in pregnancy, and NSW Health lists pregnant women among those at risk in hot weather; plan the day around it"
    - first-trimester overheating can affect growth and development; when overheated, blood goes to the skin and less to the placenta
    - signs of heat exhaustion and when it becomes heatstroke (call 000)
    - move exercise to early or late; swimming or walking are less likely to overheat you
    - air conditioning in the middle of the day, water, loose clothes, feet in cool water, lie on your side
    - dark urine means drink
