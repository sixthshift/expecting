  related: [spas-and-hot-tubs, hot-baths, hot-yoga, hot-weather]
  notes: Contested. MotherSafe cites a 2019 BJSM review saying 20 minutes in a sauna or hot tub is safe at any stage. PBB, the Royal Women's and RANZCOG say avoid. Writers should present "avoid" as the Australian guidance and mention the review for the person who already had one.

