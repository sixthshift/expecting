- id: overseas-travel
  title: Overseas travel
  type: can-i
  topic: travel
  ask: Can we go overseas while I'm pregnant?
  aliases: [overseas, international travel, Bali, Fiji, Europe trip, developing countries, Smartraveller, travel advisory, medical care overseas, giving birth overseas, embassy]
  who: together
  priority: 1
  stakes: high
  covers:
    - "verdict: yes to places with good hospitals and no Zika or malaria; not recommended to remote areas or developing countries"
    - check the Smartraveller advisory and health section for the destination; set an alert
    - distance to a hospital with maternity and newborn care; whether very premature babies can be cared for there
    - "food and water: boil, cook, bottle, peel; no iodine to purify water after 10 weeks, chlorine tablets are an option; traveller's diarrhoea is serious in pregnancy"
    - "language: a phrase list for pregnancy emergencies; the embassy as last resort"
    - medicines legal at home may be restricted abroad; carry prescriptions
    - "COVID and flu: unvaccinated pregnant travellers are at higher risk of severe illness; ask your doctor about vaccination"
  sources:
    - title: Smartraveller — Advice for pregnant travellers
      url: https://www.smartraveller.gov.au/before-you-go/health/pregnancy
