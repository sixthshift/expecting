- id: flying
  title: Flying
  type: can-i
  topic: travel
  ask: Is it safe to fly while pregnant?
  aliases: [flying, plane, air travel, long haul, domestic flight, international flight, cabin pressure, radiation on planes, swelling on flights, aisle seat, is flying bad for the baby]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes in an uncomplicated pregnancy; the airline's week limit and clot risk are the practical issues"
    - "cabin pressure and cosmic radiation on normal trips don't harm the baby (ARPANSA: under 1 mSv)"
    - "clots: water, compression stockings, walk every half hour or so, ankle exercises; high-risk may need injections, ask before a long haul"
    - aisle or bulkhead seat; seatbelt under the bump; ask crew for oxygen if faint or breathless
    - "gestational diabetes or multiples: Better Health says flying is generally advised against; others say ask"
    - "after a dive: no flying for 24 hours"
  sources:
    - title: Pregnancy, Birth and Baby — Travel and pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/travel-and-pregnancy
    - title: Better Health Channel — Pregnancy and travel
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-travel
    - title: ARPANSA — Flying and health, cosmic radiation exposure for casual flyers and aircrew
      url: https://www.arpansa.gov.au/understanding-radiation/radiation-sources/more-radiation-sources/flying-and-health
    - title: Pregnancy, Birth and Baby — Common myths about pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/common-myths-about-pregnancy
  related: [airline-pregnancy-limits, dvt-and-compression-stockings, airport-scanners, travel-insurance, scuba-diving]
  notes: Better Health's "last six weeks could trigger premature labour" and "no flying with gestational diabetes or multiples" are stronger than PBB or the airlines. Present them as a more cautious view.

- id: airline-pregnancy-limits
  title: Airline week limits and the doctor's letter
  type: can-i
  topic: travel
  ask: Until what week will the airline let me fly, and do I need a letter?
  aliases: [airline policy, Qantas pregnancy, Jetstar pregnancy, Virgin pregnancy, 28 weeks letter, 36 weeks, medical clearance, fit to fly letter, twins flying limit, how late can I fly]
  weeks: [24, 40]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "verdict: on Qantas and Virgin Australia, routine single pregnancies fly to the end of week 36 on flights of four hours or more and week 40 under four hours; twins to 32 and 36. From 28 weeks carry a letter"
    - "the letter: due date, single or multiple, no complications, fit to fly; Virgin wants it dated within 10 days of travel"
    - "complications of any kind: formal medical clearance, lodged days ahead"
    - overseas carriers set their own rules, often earlier (Smartraveller says most airlines won't let you fly beyond 28 weeks; MotherSafe says international cut-offs start from 32 weeks); check before you book
    - "RANZCOG: travel beyond 36 weeks is not recommended regardless"
    - the limits are the airline's minimum, not a safety endorsement
  sources:
    - title: Qantas — Flying with a medical condition (pregnancy)
      url: https://www.qantas.com/en-au/travel-information/specific-needs-assistance/fitness-to-fly
    - title: Virgin Australia — Flying while pregnant
      url: https://www.virginaustralia.com/au/en/travel-info/specific-travel/specific-needs-assistance/flying-while-pregnant/
    - title: Smartraveller — Advice for pregnant travellers
      url: https://www.smartraveller.gov.au/before-you-go/health/pregnancy
    - title: RANZCOG — Travelling during pregnancy
      url: https://ranzcog.edu.au/womens-health/patient-information-resources/travelling-during-pregnancy
  related: [flying, travel-in-pregnancy, travel-insurance]
  notes: Changing advice. Airline policies move; the entry should carry a checked date and name the airlines whose pages were read (Qantas, Virgin; Jetstar's page would not load for us). A task "get the fit-to-fly letter" belongs here, due the week before the trip.

- id: dvt-and-compression-stockings
  title: Blood clots on long journeys
  type: can-i
  topic: travel
  ask: Do I need compression stockings for the flight?
  aliases: [DVT, blood clot, deep vein thrombosis, compression stockings, flight socks, clexane for flying, heparin injections, calf pain after flight, long journey clot]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - "verdict: yes, knee-high fitted stockings for any flight or sitting journey of four hours or more; pregnancy already raises clot risk"
    - the risk lasts up to two weeks after a long flight
    - "higher risk (previous clot, over 100 kg, multiples, family history): talk about injections before and after"
    - water, walking, ankle circles, limit caffeine and alcohol
    - "calf pain or swelling, chest pain or breathlessness afterwards: emergency"
  sources:
    - title: Pregnancy, Birth and Baby — Travel and pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/travel-and-pregnancy
    - title: Better Health Channel — Pregnancy and travel
