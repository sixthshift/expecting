- id: travel-vaccines
  title: Travel vaccines
  type: can-i
  topic: travel
  ask: Can I have the travel vaccines I need?
  aliases: [travel vaccines, typhoid, hepatitis A, yellow fever, Japanese encephalitis, rabies, cholera, travel doctor, travel clinic, yellow fever certificate]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - "verdict: inactivated vaccines (injectable typhoid, hepatitis A, inactivated JE) yes if the risk warrants; live ones no, and yellow fever only when travel is unavoidable and risk substantial"
    - a destination that requires a live vaccine is a destination to reconsider
    - "plan ahead: these are ideally done before pregnancy"
    - a travel doctor plus your obstetric team, not either alone
  sources:
    - title: Australian Immunisation Handbook — Vaccination for women who are planning pregnancy, pregnant or breastfeeding
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
