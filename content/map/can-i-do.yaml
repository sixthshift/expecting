- id: yoga
  title: Yoga
  type: can-i
  topic: activities
  ask: Can I do yoga, and which poses should I skip?
  aliases: [yoga, prenatal yoga, pregnancy yoga, vinyasa, ashtanga, stretching, inversions, twists]
  who: carrying
  priority: 1
  stakes: low
  covers:
    - "verdict: yes; tell the teacher or choose a pregnancy class"
    - no lying flat on your back after the first trimester
    - no hot rooms
    - "looser ligaments: don't push stretches; deep twists, wide squats and walking lunges not recommended"
    - balance changes; avoid poses you could fall from
  sources:
