    - title: Better Health Channel — Pregnancy and travel
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-travel
  related: [swimming, flying, skydiving]
  notes: Better Health's travel page says scuba is "generally considered reasonably safe to 18 metres". Every other Australian source says avoid. Say avoid and explain the outlier.

