# Travel
# ---------------------------------------------------------------------------

- id: travel-in-pregnancy
  title: Travelling while pregnant
  type: can-i
  topic: travel
  ask: Can we still go on that trip?
  aliases: [travel, holiday, babymoon, trip, when is the best time to travel, travelling pregnant, high-risk pregnancy travel, medical letter for travel]
  who: together
  priority: 1
  stakes: high
  covers:
    - "verdict: usually yes; the second trimester (13 to 26 weeks) is the sweet spot"
    - "who shouldn't: multiples, high blood pressure, placental problems, incompetent cervix, previous preterm labour, diabetes; ask first"
    - "what to take: a letter with due date, complications and a brief history; copies of prescriptions and insurance; medical records"
    - how far from a hospital will you be, and does it have a maternity unit
    - "Australia: Medicare or private health insurance covers care throughout the country"
    - "overseas: see insurance, vaccines, Zika, malaria, altitude"
    - see your doctor at least 8 weeks before leaving (Smartraveller)
  sources:
