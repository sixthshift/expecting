- id: pilates
  title: Pilates
  type: can-i
  topic: activities
  ask: Can I do Pilates while pregnant?
  aliases: [pilates, reformer, clinical pilates, mat pilates, core work]
  who: carrying
  priority: 2
  stakes: low
  covers:
    - "verdict: yes, with a pregnancy-trained instructor; reformer and clinical Pilates are fine"
    - two strength sessions a week with a day between
    - no supine work after the first trimester; no hot studios
    - skip abdominal exercises if you develop a bulge down the midline (abdominal separation)
  sources:
    - title: Pregnancy, Birth and Baby — Yoga and Pilates during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/yoga-and-pilates-during-pregnancy
