      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
  related: [exercise-in-pregnancy, motorbikes-and-scooters, horse-riding]
  notes: Contested between Australian sources. Give both and let the verdict turn on fall risk, not cycling itself.

- id: contact-sports
  title: Contact and team sports
  type: can-i
  topic: activities
  ask: Can I keep playing netball, soccer or footy?
  aliases: [netball, soccer, football, AFL, rugby, hockey, basketball, touch footy, cricket, softball, martial arts, boxing, squash, tennis, team sport, competitive sport]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "verdict: avoid; a knock to the abdomen can separate the placenta"
    - "the list: football, soccer, hockey, basketball, martial arts, judo, kickboxing, and bat-and-ball sports (cricket, softball)"
    - court sports (tennis, squash) also mean sudden direction changes on loose ligaments
    - after about 12 weeks the uterus is above the pelvis and unprotected
    - "low-contact substitutes: walking, swimming, stationary bike, pregnancy classes"
