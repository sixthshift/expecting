# Exercise and activity
# ---------------------------------------------------------------------------

- id: exercise-in-pregnancy
  title: Exercise in pregnancy
  type: can-i
  topic: activities
  ask: Can I keep exercising now that I'm pregnant?
  aliases: [exercise, working out, keeping fit, gym, fitness, physical activity, how much exercise, cardio]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "verdict: yes, and recommended; most days, about 30 minutes of moderate activity, or 150 minutes a week"
    - intensity test is talk-but-not-sing, not a heart-rate target
    - keep to what you did before; don't ramp up intensity in pregnancy
    - "the short list to avoid: falls, contact, heat, pressure change, lying flat after 16 weeks"
    - stop and call if chest pain, dizziness, bleeding, fluid, contractions, less movement, calf pain or sudden swelling
    - don't exercise with a fever
    - starting from unfit is fine, 15 to 20 minutes and build
  sources:
    - title: Pregnancy, Birth and Baby — Exercising during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/exercising-during-pregnancy
    - title: Better Health Channel — Pregnancy and exercise
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
    - title: The Royal Women's Hospital — Active pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/active-pregnancy
    - title: RANZCOG — Common questions in pregnancy
      url: https://ranzcog.edu.au/wp-content/uploads/Common-Questions-In-Pregnancy.pdf
  related: [exercise-intensity-and-heart-rate, running, swimming, weights, exercise-lying-on-your-back, hot-yoga]
  notes: The hub entry. Contraindications (pre-eclampsia, placenta praevia late, ruptured membranes, cervical insufficiency, bleeding, growth restriction) belong here as "ask first" conditions.

- id: exercise-intensity-and-heart-rate
  title: How hard to push
  type: can-i
  topic: activities
  ask: How hard can I exercise, and is there a heart rate I shouldn't go over?
  aliases: [heart rate, 140 bpm, max heart rate, HIIT, high intensity, vigorous exercise, F45, CrossFit, Borg scale, perceived exertion]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: moderate; keep it conversational, the old 140 bpm rule is gone"
    - resting heart rate rises in pregnancy, so use perceived exertion not a number
    - Better Health keeps effort under about 75 per cent of maximum
    - vigorous is possible if you were already doing it; MotherSafe cites 35 minutes of high intensity at 25 degrees as safe
    - no competitive or personal-best efforts
  sources:
    - title: Better Health Channel — Pregnancy and exercise
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
    - title: MotherSafe (Royal Hospital for Women) — Diet and exercise before, during and after pregnancy
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/dietexercise2020.pdf
    - title: Pregnancy, Birth and Baby — Playing sport during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/playing-sport-during-pregnancy
  related: [exercise-in-pregnancy, running, hot-weather]
  notes: Sources differ on vigorous exercise for the already-fit. Write it as "continue what you did, don't add".

- id: walking
  title: Walking
  type: can-i
  topic: activities
  ask: Is walking enough exercise, and can I walk right up to the end?
  aliases: [walking, brisk walk, steps, 10,000 steps, bushwalking, hiking]
  who: carrying
  priority: 2
  stakes: low
  covers:
    - "verdict: yes, the default exercise for all 42 weeks"
    - brisk enough to notice your breathing
    - supportive shoes, shorter strides late on
    - hiking is fine on stable tracks; think about falls, heat, altitude and distance from help
  sources:
