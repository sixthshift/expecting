  covers:
    - "verdict: no new piercings; infection and slow healing. Existing ones stay until they pull"
    - a navel ring stretches with the bump; swap for a flexible bar or take it out
    - nipple piercings come out before breastfeeding; genital and navel piercings out for a caesarean
    - infection risks (hepatitis B and C) from unregistered studios
