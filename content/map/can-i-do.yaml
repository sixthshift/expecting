- id: sleeping-on-your-back
  title: Sleeping on your back
  type: can-i
  topic: body
  ask: Is it true I can't sleep on my back?
  aliases: [back sleeping, sleep on side, side sleeping, 28 weeks, left side, right side, woke up on my back, stillbirth and sleep position, Sleep on Side]
  weeks: [28, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "verdict: from 28 weeks go to sleep on your side, every sleep including naps; it halves the risk of late stillbirth"
    - either side is fine; the "left side only" rule is not the Australian advice
    - the position you fall asleep in is the one you hold longest; waking on your back is normal, just roll over
    - "why: the uterus compresses the big vessels, less blood to the placenta"
    - pillows behind the back and between the knees
  sources:
    - title: Pregnancy, Birth and Baby — Sleep during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/sleep-during-pregnancy
    - title: Red Nose — Sleeping on your side reduces your stillbirth risk
      url: https://rednose.org.au/news/sleeping-on-your-side-reduces-your-stillbirth-risk/
    - title: RANZCOG — Common questions in pregnancy
      url: https://ranzcog.edu.au/wp-content/uploads/Common-Questions-In-Pregnancy.pdf
  related: [exercise-lying-on-your-back, sleeping-on-your-stomach, massage, sex]
  notes: SA Health's heat page says "left side"; Red Nose and PBB say either. Don't let the left-side myth creep in. Handle the stillbirth statistic gently (RANZCOG quotes "up to 8 times", Red Nose "halves"); use Red Nose's framing.

- id: sleeping-on-your-stomach
  title: Sleeping on your stomach
  type: can-i
  topic: body
  ask: Can I sleep on my stomach early on?
  aliases: [stomach sleeping, front sleeping, tummy sleeping, sleeping position first trimester, pregnancy pillow]
  weeks: [1, 20]
  who: carrying
  priority: 2
  stakes: low
  covers:
    - "verdict: yes while it's comfortable; the uterus is inside the pelvis until about 12 weeks and well cushioned after"
    - it stops being comfortable before it becomes a problem
    - the switch to side-sleeping is a 28-week habit worth starting earlier
    - "pregnancy pillows: a wedge under the belly, a pillow between the knees"
  sources:
    - title: Pregnancy, Birth and Baby — Sleep during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/sleep-during-pregnancy
  related: [sleeping-on-your-back]
  notes: No source gives a verdict on front sleeping; PBB covers position and pillows. Write the "comfort decides" answer and say it is reasoning, not guidance.

- id: standing-up-quickly
  title: Dizziness when standing or lying flat
  type: can-i
  topic: body
  ask: Why do I feel faint lying on my back or standing up fast, and is it dangerous?
  aliases: [dizzy, faint, light-headed, supine hypotension, standing too long, blood pressure drop, getting up quickly]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - "verdict: common and usually harmless; lie on your side, get up slowly, don't stand still for long"
    - lower blood pressure plus the uterus on the big vein
    - calf raises and marching on the spot when you must stand
    - frequent fainting gets checked
  sources:
