      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/Factsheets/TravelInPregFeb23.pdf
  related: [overseas-travel, insect-repellent, malaria, sex]
  notes: Changing. The list of affected countries moves; the entry should point at the live Smartraveller and Department of Health pages rather than name countries. The Department of Health's own Zika page would not load for us; healthdirect quotes it.

- id: malaria
  title: Malaria areas
  type: can-i
  topic: travel
  ask: Can I travel to a malaria area, and can I take the tablets?
  aliases: [malaria, antimalarials, malaria tablets, chloroquine, doxycycline, Malarone, mefloquine, PNG, Africa trip, malaria prophylaxis]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - "verdict: avoid malaria areas if you possibly can; malaria in pregnancy causes miscarriage, stillbirth, low birth weight and prematurity"
    - "if unavoidable: some tablets are considered safe (chloroquine), some are not (doxycycline); a travel doctor chooses"
    - pregnant women are bitten more; dusk-to-dawn precautions, nets, screens, repellent
    - fever during or after the trip is malaria until proven otherwise
  sources:
    - title: healthdirect — Malaria
      url: https://www.healthdirect.gov.au/conditions/parasite-and-fungal-infections/malaria
    - title: Better Health Channel — Pregnancy and travel
