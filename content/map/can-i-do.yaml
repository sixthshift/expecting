    - the "aluminium in antiperspirant" worry has no pregnancy guidance behind it
    - "PBB's test: avoid what isn't essential and hasn't been shown safe; this is about unusual products, not deodorant"
    - skin and smell sensitivity change; swap for comfort, not safety
  sources:
