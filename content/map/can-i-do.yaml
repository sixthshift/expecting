  aliases: [electric blanket, heat pack, wheat bag, hot water bottle, heated throw, heating pad, heat on belly]
  who: carrying
  priority: 2
  stakes: low
  covers:
    - "verdict: yes; warm the bed then turn it off, and keep heat packs off the bump"
    - MotherSafe names electric blankets among things that raise body temperature but says only prolonged, very hot exposure matters
    - a heat pack on the lower back or hip for aches is fine and is packed for labour
    - skin is more sensitive in pregnancy; wrap the pack
  sources:
    - title: MotherSafe (Royal Hospital for Women) — Fever and pregnancy
