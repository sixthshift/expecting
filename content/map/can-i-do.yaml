- id: loud-noise
  title: Loud noise, concerts and festivals
  type: can-i
  topic: activities
  ask: Can I go to a concert or work somewhere loud?
  aliases: [concert, festival, loud music, nightclub, fireworks, noise at work, hearing protection, bass, baby's hearing]
  who: carrying
  priority: 3
  stakes: low
  covers:
    - "verdict: ask; no Australian source addresses it. Treat prolonged, very loud noise at work as a hazard to raise in the risk assessment; a concert is a crowd, heat and standing question"
    - the baby hears from around the middle of pregnancy; muffled by the body
    - "crowds: crush, falls, dehydration, no seat"
  sources:
    - title: SafeWork NSW — Pregnancy
      url: https://www.safework.nsw.gov.au/safety-starts-here/physical-safety-at-work-the-basics/pregnancy
