  related: [long-drives, falls-and-knocks]

- id: motorbikes-and-scooters
  title: Motorbikes, scooters and e-bikes
  type: can-i
  topic: travel
  ask: Can I keep riding my motorbike or e-scooter?
  aliases: [motorbike, motorcycle, scooter, Vespa, e-scooter, e-bike, pillion, moped overseas, Bali scooter]
  who: carrying
  priority: 3
  stakes: medium
  covers:
    - "verdict: ask; no Australian source addresses it. Every fall-risk principle applies, there's no seatbelt and a tank or bars in front of the bump"
