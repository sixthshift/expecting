  topic: food
  ask: Which cheeses are fine?
  aliases: [cheddar, tasty cheese, parmesan, cream cheese, cottage cheese, haloumi, halloumi, mozzarella, bocconcini, paneer, processed cheese, cheese slices, cheese spread]
  who: carrying
  priority: 1
  stakes: medium
  covers: ["verdict: yes for hard cheeses; yes with care for pasteurised cream cheese, cottage cheese, haloumi and mozzarella", "store in the fridge, eat within two days of opening", "buy cheese packaged by the manufacturer rather than cut at a deli", "fresh mozzarella and bocconcini from a deli counter sit on the higher-risk list"]
  sources:
