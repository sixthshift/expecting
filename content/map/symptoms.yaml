- id: heartburn
  title: Heartburn and indigestion
  type: symptom
  topic: body
  ask: "Why do I get heartburn every night, and what can I take?"
  aliases: [reflux, indigestion, acid, burning chest, dyspepsia, sour taste]
  weeks: [1, 42]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "8 in 10 pregnant people get heartburn or indigestion at some point; hormones relax the valve and the uterus presses on the stomach"
    - "small frequent meals, eat slowly, don't lie down after eating, raise the head of the bed"
    - "see doctor: symptoms don't go away with medicine; heartburn that doesn't settle with antacids after 20 weeks can be pre-eclampsia (pain under the ribs)"
    - "see doctor immediately: vomiting blood, losing weight, painful or difficult swallowing, short of breath, chest pain"
    - "see doctor if severe, persistent or getting worse"
  sources:
    - title: PBB — Indigestion and heartburn in pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/indigestion-and-heartburn-in-pregnancy
    - title: PBB — Pre-eclampsia
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/pre-eclampsia
  related: [pain-under-the-ribs, signs-of-pre-eclampsia, insomnia]
  notes: "Which antacids are safe belongs to the medicines area; this entry only says when heartburn stops being just heartburn."

