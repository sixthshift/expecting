- id: spotting-and-bleeding-in-early-pregnancy
  title: Spotting or bleeding before 20 weeks
  type: symptom
  topic: body
  ask: "I've had some spotting. Am I losing the baby?"
  aliases: [spotting, bleeding, brown discharge, pink discharge, blood when I wipe, implantation bleeding, light bleeding, early pregnancy bleeding]
  weeks: [1, 20]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "common: 1 in 4 bleed in early pregnancy and many go on to have a healthy baby (RWH); light spotting does not always mean miscarriage"
    - "causes: implantation bleeding, miscarriage, ectopic pregnancy, molar pregnancy"
    - "contact doctor or midwife for spotting or bleeding at any stage; note the amount, colour, clots, pain; keep the pad"
    - "if bleeding is not heavy and you feel well, contact doctor or midwife straight away; you may be referred to an early pregnancy assessment service"
    - "go to emergency: heavy bleeding or large clots, strong abdominal pain, shoulder tip pain, fever or chills, dizzy or faint, smelly discharge, short of breath or fast heartbeat"
    - "call 000: heavy bleeding (soaking 1 or more pads an hour or can't contain it), severe pain, shoulder tip pain, feeling faint, dizzy or unwell, trouble breathing"
    - "Rh negative: after a miscarriage, ask whether you need anti-D"
  sources:
    - title: PBB — Bleeding during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/bleeding-during-pregnancy
    - title: PBB — What should I do if I think I'm having a miscarriage?
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/miscarriage/what-should-i-do-if-i-think-im-having-a-miscarriage
    - title: RWH — Bleeding in early pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/pregnancy-problems/early-pregnancy-problems/bleeding-in-early-pregnancy
  related: [heavy-bleeding, cramping-and-pain-in-early-pregnancy, shoulder-tip-pain, bleeding-after-20-weeks]
  notes: "Miscarriage as an event, and what happens next, belong to the loss area; this entry stops at 'call'. The two PBB pages give different 000 thresholds for 'heavy': 2 pads an hour (bleeding page) and 1 or more pads an hour (miscarriage page). Use the more cautious one and say so."

- id: bleeding-after-20-weeks
  title: Bleeding in later pregnancy
  type: symptom
  topic: body
  ask: "I'm 30 weeks and bleeding. What do I do?"
  aliases: [bleeding late pregnancy, bleeding third trimester, bright red blood, placenta praevia bleeding, abruption, bleeding after sex, show]
  weeks: [20, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "bleeding after 20 weeks may be a sign something needs medical attention; often the placenta: placenta praevia (painless bleeding after 28 weeks), placental abruption (bleeding with constant pain, not in waves; back pain; contractions; the baby moving less; pain may be mild or absent), vasa praevia"
    - "a 'show' is mucus, possibly bloodstained; bright red blood not mixed with mucus is probably not a show: contact doctor or midwife immediately"
    - "contact doctor, midwife or birth unit immediately for any bleeding; tell them if you have a low-lying placenta"
    - "contact obstetrician or birth unit, or call an ambulance, immediately: soaking 2 pads an hour or clots, strong pain in the tummy or shoulder, dizzy or faint, short of breath"
    - "call 000: very heavy bleeding, strong pain, or feeling very unwell; placenta praevia with heavy bleeding and pain or contractions; abruption with severe bleeding or pain"
    - "after any blow to the belly, bleeding, pain or a tightening uterus: call 000"
  sources:
    - title: PBB — Bleeding during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/bleeding-during-pregnancy
    - title: PBB — Placental abruption
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placental-abruption
    - title: PBB — Placenta praevia
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placenta-praevia
    - title: PBB — Vaginal discharge during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/vaginal-discharge-during-pregnancy
    - title: RWH — Placenta problems
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/pregnancy-problems/pregnancy-problems-in-later-pregnancy/placenta-problems
  related: [heavy-bleeding, abdominal-pain, fall-or-blow-to-the-belly, reduced-movements, fluid-leaking]
  notes: "Placenta praevia and abruption as conditions (what they are, what happens) are terms for the tests-and-care or body-and-baby areas; this entry is the symptom and the call."

