# "Is this normal?": symptoms during the pregnancy.
#
# Every entry is `type: symptom`. `covers` lists what the cited source says is
# usual, then its thresholds in its own words: "mention at next visit", "see
# doctor or midwife", "call birth unit today / contact immediately", and
# "call now / 000". Nothing in `covers` is our judgement. Where a source gives
# no threshold, `notes` says so. Red flags are `stakes: high`, `priority: 1`.
#
# Abbreviations in source titles: PBB = Pregnancy, Birth and Baby
# (pregnancybirthbaby.org.au, Healthdirect Australia); RWH = the Royal Women's
# Hospital, Melbourne. Every URL below was fetched and read on 2026-10-28.

# ---------------------------------------------------------------------------
# Common: usually nothing to worry about
# ---------------------------------------------------------------------------

- id: nausea-and-vomiting
  title: Nausea and vomiting (morning sickness)
  type: symptom
  topic: body
  ask: "Is it normal to feel sick all day, not just in the morning?"
  aliases: [morning sickness, nausea, feeling sick, throwing up, vomiting, queasy, all-day sickness]
  weeks: [4, 20]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "can happen at any time of day; most common between weeks 6 and 14, can last to 14 to 20 weeks"
    - "usually starts around week 6 and settles by about 14 to 16 weeks (RWH)"
    - "no research shows it harms the baby"
    - "see doctor or midwife: nausea or vomiting causing a lot of discomfort, or you think it is hyperemesis"
    - "see doctor: very dark urine, blood in vomit, extreme tiredness, a large amount of weight loss, can't keep fluids down"
    - "see your doctor immediately if vomiting and can't keep fluids down"
    - "RWH: if nothing works, you feel exhausted, or you are vomiting and losing weight, see your doctor or midwife"
  sources:
    - title: PBB — Morning sickness
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/dealing-with-morning-sickness
    - title: RWH — Common concerns in early pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/common-concerns-in-early-pregnancy
    - title: RWH — Coping with nausea, vomiting and hyperemesis in pregnancy (fact sheet, July 2026)
      url: https://www.thewomens.org.au/images/uploads/fact-sheets/Nausea_vomiting_hyperemesis_in_pregnancy_260721.pdf
  related: [severe-vomiting, food-cravings-and-aversions, tiredness]
  exists: content/items/morning-sickness.md

- id: tiredness
  title: Tiredness and fatigue
  type: symptom
  topic: body
  ask: "Why am I so exhausted, and when does it get better?"
  aliases: [fatigue, exhausted, no energy, sleepy all the time, wiped out]
  weeks: [1, 42]
  who: carrying
  priority: 1
  stakes: low
  covers:
    - "common; feeling tired is very common especially in the first 12 weeks; energy often improves after 14 weeks"
    - "returns late in pregnancy from carrying more weight and poorer sleep"
    - "can be a symptom of anaemia (low iron), common in pregnancy"
    - "see doctor or midwife: exhausted and more rest does not help; new snoring or pauses in breathing during sleep; sleep disturbed by heartburn or restless legs; feeling anxious or depressed"
    - "from 28 weeks, sleep on your side, not your back"
  sources:
    - title: PBB — Dealing with fatigue during your pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/dealing-with-fatigue-during-your-pregnancy
    - title: PBB — Early signs of pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/early-signs-of-pregnancy
  related: [insomnia, snoring, restless-legs]

