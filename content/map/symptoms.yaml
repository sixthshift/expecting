- id: itchy-palms-and-soles
  title: Itchy palms and soles (cholestasis)
  type: symptom
  topic: body
  ask: "The palms of my hands and soles of my feet itch like mad at night, with no rash. What is it?"
  aliases: [cholestasis, obstetric cholestasis, ICP, itchy hands and feet, itching without rash, itching at night, bile acids, liver itch]
  weeks: [20, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "cholestasis affects the liver; uncommon; usually starts in the third trimester; itch without a rash, often starting on palms and soles and spreading"
    - "see doctor or midwife for itchy skin without a rash after 20 weeks; tell them if the itch is worst on hands or feet, or you or a family member had cholestasis before"
    - "healthdirect: after 20 weeks, contact doctor, midwife or hospital immediately for extreme itchiness, especially hands and feet"
    - "diagnosed by blood tests (bile acids, liver); repeated every week or two; treated with ursodeoxycholic acid; birth may be recommended earlier"
    - "increases the risk of fetal distress, preterm labour and stillbirth, more so with higher bile acids; any change in movements: contact midwife or doctor immediately, do not wait until the next day"
  sources:
