  related: [breathlessness, racing-heartbeat, heartburn, painful-swollen-leg]
  notes: "healthdirect's chest-pain page is general, not pregnancy-specific; its 10-minute rule is the only stated threshold."

- id: racing-heartbeat
  title: Racing or pounding heart
  type: symptom
  topic: body
  ask: "My heart keeps racing and skipping. Is that normal in pregnancy?"
  aliases: [palpitations, heart racing, pounding heart, skipped beats, fast heartbeat, fluttering heart]
  weeks: [1, 42]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - "contact doctor, midwife or hospital immediately: shortness of breath or a racing heartbeat (healthdirect warning signs)"
    - "palpitations are common and usually not serious, but see doctor so your heart can be checked"
    - "see doctor urgently: palpitations lasting more than a few minutes, happening often, or a family history of heart rhythm problems"
    - "call 000: palpitations with chest pain, shortness of breath, dizziness or fainting"
    - "a fast heart rate is also a sign of ectopic pregnancy (early) and sepsis"
  sources:
    - title: healthdirect — Warning signs during pregnancy
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
    - title: healthdirect — Heart palpitations
