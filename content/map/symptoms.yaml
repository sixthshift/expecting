- id: dizziness-and-fainting
  title: Dizziness and feeling faint
  type: symptom
  topic: body
  ask: "I nearly fainted standing up. Is low blood pressure normal in pregnancy?"
  aliases: [lightheaded, faint, fainting, passing out, low blood pressure, hypotension, dizzy, woozy, blacked out]
  weeks: [1, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "blood pressure commonly falls in the first and second trimesters and rises back by birth"
    - "most likely getting up quickly, after a hot bath, standing too long; in late pregnancy lying on your back can make you faint, turn onto your side (RWH)"
    - "sit or lie down at the first sign; drink water, stand slowly, eat regularly"
    - "tell midwife or doctor at your next check if you notice symptoms of low blood pressure"
    - "RWH: contact doctor or midwife for frequent dizziness or fainting"
    - "before 20 weeks, contact doctor, midwife or hospital immediately for dizziness or fainting (healthdirect warning signs)"
    - "early pregnancy with fainting, dizziness, bleeding or abdominal pain: go straight to emergency or call 000 (possible ectopic pregnancy)"
  sources:
    - title: PBB — Low blood pressure during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/low-blood-pressure-during-pregnancy
    - title: RWH — Common concerns in early pregnancy
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/common-concerns-in-early-pregnancy
    - title: healthdirect — Warning signs during pregnancy
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
    - title: healthdirect — Fainting
      url: https://www.healthdirect.gov.au/fainting
  related: [cramping-and-pain-in-early-pregnancy, shoulder-tip-pain, racing-heartbeat, heavy-bleeding]
  notes: "PBB's own low-blood-pressure page says 'tell your midwife at your next check', while healthdirect's warning-signs page says contact immediately for dizziness or fainting before 20 weeks. Give both, by context (with bleeding or pain it is the ectopic rule)."

