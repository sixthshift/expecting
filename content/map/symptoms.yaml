  covers:
    - "pain or a burning feeling when passing urine, needing to go more, cloudy, bloody or smelly urine, low tummy pain: a UTI, the most common bacterial infection in pregnancy"
    - "see midwife or doctor for any UTI symptoms; don't delay antibiotics (healthdirect: see as soon as possible for urgency, pain or burning when urinating)"
    - "fever above 38°C with back pain means the infection may have reached the kidneys"
    - "RWH: any pain or scalding when you pass urine may mean infection, see your doctor"
  sources:
