- id: back-pain
  title: Back pain
  type: symptom
  topic: body
  ask: "My lower back aches all the time. Is that just pregnancy?"
  aliases: [backache, sore back, lower back pain, bad back]
  weeks: [1, 42]
  who: carrying
  priority: 1
  stakes: medium
  covers:
    - "common, up to 7 in 10, especially in the third trimester; ligaments loosen and the baby's weight pulls the spine forward; often worse at night"
    - "walking, swimming, stretching and strengthening; posture; physiotherapy"
    - "see doctor or midwife: pain that disrupts your day, happens while exercising, is new to you, or you have pins and needles, leg weakness or incontinence"
    - "see doctor or midwife: back pain with painful urination, blood in urine, nausea and vomiting or bowel/bladder changes (can be a UTI)"
    - "call 000: symptoms of preterm labour or cauda equina syndrome (sudden loss of bladder or bowel control, numbness in the genital area)"
  sources:
    - title: PBB — Backache in pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/backache-in-pregnancy
    - title: RWH — Back care & posture
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/back-care-posture
    - title: healthdirect — Sciatica
      url: https://www.healthdirect.gov.au/sciatica
  related: [pelvic-girdle-pain, sciatica, signs-of-preterm-labour, urinary-tract-infection]

