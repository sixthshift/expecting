    - title: PBB — Third trimester
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/third-trimester
    - title: PBB — Backache in pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/backache-in-pregnancy
  related: [braxton-hicks, fluid-leaking, bleeding-after-20-weeks, abdominal-pain, back-pain]
  notes: "The signs of labour at term, and what preterm birth means for the baby, belong to the labour area; this entry is the before-37-weeks call."

- id: weight-loss
  title: Losing weight in pregnancy
  type: symptom
  topic: body
  ask: "I've lost weight instead of gaining. Is that a problem?"
  aliases: [losing weight, weight loss, not gaining weight, scales going down]
  weeks: [1, 42]
  who: carrying
