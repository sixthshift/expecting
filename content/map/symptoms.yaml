- id: fall-or-blow-to-the-belly
  title: A fall, a car accident or a blow to the belly
  type: symptom
  topic: body
  ask: "I slipped and landed on my front. Do I need to be checked?"
  aliases: [fell over, fall, car accident, seatbelt, hit in the stomach, bump to belly, trauma, knocked, domestic violence]
  weeks: [1, 42]
  priority: 1
  stakes: high
  covers:
    - "contact doctor, midwife or hospital immediately after any hit or blow to the stomach: a fall, car accident or family violence; even a minor injury needs assessing"
    - "for any injury to the abdomen go to the nearest hospital and say you are pregnant; you may be monitored for at least 4 hours for placental abruption"
    - "call 000: pain in the abdomen, a firm or tightening uterus, or vaginal bleeding after an injury"
    - "any injury to the belly: go to the nearest hospital; after any injury, go to hospital if the baby moves less, there is vaginal bleeding or belly pain"
    - "after an injury, contractions or waters breaking: contact your doctor (000 in an emergency)"
    - "belly pain, a firm or tightening uterus, or vaginal bleeding after an injury: call 000"
    - "wear the seatbelt under the bump; 1800 RESPECT (1800 737 732) for family violence"
  sources:
    - title: PBB — Injuries during pregnancy
