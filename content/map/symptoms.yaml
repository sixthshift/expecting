  related: [nausea-and-vomiting, food-cravings-and-aversions, tiredness]
  notes: "Anti-nausea medicines by name belong to the medicines area; the mental-health toll of HG to the mental-health area."

- id: signs-of-preterm-labour
  title: Signs of labour before 37 weeks
  type: symptom
  topic: body
  ask: "I'm 33 weeks and getting regular tightenings and backache. Is this labour?"
  aliases: [preterm labour, premature labour, early labour, contractions before 37 weeks, period pain at 30 weeks, pressure down below, baby coming early]
  weeks: [20, 37]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "about 8 in 100 babies are born before 37 weeks; often no known cause; it may be possible to slow or stop labour, and every day inside helps"
    - "early signs of labour: period-like cramps, low backache, frequent or loose bowel motions, a change in discharge, a bloodstained show, waters breaking"
    - "contact midwife, doctor or nearest birthing unit immediately if under 37 weeks with any sign of labour; contact immediately for pain or discomfort in the pelvis, belly or lower back"
    - "contact doctor, midwife or hospital immediately: regular, painful contractions before 37 weeks (PBB second and third trimester)"
    - "call midwife or doctor straight away: contractions or other signs of labour before 37 weeks; bleeding; waters green or brown; strong pressure in the vagina or bottom or an urge to push"
    - "call 000: symptoms of preterm labour with severe back pain (PBB backache)"
  sources:
    - title: PBB — Premature baby
      url: https://www.pregnancybirthbaby.org.au/babies/premature-baby/premature-baby
    - title: "PBB — Giving birth: early signs of labour"
