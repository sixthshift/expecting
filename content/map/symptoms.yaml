- id: severe-vomiting
  title: Can't keep anything down (hyperemesis)
  type: symptom
  topic: body
  ask: "I'm vomiting everything, even water. When is it hyperemesis?"
  aliases: [hyperemesis gravidarum, HG, can't keep fluids down, vomiting all day, dehydrated, severe morning sickness, losing weight]
  weeks: [4, 20]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "hyperemesis is severe nausea and vomiting that makes eating and drinking enough hard; begins between 4 and 10 weeks, improves by about 20 weeks for most, some all pregnancy"
    - "contact midwife or doctor: frequent or uncontrollable vomiting, ongoing nausea that stops you eating and drinking enough, losing weight"
    - "contact doctor or hospital (RWH): lost a lot of weight quickly, not getting enough fluids, weren't eating well before pregnancy, worried about yourself or the baby"
    - "go to emergency if you can't keep fluids down at all (IV fluids); RWH: if you can't keep food or fluids down, go to the Women's Emergency Centre"
    - "contact doctor, midwife or hospital immediately for severe nausea or vomiting (healthdirect warning signs)"
    - "can lead to dehydration, weight loss, low vitamins, depression and anxiety; many need IV fluids at some point; treatable with medicines"
  sources:
    - title: PBB — Severe vomiting during pregnancy (hyperemesis gravidarum)
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/severe-vomiting-during-pregnancy-hyperemesis-gravidarum
    - title: RWH — Coping with nausea, vomiting and hyperemesis in pregnancy (fact sheet, July 2026)
