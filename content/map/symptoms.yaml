- id: swollen-feet-and-ankles
  title: Swollen feet, ankles and fingers
  type: symptom
  topic: body
  ask: "My feet and rings are tight by evening. When is swelling a worry?"
  aliases: [oedema, puffy feet, swollen ankles, fluid retention, rings tight, swollen hands, cankles]
  weeks: [20, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "common: 8 in 10 (RWH); worse at the end of the day and the end of pregnancy; usually goes down overnight"
    - "gradual mild swelling needs no doctor; avoid long standing, rest with legs up, loose shoes, compression stockings"
    - "RWH: tell doctor or midwife if swelling is more than slight, not relieved by rest, or in other parts of the body"
    - "contact doctor, midwife or maternity hospital immediately: sudden swelling of face, hands or feet, or swelling with a severe headache, vision changes, pain below the ribs, vomiting or heartburn not eased by antacids (pre-eclampsia)"
    - "contact straight away: one arm or leg more swollen than the other with pain, redness or warmth (blood clot)"
    - "healthdirect, after 20 weeks: contact doctor, midwife or hospital immediately for swelling in the legs that doesn't improve overnight"
    - "healthdirect, earlier in pregnancy: see doctor or midwife as soon as possible for swelling in the legs that doesn't improve overnight"
  sources:
    - title: PBB — Swelling during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/swelling-during-pregnancy
    - title: RWH — Coping with common discomforts of pregnancy (fact sheet, April 2018)
