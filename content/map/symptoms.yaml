    - "contact immediately: pain or swelling in one leg (healthdirect warning signs)"
    - "see doctor immediately: leg pain that doesn't go away, or a leg that is red, warm or swollen (PBB leg cramps); see doctor straight away for signs of DVT"
    - "call 000: chest pain, trouble breathing (a clot in the lung)"
