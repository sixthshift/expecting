    - "see doctor or urgent care: dizziness, nausea, fast pulse, shortness of breath"
    - "call 000: heatstroke, hot dry skin with no sweating, temperature above 40°C, severe dehydration, rapid breathing, vomiting, confusion or slurred speech, loss of consciousness or seizures"
