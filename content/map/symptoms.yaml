  notes: "PBB's cholestasis page says 'see your midwife or doctor'; healthdirect's warning-signs page says 'contact immediately'. Give the stronger one. The intent doc names this as the example symptom entry."

- id: fluid-leaking
  title: Fluid leaking from the vagina
  type: symptom
  topic: body
  ask: "I keep feeling wet. Is it wee, discharge, or my waters?"
  aliases: [waters breaking, waters broke, leaking fluid, gush, trickle, wet underwear, PROM, PPROM, membranes ruptured, green waters, meconium]
  weeks: [20, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "waters can gush or trickle; may feel like wetting yourself; usually clear, can be straw-coloured or pink; hard to tell from discharge or urine, a midwife can test it"
    - "contact doctor or midwife immediately for any fluid leaking from the vagina (PBB discharge, healthdirect: clear fluid leaking)"
    - "before 37 weeks (PPROM, 4 in 100): put on a pad, call doctor or midwife immediately, go to hospital; antibiotics and monitoring"
    - "at term before labour: put on a pad, contact midwife, doctor or birth centre; most go into labour naturally within 24 to 96 hours"
    - "call immediately or go to hospital: fluid green, brown or blood-coloured; smells bad; bleeding; temperature 37.5°C or above; feeling unwell or flu-like; a change in the baby's movements; regular painful contractions or belly pain"
    - "call an ambulance and get on hands and knees, bottom up, if you feel something in the vagina after the waters break (cord prolapse)"
    - "seek care straight away for anything green or brown in leaked fluid, even if you thought it was urine"
  sources:
    - title: "PBB — Giving birth: waters breaking"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/giving-birth-waters-breaking
    - title: PBB — Waters breaking early
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/waters-breaking-early
    - title: PBB — Vaginal discharge during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/vaginal-discharge-during-pregnancy
    - title: PBB — Frequent urination during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/frequent-urination-during-pregnancy
    - title: healthdirect — Warning signs during pregnancy
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
  related: [vaginal-discharge, leaking-urine, signs-of-preterm-labour, fever, reduced-movements, braxton-hicks]
  notes: "Waters breaking at term as part of labour (what happens next, when to go in) is the labour area's; this entry is the symptom and the call, at any week."

- id: reduced-movements
  title: The baby is moving less, or differently
  type: symptom
  topic: baby
  ask: "The baby's been quiet today. Should I wait and see?"
  aliases: [baby quiet, baby not moving, fewer kicks, reduced movements, less movement, movements changed, kick counts, baby not kicking, decreased fetal movements]
  weeks: [24, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "get to know your baby's own pattern; regular by 28 weeks; babies move every day right up to birth and during labour; no set number of movements"
    - "babies sleep in 20 to 40 minute cycles (occasionally up to 90) and don't move while asleep"
    - "contact midwife, hospital birth unit or doctor immediately if concerned about the pattern or movements decrease; do not wait until the next day; if you can't reach them, go to the nearest birth unit or emergency"
    - "go to the local hospital immediately if the baby has stopped moving or is moving less than usual (healthdirect); seek help immediately"
    - "contact again even if already checked; you are not wasting their time; reduced movements are linked to stillbirth"
    - "after any injury, go to hospital if the baby is moving less"
  sources:
    - title: PBB — Injuries during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy
    - title: PBB — Baby movements during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/baby-movements-during-pregnancy
    - title: healthdirect — Warning signs during pregnancy
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
    - title: Safer Baby (Stillbirth CRE) — Your baby's movements matter
      url: https://www.saferbaby.org.au/preventative-steps/your-babys-movements-matter/
  related: [not-felt-baby-move-yet, fall-or-blow-to-the-belly, itchy-palms-and-soles, fluid-leaking]
  exists: content/items/baby-movements.md
  notes: "The existing item is a card; this entry is the full symptom with the sleep-cycle fact and the 'call again' line. Both must end at the birth unit's number."

- id: fever
  title: Fever
  type: symptom
  topic: body
  ask: "I've got a temperature. When do I need to call?"
  aliases: [temperature, high temperature, fever, chills, shivering, hot and cold, 38 degrees, feverish]
  weeks: [1, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "a fever is 38°C or higher (healthdirect, PBB cold and flu); a kidney infection gives a fever above 38°C with back pain"
    - "contact doctor, midwife or hospital immediately: fever or chills at any time in pregnancy (healthdirect warning signs)"
    - "fever or chills while pregnant: contact doctor, midwife or hospital immediately (healthdirect warning signs)"
    - "call 000 for fever with confusion or drowsiness, difficulty breathing, or seizures (healthdirect fever)"
    - "with waters broken: call immediately for 37.5°C or above"
    - "fever in pregnancy increases the baby's chance of congenital anomalies and miscarriage; sepsis needs urgent treatment: see doctor urgently, emergency, or 000 for fever with infection or difficulty breathing"
  sources:
    - title: healthdirect — Warning signs during pregnancy
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
    - title: healthdirect — Fever
      url: https://www.healthdirect.gov.au/fever
    - title: "PBB — Giving birth: waters breaking"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/giving-birth-waters-breaking
    - title: PBB — Sepsis during pregnancy and after childbirth
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/sepsis-during-pregnancy-and-after-childbirth
    - title: PBB — Urinary tract infections (UTIs) during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/urinary-tract-infections-utis-during-pregnancy
  related: [cold-or-flu, feeling-very-unwell, urinary-tract-infection, fluid-leaking]
  notes: "Sources disagree on the number: 38°C in general (healthdirect, PBB), 37.5°C once the waters have broken (PBB). The old NSW Health Having a Baby book said 37.8°C but has been withdrawn and did not load. State both thresholds with their context."

- id: feeling-very-unwell
  title: Feeling very unwell (sepsis)
  type: symptom
  topic: body
  ask: "I feel really sick, shivery and my heart is racing. Could it be sepsis?"
  aliases: [sepsis, septic, infection, feeling awful, flu-like, shivering, fast heartbeat and fever, something isn't right]
  weeks: [1, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "sepsis is a big immune reaction to any infection, including pregnancy-related ones; rare but one of the biggest causes of severe illness and death in pregnancy and after birth"
    - "symptoms include fever, tummy pain, a faster than normal heart rate, difficulty breathing; the baby's heart rate may be fast"
    - "see doctor or midwife as soon as possible for symptoms of infection, any symptom of sepsis, or feeling unwell in pregnancy"
    - "see doctor urgently, go to emergency or call 000: fever or difficulty breathing with infection"
    - "even if not sure and something just doesn't feel right, get checked (healthdirect)"
  sources:
    - title: PBB — Sepsis during pregnancy and after childbirth
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/sepsis-during-pregnancy-and-after-childbirth
    - title: healthdirect — Warning signs during pregnancy
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
  related: [fever, racing-heartbeat, breathlessness, abdominal-pain]

- id: chest-pain
  title: Chest pain
  type: symptom
  topic: body
  ask: "I've got chest pain. Is it heartburn or something worse?"
  aliases: [chest pain, tight chest, pain in chest, heart attack, pressure in chest]
  weeks: [1, 42]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - "call 000 and ask for an ambulance: chest pain that is severe, getting worse, or has lasted 10 minutes"
    - "call 000: chest pain with trouble breathing (pulmonary embolism; pregnancy and the weeks after birth raise the risk of clots)"
    - "see doctor immediately if heartburn comes with chest pain, breathlessness, vomiting blood or difficulty swallowing"
    - "call 000: palpitations with chest pain, shortness of breath, dizziness or fainting"
  sources:
    - title: healthdirect — Chest pain
      url: https://www.healthdirect.gov.au/chest-pain
