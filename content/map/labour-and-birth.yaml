# The Library's map: getting ready for the birth, labour, the birth itself, and the
# first days after. See README.md for the entry format. Entries marked
# "after the birth: later phase" are mapped now and written for the version after
# the pregnancy. Every source URL below was fetched and read on 2026-10-28; the
# RANZCOG leaflets are the PDFs linked from ranzcog.edu.au/womens-health/patient-information/.

# ---------------------------------------------------------------------------
# Getting ready
# ---------------------------------------------------------------------------

- id: birth-preferences
  title: Birth preferences (the birth plan)
  type: decision
  topic: birth
  ask: Do we need a birth plan, and what goes in it?
  aliases: [ birth plan, birth preferences, birth wishes, birth choices ]
  weeks: [ 30, 36 ]
  who: together
  priority: 1
  stakes: medium
  covers:
    - "preferences, not a script: labour rarely follows a plan"
    - pain relief, who is in the room, positions, monitoring, skin to skin, cord clamping, the third stage, vitamin K
    - what you want if things change (induction, caesarean)
    - write it together so the partner can speak for you
    - talk it through with the midwife so it is realistic for your hospital
    - decide by about 36 weeks
  sources:
    - title: Pregnancy, Birth and Baby — Birth choices and making a birth plan
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/making-a-birth-plan
    - title: The Royal Women's Hospital — Preparing for labour
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/labour-birth/preparing-for-labour
  related: [ pain-relief, support-person, third-stage-placenta, delayed-cord-clamping, vitamin-k, support-person-role ]
  notes: Keep it short and about choices the hospital actually offers. Birth trauma is often tied to plans that could not be followed; say plainly that preferences can change on the day.

