  type: guide
  topic: labour
  ask: My waters broke, what now?
  aliases: [ waters broke, rupture of membranes, PROM, amniotic fluid leaking, gush or trickle ]
  weeks: [ 37, 42 ]
  priority: 1
  stakes: high
  covers: [ a gush or a slow trickle, note the colour and smell, call the birth unit, green brown or bloody fluid is urgent, most labours start within 24 to 48 hours, antibiotics if GBS positive, after 18 hours the baby is watched for infection ]
  sources:
    - title: Pregnancy, Birth and Baby — Waters breaking
