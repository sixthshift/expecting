- id: when-to-go-to-hospital
  title: When to go to hospital
  type: guide
  topic: labour
  ask: How do we know it's time to go in?
  aliases: [ when to call the hospital, 5-1-1, contractions 5 minutes apart, going in too early, sent home from hospital ]
  weeks: [ 36, 42 ]
  who: together
  priority: 1
  stakes: high
  covers:
    - call the birth unit first, any time you are worried; they will ask questions and help you decide
    - go in when contractions are about 5 minutes apart, or you live far away, or you no longer feel comfortable at home (Better Health Channel)
    - call the birth unit or go to hospital straight away if the waters break, for bleeding, for green, brown or blood-coloured fluid, or if the baby's movements change (Better Health Channel says go immediately for waters or bleeding, KEMH and Pregnancy, Birth and Baby say call immediately)
    - being checked and sent home in early labour is common and not a failure
    - "second and later labours are often faster: plan to leave earlier"
  sources:
    - title: Better Health Channel — Pregnancy, labour
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-labour
    - title: Pregnancy, Birth and Baby — Going to hospital
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/going-to-hospital
    - title: King Edward Memorial Hospital — Giving birth
      url: https://www.kemh.health.wa.gov.au/Pregnancy-and-Birth/Giving-birth
  related: [ signs-of-labour, timing-contractions, waters-breaking, early-labour, getting-to-hospital, numbers-to-save ]
  notes: The "5-1-1" rule is American; Australian sources say "about 5 minutes apart" and "ring and ask". Hospitals differ, so the entry should send them to their own birth unit's advice. A change in the baby's movements is always a call, never a wait.

