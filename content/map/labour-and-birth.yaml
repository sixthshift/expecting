- id: epidural
  title: The epidural
  type: guide
  topic: labour
  ask: What does an epidural involve, and what are the trade-offs?
  aliases: [ epidural block, spinal, combined spinal-epidural, walking epidural, epidural side effects, epidural and pushing ]
  weeks: [ 30, 42 ]
  priority: 1
  stakes: high
  covers:
    - a fine tube in the lower back by an anaesthetist, local anaesthetic and an opioid topped up as needed
    - very effective relief, it usually takes 25 to 40 minutes to set up and take full effect, and you stay awake and aware
    - the trade-offs, a drip, continuous CTG, a catheter, less or no mobility, pushing may be harder and the second stage longer; the sources disagree on forceps or vacuum (Pregnancy, Birth and Baby says the chance may increase, RANZCOG says modern epidurals may slightly lengthen labour but do not change the chance of an assisted birth or caesarean)
    - side effects, a drop in blood pressure, itching or shaking, patchy or incomplete relief, a bruised back for a couple of days, and rarely a bad headache within 24 to 48 hours, a skin infection or permanent nerve damage
    - when it is recommended anyway (twins, high blood pressure, a likely caesarean)
    - you can ask for one at almost any stage of labour if there is no medical reason against it, not in birth centres or home births
  sources:
    - title: Pregnancy, Birth and Baby — Epidural
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/pain-relief/epidural
