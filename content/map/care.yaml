- id: higher-risk-pregnancy
  title: What a "high-risk" pregnancy means for your care
  type: guide
  topic: care
  ask: They called my pregnancy high risk, what does that mean?
  aliases: [ high risk pregnancy, complex pregnancy, obstetric-led care, maternal fetal medicine, MFM, high risk clinic ]
  weeks: [ 6, 42 ]
  priority: 2
  stakes: medium
  covers:
    - a label about monitoring, not a prediction, and the common reasons, age, BMI, twins, diabetes, high blood pressure, a previous caesarean or complication, a condition found at a test
    - what changes, obstetrician-led care in a public clinic, more visits, more bloods and scans, sometimes maternal-fetal medicine
    - it may rule out a birth centre or home birth and move you from a midwifery model, ask what can stay
    - the care is still yours to agree to
