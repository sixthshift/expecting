  related: [ high-blood-pressure-in-pregnancy, what-happens-at-each-visit, ctg-monitoring, growth-scans, higher-risk-pregnancy ]
  notes: Symptoms (headache, vision, swelling, pain under the ribs) and when to call are the symptoms file; link, don't duplicate.

- id: high-blood-pressure-in-pregnancy
  title: High blood pressure in pregnancy
  type: guide
  topic: tests
  ask: My blood pressure was high at a visit, what now?
  aliases: [ gestational hypertension, chronic hypertension pregnancy, hypertension in pregnancy, blood pressure medication pregnancy, home blood pressure ]
  weeks: [ 12, 42 ]
  priority: 2
  stakes: high
  covers:
    - the kinds, already high before 20 weeks, new after 20 weeks, and pre-eclampsia
    - one high reading is rechecked, a pattern means bloods, urine and more visits
    - safe medicines in pregnancy, and home monitoring
    - more often obstetric-led care, growth scans and a talk about timing the birth
  sources:
