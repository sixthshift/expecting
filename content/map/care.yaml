  who: together
  priority: 2
  stakes: high
  covers:
    - the early scan shows how many and whether they share a placenta, which sets the whole plan
    - more visits, scans every 2 to 4 weeks, often an obstetric-led or multiples clinic, a hospital with the right nursery
    - birth centre and home birth are usually off the table, most twins come before 37 weeks
    - the higher chances, diabetes, pre-eclampsia, anaemia, the extra screening
    - costs rise in the private system if the babies need the nursery
    - a vanishing twin, seen on one scan and not the next
