- id: rubella-immunity
  title: Rubella immunity
  type: term
  topic: tests
  ask: Why are they testing me for German measles?
  aliases: [ rubella antibodies, German measles, rubella immune, MMR after birth ]
  weeks: [ 5, 12 ]
  priority: 2
  stakes: medium
  covers:
    - rubella in early pregnancy can harm the baby, most Australians are immune from childhood vaccination
    - the test checks antibodies, not immune means avoid contact with rashes and get the MMR after the birth
    - MMR is a live vaccine, so it cannot be given during pregnancy
  sources:
