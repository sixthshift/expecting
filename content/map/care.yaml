- id: flu-vaccine
  title: The flu vaccine
  type: moment
  topic: tests
  ask: Should I get the flu shot while pregnant?
  aliases: [ influenza vaccine, flu shot, flu jab, free flu vaccine pregnancy ]
  weeks: [ 4, 40 ]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - recommended at any stage of every pregnancy, free under the National Immunisation Program
    - pregnancy raises the risk of severe flu, and the vaccine protects the baby for the first 6 months
    - inactivated, not live, safe in every trimester
    - if vaccinated early with last year's, have this year's when it comes out
    - can be given with the whooping cough and RSV vaccines
  sources:
    - title: Department of Health — Immunisation for pregnancy
      url: https://www.health.gov.au/topics/immunisation/when-to-get-vaccinated/immunisation-for-pregnancy
    - title: Australian Immunisation Handbook — Influenza (flu)
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/influenza-flu
  related: [ whooping-cough-vaccine, rsv-vaccine, vaccines-in-one-visit, partner-flu-vaccine ]
  exists: content/items/flu-vaccine.md

- id: whooping-cough-vaccine
  title: The whooping cough vaccine
  type: moment
  topic: tests
  ask: When do I get the whooping cough vaccine?
  aliases: [ pertussis vaccine, dTpa, Boostrix, Adacel, 28 week vaccine, whooping cough booster ]
  weeks: [ 20, 32 ]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - a single dose between 20 and 32 weeks of every pregnancy, free, still worth having later if missed
    - vaccination in pregnancy cuts whooping cough in young babies (3 to 4 months) by about 90 percent, and gives some protection until their first immunisations at 6 weeks
    - the partner and other adults around the baby need their own booster
  sources:
    - title: Australian Immunisation Handbook — Pertussis (whooping cough)
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/pertussis-whooping-cough
    - title: Department of Health — Immunisation for pregnancy
      url: https://www.health.gov.au/topics/immunisation/when-to-get-vaccinated/immunisation-for-pregnancy
  related: [ partner-whooping-cough-booster, flu-vaccine, rsv-vaccine, vaccines-in-one-visit ]
  exists: content/items/whooping-cough-vaccine.md

- id: rsv-vaccine
  title: The RSV vaccine
  type: moment
  topic: tests
  ask: What is the RSV vaccine in pregnancy?
  aliases: [ Abrysvo, RSV vaccine pregnancy, respiratory syncytial virus, bronchiolitis vaccine, nirsevimab, Beyfortus ]
  weeks: [ 28, 36 ]
  who: carrying
  priority: 1
  stakes: high
  covers:
    - Abrysvo, a single dose from 28 weeks, best by the end of 36, free under the NIP
    - protects the baby from birth against RSV, cutting severe RSV in babies under 6 months by about 70 percent, RSV is a leading cause of lower respiratory tract hospitalisation in babies under 12 months
    - not before 28 weeks, and what the trials showed
    - if missed or given late, the baby can have the antibody injection instead through state programs
    - can be given with flu and whooping cough
  sources:
    - title: Australian Immunisation Handbook — Respiratory syncytial virus (RSV)
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/respiratory-syncytial-virus-rsv
    - title: Department of Health — Immunisation for pregnancy
      url: https://www.health.gov.au/topics/immunisation/when-to-get-vaccinated/immunisation-for-pregnancy
  related: [ whooping-cough-vaccine, flu-vaccine, vaccines-in-one-visit ]
  exists: content/items/rsv-vaccine.md
  notes: Infant nirsevimab eligibility differs by state program.

- id: covid-vaccine-in-pregnancy
  title: The COVID-19 vaccine in pregnancy
  type: decision
  topic: tests
  ask: Do I need a COVID vaccine while pregnant?
  aliases: [ COVID vaccine pregnancy, COVID booster pregnant, mRNA vaccine pregnancy ]
  weeks: [ 20, 40 ]
  who: carrying
  priority: 2
  stakes: medium
  covers:
    - not routinely recommended, but any pregnant person can consider a dose from 20 weeks in each pregnancy, to protect the baby
    - safe at any stage, mRNA vaccines have good pregnancy data
    - more reason if in a higher-risk group or it has been a long time since the last dose
    - free, and can be given with the other pregnancy vaccines
  sources:
    - title: Australian Immunisation Handbook — COVID-19
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/covid-19
    - title: Australian Immunisation Handbook — Vaccination for women who are planning pregnancy, pregnant or breastfeeding
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
  related: [ flu-vaccine, vaccines-in-one-visit, live-vaccines-to-avoid ]
  notes: Advice has shifted from "recommended" to "can consider"; date the entry and check the Handbook each year.

- id: live-vaccines-to-avoid
  title: Vaccines not to have in pregnancy
  type: guide
  topic: tests
  ask: Which vaccines can't I have while pregnant?
  aliases: [ live vaccines, MMR pregnancy, chickenpox vaccine pregnancy, varicella vaccine, yellow fever vaccine, BCG, travel vaccines pregnancy, immunisation history ]
  weeks: [ 1, 42 ]
  who: carrying
  priority: 2
  stakes: high
  covers:
    - live vaccines are contraindicated, MMR, varicella, BCG, oral typhoid, oral cholera, yellow fever, the nasal flu spray
    - wait 28 days after a live vaccine before conceiving, and tell any vaccinator you may be pregnant
    - if given by accident, no proven harm, tell your midwife
    - not immune to rubella or chickenpox, the catch-up is after the birth and is fine while breastfeeding
    - travel vaccines, inactivated ones can be given if the risk justifies it
    - check your record on the Australian Immunisation Register through myGov
  sources:
    - title: Australian Immunisation Handbook — Vaccination for women who are planning pregnancy, pregnant or breastfeeding
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
    - title: Pregnancy, Birth and Baby — Vaccinations and pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/vaccinations-and-pregnancy
  related: [ rubella-immunity, flu-vaccine, covid-vaccine-in-pregnancy ]
  notes: Travel itself is another file; here only the vaccines.

- id: vaccines-in-one-visit
  title: The three pregnancy vaccines can be one visit
  type: card
  topic: tests
  ask: Can I get all the pregnancy vaccines at once?
  aliases: [ vaccines together, same day vaccines, 28 week vaccines, one appointment vaccines ]
  weeks: [ 26, 32 ]
  who: carrying
  priority: 2
  stakes: low
  covers:
    - flu, whooping cough and RSV can all be given at the same visit, different arms
    - from 28 weeks the windows overlap, so one appointment around 28 to 32 covers all three
    - a GP, a pharmacy or the antenatal clinic, all free with Medicare
  sources:
    - title: Department of Health — Immunisation for pregnancy
      url: https://www.health.gov.au/topics/immunisation/when-to-get-vaccinated/immunisation-for-pregnancy
    - title: Australian Immunisation Handbook — Vaccination for women who are planning pregnancy, pregnant or breastfeeding
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
  related: [ flu-vaccine, whooping-cough-vaccine, rsv-vaccine ]

- id: partner-whooping-cough-booster
  title: The partner's whooping cough booster
  type: moment
  topic: tests
  ask: Does the partner need a whooping cough shot too?
  aliases: [ partner vaccine, dad whooping cough, grandparents whooping cough, household booster, cocooning ]
  weeks: [ 28, 40 ]
  who: partner
  priority: 1
  stakes: high
  covers:
    - adults who will be close to the baby need a dTpa if their last was more than 10 years ago, at least 2 weeks before meeting the baby
    - other adult household contacts and carers of babies under 6 months too
  sources:
    - title: Australian Immunisation Handbook — Pertussis (whooping cough)
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/pertussis-whooping-cough
  related: [ whooping-cough-vaccine, partner-flu-vaccine ]
  notes: Whether a partner's or household contact's dTpa is funded is not on the cited page; check the state program before promising free.

- id: partner-flu-vaccine
  title: The partner's flu vaccine
  type: moment
  topic: tests
  ask: Should the partner get a flu shot before the baby comes?
  aliases: [ partner flu shot, household flu vaccine, flu vaccine for dad ]
  weeks: [ 4, 40 ]
  who: partner
  priority: 2
  stakes: medium
  covers:
    - household contacts of babies under 6 months are advised to have the yearly flu vaccine, the baby cannot
    - get it when the season's vaccine arrives, at a GP or pharmacy, usually a small fee
  sources:
    - title: Australian Immunisation Handbook — Influenza (flu)
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/influenza-flu
  related: [ flu-vaccine, partner-whooping-cough-booster ]

