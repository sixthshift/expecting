# Antenatal care, appointments, tests, scans and vaccines in Australia.
# Models of care, Medicare and the cost of care, the schedule of visits, every
# routine test and screen with its window, the vaccines, and the conditions a
# test can find. Symptoms, labour, pain relief, induction and money outside
# care are in other files. The Pregnancy Care Guidelines (health.gov.au) sit
# behind a bot check we could not pass, so they are not cited here; every
# entry cites a page that loaded.

# ---------------------------------------------------------------------------
# Models of care and the cost of care
# ---------------------------------------------------------------------------

- id: choosing-your-model-of-care
  title: Choosing your model of care
  type: decision
  topic: care
  ask: Public, private, midwife or GP — who should look after us?
  aliases: [ models of care, maternity care options, public or private, who do I see, antenatal care options, maternity model ]
  weeks: [ 4, 12 ]
  who: together
  priority: 1
  stakes: high
  covers:
    - the four common models, public hospital clinic, shared care, midwifery group practice, private obstetrician, plus private midwife, birth centre and home birth
    - what each costs, who you see, whether you see the same person, and where the birth happens
    - continuity of care has real benefits, and caseload places are popular and not available everywhere, so check at booking
    - what is actually offered depends on where you live and your hospital
    - the questions to ask your GP, midwife or doctor at the first visit
  sources:
    - title: Pregnancy, Birth and Baby — Maternity models of care
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/maternity-models-of-care
    - title: Pregnancy, Birth and Baby — Public vs private care in pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/what-is-the-difference-between-public-and-private-care-in-pregnancy
    - title: The Royal Women's Hospital — Pregnancy care & birthing options
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/now-you-are-pregnant/pregnancy-care-birthing-options
  related: [ public-hospital-care, midwifery-group-practice, gp-shared-care, private-obstetrician, private-midwife, birth-centre, home-birth, choosing-a-hospital, booking-in, first-antenatal-visit, what-medicare-covers ]
  notes: The names and the mix differ by state and hospital (the Royal Women's calls its models Team Maternity, MIST, Caseload/COSMOS; WA has the Community Midwifery Programme). Write it as the national shape and tell the reader to ask what their hospital calls them.

- id: public-hospital-care
  title: Public hospital maternity care
  type: guide
  topic: care
  ask: What is it like having the baby as a public patient?
  aliases: [ public patient, antenatal clinic, hospital clinic, team midwifery, public maternity ]
  weeks: [ 4, 42 ]
  priority: 1
  stakes: medium
  covers:
    - the most used model in Australia, free with a Medicare card
    - antenatal visits at the hospital outpatient clinic or an outreach clinic, midwives and doctors, often not the same person
    - midwife-led for low-risk pregnancies, obstetrician-led if risk factors arise
    - the birth in the hospital's birth unit with whoever is rostered on
    - waiting times can be longer than a private clinic
    - options inside a public hospital, team midwifery, group practice, birth centre, public home birth
  sources:
    - title: Pregnancy, Birth and Baby — Maternity models of care
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/maternity-models-of-care
    - title: Pregnancy, Birth and Baby — What to expect if I have my baby in hospital
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/having-a-baby-in-hospital
    - title: The Royal Women's Hospital — Pregnancy care & birthing options
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/now-you-are-pregnant/pregnancy-care-birthing-options
  related: [ choosing-your-model-of-care, booking-in, what-medicare-covers, private-patient-in-a-public-hospital ]

- id: midwifery-group-practice
  title: Midwifery group practice (caseload)
  type: guide
  topic: care
  ask: What is midwifery group practice and how do I get a place?
  aliases: [ MGP, caseload midwifery, continuity of care, continuity of carer, known midwife, COSMOS, MIST, midwives in small teams ]
  weeks: [ 4, 14 ]
  priority: 1
  stakes: high
  covers:
    - one known midwife, with a small backup team, through pregnancy, birth and up to six weeks after
    - publicly funded; care may be in hospital, in the community or at home
    - strong evidence of benefit, including fewer preterm births
    - places are limited and not available everywhere, ask at the first visit and at booking
    - what happens if a complication arises, the midwife works with the doctors
    - team midwifery is the same idea with less continuity
  sources:
    - title: Pregnancy, Birth and Baby — What is midwife continuity of care?
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/what-is-midwife-continuity-of-care
    - title: Pregnancy, Birth and Baby — Maternity models of care
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/maternity-models-of-care
    - title: The Royal Women's Hospital — Pregnancy care options
      url: https://thewomens.org.au/patients-visitors/clinics-and-services/pregnancy-birth/pregnancy-care-options
  related: [ choosing-your-model-of-care, booking-in, birth-centre, home-birth ]
  notes: Eligibility and how early places go differ by hospital. The Royal Women's confirms caseload availability at the booking appointment. Say that, not a national rule.

- id: gp-shared-care
  title: GP shared care
  type: guide
  topic: care
  ask: Can my own GP do my pregnancy appointments?
  aliases: [ shared care, shared maternity care, GP antenatal care, GP obstetrician ]
  weeks: [ 4, 42 ]
  priority: 1
  stakes: medium
  covers:
    - most visits with an accredited GP or community midwife, key visits and the birth at the hospital, under an agreed schedule
    - convenient and usually cheaper, Medicare covers bulk-billed visits, some GPs charge a gap
    - suits a healthy, low-risk pregnancy, the hospital takes over if things change
    - the GP must be affiliated with the hospital, ask whether yours is
    - GP obstetricians in rural areas may provide all the care and attend the birth
  sources:
    - title: Pregnancy, Birth and Baby — GPs, what they do during your pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/the-role-of-your-gp
    - title: Pregnancy, Birth and Baby — Maternity models of care
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/maternity-models-of-care
    - title: The Royal Women's Hospital — Pregnancy care & birthing options
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/now-you-are-pregnant/pregnancy-care-birthing-options
  related: [ choosing-your-model-of-care, first-antenatal-visit, antenatal-visit-schedule ]

- id: private-obstetrician
  title: Private obstetrician care
  type: guide
  topic: care
  ask: How does it work with a private obstetrician?
  aliases: [ private OB, obstetrician, private hospital, private maternity, specialist care ]
  weeks: [ 4, 42 ]
  priority: 1
  stakes: high
  covers:
    - the same doctor through pregnancy, birth and after, visits in their rooms, the birth in a private or public hospital with hospital midwives
    - you need a GP referral, which lasts 12 months, to claim any Medicare rebate
    - ask about fees before the first appointment, costs vary a lot
    - private health insurance only applies once admitted to hospital, and needs the 12-month wait served
    - how to find one, ask the GP, the hospital's list, the RANZCOG find-a-doctor
    - the obstetrician may not be there for most of the labour, midwives are
  sources:
    - title: Pregnancy, Birth and Baby — Obstetricians, what do they do?
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/obstetrician
    - title: The Royal Women's Hospital — Pregnancy care & birthing options
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/now-you-are-pregnant/pregnancy-care-birthing-options
    - title: Pregnancy, Birth and Baby — Private health insurance and pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/private-health-insurance-and-pregnancy
  related: [ obstetrician-out-of-pocket-costs, private-health-insurance-and-pregnancy, choosing-your-model-of-care, private-patient-in-a-public-hospital ]

- id: private-midwife
  title: Private midwife care
  type: guide
  topic: care
  ask: Can I hire my own midwife?
  aliases: [ privately practising midwife, MIPP, endorsed midwife, eligible midwife, private midwifery ]
  weeks: [ 4, 42 ]
  priority: 3
  stakes: medium
  covers:
    - a midwife you employ for pregnancy, birth and postnatal care, often for a home birth or birth centre
    - usually no GP referral needed, but Medicare rebates for eligible midwives need one
    - an endorsed midwife can order tests and prescribe some medicines
    - what Medicare does not cover, the labour and home-birth fees
    - their arrangement with a local hospital in case of transfer, and booking in there too
    - some work jointly with a private obstetrician
  sources:
    - title: Pregnancy, Birth and Baby — Midwives, what do they do?
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/midwife
    - title: Pregnancy, Birth and Baby — Public vs private care in pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/what-is-the-difference-between-public-and-private-care-in-pregnancy
    - title: The Royal Women's Hospital — Money matters
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/preparing-for-pregnancy/money-matters
  related: [ home-birth, birth-centre, choosing-your-model-of-care, what-medicare-covers ]

- id: birth-centre
  title: Having the baby at a birth centre
  type: guide
  topic: care
  ask: What is a birth centre and can we use one?
  aliases: [ birthing centre, birth center, low-intervention birth, family birth centre ]
  weeks: [ 4, 14 ]
  priority: 2
  stakes: medium
  covers:
    - home-like rooms, usually attached to a public hospital, care from a known midwife or small team
    - only for low-risk pregnancies, the centre decides eligibility
    - no epidural, transfer to the labour ward if one is wanted or anything changes
    - referral rules differ, some take self-referral
    - the first appointment is usually at 10 to 16 weeks, so ask early
    - free as a public patient
  sources:
    - title: Pregnancy, Birth and Baby — What to expect if I have my baby at a birthing centre
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/having-a-baby-at-a-birthing-centre
    - title: Pregnancy, Birth and Baby — Choosing where to give birth
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/choosing-where-to-give-birth
  related: [ midwifery-group-practice, home-birth, choosing-a-hospital, choosing-your-model-of-care ]
  notes: Pain relief options at a birth centre belong to the labour file; keep this to who can use one and how to get in.

- id: home-birth
  title: Planned home birth
  type: guide
  topic: care
  ask: Can we have the baby at home?
  aliases: [ homebirth, publicly funded homebirth, home birth program, freebirth ]
  weeks: [ 4, 16 ]
  priority: 3
  stakes: high
  covers:
    - two routes, a public hospital home-birth program (needs a GP referral, strict criteria, free) or a private midwife (fees, Medicare covers some antenatal care but not the birth)
    - low-risk pregnancies only, and what rules you out
    - the transfer plan and booking in at the local hospital as backup
    - freebirth, birth without a registered carer, is a different thing and not recommended
  sources:
    - title: Pregnancy, Birth and Baby — Public vs private care in pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/what-is-the-difference-between-public-and-private-care-in-pregnancy
    - title: Pregnancy, Birth and Baby — Choosing where to give birth
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/choosing-where-to-give-birth
    - title: Pregnancy, Birth and Baby — Medicare during pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/medicare-during-pregnancy
  related: [ private-midwife, midwifery-group-practice, birth-centre, choosing-your-model-of-care ]
  notes: Public home-birth programs exist only in some hospitals and states; say to ask the hospital.

- id: choosing-a-hospital
  title: Choosing a hospital
  type: decision
  topic: care
  ask: Which hospital should we book into?
  aliases: [ which hospital, catchment, maternity hospital, where to give birth, hospital catchment area ]
  weeks: [ 4, 12 ]
  who: together
  priority: 1
  stakes: high
  covers:
    - "public hospital: you may book at the local maternity hospital for your area, and can choose if there is more than one"
    - what to compare, models of care offered, a birth centre, easy transfer to a special care or neonatal intensive care unit, how far you will travel, pain relief available, length of stay
    - a private hospital comes with the obstetrician, choose the doctor and the hospital together
    - twins or a higher-risk pregnancy may mean a bigger hospital
    - the questions to ask, including whether you can tour it
    - decide early, birth centres are popular, book as early as you can
  sources:
    - title: Pregnancy, Birth and Baby — Choosing where to give birth
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/choosing-where-to-give-birth
