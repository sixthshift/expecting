- id: gestational-diabetes
  title: Gestational diabetes
  type: guide
  topic: tests
  ask: I have gestational diabetes, what does that mean for the rest of the pregnancy?
  aliases: [ GDM, gestational diabetes mellitus, diabetes in pregnancy, blood sugar pregnancy, finger prick testing, NDSS ]
  weeks: [ 24, 42 ]
  priority: 1
  stakes: high
  covers:
    - about 1 in 10 pregnancies, hormones from the placenta blunt insulin, it usually goes after the birth
    - the care that follows, a diabetes educator and dietitian, finger-prick testing, diet and walking, sometimes metformin or insulin
    - extra antenatal visits, and giving birth in a hospital with a consultant-led team
    - register with the NDSS for subsidised strips
    - the baby after birth, early feeds and sugar checks
    - a higher chance of type 2 later, the test at 6 to 12 weeks after and every few years
  sources:
    - title: Pregnancy, Birth and Baby — Gestational diabetes
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/gestational-diabetes
    - title: The Royal Women's Hospital — Gestational diabetes
