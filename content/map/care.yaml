  priority: 2
  stakes: medium
  covers:
    - a big fundal height leads to a growth scan and a check for diabetes or extra fluid
    - scan weight estimates can be out by 10 to 15 percent either way
    - what it changes, more scans, sometimes a conversation about timing or mode of birth, often nothing
    - a large baby in a previous pregnancy is a reason for early diabetes testing
  sources:
