- id: uti-found-on-testing
  title: A UTI found on the urine test
  type: guide
  topic: tests
  ask: They found an infection in my urine but I feel fine, why treat it?
  aliases: [ asymptomatic bacteriuria, bacteria in urine, urine infection pregnancy, antibiotics in pregnancy UTI ]
  weeks: [ 5, 42 ]
  priority: 2
  stakes: medium
  covers:
    - bacteria in the urine with no symptoms is treated in pregnancy because it can become a kidney infection and bring on early labour
    - a short course of a pregnancy-safe antibiotic, a repeat culture after
    - repeat cultures through the pregnancy if it recurs
  sources:
    - title: Pregnancy, Birth and Baby — Urinary tract infections (UTIs) in pregnancy
