      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/maternity-care-in-australia
    - title: Pregnancy, Birth and Baby — Pregnant with twins
      url: https://www.pregnancybirthbaby.org.au/pregnancy/multiple-pregnancy/twin-pregnancy
  related: [ booking-in, choosing-your-model-of-care, hospital-tour, private-obstetrician ]
  notes: Catchment rules differ by state and hospital; don't promise out-of-area access.

- id: booking-in
  title: Booking in with your hospital or birth centre
  type: moment
  topic: care
  ask: When do I have to book into the hospital?
  aliases: [ book in, hospital booking, referral to hospital, maternity referral, booking appointment ]
  weeks: [ 6, 14 ]
  priority: 1
  stakes: high
  covers:
    - a GP referral starts the hospital booking, some midwifery services take self-referral
    - book as early as possible
  sources:
    - title: Pregnancy, Birth and Baby — Maternity care in Australia
