  covers:
    - a small fundal height is a prompt, the growth scan decides, and many small babies are simply small
    - growth restriction means the placenta is not keeping up, dopplers of the cord and more scans
    - who is at higher risk, smoking, high blood pressure, a previous small baby
    - the plan, scans every 2 to 4 weeks, CTGs, movements matter more, and an earlier birth if growth stalls
    - why it is caught, stillbirth prevention
  sources:
    - title: Pregnancy, Birth and Baby — Placental insufficiency
