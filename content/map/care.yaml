- id: twins-found-at-a-scan
  title: Twins found at a scan
  type: guide
  topic: tests
  ask: It's twins, what changes in our care?
  aliases: [ twins, multiple pregnancy, twin pregnancy care, chorionicity, identical twins, DCDA, MCDA, vanishing twin, twin scans ]
