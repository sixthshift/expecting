  type: guide
  topic: tests
  ask: My platelets are low, is that a problem?
  aliases: [ gestational thrombocytopenia, thrombocytopenia, low platelet count, platelets and epidural ]
  weeks: [ 20, 42 ]
  priority: 3
  stakes: medium
  covers:
    - about 1 in 10, usually gestational thrombocytopenia, harmless and found on a routine count
    - rechecked through the third trimester, other causes ruled out if very low
    - why the anaesthetist cares, a threshold for an epidural, so it is checked again near term
  sources:
    - title: Pregnancy, Birth and Baby — Low platelets during pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/low-platelets-during-pregnancy
