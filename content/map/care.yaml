- id: syphilis-screening
  title: Syphilis screening
  type: term
  topic: tests
  ask: Why do they test for syphilis, and why again later?
  aliases: [ syphilis test, syphilis serology, congenital syphilis, repeat syphilis test ]
  weeks: [ 5, 36 ]
  priority: 2
  stakes: high
  covers:
    - tested at the first bloods in every pregnancy, cases are rising in Australia
    - many services now repeat it at 26 to 28 weeks and at 36 weeks or birth
