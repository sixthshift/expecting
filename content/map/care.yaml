  related: [ anti-d, rhd-nipt, blood-group-and-antibodies, third-trimester-bloods ]

- id: low-lying-placenta
  title: A low-lying placenta and placenta praevia
  type: guide
  topic: tests
  ask: The scan said my placenta is low, is that serious?
  aliases: [ placenta praevia, low placenta, low-lying placenta, anterior placenta, placenta position scan, 32 week placenta scan ]
  weeks: [ 18, 40 ]
  priority: 2
  stakes: high
  covers:
    - seen at the morphology scan in many pregnancies, most move up as the uterus grows
    - a repeat scan at about 32 to 34 weeks decides, within 2 cm of the cervix is low-lying, covering it is praevia
    - if it stays low, a planned caesarean, extra scans, advice on sex and travel, and a plan for bleeding
    - painless bleeding after 28 weeks is the warning, go straight in
    - an anterior placenta is a different thing, normal, movements felt later
  sources:
    - title: Pregnancy, Birth and Baby — Placenta praevia
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placenta-praevia
