- id: confirming-the-pregnancy
  title: Confirming the pregnancy
  type: moment
  topic: appointments
  ask: The test is positive, what now?
  aliases: [ positive pregnancy test, hCG blood test, home pregnancy test, am I pregnant, confirm pregnancy GP ]
  weeks: [ 4, 6 ]
  priority: 1
  stakes: medium
  covers:
    - home tests detect hCG from about the day the period is due, test first thing in the morning
    - see a GP to confirm with a blood test and to start the first visit, before 10 weeks and ideally at 6 to 8
    - what the GP does at that visit, due date from the last period, the first bloods, folate and iodine, care options
    - a false positive is rare, a false negative early on is not
  sources:
    - title: Pregnancy, Birth and Baby — Pregnancy tests
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/pregnancy-tests
    - title: Pregnancy, Birth and Baby — GPs, what they do during your pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/the-role-of-your-gp
  related: [ first-antenatal-visit, estimated-due-date, first-blood-tests, dating-scan ]

- id: first-antenatal-visit
  title: The first visit and choosing your care
  type: moment
  topic: appointments
  ask: What happens at the first pregnancy appointment?
  aliases: [ first GP visit, first antenatal appointment, 8 week appointment, confirm pregnancy, first checkup ]
  weeks: [ 4, 10 ]
  priority: 1
  stakes: high
  covers:
    - before 10 weeks, ideally 6 to 8, with a GP or directly with a midwifery service
    - a long visit, medical and family history, medicines, mental health and support, family violence asked of everyone
    - blood pressure, weight and height, urine, the first bloods, cervical screening if due
    - the due date and whether a dating scan is needed
    - the model of care conversation and the referral or booking that follows
    - the screening choices with short windows that open at 10 weeks
  sources:
    - title: Pregnancy, Birth and Baby — Your first antenatal visit
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/your-first-antenatal-visit
    - title: Pregnancy, Birth and Baby — Screening for Down syndrome
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/screening-for-down-syndrome
    - title: The Royal Women's Hospital — Your first pregnancy check-up
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/now-you-are-pregnant/your-first-pregnancy-check-up
  related: [ confirming-the-pregnancy, choosing-your-model-of-care, first-blood-tests, booking-in, first-trimester-screening, carrier-screening ]
  exists: content/items/first-antenatal-visit.md

- id: booking-visit
  title: The booking visit
  type: moment
  topic: appointments
  ask: What is the booking-in appointment at the hospital?
  aliases: [ booking appointment, hospital booking visit, first hospital appointment, 12 week appointment, 16 week appointment, antenatal booking ]
  weeks: [ 10, 16 ]
  priority: 1
  stakes: medium
  covers:
    - the long first hospital appointment, usually 10 to 16 weeks, often with a midwife
    - history again in detail, blood pressure, weight and BMI, urine, the bloods if not done, mental health and wellbeing screen
    - results so far and the screening decisions reviewed
    - allocation to a model of care, caseload confirmed here at some hospitals
    - what to bring, the referral, Medicare card, scan and blood results, a list of questions, the partner
    - the visit schedule you leave with
  sources:
