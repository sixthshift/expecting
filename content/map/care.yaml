  related: [ morphology-scan, growth-scans, ecv ]
  notes: Caesarean itself is the birth file; stop at "a planned caesarean will be discussed".

- id: pre-eclampsia
  title: Pre-eclampsia
  type: guide
  topic: tests
  ask: What is pre-eclampsia and how do they watch for it?
  aliases: [ preeclampsia, toxaemia, high blood pressure pregnancy, protein in urine, PET, aspirin in pregnancy, HELLP ]
  weeks: [ 12, 42 ]
  priority: 1
  stakes: high
  covers:
    - high blood pressure that can affect the liver, kidneys and brain, usually after 20 weeks, protein in the urine is also a sign, why every visit checks blood pressure and a high reading leads to urine and blood tests
    - who is at higher risk, first pregnancy, twins, previous pre-eclampsia, chronic hypertension, diabetes, older, higher BMI
    - low-dose aspirin for those at higher risk, and calcium
    - what a diagnosis leads to, bloods, CTG, growth scans, more visits or admission, medicines, and birth as the cure, sometimes early
    - blood pressure after the birth and the 6-week check
  sources:
    - title: Pregnancy, Birth and Baby — Pre-eclampsia
