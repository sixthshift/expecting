  title: Hepatitis B screening
  type: term
  topic: tests
  ask: Why do they test for hepatitis B?
  aliases: [ hep B, HBsAg, hepatitis B surface antigen, hepatitis B positive pregnancy ]
  weeks: [ 5, 12 ]
  priority: 2
  stakes: high
  covers:
    - a blood-borne virus that can pass to the baby at birth, tested in every pregnancy
    - a positive result changes the birth plan for the baby, vaccine and immunoglobulin straight after birth, and referral for the parent
    - not immune and at risk means the vaccine can be given in pregnancy, it is not live
