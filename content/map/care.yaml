- id: what-medicare-covers
  title: What Medicare covers in pregnancy
  type: payment
  topic: care
  ask: What do we actually have to pay for?
  aliases: [ Medicare, bulk billing, gap fee, out of pocket, free pregnancy care, Medicare rebate ]
  weeks: [ 1, 42 ]
  priority: 1
  stakes: high
  covers:
    - public patient in a public hospital or birth centre, care and the stay are free
    - bulk-billed GP and midwife visits cost nothing, others charge a gap
    - free or subsidised routine ultrasounds, blood tests and telehealth
    - flu, whooping cough and RSV vaccines free under the National Immunisation Program
    - three pregnancy support counselling sessions per pregnancy
    - not covered, NIPT, private obstetrician and private midwife gap fees, private hospital accommodation, private midwife labour fees
    - as a private patient, 75 percent of the schedule fee for in-hospital doctors, nothing for the bed or theatre
  sources:
    - title: Pregnancy, Birth and Baby — Medicare during pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/medicare-during-pregnancy
    - title: Services Australia — Medicare services for conceiving, pregnancy and birth
      url: https://www.servicesaustralia.gov.au/medicare-services-for-conceiving-pregnancy-and-birth
    - title: Pregnancy, Birth and Baby — Vaccinations and pregnancy
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/vaccinations-and-pregnancy
  related: [ medicare-safety-net, obstetrician-out-of-pocket-costs, private-health-insurance-and-pregnancy, paying-for-scans, nipt, pregnancy-care-without-medicare ]

- id: private-health-insurance-and-pregnancy
  title: Private health insurance and the 12-month wait
  type: payment
  topic: care
  ask: Will our health insurance cover the birth?
  aliases: [ 12 month waiting period, obstetrics cover, pregnancy cover, gold cover, hospital cover, upgrade to family cover ]
  weeks: [ 1, 36 ]
  who: together
  priority: 1
  stakes: high
  covers:
    - obstetrics has a waiting period of up to 12 months, served before admission to hospital, so cover bought after conception won't pay for this birth
    - what it pays, the private hospital stay and part of the doctors' in-hospital fees, not the consultations in the rooms
    - check the policy covers obstetrics and midwifery, some only cover a private patient in a public hospital
    - the baby's cover, upgrade to a family policy one to three months before the birth, some funds want longer
    - a premature or unwell baby admitted in a private hospital can cost a lot without family cover
    - without cover, a private hospital means high out-of-pocket costs, and the public system is always there
  sources:
    - title: Pregnancy, Birth and Baby — Private health insurance and pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/private-health-insurance-and-pregnancy
    - title: PrivateHealth.gov.au — Waiting periods
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/waiting_periods.htm
    - title: The Royal Women's Hospital — Money matters
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/preparing-for-pregnancy/money-matters
  related: [ private-obstetrician, obstetrician-out-of-pocket-costs, what-medicare-covers, private-patient-in-a-public-hospital ]
  notes: The decision was really made before conception; in the app it becomes a check. The family-policy upgrade is the live deadline.

- id: obstetrician-out-of-pocket-costs
  title: What a private obstetrician costs
  type: guide
  topic: care
  ask: How much is a private obstetrician really?
  aliases: [ management fee, pregnancy management fee, obstetrician fees, gap, anaesthetist fee, paediatrician fee, known gap ]
  weeks: [ 4, 12 ]
  who: together
  priority: 2
  stakes: high
  covers:
    - the pieces, consultation fees, a pregnancy management fee, the birth fee, then anaesthetist and paediatrician bills, scans and tests
    - Medicare rebates part of each, insurance covers the hospital stay and some in-hospital gaps, the rooms fees are yours
    - ask for a written estimate before committing, and ask the fund what it pays
    - the Medical Costs Finder and the Safety Net
    - a private patient in a public hospital pays medical and diagnostic costs without a guaranteed single room
  sources:
    - title: Pregnancy, Birth and Baby — Obstetricians, what do they do?
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/obstetrician
    - title: Pregnancy, Birth and Baby — Private health insurance and pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/private-health-insurance-and-pregnancy
    - title: The Royal Women's Hospital — Money matters
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/preparing-for-pregnancy/money-matters
  related: [ private-obstetrician, private-health-insurance-and-pregnancy, medicare-safety-net, what-medicare-covers ]
  notes: Don't quote dollar figures; they vary by city and doctor. Describe the structure and tell the reader to get it in writing.

- id: private-patient-in-a-public-hospital
  title: Being a private patient in a public hospital
  type: guide
  topic: care
  ask: Can I use my insurance at the public hospital?
  aliases: [ private in public, use my cover in a public hospital, single room public hospital ]
  weeks: [ 4, 20 ]
  priority: 3
  stakes: medium
  covers:
    - you can elect to be private in a public hospital, with your own obstetrician if they have rights there
    - no guaranteed single room, and you take on hospital, medical and diagnostic costs the fund may not fully cover
    - sometimes the hospital asks a public patient to use their cover, you can say no
  sources:
    - title: Pregnancy, Birth and Baby — Public vs private care in pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/what-is-the-difference-between-public-and-private-care-in-pregnancy
    - title: The Royal Women's Hospital — Pregnancy care & birthing options
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/now-you-are-pregnant/pregnancy-care-birthing-options
  related: [ private-health-insurance-and-pregnancy, public-hospital-care, private-obstetrician ]

- id: pregnancy-care-without-medicare
  title: Pregnancy care on a visa, without Medicare
  type: guide
  topic: care
  ask: We're not eligible for Medicare, what will it cost?
  aliases: [ visa, overseas student health cover, OSHC, reciprocal health care, no Medicare card, temporary visa pregnancy ]
  weeks: [ 1, 42 ]
  priority: 3
  stakes: high
  covers:
    - without Medicare you pay the full cost in public or private hospitals, ask for an estimate at booking
    - reciprocal agreements cover urgent treatment only, check whether pregnancy care counts
    - visa health cover often has its own 12-month wait for pregnancy
    - hospitals may offer payment plans or financial support, ask early
  sources:
    - title: Pregnancy, Birth and Baby — Pregnancy and newborn care on a visa in Australia
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/pregnancy-care-on-a-visa-in-australia
    - title: Pregnancy, Birth and Baby — Medicare during pregnancy
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/medicare-during-pregnancy
  related: [ what-medicare-covers, private-health-insurance-and-pregnancy ]

