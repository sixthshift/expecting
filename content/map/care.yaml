  notes: UTI symptoms and when to call are the symptoms file.

- id: rhd-negative
  title: Being RhD negative
  type: guide
  topic: tests
  ask: My blood group is negative, what does that mean for the baby?
  aliases: [ rhesus negative, Rh negative, RhD negative, negative blood group, haemolytic disease of the newborn, sensitising event ]
  weeks: [ 6, 42 ]
  priority: 1
  stakes: high
  covers:
    - about 17 in 100 Australians, a mismatch with a positive baby can make antibodies that usually don't affect the first pregnancy but can seriously affect the next baby
    - the plan, anti-D at 28 and 34 weeks and after the birth, the baby's cord blood group
    - sensitising events, heavy or repeated bleeding, an injury or accident to the abdomen, CVS or amniocentesis, miscarriage, call and ask about anti-D within 72 hours (it can still be given later), one-off bleeding in the first 12 weeks may not need it
    - the RhD NIPT that can show the baby is negative and make anti-D unnecessary
  sources:
    - title: Pregnancy, Birth and Baby — Rhesus D negative in pregnancy
