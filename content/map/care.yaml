  aliases: [ iron deficiency, low haemoglobin, low ferritin, iron tablets, iron infusion, Ferinject ]
  weeks: [ 6, 42 ]
  priority: 1
  stakes: medium
  covers:
    - about 1 in 4 pregnancies, blood volume rises and the baby takes iron, found on the full blood count at the start and at 28 weeks
    - treatment, iron tablets and how to take them, constipation and nausea, when an infusion is offered instead
    - why it matters for the birth, blood loss and recovery, and the baby's iron stores
    - an infusion is a day visit, Medicare covers it, some private fees
    - recheck a few weeks after starting
  sources:
