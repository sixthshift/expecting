# Check M12: drafts fact-checked against their cited pages (fetched 2026-10-29).
# Mental-health entries first, then labour-and-birth entries.
- id: intrusive-thoughts
  file: content/drafts/intrusive-thoughts.md
  verdict: fix
  problems:
    - claim: "For new parents they're often about harm coming to the baby."
      judgement: wrong
      source_says: "Among new parents, these thoughts can relate to harming or witnessing harm to their baby or others."
      url: https://www.gidgetfoundation.org.au/fact-sheets/intrusive-thoughts-what-are-they-and-how-do-we-deal-with-them
      fixed_to: "For new parents they can be about harming, or seeing harm come to, the baby or others."
    - claim: "The Gidget Foundation (1300 851 758) offers free specialist counselling."
      judgement: unsupported
      source_says: "free ongoing specialist counselling ... Up to 10 individual sessions per calendar year. ... subject to meeting relevant Medicare eligibility requirements."
      url: https://www.gidgetfoundation.org.au/fact-sheets/intrusive-thoughts-what-are-they-and-how-do-we-deal-with-them
      fixed_to: "added the 10-session and Medicare-eligibility limits"
  notes: "000 lines confirmed under the emergency heading: page says 'contact your healthcare provider immediately or call 000' and 'if you or your baby are not safe, call 000 or have someone take you to an emergency room'. Lifeline 13 11 14 is on the page (banner, 24/7 crisis support)."
- id: stress-in-pregnancy
  file: content/drafts/stress-in-pregnancy.md
  verdict: fix
  problems:
    - claim: "It can come from an unplanned pregnancy, a previous loss or hard birth,"
      judgement: wrong
      source_says: "having a pregnancy that is unplanned or unwanted; becoming pregnant after previous negative experiences with a pregnancy, birth or parenthood, such as a miscarriage or the death of a baby"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/stress-and-pregnancy
      fixed_to: "unplanned or unwanted pregnancy, previous negative experiences with a pregnancy, birth or parenthood (such as a miscarriage or the death of a baby)"
  notes: "Lifeline line ('If you are having thoughts of self-harm or suicide, call Lifeline on 13 11 14 for immediate support') is a banner on the page with no 000 instruction, so it stays out of the 000 heading. It sits as a bold line under 'See your doctor or midwife'; 'immediate support' is stronger than that heading, so the caller may want it moved or shown as a callout above the headings."
- id: tokophobia
  file: content/drafts/tokophobia.md
  verdict: fix
  problems:
    - claim: "miscarriage, stillbirth, termination, fertility problems or the death of a baby"
      judgement: wrong
      source_says: "a traumatic birth experience, a miscarriage, a stillbirth, a termination of pregnancy, fertility challenges, neonatal death"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/fear-of-childbirth
      fixed_to: "neonatal death"
  notes: "Everything else matches the page, including Lifeline/Beyond Blue/PANDA numbers (no 000 on this page; none used)."
- id: previous-trauma-and-pregnancy
  file: content/drafts/previous-trauma-and-pregnancy.md
  verdict: fix
  problems:
    - claim: "Persistent overwhelm, stress or intrusive trauma memories are clear signs you may need support; getting it early can stop things getting worse."
      judgement: unsupported
      source_says: "If you identify with any of the symptoms, it's a good time to reach out to a perinatal mental health clinician ... Early identification and intervention are so important."
      url: https://www.gidgetfoundation.org.au/fact-sheets/complex-trauma-during-the-perinatal-period
      fixed_to: "If you notice symptoms of complex trauma, such as those above, it's a good time to reach out to a perinatal mental health clinician; start with someone you trust. Early identification and intervention are so important, according to the Gidget Foundation."
    - claim: "the Gidget Foundation offers free psychological therapy for expectant and new parents"
      judgement: unsupported
      source_says: "free individual psychological therapy ... Up to 10 individual sessions per calendar year ... subject to Medicare eligibility"
      url: https://www.gidgetfoundation.org.au/fact-sheets/complex-trauma-during-the-perinatal-period
      fixed_to: "added the limits"
  notes: "Helplines (1800RESPECT, PANDA, Beyond Blue, Medicare Mental Health 1800 595 212, Bravehearts 1800 272 831) all appear on cited pages; no 000 on them and none added."
- id: worry-and-sleep
  file: content/drafts/worry-and-sleep.md
  verdict: fix
  problems:
    - claim: "Under 'Call 000 or go to emergency': 'If you're extremely distressed or having suicidal thoughts, call Lifeline on 13 11 14 or the Suicide Call Back Service on 1300 659 467 for immediate support.'"
      judgement: wrong
      source_says: "Insomnia page: 'Warning: If you are extremely distressed or having suicidal thoughts call Lifeline 13 11 14 or Suicide Call Back Service 1300 659 467 for immediate support.' (no 000). Mental wellbeing page: 'If you or someone you know, is having suicidal thoughts and is in immediate danger, call triple zero (000). For help and support call Lifeline on 13 11 14.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/insomnia-in-pregnancy-and-breastfeeding
      fixed_to: "000 heading keeps only the mental wellbeing page's 000 line plus its Lifeline line; the extremely-distressed Lifeline/Suicide Call Back line moved, in bold, under 'See your doctor or midwife'"
    - claim: "trouble sleeping that goes on after trying these tips"
      judgement: unsupported
      source_says: "If you have problems with insomnia, seek medical advice and treatment."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/insomnia-in-pregnancy-and-breastfeeding
      fixed_to: "problems with insomnia (Pregnancy, Birth and Baby says to seek medical advice and treatment)"
  notes: "Same level caveat as stress-in-pregnancy for the moved line: 'immediate support' is stronger than the doctor/midwife heading."
- id: mental-health-screening-epds
  file: content/drafts/mental-health-screening-epds.md
  verdict: fix
  problems:
    - claim: "It isn't a test you can fail."
      judgement: unsupported
      source_says: "(not on any cited page)"
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/mental-health-pregnancy/depression-pregnancy
      fixed_to: cut
    - claim: "At some point your midwife or doctor will hand you a short questionnaire"
      judgement: unsupported
      source_says: "most women in Australia will be screened for depression. You will be screened using a questionnaire that asks a number of set questions about how you are feeling."
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/mental-health-pregnancy/depression-pregnancy
      fixed_to: "reworded to the page's words"
    - claim: "Your answers are how the people caring for you know whether to offer more."
      judgement: unsupported
      source_says: "Your answers will let the health professional know whether or not you have symptoms of depression."
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/mental-health-pregnancy/depression-pregnancy
      fixed_to: "Your answers let the health professional know whether or not you have symptoms of depression."
    - claim: "Some private hospitals (in Sydney and Melbourne so far) ... one-on-one emotional wellbeing appointment"
      judgement: unsupported
      source_says: "a routine inclusion of antenatal care at the following private hospitals: Kareena (Caringbah NSW), Mater (North Sydney), North Shore Private (St Leonards), St Vincent's Private (Fitzroy VIC)"
      url: https://www.gidgetfoundation.org.au/support/emotional-wellbeing-screening-progam
      fixed_to: "Selected private hospitals (four in NSW and Victoria so far)"
    - claim: "If you've been feeling miserable most of the day on most days, or have thoughts of harming yourself, the Royal Women's says to see your GP."
      judgement: unsupported
      source_says: "'feeling depressed or miserable consistently for most of the day and for most days of the week' and 'thoughts of harming yourself' are listed as symptoms; 'If you feel that you may have symptoms, visit your GP.' Disclaimer: 'if you require urgent care you should go to the nearest Emergency Dept.'"
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/mental-health-pregnancy/depression-pregnancy
      fixed_to: "reworded to say these are listed symptoms and that the page says visit your GP if you think you may have symptoms"
  notes: "CONFIRMED: Gidget's screening page says 'The National Perinatal Mental Health Guidelines were reviewed and updated in 2023 ... New additions to the 2023 Guideline include screening and psychosocial assessment for fathers and non-birthing partners.' The draft's line stands. EPDS 'commonly used screening questionnaire in the perinatal period with a standard scoring guide' and Q10 self-harm also confirmed. 15 per cent figure confirmed on the Women's mental health page. No 000 on the pages; none added (only the Women's disclaimer about the emergency department)."
- id: retained-placenta
  file: content/drafts/retained-placenta.md
  verdict: fix
  problems:
    - claim: "Your doctor will likely recommend antibiotics afterwards, especially if you had a fever or needed surgery."
      judgement: wrong
      source_says: "If you needed help to deliver your placenta, especially if you had a fever or needed surgery, it's likely your doctor will also recommend antibiotics to prevent infection."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/retained-placenta
      fixed_to: "If you needed help to deliver your placenta, especially if you had a fever or needed surgery, your doctor will likely recommend antibiotics to prevent infection."
  notes: "Red flags confirmed: 000 only when bleeding or pain becomes severe; contact doctor/medical team as soon as possible for heavy bleeding or pain in days or weeks after birth, many large clots, or bleeding heavier, bright red or foul-smelling. 30 min / 1 hour thresholds, 2 in 100, 5 to 60 minutes confirmed."
