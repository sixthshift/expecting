- id: going-home
  file: content/drafts/going-home.md
  verdict: fix
  problems:
    - claim: "The two sources give slightly different ranges. PBB says 4 to 24 hours vaginal, 48 to 72 hours caesarean; KEMH 4 hours vaginal, 24 to 72 hours caesarean."
      judgement: unsupported
      source_says: "Two other PBB pages (Your first few days after giving birth; Mum's first 24 hours after birth) say 'You may be able to go home 4 to 6 hours after a vaginal birth in a public hospital or birth centre' and 'You may need to stay in hospital longer if: assisted delivery, caesarean, you are unwell, your baby is unwell'; private hospital 'might be able to stay longer'."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/after-birth/your-first-few-days-after-giving-birth
      fixed_to: "kept all credited: the at-home page's 4 to 24 h / 48 to 72 h, the two other PBB pages' 4 to 6 h, and KEMH; both pages added to sources"
    - claim: "It can be sooner than people expect."
      judgement: unsupported
      source_says: "(not on any cited page)"
      url: https://www.kemh.health.wa.gov.au/Pregnancy-and-Birth/After-your-pregnancy/Going-home
      fixed_to: cut
    - claim: "Beyond Blue on 1300 224 636"
      judgement: ok
      source_says: "Page prints 1300 224 636 (same digits as 1300 22 4636)"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/after-birth/being-at-home-with-your-baby-after-giving-birth
      fixed_to: "written 1300 22 4636 to match the other entries"
  notes: "KEMH confirmed: from 4 hours after an uncomplicated vaginal birth, 24 to 72 hours after a caesarean, discharge checklist. Admin (Medicare, register within 60 days in most states and territories), first child health nurse visit about 10 days after getting home confirmed."
- id: first-days-mum
  file: content/drafts/first-days-mum.md
  verdict: ok
  notes: "Credited disagreements confirmed. Lochia: PBB 'up to 6 weeks' (first few days page and 24-hour page); RANZCOG 'may continue for about two months'. Large clots: PBB 'tell your midwife'; RANZCOG 'contact your midwife or doctor or present to an emergency facility' and save the pad. Blues: RANZCOG 'if you have the blues for more than a few days ... call your doctor or midwife right away' (peak around day 4, ease up in under two weeks); PBB 'still having the blues 2 weeks after giving birth ... call your doctor'. Thoughts of hurting yourself or the baby: PBB 'call your doctor', RANZCOG 'call your doctor or midwife right away'. Red-flag list (sudden heavy bleeding, high temperature, chest pain, calf pain, severe headache, blurred vision, vomiting) is PBB's 'talk to your doctor or midwife straight away ... signs you need immediate treatment'. No 000 on these pages."
- id: term-lochia
  file: content/drafts/term-lochia.md
  verdict: fix
  problems:
    - claim: "Expect it for up to 6 weeks."
      judgement: unsupported
      source_says: "PBB: 'up to 6 weeks'. RANZCOG: 'may continue for about two months'."
      url: https://ranzcog.edu.au/wp-content/uploads/First-Few-Weeks-Following-Birth.pdf
      fixed_to: "both credited; RANZCOG added to sources"
    - claim: "Use maternity pads or period underwear, not tampons or cups."
      judgement: wrong
      source_says: "use maternity pads or period underwear until your 6-week check. Using internal period products like tampons and menstrual cups may increase your chance of getting an infection."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/after-birth/mums-first-24-hours-after-birth
      fixed_to: "Use maternity pads or period underwear until your 6-week check: tampons and menstrual cups may increase the chance of infection."
    - claim: "If you pass large clots or notice a bad smell, tell your midwife."
      judgement: wrong
      source_says: "PBB: tell your midwife. RANZCOG: 'contact your midwife or doctor or present to an emergency facility' (save the pad)."
      url: https://ranzcog.edu.au/wp-content/uploads/First-Few-Weeks-Following-Birth.pdf
      fixed_to: "both credited; bad smell kept as tell your midwife (PBB)"
- id: caesarean-recovery
  file: content/drafts/caesarean-recovery.md
  verdict: fix
  problems:
    - claim: "Pregnancy, Birth and Baby says you'll usually stay 2 to 5 days; KEMH says 24 to 72 hours."
      judgement: unsupported
      source_says: "PBB being-at-home page: 'likely to go home ... 48 to 72 hours after a caesarean section'. Recovery page: 'usually stay in hospital for 2 to 5 days'. KEMH: 'between 24 and 72 hours after a caesarean birth'."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/after-birth/being-at-home-with-your-baby-after-giving-birth
      fixed_to: "all three credited; being-at-home page added to sources"
  notes: "Everything else matches (fever 38 C or more, redness or swelling, smelly discharge, pain when you wee, heavy bleeding: contact doctor or midwife straight away; staples about 7 days; driving 2 to 6 weeks; wound pain easing 3 to 6 months; avoid lifting more than your baby)."
