  file: content/drafts/first-feed.md
  verdict: ok
- id: hepatitis-b-birth-dose
  file: content/drafts/hepatitis-b-birth-dose.md
  verdict: fix
  problems:
    - claim: "usually as part of a combined vaccine"
      judgement: unsupported
      source_says: "3 subsequent doses of a hepatitis B-containing vaccine at 2, 4 and 6 months of age"
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/hepatitis-b
      fixed_to: "as part of a hepatitis B-containing vaccine"
  notes: "Confirmed: 24 h preferred and within 7 days, no birth-dose catch-up (3-dose course instead), 2-month dose from 6 weeks, free under NIP, HBIG within 12 h preferably and certainly within 48 h, blood test 3-12 months after course and not before 9 months, newborns tolerate very well, can be given with vitamin K."
