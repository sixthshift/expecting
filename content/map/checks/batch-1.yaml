      judgement: unsupported
      source_says: "Neither cited page mentions seaweed. FSANZ has a separate 'Inorganic arsenic and iodine in seaweed' page, not cited here."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/raw-fish-dishes

