- id: prawns
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "the Christmas prawn platter is the classic trap"
      judgement: unsupported
      source_says: "Minor, editorial. Sources say only that chilled cooked / cooked ready-to-eat prawns are to be avoided (FSANZ vulnerable page: 'chilled cooked prawns'; freshly cooked or thoroughly reheated to steaming hot is the safe option). Nothing about Christmas or platters."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/Food-safety-for-vulnerable-populations
    - covers: "same rule for crab, lobster and bugs"
      judgement: unsupported
      source_says: "Minor. The FSANZ vulnerable-people table covers 'seafood - chilled, ready-to-eat or raw' generally, and names only oysters, sushi, sashimi, ceviche, smoked seafood and chilled cooked prawns. Crab, lobster and bugs appear only in the mercury brochure, as crustacea that are low in mercury."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/Food-safety-for-vulnerable-populations

- id: smoked-salmon
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "canned smoked seafood is shelf-stable and fine"
      judgement: unsupported
      source_says: "Neither cited page says it. FSANZ listeria says avoid 'smoked ready-to-eat seafood'; PBB says avoid smoked salmon. FSANZ vulnerable page (not cited) gives 'canned or shelf-stable' only for pates. NSW foods-to-eat-or-avoid (not cited) says canned fish is okay to eat, shelf-stable, once opened store in the fridge and use within a day."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/bacteria-foodborne-illness/listeria
    - covers: "cold-smoked salmon is raw and ready-to-eat: listeria"
      judgement: unsupported
      source_says: "Not on either cited page. It is on FSANZ 'Raw fish dishes', which lists cold smoked salmon among raw fish dishes (ready-to-eat raw fish such as cold smoked salmon is kept in the fridge and used before expiry), and says vulnerable people should not eat raw fish because of Listeria. Add that page."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/raw-fish-dishes

- id: high-mercury-fish
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "flake is shark: the default fish-and-chips fish in much of Australia"
      judgement: unsupported
      source_says: "Minor. FSANZ and NSW say shark (flake) is higher in mercury and name it in the table; neither says it is the default fish-and-chips fish. The portion rules, 150 g, the fortnight/week rules, 'ask what the fish is', and 'cooking and canning do not reduce mercury' are all on the FSANZ brochure and match. NSW also prints 2-3 serves per week for other fish, as the notes say."
      url: https://www.foodstandards.gov.au/consumer/chemicals/mercury

- id: pre-cut-fruit-and-salads
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "includes coleslaw and the salads from a deli"
      judgement: unsupported
      source_says: "Coleslaw is not named on either page. Both name 'pre-prepared or pre-packaged fruit or vegetable salads, including those from buffets and salad bars'. NSW 'why avoid' also lists 'pre-prepared vegetables and salads' and 'pre-cut fruit'."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/bacteria-foodborne-illness/listeria
    - covers: "bagged leaves are a grey area: FSANZ says pre-packaged salads; wash and eat the same day if you do"
      judgement: unsupported
      source_says: "Both FSANZ and NSW say avoid pre-packaged salads, with no grey area and no allowance to eat them if washed and eaten the same day. FSANZ lists 'freshly prepared salads' as the safer alternative; NSW: home-made salads are okay if ingredients are washed well just before making and eating. The same-day provision is not in the sources and would tell someone it is acceptable to eat a bagged salad. Drop it or say avoid."
      url: https://www.foodauthority.nsw.gov.au/consumer/life-events-and-food/pregnancy/foods-to-eat-or-avoid-when-pregnant

