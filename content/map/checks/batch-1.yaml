- id: cold-cooked-chicken
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "sandwich bars and pre-packed salads"
      judgement: unsupported
      source_says: "Minor. The only cited page (FSANZ vulnerable populations) lists 'Chicken - pre-cooked, cold: purchased whole, portions, slices or diced', with 'freshly cooked' as the alternative. It does not mention sandwich bars or salads. Sandwich bars appear on the NSW Food Authority 'Foods to eat or avoid when pregnant' page ('Cold chicken or turkey (e.g. from sandwich bars): do not eat'), and pre-packaged salads are a separate avoid on FSANZ listeria and PBB; neither is cited here."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/Food-safety-for-vulnerable-populations

- id: rare-meat
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "toxoplasmosis is rare but can harm the baby; Australia doesn't screen for it"
      judgement: wrong
      source_says: "PBB toxoplasmosis page calls it 'a common infection' that is 'common in all parts of the world'; it does not say rare. It says infection in pregnancy can cause serious problems in the baby. Nothing about screening (it says a blood test can diagnose it if you have symptoms or exposure), so 'Australia doesn't screen' is unsupported too."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/toxoplasmosis
    - covers: "no pink in pork, sausages, mince and burgers"
      judgement: unsupported
      source_says: "Not on either cited page. It is on PBB 'Foods to avoid when pregnant' ('make sure there is no pink left in pork, sausages and minced meat, including burgers'), which this entry does not cite. NSW says raw meat: do not eat; cooked meats cooked to at least 71 C (medium)."
      url: https://www.foodauthority.nsw.gov.au/consumer/life-events-and-food/pregnancy/foods-to-eat-or-avoid-when-pregnant
    - covers: "whole-muscle steak cooked to at least medium (71°C) and eaten hot"
      judgement: unsupported
      source_says: "NSW gives one rule for 'Cooked meats: beef, pork, chicken, mince': cook to at least 71 C (medium), eat while hot. It does not single out whole-muscle steak. PBB foods-to-avoid (not cited) says 'cook all meat and poultry to at least 75 C and eat it hot', and NSW's own home-cooked chicken line says 74 C. The sources disagree on the temperature; the notes already flag this."
      url: https://www.foodauthority.nsw.gov.au/consumer/life-events-and-food/pregnancy/foods-to-eat-or-avoid-when-pregnant

- id: raw-eggs
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "commercial mayonnaise, aioli and custard in jars and cartons are pasteurised and fine"
      judgement: unsupported
      source_says: "FSANZ lists 'pasteurised eggs, cooked omelettes, hard boiled eggs, commercial custard and dressings e.g. mayonnaise, aioli' as the safer alternatives; PBB says commercially made mayonnaise is fine if stored correctly. Neither says they are pasteurised or that jars and cartons are the test. NSW (not cited) is stricter on custard: store-bought is 'eat with caution', can be eaten cold if freshly opened, reheat to 60 C and use within a day of opening."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/Food-safety-for-vulnerable-populations
    - covers: "Australian advice is stricter than the UK's lion-stamp rule; don't import it"
      judgement: unsupported
      source_says: "Neither cited page mentions the UK, the lion stamp or any comparison. Editorial, not from the sources."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/foods-to-avoid-when-pregnant

- id: sushi
