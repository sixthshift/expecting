      judgement: unsupported
      source_says: "Minor. PBB says alcohol 'passes from your blood through the placenta' and 'the placenta can't stop the alcohol from reaching your baby'. 'Baby's level matches yours' is on the SESLHD Royal Hospital for Women leaflet ('levels in the developing baby's bloodstream that are as high as those in the mother'), which is cited by alcohol-before-you-knew, not this entry. Everything else (Guideline 3 wording, no safe time/amount/type, miscarriage, stillbirth, premature birth, FASD, partner stopping, lines to use, breastfeeding, Feed Safe) is on the cited pages."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/alcohol-and-pregnancy

- id: alcohol-before-you-knew
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "very common: most people find out at 4–6 weeks"
      judgement: unsupported
      source_says: "Neither page gives when people find out. PBB says only 'you might have drunk alcohol before you even knew you were pregnant'."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/alcohol-and-pregnancy
    - covers: "heavy drinking is worth mentioning at booking-in"
      judgement: unsupported
      source_says: "Neither page mentions booking-in. PBB: 'if you are concerned, speak to your doctor or midwife'. SESLHD: if concerned about your intake or finding it hard to reduce or stop, consider discussing with your doctor or midwife or a specialist alcohol counselling service (ADIS 24-hour line 1800 250 015). SESLHD also says chronic heavy drinkers are at increased risk of FASD and the risk is higher with frequent, large amounts and binge drinking."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Alcohol%20in%20Pregnancy.pdf
    - covers: "no test can measure it; no action needed beyond stopping"
      judgement: unsupported
      source_says: "Neither page says there is no test. PBB: 'once you know you are pregnant, it's safest to stop drinking', and if concerned, talk to a doctor or midwife or call NOFASD. SESLHD: stopping at any time reduces the risk; call MotherSafe for individual advice. 'No action needed beyond stopping' leaves out the advice to talk to someone if worried, which the other phrases in this entry do include."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/alcohol-and-pregnancy

- id: medicines-in-pregnancy
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "the TGA categories (A, B1–B3, C, D, X) are for prescribers: B is not safer than C"
      judgement: unsupported
      source_says: "The cited TGA page only defines category A for paracetamol ('taken by a large number of pregnant women... without any proven increase in the frequency of malformations'). It does not list the other categories, say they are for prescribers, or compare B with C. The notes already admit this."
      url: https://www.tga.gov.au/news/media-releases/paracetamol-use-pregnancy
    - covers: "MotherSafe (NSW, 1800 647 848) and the KEMH medicines line (WA) answer the phone; healthdirect 1800 022 222 nationally"
      judgement: unsupported
      source_says: "Partly. healthdirect 1800 022 222 (nurse, 24 hours) is on the PBB medicines page. KEMH gives its Medicine Information line (08) 6458 2723, 8:30am-4:30pm Mon-Fri, and only links MotherSafe by name. The MotherSafe number 1800 647 848 (NSW non-metro; Sydney metro (02) 9382 6539, Mon-Fri 9am-5pm) is on the SESLHD leaflets cited by other entries, not by this one."
      url: https://kemh.health.wa.gov.au/Pregnancy-and-Birth/After-your-pregnancy/Pharmacy/Medicines-in-pregnancy

