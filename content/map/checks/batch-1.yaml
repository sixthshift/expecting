- id: soft-cheese
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "pasteurised doesn't make a soft cheese safe: the risk is after pasteurising"
      judgement: unsupported
      source_says: "Neither page says it. PBB: listeria 'may contaminate the cheese during the manufacturing process', and separately 'only drink and eat dairy products made from pasteurised milk'. FSANZ lists soft cheeses to avoid without mentioning pasteurisation. FSANZ's vulnerable-people page lists 'pasteurised cream cheese' as a safer alternative, so the sources do not state that pasteurised soft cheese is unsafe because of post-pasteurisation contamination. Reword to what PBB says (contamination can happen in manufacturing)."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/foods-to-avoid-when-pregnant

