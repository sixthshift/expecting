- id: breech-birth
  file: content/drafts/breech-birth.md
  verdict: fix
  problems:
    - claim: "decide_by: 37"
      judgement: unsupported
      source_says: "PBB: no extra care is needed for an uncomplicated breech pregnancy until about 37 weeks; ECV after 37 weeks. RANZCOG: elective caesarean at 39 weeks. No page gives 37 weeks as the week to decide by."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/breech-pregnancy
      fixed_to: "decide_by removed; 'When to decide' now states what the pages say (37 weeks no extra care, ask about options after 37 weeks; RANZCOG caesarean at 39 weeks)"
    - claim: "'When to decide': talk through ... so a caesarean can be booked at about 39 weeks if that's your choice"
      judgement: unsupported
      source_says: "PBB question list: 'What are my options if my baby is in a breech position after 37 weeks?'; RANZCOG guidance: elective caesarean for breech at 39 weeks"
      url: https://ranzcog.edu.au/wp-content/uploads/Management-Breech-Presentation.pdf
      fixed_to: "reworded to the two statements above"
    - claim: "It works about half the time. RANZCOG's guidance is to offer it from 37 weeks, or from 36 weeks for a first baby."
      judgement: unsupported
      source_says: "Leaflet: ECV is successful 50% of the time; discuss at 36 weeks. Guidance: offer from 37+0, 36+0 for nulliparous; success 40% nulliparous, 60% multiparous. PBB: after 37 weeks."
      url: https://ranzcog.edu.au/wp-content/uploads/Breech-Presentation-End-of-Pregnancy.pdf
      fixed_to: "all three timings and both success figures given, each credited"
    - claim: "moxibustion: no evidence (PBB Breech, RANZCOG)"
      judgement: unsupported
      source_says: "PBB Malpresentation: if moxibustion is done before 37 weeks there is some evidence it may reduce the chance of your baby being breech at birth"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/malpresentation
      fixed_to: "added the Malpresentation page's statement, credited, and added it to sources"
    - claim: "call-000 instruction was the third paragraph"
      judgement: wrong
      source_says: "Warning: If your waters break and you have been told that your baby is not head-first, seek medical help immediately by calling triple-zero (000) and asking for an ambulance."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/breech-pregnancy
      fixed_to: "moved to the first line of the body, wording unchanged"

