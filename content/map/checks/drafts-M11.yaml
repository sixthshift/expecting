# Fact-check of 20 drafted Library entries (batch M11, labour and birth): every claim,
# heading level and figure checked against the pages in `sources:` (PBB pages re-fetched
# 2026-10-29; RANZCOG PDFs and the Royal Women's Hospital pages read in full).
# verdict "fix" = text rewritten to the source and `checked: 2026-10-29` added;
# "ok" = no change needed, `checked` added.
# Notes for the owner:
#  - Emergency position conflict: PBB "Umbilical cord prolapse" says (you may be asked to)
#    bring your knees to your chest with your head facing down; PBB "Waters breaking early"
#    says call an ambulance and get down on your hands and knees with your bottom in the
#    air. Both pages say call triple zero / an ambulance. cord-prolapse and
#    waters-breaking-early now lead with the call and give both positions, each credited.
#  - VBAC scar rupture: RANZCOG 1 in 122-500 (1 in 370 if induced, 1 in 56 if induced from
#    40+6 weeks), PBB 5-7 in 1,000, Royal Women's 1-2 in 200: all three kept as drafted.
#    Success: RWH 70 in 100; PBB about 1 in 4 need an emergency caesarean. Gap: RANZCOG
#    under 21 months, PBB caesarean under 18 months. All verified.
#  - ECV: PBB usually after 37 weeks (after 36 if first baby); RANZCOG clinical guidance
#    37+0 or 36+0 for first baby; RANZCOG patient leaflet says discuss at 36 weeks.
#    Success RANZCOG leaflet 50%, guidance 40% first / 60% later; 1 in 200 emergency
#    caesarean; about 3% turn back. All verified.
#  - Moxibustion: PBB Breech and ECV pages and RANZCOG: no good evidence; PBB
#    Malpresentation: some evidence before 37 weeks may reduce chance of breech at birth.
#    breech-birth now gives both, credited.
#  - Perineal tears: PBB 8 in 10 have a tear; PBB "Birth injury to the mother" about 3 in 4
#    tear or cut. Verified.
#  - Prostaglandin timing: PBB gel usually every 6 hours, RWH every six to eight hours;
#    PBB lie on left side 30-40 minutes, RWH rest at least 30 minutes. Verified.
#  - Third stage: PBB physiological usually recommended for healthy low-risk, up to an
#    hour; active up to 30 minutes; RANZCOG C-Obs 31 recommends active for all (conditional,
#    from C-Obs 43) while saying benefit is less certain for low-risk. Verified.

- id: shoulder-dystocia
