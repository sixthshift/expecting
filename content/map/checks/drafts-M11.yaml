  verdict: ok

- id: cord-prolapse
  file: content/drafts/cord-prolapse.md
  verdict: fix
  problems:
    - claim: "The call-000 instruction sat in the middle of the entry, after the signs and risk factors"
      judgement: wrong
      source_says: "Warning: If you're pregnant and your waters have broken and you feel the umbilical cord in your vagina, call triple zero (000) and ask for an ambulance. ... While you're waiting for the ambulance, you may be asked to bring your knees to your chest with your head facing down. This will help relieve pressure on the cord. Stay in this position while waiting for an ambulance"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/umbilical-cord-prolapse
      fixed_to: "'When to get help' moved to the top with the page's wording; the opening paragraph follows under 'What it is'"
    - claim: "(no mention of the other PBB page's different position)"
      judgement: unsupported
      source_says: "PBB Waters breaking early: if you feel something in your vagina after your waters break, call an ambulance and get down on your hands and knees with your bottom in the air."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/waters-breaking-early
      fixed_to: "added a sentence crediting that page's hands-and-knees position, and that the two pages differ"
    - claim: "weighs under 2.5 kg (as a baby's trait)"
      judgement: wrong
      source_says: "You're more likely to have an umbilical cord prolapse if: you've had a baby that weighs less than 2.5kg at birth ... different pelvic structure; the chance increases if your baby is not head down, has birth differences, has a very long cord, is the second twin, is premature"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/umbilical-cord-prolapse
      fixed_to: "risk factors rewritten to the page's two lists (adds one or more babies before, different pelvic structure, birth differences)"
    - claim: "they may suggest you stay in hospital from 37 weeks (if lying sideways or position changes)"
      judgement: unsupported
      source_says: "can't be prevented; may recommend staying in hospital from 37 weeks if your baby is lying on its side or its position changes ... if the cord is felt before the waters break, your doctor will not break your waters if possible"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/umbilical-cord-prolapse
      fixed_to: "reworded to the page, plus the 'won't break your waters' line"

