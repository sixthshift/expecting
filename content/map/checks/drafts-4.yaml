      fixed_to: "'which you may be offered at 28 and 34 weeks ... usually prevent it'; body 'You may be offered an injection of anti-D immunoglobulin, a blood product made from plasma.'"
- id: pre-eclampsia
  file: content/drafts/pre-eclampsia.md
  verdict: fix
  problems:
    - claim: "When to get help gave only 'See your midwife, doctor or pregnancy care provider straight away' for the symptoms"
      judgement: wrong
      source_says: "Warning on the page: 'Seek medical attention urgently or go to your local emergency department if you have symptoms such as a severe headache, blurred vision or sudden swelling of your hands, feet or face or pain under your ribcage.' (the 'see ... straight away' level for any symptom is also on the page)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/pre-eclampsia
      fixed_to: "Added the urgent / emergency department line above the straight-away list; both levels kept distinct."
- id: when-to-go-to-hospital
  file: content/drafts/when-to-go-to-hospital.md
  verdict: fix
  problems:
    - claim: "'When to get help straight away' listed: any change in baby's movements, a fever, or contractions before 37 weeks: go to hospital or the birth centre"
      judgement: wrong
      source_says: "Pregnancy, Birth and Baby lists these in its ordinary 'You should go to hospital or the birth centre if' list, with no 'straight away'."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/going-to-hospital
      fixed_to: "Moved into the 'go to the hospital or birth centre if' list, with waters breaking and bleeding as listed there too."
    - claim: "The fluid is green, brown or blood-coloured: call your midwife or doctor for urgent advice."
      judgement: wrong
      source_says: "'If your water breaks and the fluid is green, brown or blood coloured, call your doctor, midwife or birthing unit immediately for advice, or go to hospital.' Before 37 weeks: 'contact your midwife or doctor and go to the hospital.' Also call immediately if waters break and they smell bad, temp 37.5 C or above, unwell, change in movements."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/giving-birth-waters-breaking
      fixed_to: "Rewritten to the page's wording; added waters before 37 weeks and the call-immediately signs."
    - claim: "If you've had a baby before, expect this labour to be quicker, and plan to leave sooner."
      judgement: wrong
      source_says: "'If you have had a baby before then you can expect that this labour to be quicker and may help you to plan when to go to hospital.'"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/preparing-for-birth/going-to-hospital
      fixed_to: "... you can expect this labour to be quicker, which may help you plan when to go to hospital."
