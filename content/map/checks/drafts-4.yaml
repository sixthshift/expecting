# Fact-check of drafts batch 4 (travel, care, tests, labour), 2026-10-29.
# Each draft's claims were checked against the pages in its sources (fetched that day);
# fixes were made in the draft itself. All 21 carry `checked: 2026-10-29`.
- id: travel-in-pregnancy
  file: content/drafts/travel-in-pregnancy.md
  verdict: ok
  problems: []
- id: airline-pregnancy-limits
  file: content/drafts/airline-pregnancy-limits.md
  verdict: fix
  problems:
    - claim: "From 28 weeks Qantas and Virgin Australia want a letter (summary and body)"
      judgement: wrong
      source_says: "Qantas: 'After 28 weeks, you need to carry a certificate or letter'. Virgin: 'If you are 28 weeks pregnant or more, you will be required to carry a letter'."
      url: https://www.qantas.com/en-au/travel-information/specific-needs-assistance/fitness-to-fly
      fixed_to: "Qantas after 28 weeks, Virgin Australia from 28 weeks, in summary and body"
    - claim: "Overseas airlines can be stricter"
      judgement: unsupported
      source_says: "Smartraveller: 'Most airlines won't let you fly beyond 28 weeks of pregnancy.' (nothing about overseas airlines specifically)"
      url: https://www.smartraveller.gov.au/before-you-go/health/pregnancy
      fixed_to: "Other airlines can be stricter."
    - claim: "Week limits table (36/32 weeks for 4 hours or more; 40/36 for under 4 hours), 10-day letter (Virgin), Qantas form 5 days before departure, RANZCOG not recommended beyond 36 weeks"
      judgement: ok
      source_says: "Confirmed exactly on the Qantas and Virgin pages as fetched 2026-10-29; Qantas: 'only our minimum requirements'; RANZCOG: 'Travel beyond 36 weeks' gestation is not recommended'."
      url: https://www.virginaustralia.com/au/en/travel-info/specific-travel/specific-needs-assistance/flying-while-pregnant/
      fixed_to: "unchanged"
