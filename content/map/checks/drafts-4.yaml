- id: seatbelt-position
  file: content/drafts/seatbelt-position.md
  verdict: fix
  problems:
    - claim: "Go to hospital straight away after any injury if the baby is moving less than normal, or you have vaginal bleeding or pain in your abdomen."
      judgement: wrong
      source_says: "'If your injury is less urgent, you can contact your doctor first. However, as with any injury, you should go to hospital if: your baby is not moving as much as normal; you have vaginal bleeding; you have pain in your abdomen' (no 'straight away'; the 000 level is separate and already in the draft)."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy
      fixed_to: "Go to hospital after any injury if ..."
    - claim: "Driving seat as far back from the wheel as possible reduces airbag impact (RANZCOG/MotherSafe wording not in listed sources)"
      judgement: unsupported
      source_says: "RANZCOG: 'Move your seat back from the steering wheel as much as is safe to do so to reduce the risk of airbag impact.'"
      url: https://ranzcog.edu.au/womens-health/patient-information-resources/travelling-during-pregnancy
      fixed_to: "RANZCOG page added to sources"
