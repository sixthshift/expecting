- id: term-stillbirth
  file: content/drafts/term-stillbirth.md
  verdict: fix
  problems:
    - claim: "In Australia, losing a baby before 20 weeks is a miscarriage; the birth of a baby without signs of life after 20 weeks is a stillbirth. The AIHW and Fair Work definitions also count a baby of 400 grams or more."
      judgement: wrong
      source_says: "PBB glossary: 'Stillbirth is the birth of a baby without signs of life after 20 weeks'; 'Miscarriage is the loss of a baby before 20 weeks'. AIHW: 'fetal death (stillbirth) ... 20 or more completed weeks of gestation or of 400 grams or more birthweight'. Fair Work: 'at least 400 grams or reached at least 20 weeks gestation'. BDM Victoria: 'carried in the womb for 20 weeks or more, or weighing over 400 grams'."
      url: https://www.aihw.gov.au/reports-data/population-groups/mothers-babies/glossary
      fixed_to: "each source credited with its own definition; BDM Victoria added"
    - claim: "summary: that line decides whether the birth is registered and what leave applies"
      judgement: unsupported
      source_says: "BDM Victoria: stillbirth registration is required by law; an early pregnancy loss 'can't be registered' but can have a recognition certificate. Fair Work: stillbirth gives up to 12 months' unpaid parental leave. No page says the 20-week line decides 'what leave applies'."
      url: https://www.bdm.vic.gov.au/register-birth-baby-who-died
      fixed_to: "summary reworded to the registration point only"
- id: card-anterior-placenta
  file: content/drafts/card-anterior-placenta.md
  verdict: fix
  problems:
    - claim: "summary: call straight away about any change"
      judgement: wrong
      source_says: "PBB: 'if you are concerned about your baby's movement pattern or notice a decrease in their movements, contact your midwife, hospital birth unit or doctor immediately. Do not wait until the next day.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/baby-movements-during-pregnancy
      fixed_to: "call immediately if you're concerned or notice a decrease"
