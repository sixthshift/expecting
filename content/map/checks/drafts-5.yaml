      source_says: "Beyond Blue talk-to-a-counsellor: 'open 24/7'; PBB helplines list: 'Speak to a trained mental health professional'; PBB depression page: GP, midwife or obstetrician may refer to psychologist, psychiatrist, social worker; PANDA: GP 'non-judgemental support, assessment, diagnosis, ongoing care and treatment'. Beyond Blue talk-to-a-counsellor, PBB depression and PANDA contact pages added to sources. Gidget 1300 851 758, 13YARN 13 92 76 (24/7), Lifeline 13 11 14, PANDA 1300 726 306 confirmed on loaded pages."
