  verdict: fix
  problems:
    - claim: "summary: ... or waters breaking before 37 weeks, means calling immediately"
      judgement: wrong
      source_says: "If your waters break before 37 weeks, contact your midwife or doctor and go to the hospital. (Green/brown/blood coloured: call ... immediately for advice, or go to hospital.)"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/giving-birth-waters-breaking
      fixed_to: "separated: colour = calling immediately; before 37 weeks = contact midwife or doctor and go to hospital"
    - claim: "Notice the smell too: a bad smell is a warning sign."
      judgement: unsupported
      source_says: "Only 'your waters smell bad' in the call-immediately list (kept there)."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/giving-birth-waters-breaking
      fixed_to: cut
    - claim: "they can check with a speculum examination, or test the fluid for amniotic proteins"
      judgement: wrong
      source_says: "will examine your vagina using a speculum. If they are still not sure, they can check for amniotic fluid proteins"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/giving-birth-waters-breaking
      fixed_to: "speculum first; if still not sure, test for proteins"
    - claim: "24 to 96 hours labour / 24 to 48 hours birth"
      judgement: ok
      source_says: "most people will go into labour naturally within 24 to 96 hours ... Most people will give birth within 24 to 48 hours of their waters breaking (both PBB, kept as given)"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/giving-birth-waters-breaking
      fixed_to: unchanged
