  file: content/weeks/9.md
  verdict: ok
- id: week-10
  file: content/weeks/10.md
  verdict: fix
  problems:
    - claim: "the window for the combined test closes at about 13 weeks"
      judgement: unsupported
      source_says: "Item first-trimester-screening (checked): blood test between 9 and 13 weeks, scan between 11 weeks and 13 weeks 6 days. The week 10 page says a scan around 12 weeks is often recommended and the tests are optional."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-10
      fixed_to: "blood test 9 to 13 weeks, scan 11 weeks to 13 weeks 6 days"
  restored:
    - claim: "size length 2.5 cm (new)"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-week-by-week
      source_says: "Pregnancy week 10 The embryo is now known as a fetus and is about 2.5 cm in length."
- id: week-11
  file: content/weeks/11.md
  verdict: fix
  problems:
    - claim: "this is the last comfortable week to [decide]"
      judgement: unsupported
      source_says: "Item first-trimester-screening: blood test 9 to 13 weeks, scan 11 weeks to 13 weeks 6 days."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-11
      fixed_to: "the actual windows"
    - claim: "Vomiting that is hard to live with, or discharge ... are worth a call."
      judgement: wrong
      source_says: "\"If nausea or vomiting is causing you significant discomfort ... you should see your doctor.\" Discharge with smell, colour, itching or pain: \"see your doctor or midwife\"."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-11
      fixed_to: "see your doctor / see your doctor or midwife (source wording)"
  # note 11 has no ## fix to baby part; checked added (all else ok)
- id: week-12
  file: content/weeks/12.md
  verdict: fix
  problems:
    - claim: "source: raisingchildren.net.au (refuses fetches)"
      judgement: unsupported
      source_says: "re-checked against the Pregnancy, Birth and Baby week 12 page"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-12
      fixed_to: "source switched; text rewritten to that page"
    - claim: "its chest makes practice breathing movements. Twenty tiny tooth buds sit in the gums. from here it is mostly growing."
      judgement: unsupported
      source_says: "Kidneys and digestive system are starting to function; swallowing the amniotic fluid and passing it back out as urine."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-12
      fixed_to: "cut; title 'Fully formed, and practising' now 'Fully formed'"
    - claim: "end of the first trimester; sickness and tiredness start to ease; a bump usually isn't showing; first time you'll see the baby move; many couples start telling people after the scan"
      judgement: unsupported
      source_says: "\"less pressure on your bladder ... less tired ... more energy\"; pelvic floor exercises; routine antenatal visits start around week 12; attend even when well."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-12
      fixed_to: "rewritten to the page"
    - claim: "size length 6, weight 18"
      judgement: unchecked
      source_says: "Only 'plum' (infographic); no length or weight."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/how-big-is-your-baby-infographic
      fixed_to: "kept, unchecked; 'a plum' ok"
  restored:
    - claim: "Teeth are budding inside the gums."
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-week-by-week
      source_says: "Pregnancy week 11 Teeth are budding inside the gums. (given at week 11, not 12; the number twenty is not given)"
    - claim: "For most people morning sickness resolves by weeks 12 to 14, though 1 in 5 have it into the second trimester."
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-morning-sickness
      source_says: "For most women, morning sickness begins around the fourth week of pregnancy and resolves by weeks 12 to 14. However, 1 in 5 women endures morning sickness into their second trimester"
  not_restored:
    - claim: "practice breathing movements"
      reason: "Better Health puts breathing movements at week 24, PBB at week 28; no page puts them at week 12"
    - claim: "a bump usually isn't showing yet"
      reason: "no source; Better Health says only 'your pregnancy may be visible' in the second trimester"
    - claim: "size length 6, weight 18, like a plum"
      reason: "no official Australian page gives week-12 length or weight; size removed (the schema needs a length for 'like')"
