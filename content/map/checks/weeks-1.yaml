      source_says: "re-checked against the Pregnancy, Birth and Baby week 20 page"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-20
      fixed_to: "source switched; text rewritten to that page"
    - claim: "like: a banana"
      judgement: wrong
      source_says: "20 weeks - mango"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/how-big-is-your-baby-infographic
      fixed_to: "a mango"
    - claim: "size length 16, weight 320"
      judgement: unchecked
      source_says: "No length or weight on any page loaded."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/how-big-is-your-baby-infographic
      fixed_to: "kept, unchecked"
    - claim: "The heart beats 120 to 160 times a minute"
      judgement: unsupported
      source_says: "Not on the page (it gives 150-180 at weeks 7 and 10)."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-20
      fixed_to: "cut"
    - claim: "the baby is moving a lot; first flutters often arrive around now; backache, hip ache; kicks you can feel from the outside a few weeks after; morphology scan is due about now"
      judgement: unsupported
      source_says: "Fundus roughly level with the belly button; breathless lying on back; round ligament pain; morphology scan can be done anytime between about 18 and 22 weeks."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-20
      fixed_to: "rewritten to the page"
  restored:
    - claim: "You will start to feel your baby's movements between 16 and 24 weeks of pregnancy, and every baby is different."
      url: https://www.saferbaby.org.au/preventative-steps/your-babys-movements-matter/
      source_says: "You will start to feel your baby movements between 16 and 24 weeks of pregnancy, regardless of where your placenta lies. Every baby is different."
  not_restored:
    - claim: "The heart beats 120 to 160 times a minute"
      reason: "only clinical CTG guidelines (NSW, WA, SA, RANZCOG) give a baseline of 110 to 160 bpm, for monitoring, not a week-20 fact for parents"
    - claim: "size length 16, weight 320"
      reason: "Better Health gives 21 cm 'in length' at week 20 with no weight, and its 24-week and 36-week figures are crown-to-heel, so 21 cm cannot be labelled head to bottom; size removed"
    - claim: "kicks you can feel from the outside a few weeks after the first flutters"
