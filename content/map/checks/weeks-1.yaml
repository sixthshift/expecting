# Fact-check of the week notes content/weeks/1.md to 21.md, 2026-10-29.
# Each claim was read against the cited Pregnancy, Birth and Baby page (fetched with curl), plus the
# infographic https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/how-big-is-your-baby-infographic
# (fruit comparisons only: it gives no lengths or weights) and the already-checked items in content/items/.
# `checked:` added to a note only where every claim is ok or fixed. Notes 6, 7, 12 and 20 keep size
# figures (mm/cm, g) that no page gives, so they stay unchecked.
- id: week-1
  file: content/weeks/1.md
  verdict: fix
  problems:
    - claim: "week 1 is that period: it happens before conception ... Nothing has started, but the count has."
      judgement: unsupported
      source_says: "pregnancy and due date is typically calculated according to the first day of your last period, before conception has even happened."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-1-4
      fixed_to: "reworded to the source's counting statement"
    - claim: "This is a normal period. There is nothing to notice ... most people only work out afterwards which week this was."
      judgement: unsupported
      source_says: "You probably won't notice any signs that you're pregnant just yet."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-1-4
      fixed_to: "You probably will not notice any signs of pregnancy yet"
    - claim: "a good moment to find out together how your GP and the local hospitals handle pregnancy care"
      judgement: unsupported
      source_says: "\"If the baby is planned, you might consider seeing your doctor to talk about genetic screening or to be tested for any sexually transmitted infections\"; no alcohol and no smoking are best."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-1-4
      fixed_to: "doctor visit before conception, no alcohol, no smoking (as the source says)"
- id: week-2
  file: content/weeks/2.md
  verdict: fix
  problems:
    - claim: "The egg that will be fertilised is maturing, and that is all."
      judgement: unsupported
      source_says: "\"Your pregnancy began when your egg was fertilised by sperm\" (nothing about maturing)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-1-4
      fixed_to: "cut; kept the counting statement"
    - claim: "\"no test that can tell you anything\" / \"the first visit, once there is a positive test, is a GP appointment; it is where the care options get laid out\""
      judgement: unsupported
      source_says: "\"Your baby will have the best possible start in life if you are healthy when you conceive\" (diet, exercise, no alcohol, no smoking); the GP visit is described on the week 5 and 6 pages, not here."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-1-4
      fixed_to: "partner part rewritten to the healthy-before-conception advice"
- id: week-3
  file: content/weeks/3.md
  verdict: fix
  problems:
    - claim: "It is a cluster of cells, far too small to see without a microscope."
      judgement: unsupported
      source_says: "Over the next 4 or 5 days, your fertilised egg continues to divide and travel down the fallopian tube towards your uterus."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-1-4
      fixed_to: "cut"
    - claim: "Your period is not due for another week, and a pregnancy test cannot tell you anything this early."
      judgement: unsupported
      source_says: "\"The first sign for many women is that they miss their period at the end of week 4.\" Test from the day after a missed period (week 5 page)."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-5
      fixed_to: "reworded to the missed period at the end of week 4 and a test the day after"
    - claim: "This is the week it begins; the first visit later on is a GP appointment"
      judgement: unsupported
      source_says: "The page covers weeks 1 to 4 together and gives no week for conception; it says nothing of a first visit."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-1-4
      fixed_to: "'Around now it begins'; visit sentence cut"
- id: week-4
  file: content/weeks/4.md
  verdict: ok
  problems:
    - claim: "Expect a mix of feelings on both sides"
      judgement: unsupported
      source_says: "\"you might be feeling all kinds of different emotions, from happiness and excitement, to worry and fear\" (about the person who missed the period)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-1-4
      fixed_to: "Expect a mix of feelings"
  # Test the day after a missed period, and seeing a doctor to confirm: week 5 page (loaded).
- id: week-5
  file: content/weeks/5.md
  verdict: fix
  problems:
    - claim: "the care options, public, private or a midwifery group practice"
      judgement: unsupported
      source_says: "They may also be able to help you understand the different models of maternity care available to you"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-5
      fixed_to: "the models of maternity care available, and an early dating scan"
- id: week-6
  file: content/weeks/6.md
  verdict: fix
  problems:
    - claim: "source: raisingchildren.net.au (refuses fetches)"
      judgement: unsupported
      source_says: "re-checked against the Pregnancy, Birth and Baby week 6 page"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-6
      fixed_to: "source switched"
    - claim: "the neural tube is closing; the heart has started beating"
      judgement: unsupported
      source_says: "If you have an ultrasound in the sixth week, you may be able to see your baby's heart beating."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-6
      fixed_to: "reworded to the source (double in size, tadpole, buds, jaw, eyes, vertebrae, heart on ultrasound)"
    - claim: "morning sickness often starts around this week"
      judgement: unsupported
      source_says: "Not all women experience morning sickness ... at any time of day ... usually clears up by about 3 months into pregnancy."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-6
      fixed_to: "cut"
    - claim: "If you can't keep fluids down, call your GP or midwife today"
      judgement: wrong
      source_says: "If you're feeling very unwell or you have severe vomiting that doesn't stop, talk to your doctor or midwife."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-6
      fixed_to: "talk to your doctor or midwife (source wording)"
    - claim: "cooking smells, snacks; many people wait until after the 12-week scan"
      judgement: unsupported
      source_says: "\"Try to eat small frequent meals\"; see your doctor to confirm with a blood test; the week 13 page says many people share the news in the second trimester."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-13
      fixed_to: "small frequent meals, walking, book the GP, wait until the second trimester"
    - claim: "size length 0.5 (mm/cm)"
      judgement: unchecked
      source_says: "Only 'lentil seed' (infographic); no length given."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/how-big-is-your-baby-infographic
      fixed_to: "kept, unchecked; like changed to 'a lentil seed'"
  restored:
    - claim: "Not everyone has morning sickness, but it is more likely between weeks 6 and 14"
      url: https://www.healthdirect.gov.au/morning-sickness
      source_says: "You are more likely to have morning sickness between weeks 6 and 14 of pregnancy."
    - claim: "size length 0.3 cm (3 mm), a lentil seed"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-week-by-week
      source_says: "Pregnancy week 6 The baby is now known as an embryo. It is around 3 mm in length."
  not_restored:
    - claim: "the neural tube is closing"
      reason: "Better Health week 5 says only 'the evolving neural tube will eventually become the central nervous system'; nothing on closing"
- id: week-7
  file: content/weeks/7.md
  verdict: fix
  problems:
    - claim: "About 1 cm long."
      judgement: unchecked
      source_says: "No length on the page; infographic says blueberry."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-7
      fixed_to: "sentence cut from the text; size.length 1 kept in frontmatter, unchecked"
    - claim: "Constipation is common about now."
      judgement: wrong
      source_says: "Some women have problems with constipation at this stage."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-7
      fixed_to: "Some people have problems with constipation at this stage."
    - claim: "The dating scan is usually arranged from that visit"
      judgement: unsupported
      source_says: "Dating scan item: most often done between 6 and 8 weeks; week 5 page: the doctor discusses the option of an early dating ultrasound."
      url: https://www.pregnancybirthbaby.org.au/dating-scan
      fixed_to: "ask about an early dating scan; most often 6 to 8 weeks"
  not_restored:
    - claim: "About 1 cm long; size length 1"
      reason: "no official Australian page gives a week-7 length (Better Health jumps from 3 mm at week 6 to 1.3 cm at week 8); size removed, and with it 'like', since the schema needs a length"
- id: week-8
  file: content/weeks/8.md
  verdict: ok
  restored:
    - claim: "size length 1.3 cm (new)"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-week-by-week
      source_says: "Pregnancy week 8 The embryo is now around 1.3 cm in length."
