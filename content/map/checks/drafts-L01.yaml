- id: stretch-marks
  file: content/drafts/stretch-marks.md
  verdict: fix
  problems:
    - claim: "Under '## See your doctor or midwife': a very itchy rash in or around stretch marks can be polymorphic eruption of pregnancy (1 in 160, goes away 4 to 6 weeks after the birth)"
      judgement: wrong
      source_says: "Under 'Complications of stretch marks': Sometimes a very itchy rash can start in or around stretch marks on your abdomen. This is called polymorphic eruption of pregnancy and it affects 1 in 160 pregnant women. It will go away 4 to 6 weeks after your baby is born. (No advice to see a doctor is given for it; the see-your-doctor line is only 'If you are concerned about stretch marks ... talk to your doctor or midwife at your next antenatal appointment'.)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/stretch-marks
      fixed_to: "Moved to a closing paragraph of 'What's usual' with no advice attached; the See-your-doctor heading keeps only the antenatal-appointment line."
- id: brain-fog
  file: content/drafts/brain-fog.md
  verdict: fix
  problems:
    - claim: "Baby brain is real enough to have a name."
      judgement: unsupported
      source_says: "Brain fog — Pregnancy can affect brain function and memory, especially in the third trimester. This is sometimes known as 'brain fog'. (The page does not say 'baby brain'.)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/changes-to-your-body-during-pregnancy
      fixed_to: cut
    - claim: "Tiredness can make it worse (also in summary: 'and tiredness makes it worse'); Pregnancy, Birth and Baby lists reduced concentration and alertness among the effects of fatigue."
      judgement: unsupported
      source_says: "Possible complications [of severe or ongoing tiredness]: increased risk of accidents or falls due to reduced concentration and alertness. (Nothing links tiredness to brain fog.)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/dealing-with-fatigue-during-your-pregnancy
      fixed_to: "lists reduced concentration and alertness among the possible complications of severe or ongoing tiredness; summary clause cut"
