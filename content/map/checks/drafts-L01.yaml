- id: hemp-seeds
  file: content/drafts/hemp-seeds.md
  verdict: fix
  problems:
    - claim: "summary: low-THC hemp seed foods are legal and not a drug"
      judgement: unsupported
      source_says: "The Food Standards Code was amended in 2017 to permit the sale of low THC hemp seed foods. (The page does not call hemp 'not a drug'; it says hemp has no, or very low levels of, THC.)"
      url: https://www.foodstandards.gov.au/consumer/our-safe-food-supply/hemp-seeds-food
      fixed_to: "low-THC hemp seed foods are permitted for sale"
    - claim: "Cannabis products are a different question."
      judgement: unsupported
      source_says: "Page says nothing about cannabis products in pregnancy."
      url: https://www.foodstandards.gov.au/consumer/our-safe-food-supply/hemp-seeds-food
      fixed_to: cut
- id: raspberry-leaf
  file: content/drafts/raspberry-leaf.md
  verdict: fix
  problems:
    - claim: "If you'd like to try it, check with your doctor or midwife first."
      judgement: unsupported
      source_says: "Raspberry leaf is only said to be likely safe and not shown to help. The check-first advice is general to herbal teas: 'It's always a good idea to check with your doctor or pharmacist before you drink any herbal teas ...'; 'ask your doctor or midwife for advice on how to do so safely'."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/herbal-teas-during-pregnancy-and-breastfeeding
      fixed_to: "Credited to Pregnancy, Birth and Baby as general advice for any herbal tea (doctor or pharmacist; doctor or midwife for advice on drinking them safely)."
    - claim: "if you're unsure about a product, especially tablets, ask your doctor, midwife or pharmacist"
      judgement: unsupported
      source_says: "Large amounts of some herbs may be harmful during pregnancy. (Nothing on tablets in the listed source; the MotherSafe herbal PDF text could not be read for raspberry leaf.)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/herbal-teas-during-pregnancy-and-breastfeeding
      fixed_to: "Large amounts of some herbs may be harmful during pregnancy."
- id: water
  file: content/drafts/water.md
  verdict: fix
  problems:
    - claim: "Pregnancy, Birth and Baby's guide says 7 to 9 glasses a day (cited sources: foods-to-avoid, healthy-diet pages)"
      judgement: unsupported
      source_says: "Neither cited page gives a glass count. Appetite page: 'your body also needs plenty of water (7 to 9 glasses each day)'; constipation page: 'drink at least 7 to 8 glasses a day and even more in hot or humid weather' (fluids)."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/appetite-changes-and-food-aversions-during-pregnancy
      fixed_to: "Both figures stated, each credited; the two pages added to sources."
- id: nasal-sprays
  file: content/drafts/nasal-sprays.md
  verdict: fix
  problems:
    - claim: "summary: decongestant sprays ... no more than 3 days at a time"
      judgement: wrong
      source_says: "KEMH: not more than three days at a time. PBB: not longer than 3 days. MotherSafe cold factsheet: 'should not be used for longer than 5 days'."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/docs/Cold%20in%20pregnancy%20and%20breastfeeding%20.pdf
      fixed_to: "Summary now gives KEMH and PBB at 3 days and MotherSafe at 5; body credits each."
    - claim: "Oral decongestants such as pseudoephedrine or phenylephrine are not recommended in pregnancy."
      judgement: wrong
      source_says: "KEMH: not recommended in pregnancy. PBB: 'You should not use oral decongestants such as phenylephrine.' MotherSafe: no conclusive data that they're harmful in the first trimester; do not use in the 2nd and 3rd trimester if you have high blood pressure."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/docs/Cold%20in%20pregnancy%20and%20breastfeeding%20.pdf
      fixed_to: "Three sources stated separately, each credited."
