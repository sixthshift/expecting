- id: bushfire-smoke
  file: content/drafts/bushfire-smoke.md
  verdict: fix
  problems:
    - claim: "(no official page on staying indoors in smoke; drafter found none)"
      judgement: unsupported
      source_says: "Queensland Government: 'When smoke is in the air, but a fire is not directly threatening you, stay indoors and close all windows and doors.' NSW Health: 'If you are pregnant, you may be more sensitive to the effects of smoke. Brief exposure to bushfire smoke during pregnancy is unlikely to affect you or your baby. If you are continuously exposed to smoke for more than one week, it may increase the risk of outcomes such as preterm birth, lower birth weight and developing gestational diabetes.' Steps: talk to your doctor or midwife; take steps to reduce your exposure to all sources of smoke during pregnancy."
      url: https://www.qld.gov.au/health/staying-healthy/environmental/after-a-disaster/bushfires/bushfire-smoke-and-your-health ; https://www.health.nsw.gov.au/environment/bushfire/Pages/know-high-risk.aspx
      fixed_to: "Both pages added to sources; stay-indoors bullet, NSW Health sensitivity/one-week wording and reduce-exposure bullet added; summary updated. Verdict stays limit. No EPA page found that is pregnancy-specific."
- id: farm-animals-and-lambing
  file: content/drafts/farm-animals-and-lambing.md
  verdict: fix
  problems:
    - claim: "Talk to your doctor before working with farm animals."
      judgement: unsupported
      source_says: "No readable official Australian page I could load says pregnant people should stay away from lambing/birthing animals. healthdirect Q fever: pregnant = higher chance of chronic Q fever; Q fever in pregnancy can lead to miscarriage, stillbirth, premature birth, low birth weight. NSW Health Q fever: breathing in bacteria 'while birthing, slaughtering or butchering infected animals (especially cattle, sheep or goats). These activities carry a very high risk of infection.' NSW Health Q fever page also lists pregnant women among those more at risk of complications."
      url: https://www.health.nsw.gov.au/Infectious/factsheets/Pages/q-fever.aspx
      fixed_to: "Lede reframed honestly: official pages we could read give no pregnancy-specific advice on lambing or farm work, so ask your doctor or midwife; NSW Health 'very high risk' wording and source added. Verdict stays ask."
    - claim: "Don't drink unpasteurised milk."
      judgement: wrong
      source_says: "Drinking unpasteurised (unsterilised) milk may also increase your chance of developing Q fever."
      url: https://www.healthdirect.gov.au/conditions/bacterial-infections/q-fever
      fixed_to: "healthdirect says drinking it may also increase your chance of developing Q fever."
    - claim: "(lead found, not loadable) Queensland Health, Darling Downs HHS news item 'Darling Downs and South West communities reminded of the risk of Q fever'"
      judgement: unchecked
      source_says: "Web-search summary only, NOT verified (page blocked automated fetch, Cloudflare; not worked around): reportedly advises pregnant women, or those who may be, to stay away from animals giving birth, recently given birth or aborted; not to help lamb, calve or kid; avoid birth products and contaminated bedding/clothing. Hand-check the page, and if it says this, it is the Australian official source for an avoid verdict."
      url: https://www.darlingdowns.health.qld.gov.au/about-us/our-stories/news/darling-downs-and-south-west-communities-reminded-of-the-risk-of-q-fever
      fixed_to: "not added to the draft; flagged for a human check"
  # UK/Scotland pages (gov.uk, gov.scot) do say to avoid birthing animals (Chlamydia abortus, toxoplasmosis, listeria, Q fever) but are not Australian and were not used.
