- id: dental-work
  file: content/drafts/dental-work.md
  verdict: fix
  problems:
    - claim: "MotherSafe names paracetamol and codeine as first choice; NSAIDs such as ibuprofen are no longer recommended in pregnancy except under medical supervision."
      judgement: wrong
      source_says: "Paracetamol and codeine for acute pain are considered the first choice in pregnancy. NSAIDs such as ibuprofen or diclofenac are no longer recommended in pregnancy and should only be used under medical supervision. Inadvertent use is not considered to be of concern."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/DentaltreatmentpregbreastNov2020.pdf
      fixed_to: "MotherSafe wording restored, with the inadvertent-use line and MotherSafe phone numbers"
    - claim: "X-rays: MotherSafe calls dental x-rays safe, with a lead apron; PBB says generally aren't recommended..."
      judgement: wrong
      source_says: "MotherSafe: dental X-rays are safe during pregnancy as the dose to the unborn baby is considered insignificant; usual practice is a lead apron. PBB: generally x-rays are not recommended during pregnancy, especially in the first trimester; however most dental x-rays are safe as they are very small radiation doses."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/looking-after-your-teeth-during-pregnancy
      fixed_to: "each source credited with its own wording"
    - claim: "ideally early; second trimester is often easiest"
      judgement: wrong
      source_says: "See your dentist at least once, ideally in the first or second trimester ... You might find the best time is the second trimester."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/looking-after-your-teeth-during-pregnancy
      fixed_to: "PBB wording"
