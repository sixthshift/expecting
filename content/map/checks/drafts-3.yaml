- id: nicotine-replacement
  file: content/drafts/nicotine-replacement.md
  verdict: fix
  problems:
    - claim: "Nicotine replacement therapy (NRT) is safer than smoking, but can still be harmful to the baby. It still delivers nicotine, but not the other harmful chemicals and carbon monoxide in cigarette smoke."
      judgement: wrong
      source_says: "PBB: 'NRT products are safer than smoking, but they can still be harmful to your baby.' MotherSafe: 'Although research is somewhat limited, it is generally felt that using NRT in pregnancy is likely to be less harmful than smoking cigarettes' (it contains no other chemicals or carbon monoxide); 'NRT should be used with medical advice and support.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/smoking-and-pregnancy
      fixed_to: "two views stated separately, each credited to its source"

- id: vaping
  file: content/drafts/vaping.md
  verdict: fix
  problems:
    - claim: "Adults can buy vapes of 20 mg/mL nicotine or less after talking with the pharmacist"
      judgement: unsupported
      source_says: "On 1 July 2024 vapes became pharmacy-only; from 1 October 2024, people 18 years and older can buy vapes with 20 mg/mL or less without a prescription from participating pharmacies, after talking with the pharmacist, where state and territory laws allow. Higher concentrations need a prescription. (Page still current 2026-10-29; TGA vaping hub confirms the Act commenced 1 July 2024.)"
      url: https://www.health.gov.au/topics/smoking-vaping-and-tobacco/about-vaping
      fixed_to: "date (1 October 2024), age (18+), 'participating pharmacies' and 'without a prescription' added; law otherwise unchanged and no 'as of' date needed"

