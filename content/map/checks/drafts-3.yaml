- id: paracetamol
  file: content/drafts/paracetamol.md
  verdict: fix
  problems:
    - claim: "The usual dose is 2 × 500 mg tablets every 4 to 6 hours, and no more than 8 × 500 mg tablets (4 g) in 24 hours."
      judgement: unsupported
      source_says: "The recommended dose is 2 x 500 mg tablets or capsules every 4-6 hours (but no more than 8 x 500 mg tablets or capsules in 24 hours)."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Pain%20in%20Pregnancy.pdf
      fixed_to: "'usual' changed to 'recommended'; doses unchanged and confirmed (KEMH also says no more than 8 x 500 mg in 24 hours)"

- id: ibuprofen-and-nsaids
  file: content/drafts/ibuprofen-and-nsaids.md
  verdict: fix
  problems:
    - claim: "Avoid them unless your doctor tells you otherwise."
      judgement: unsupported
      source_says: "Non-steroidal anti-inflammatory drugs (NSAIDs), such as ibuprofen and aspirin should be avoided during pregnancy unless advised by your doctor. (healthdirect, Medicines during pregnancy); the cited ibuprofen page says only 'generally not recommended', MotherSafe 'no longer recommended ... only under medical supervision'"
      url: https://www.healthdirect.gov.au/medicines/medicines-during-pregnancy
      fixed_to: "wording kept; healthdirect Medicines during pregnancy added to sources: because it is the page that says 'avoided unless advised by your doctor'"

- id: antibiotics
