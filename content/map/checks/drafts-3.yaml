      judgement: unsupported
      source_says: "From week 28 of your pregnancy, it is important that you sleep on your side to help reduce your risk of stillbirth. (PBB); RANZCOG: 'The best position to sleep ... particularly after 28 weeks, is on your side.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/sleep-during-pregnancy
      fixed_to: "added PBB's 'important ... to help reduce your risk of stillbirth'. Red Nose / Safer Baby Bundle pages returned 403 / 404 and could not be loaded, so not added. Verdict avoid kept."

