      judgement: unsupported
      source_says: "UTIs are the most common bacterial infection in pregnancy (not 'the commonest reason for antibiotics')"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/urinary-tract-infections-utis-during-pregnancy
      fixed_to: "A common reason in pregnancy is a urinary tract infection (UTI), the most common bacterial infection in pregnancy. Note: the sources only cover UTI antibiotics."

