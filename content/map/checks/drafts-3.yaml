- id: falls-and-knocks
  file: content/drafts/falls-and-knocks.md
  verdict: fix
  problems:
    - claim: "summary and opening: needs checking at the nearest hospital, even if you feel fine"
      judgement: unsupported
      source_says: "Even a minor injury ... needs to be assessed. Any injury to the abdomen: go to the nearest hospital. Any trauma to your abdomen: contact your midwife or doctor immediately. If your injury is not an emergency, you can contact your GP, obstetrician or Urgent Care Clinic first; go to hospital if baby moves less, bleeding or abdominal pain. 'Even if you feel fine' is not in the sources."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy
      fixed_to: "summary now 'contact your midwife or doctor immediately or go to the nearest hospital'; 'even if you feel fine' cut; the 'not an emergency' level added as its own bullet. Call 000 warning (pain, firm or tightening uterus, bleeding) confirmed unchanged. Verdict 'ask' kept."

