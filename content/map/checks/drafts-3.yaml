- id: sleeping-on-your-back
  file: content/drafts/sleeping-on-your-back.md
  verdict: fix
  problems:
    - claim: "RANZCOG's 'up to 8 times' figure omitted"
      judgement: unsupported
      source_says: "Recent scientific studies have shown that women who go to sleep on their back have up to an 8 times higher chance of having a stillborn baby compared to women who go to sleep in another position."
      url: https://ranzcog.edu.au/wp-content/uploads/Common-Questions-In-Pregnancy.pdf
      fixed_to: "figure restored, credited to RANZCOG"
