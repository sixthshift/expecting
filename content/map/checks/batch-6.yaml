- id: partner-after-a-loss
  file: mind-and-circumstances.yaml
  verdict: fix
  problems:
    - covers: "partners often park their feelings to be the support, then feel it later, sometimes when planning the next baby (PBB)"
      judgement: unsupported
      source_says: "The cited PBB partners page says partners often feel they need to be strong and can feel isolated, and that thinking about trying again can be difficult. The 'ignore their feelings at first ... may feel sad or anxious later while planning for another baby' wording is on PBB's 'Experiencing a pregnancy loss' page, which is already in the map; kept, and that page added to the sources."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/miscarriage/partners-and-miscarriage
    - covers: "look after yourself as well as her; the bereavement leave is yours too"
      judgement: unsupported
      source_says: "None of the cited pages mentions leave. Fair Work's page on accruing and taking other leave (already in the map) says an employee can take compassionate leave if their spouse or de facto partner has a miscarriage, or if their baby is stillborn. Reworded to compassionate leave and that page added."
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/accruing-and-taking-other-leave-during-parental-leave
    - covers: "support services are for partners: Red Nose, Bears of Hope's dads support, PANDA"
      judgement: unsupported
      source_says: "Red Nose's men's grief page and its dads' group are ok. Bears of Hope's page mentions no dads support (removed). PANDA is not on the cited partner pages."
      url: https://rednose.org.au/grief-and-loss-support/mens-grief/

- id: pregnancy-after-loss
  file: mind-and-circumstances.yaml
  verdict: fix
  problems:
    - covers: "milestones (the week it happened last time) are the hard days"
      judgement: unsupported
      source_says: "Not on the cited pages. The Gidget stillbirth fact sheet (already in the map) says grief can return around due dates, birthdays, anniversaries, medical appointments and pregnancy announcements. Reworded to that and the Gidget page added. (PBB's stress page does name a previous loss as a trigger: ok.)"
      url: https://www.gidgetfoundation.org.au/fact-sheets/stillbirth
    - covers: "extra care exists: early scans, and after stillbirth or neonatal death specialist clinics in many hospitals (PBB); ask for them"
      judgement: wrong
      source_says: "PBB: you may be offered more frequent and flexible appointments, extra ultrasounds to assess growth, genetic testing and so on, and 'specialist clinics throughout Australia'. 'Early scans' and 'many hospitals' are not said."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/stillbirth-and-neonatal-death/pregnancy-after-a-stillbirth-or-neonatal-death
    - covers: "Pink Elephants and Red Nose support pregnancy after loss; Gidget's counselling"
      judgement: unsupported
      source_says: "Pink Elephants runs a Pregnancy After Loss group (ok). No Red Nose page cited mentions pregnancy after loss (removed). Gidget therapy covering fears about a future pregnancy is on the Gidget stillbirth sheet (added)."
      url: https://www.pinkelephants.org.au/page/74/peer-support-private-support-groups

- id: domestic-violence-in-pregnancy
  file: mind-and-circumstances.yaml
  verdict: fix
  problems:
    - covers: "your midwife or doctor may ask whether you feel safe at home; you can tell them, or ask to be seen alone"
      judgement: unsupported
      source_says: "PBB says to talk with your doctor, midwife or a support organisation. Gidget says some midwives and doctors are trained to spot risk, and that if you cannot speak to one directly (for example a controlling partner insists on attending every appointment) you should reach a specialist service. Neither says they will ask, or that you can ask to be seen alone."
      url: https://www.gidgetfoundation.org.au/becoming-a-parent/understanding-family-violence-and-abuse-during-pregnancy
    - covers: "1800RESPECT 1800 737 732, 24/7, free, confidential; text 0458 737 732; online chat and video; interpreters"
      judgement: unsupported
      source_says: "Number, 24/7, free, confidential, text 0458 737 732, online chat and video call are all on the 1800RESPECT home and safety planning pages. Interpreters are not mentioned on any cited page (removed)."
      url: https://1800respect.org.au/

