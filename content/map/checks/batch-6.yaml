    - covers: "the partner in the NICU: often back at work by day, at the cot by night"
      judgement: unsupported
      source_says: "Miracle Babies' dads page says dads may have to follow the baby to the neonatal unit, feel torn leaving the mother, be asked to consent to clinical procedures, and lists things dads can do (talk, sing, read, nappies, cares, helping with the pump). Nothing about work by day and the cot by night. SMS4dads does have NICU message sets."
      url: https://www.miraclebabies.org.au/content/just-for-dads/goajxs
    - covers: "NurtureLine 1300 622 243, 24 hours; PANDA; the hospital social worker"
      judgement: unsupported
      source_says: "The number and 24 hours are ok (free, 7 days a week), and PANDA 1300 726 306 is on the PBB page. No cited page mentions a hospital social worker for NICU families."
      url: https://www.pregnancybirthbaby.org.au/babies/premature-baby/supporting-parents-of-sick-or-premature-babies

