      judgement: wrong
      source_says: "Services Australia: 'If you submit a pre-birth claim for a child before 1 July 2026, your Parental Leave Pay day balance will be 120 days.' The 120-then-130 behaviour applies only to claims submitted before 1 July 2026, which has now passed. Reworded to say so. (Up to 3 months before, 56 days, 14 weeks or 100 days, 52 weeks, 2 years, myGov path and shared FTB claim all ok.)"
      url: https://www.servicesaustralia.gov.au/how-much-parental-leave-pay-you-can-get

