- id: parental-leave-pay
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "the government's payment while you care for a newborn, through Services Australia, not your employer's own leave"
      judgement: wrong
      source_says: "You claim through Services Australia, but 'in many cases your employer will deliver your Parental Leave Pay'; sometimes Services Australia pays directly. Reworded."
      url: https://www.servicesaustralia.gov.au/how-much-parental-leave-pay-you-can-get
    - covers: "can be taken before, during or after employer-paid leave, annual leave or long service leave"
      judgement: unsupported
      source_says: "Not on the three cited pages. The claiming timeframes page (already in the map) says 'You can take Parental Leave Pay before, during or after any paid or unpaid employer funded leave', including maternity or parental leave, annual leave and long service leave. Kept; page added."
      url: https://www.servicesaustralia.gov.au/claiming-timeframes-for-parental-leave-pay
    - covers: "notes: the scheme says the 2026 figure is the last step"
      judgement: unsupported
      source_says: "No cited page says 130 days is the final step. Removed from the notes. (All other figures ok: 130 days from 1 July 2026, 120 from 1 July 2025, 110 from 1 July 2024; $200.94 a day, $1,004.70 a 5-day week in 2026-27, $189.62 and $948.10 in 2025-26; rate follows the financial year of the days, not the birth date; one child's worth of days for multiples; taxable.)"
      url: https://www.servicesaustralia.gov.au/paid-parental-leave-scheme-changes

