# Batch 6: mind-and-circumstances (loss, early birth, NICU, birth trauma, family violence, three cards)
# and money-and-work (Parental Leave Pay, claiming, tests, reserved days, FTB, CCS, Medicare, unpaid leave, notice).
# Checked 2026-10-29 against the pages as they read that day. Fixes applied to the map the same day.
# Services Australia figures (rate $200.94 a day, 130/120/110 days, reserved 20/15/10, income test $186,487 and
# $386,525 for 2025-26, CCS $88,520 and $538,520) all match the map: none has changed since it was written.

- id: stillbirth
  file: mind-and-circumstances.yaml
  verdict: fix
  problems:
    - covers: "the choices (photos, hand and footprints, naming, a funeral is required after 20 weeks, registration)"
      judgement: unsupported
      source_says: "PBB: 'There is no rush to make decisions about a funeral or other memorial options', and the hospital gives information and support about registering the baby's birth and death. Nothing says a funeral is required after 20 weeks. (Notes also said PBB implies registration after 20 weeks; it does not.)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/stillbirth-and-neonatal-death/what-is-a-stillbirth
    - covers: "your body after: milk comes in, bleeding, the six-week check"
      judgement: wrong
      source_says: "PBB: 'Make an appointment to see your doctor about 8 to 12 weeks after giving birth.' Bleeding can last up to 6 weeks, which is not a check. Milk and bleeding are ok."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/stillbirth-and-neonatal-death/your-body-after-stillbirth-or-neonatal-death

- id: when-the-baby-comes-early
  file: mind-and-circumstances.yaml
  verdict: fix
  problems:
    - covers: "before 37 weeks is premature; between 32 and 37 most need special care and do well long-term; before 32 the risks are higher and most need help breathing in a NICU (PBB)"
      judgement: wrong
      source_says: "PBB: babies born between 32 and 37 weeks 'may need care in a special care nursery' and most have no serious long-term problems; before 32 weeks there is a higher risk of health and developmental problems and 'many' (not most) 'may need help breathing' and are usually cared for in a NICU at first."
      url: https://www.pregnancybirthbaby.org.au/babies/premature-baby/premature-baby

- id: baby-in-the-nicu
  file: mind-and-circumstances.yaml
  verdict: fix
