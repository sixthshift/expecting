- id: term-term
  file: content/drafts/term-term.md
  verdict: fix
  problems:
    - claim: "summary: 37–42 weeks in most health pages"
      judgement: unsupported
      source_says: "Only PBB glossary and Better Health Channel give 37–42; PBB due-date page body says full term is 'from 37 weeks' (its FAQ markup says 39–41, not used)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/working-out-your-due-date
      fixed_to: "37–42 weeks in Pregnancy, Birth and Baby and the Better Health Channel"
- id: term-show
  file: content/drafts/term-show.md
  verdict: fix
  problems:
    - claim: "If you notice a show before 37 weeks, contact your midwife or doctor."
      judgement: wrong
      source_says: "Same page, two levels: 'If you notice early signs of labour before 37 weeks, contact your midwife or doctor and let them know' and, under When should I contact, 'Call your midwife or doctor straight away if your contractions start or you have other signs of labour before 37 weeks'"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/giving-birth-early-signs-of-labour
      fixed_to: "both levels, each in its own wording"
