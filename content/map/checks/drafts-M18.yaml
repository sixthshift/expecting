- id: viability-and-prematurity
  file: content/drafts/viability-and-prematurity.md
  verdict: fix
  problems:
    - claim: "Babies born at 37 to 42 weeks are term, and a birth at 42 weeks or more is post-term."
      judgement: wrong
      source_says: "PBB glossary: \"Full term is when the baby is born in weeks 37 to 42\"; AIHW glossary: term birth is \"37–41 completed weeks\", post-term \"42 or more completed weeks\" (sources disagree)"
      url: https://www.aihw.gov.au/reports-data/population-groups/mothers-babies/glossary
      fixed_to: "Pregnancy, Birth and Baby counts full term as weeks 37 to 42; the AIHW counts a term birth as 37–41 completed weeks and a post-term birth as 42 or more completed weeks."
- id: breech
  file: content/drafts/breech.md
  verdict: fix
  problems:
    - claim: "most babies turn head down during the last month"
      judgement: wrong
      source_says: "Most babies turn to a head-down position before the last month of pregnancy"
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/breech-pregnancy
      fixed_to: "most babies turn head down before the last month"
- id: twins-and-multiples
  file: content/drafts/twins-and-multiples.md
