      fixed_to: "PANDA's own hours used (7 days; to 7:30pm Mon-Fri, 9am-4pm weekends); MensLine's differing Mon-Sat noted as superseded"
    - claim: "free psychological sessions (up to 10 a calendar year, subject to Medicare eligibility)"
      judgement: unsupported
      source_says: "Not on the cited free-dads-video page; Gidget's expectant-dads page says 'free* individual psychological therapy ... Up to 10 individual sessions per calendar year ... subject to meeting relevant Medicare eligibility requirements'"
      url: https://www.gidgetfoundation.org.au/becoming-a-parent/pregnancy-for-expectant-dads-and-non-birthing-partners
      fixed_to: "claim kept; that page added to sources"
    - claim: "PANDA lists feeling low ... (signs list)"
      judgement: unsupported
      source_says: "List is on PANDA's signs-and-symptoms page, not the cited support-dads page (it confirms short-tempered/resentful, panic, headaches/muscle tension, sleep and appetite changes)"
