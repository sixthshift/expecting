      source_says: "Two levels kept apart: Royal Women's 'psychiatric emergency ... immediate treatment'; PBB 'arrange a doctor or mental health professional to see them urgently', and separately 'thoughts of self-harm or worried about your baby's safety: nearest hospital emergency department or call triple zero (000) and ask for an ambulance'"
