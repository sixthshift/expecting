# Fact-check of drafted Library entries, batch M08 (care.yaml: 20 entries).
# Checked 2026-10-29 against fresh fetches of every cited page (PBB, RWH Sydney, Royal Women's Melbourne,
# Immunisation Handbook, Services Australia, healthdirect, RANZCOG leaflet PDF).
# Dated sources: the RANZCOG leaflet is (c) 09/2017 and the Royal Women's "Genetic testing in pregnancy" page
# has dated parts (NIPT "only in some specialist centres", "best done in the first 16 weeks"). Nothing in a draft
# rests on those dated parts: RANZCOG is used only for timeless points (screening cannot diagnose and may miss
# babies; only diagnostic tests are definite) and as one credited window for serum screening; the RWH page is used
# only for the 15-20 week window (also given by PBB) and, credited by name, trisomy 18 and "amniocentesis and ultrasound".
# Windows: serum screening PBB Down syndrome page 15-20 (its page markup says 14-20), RWH 15-20, PBB NTD and
# blood-tests pages 14-20, RANZCOG leaflet text 15-20 and table 14-20: all credited in second-trimester-serum-screening.
# Hepatitis C: PBB routine, RWH at risk: both credited in hepatitis-c-screening and first-blood-tests.
# Syphilis: exactly PBB (before 10 weeks; 26-28 weeks; 36 weeks or birth, whichever is earlier; at least 3 tests).
# Cervical screening: "safe during pregnancy and should not be delayed" kept. TIS National 131 450 confirmed.
# Booking "usually about 14 weeks" credited to the Royal Hospital for Women only.
- id: pregnancy-care-without-medicare
  file: content/drafts/pregnancy-care-without-medicare.md
  verdict: fix
  problems:
    - claim: "Cover can include pregnancy and birth, but there's usually a waiting period of up to 12 months (OVHC and OSHC merged)"
      judgement: wrong
      source_says: "OVHC: 'You may need to wait up to 12 months for parts of the cover to start'; OSHC: 'usually a waiting period of 12 months ... covered for emergency treatment'; Medicare page: 'Many private health insurance funds have a waiting period of 12 months'"
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/pregnancy-care-on-a-visa-in-australia
      fixed_to: "Split into OVHC (up to 12 months), funds generally (12 months) and OSHC (usually 12 months, emergency covered), each as its source words it"
    - claim: "Services Australia lists which visas are included."
      judgement: unsupported
      source_says: "'on some types of temporary visas - see this list to find out if your visa is included' (no publisher named in the text)"
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/pregnancy-care-on-a-visa-in-australia
      fixed_to: "check the list to see if your visa is included"
    - claim: "If not, the baby has the same visa as you and must be added through the Department of Home Affairs."
      judgement: wrong
      source_says: "If neither parent is a citizen/PR the baby is not a citizen and has the same visa as you and the other parent; tell Home Affairs about the birth so the baby can be added"
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/pregnancy-care-on-a-visa-in-australia
      fixed_to: "Reworded to the source"
- id: confirming-the-pregnancy
  file: content/drafts/confirming-the-pregnancy.md
  verdict: fix
  problems:
    - claim: "Your GP is usually the first person you see."
      judgement: wrong
      source_says: "'likely to be the first health professional you see'"
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/healthcare-professionals-and-services/the-role-of-your-gp
      fixed_to: "Your GP is likely to be the first person you see."
- id: booking-visit
  file: content/drafts/booking-visit.md
  verdict: fix
  problems:
    - claim: "Your GP sends the referral, and the hospital contacts you to arrange it. (stated as general)"
      judgement: unsupported
      source_says: "RHW: GP sends eReferral, 'we aim to contact you within 2-3 weeks'; booking 'usually ... about 14 weeks'. PBB says only that the GP gives a referral"
      url: https://www.seslhd.health.nsw.gov.au/royal-hospital-for-women/services-clinics/directory/pregnancy
      fixed_to: "Your GP refers you; hospital contact and about-14-weeks timing credited to the Royal Hospital for Women only"
    - claim: "offer the blood tests if you haven't had them"
      judgement: unsupported
      source_says: "'You will also be offered a blood test to check your blood group and rhesus factor'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/your-first-antenatal-visit
      fixed_to: "offer blood tests"
    - claim: "summary: Bring your GP's results."
      judgement: unsupported
      source_says: "Only RHW says to bring the results"
      url: https://www.seslhd.health.nsw.gov.au/royal-hospital-for-women/services-clinics/directory/pregnancy
      fixed_to: "The Royal Hospital for Women asks you to bring your GP's results"
    - claim: "task title: blood test and scan results"
      judgement: unsupported
      source_says: "RHW: GP confirms pregnancy (preferably by ultrasound), organises routine blood tests; 'bring all the above results'"
      url: https://www.seslhd.health.nsw.gov.au/royal-hospital-for-women/services-clinics/directory/pregnancy
      fixed_to: "Gather your GP's test results for the booking visit (no opens/due/deadline: none sourced)"
