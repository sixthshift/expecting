- id: falls-and-knocks
  file: can-i-do.yaml
  verdict: fix
  problems:
    - covers: "go straight to hospital if bleeding, pain, contractions, fluid or less movement"
      judgement: wrong
      source_says: "PBB: 'go to hospital if your baby is not moving as much as normal, you have vaginal bleeding or you have pain in your abdomen'. Contractions and waters breaking are listed only as symptoms to watch for, after which 'contact your doctor' (or Urgent Care, or 000 in an emergency). Abdominal pain, a firm or tightening uterus or bleeding after an abdominal injury: call 000. Any abdominal injury: go to the nearest hospital. The phrase merges these."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy

- id: hot-yoga
  file: can-i-do.yaml
  verdict: fix
  problems:
    - covers: "PBB, the Royal Women's and RANZCOG all name heated classes specifically"
      judgement: unsupported
      source_says: "PBB names them (exercising page: 'avoid exercise classes at intentionally higher temperatures, such as hot Pilates or yoga'; yoga page: not in a room that is too hot or humid) and the Royal Women's Active pregnancy page lists 'hot yoga' among activities to avoid. RANZCOG is not among the cited sources and no cited page quotes it."
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/active-pregnancy

- id: saunas
  file: can-i-do.yaml
  verdict: fix
  problems:
    - covers: "first trimester is the window where overheating matters for development"
      judgement: unsupported
      source_says: "PBB: 'A significant rise in your temperature may affect your unborn baby', no mention of the first trimester. MotherSafe says sauna and hot tub use up to 20 minutes is safe at any time in pregnancy. The first-trimester emphasis is on the PBB playing-sport page (keep cool in the first trimester), which is not cited here, and in MotherSafe only for fever, not saunas."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/things-to-avoid-during-pregnancy

- id: spas-and-hot-tubs
  file: can-i-do.yaml
  verdict: fix
  problems:
    - covers: "heated hydrotherapy pools are on the same list; a warm (not hot) pool is fine"
      judgement: unsupported
      source_says: "Hydrotherapy pools are ok (PBB things to avoid: 'activities in unsafe environments, such as spas, hydrotherapy pools or hot conditions'). 'A warm (not hot) pool is fine' is not said; PBB playing-sport page says 'avoid heated pools and spas' while swimming and aqua-natal classes are encouraged. The warm-bath reassurance on the myths page is for baths, not pools."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/playing-sport-during-pregnancy
    - covers: "hot springs and onsen are spas by another name; cooler pools at the same venue are the workaround"
      judgement: unsupported
      source_says: "No cited page mentions hot springs, onsen or using cooler pools at the same venue."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/things-to-avoid-during-pregnancy
    - covers: "MotherSafe's 20-minute line, see saunas"
      judgement: unsupported
      source_says: "Not on any page this entry cites; it is in the MotherSafe Fever and pregnancy PDF, which only the saunas entry cites. The line itself is real: 'sit in hot tubs and saunas for up to 20 minutes at any time in pregnancy'. Add the source or drop the phrase."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/2020feverp.pdf
