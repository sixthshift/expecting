- id: cramping-and-pain-in-early-pregnancy
  file: symptoms.yaml
  verdict: fix
  problems:
    - covers: "pain and bleeding are common in early pregnancy and do not always mean miscarriage; implantation can cause some cramping and light bleeding"
      judgement: unsupported
      source_says: "Implantation cramping and light bleeding is ok (PBB first trimester). The page does not say pain and bleeding are common or do not always mean miscarriage; it says 'You should get medical help if you have vaginal bleeding or abdominal pain during the first trimester' and lists miscarriage, ectopic and molar pregnancy as causes. Reassurance framing is not in the source."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/first-trimester
    - covers: "see doctor as soon as possible for any ectopic symptoms"
      judgement: wrong
      source_says: "The same ectopic page says 'If you have any of these symptoms while pregnant, go to the nearest emergency department or call triple zero (000) for an ambulance' (the 'see your doctor as soon as possible' line sits under 'When should I see my doctor?' and is weaker). The page's lead banner: 'If you have heavy bleeding, strong pain or feel unwell call triple zero (000)'. As written this phrase understates the urgency; it also conflicts with the entry's last phrase."
      url: https://www.healthdirect.gov.au/ectopic-pregnancy

