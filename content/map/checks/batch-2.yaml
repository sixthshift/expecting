  file: symptoms.yaml
  verdict: fix
  problems:
    - covers: "usually first felt by about 20 weeks, earlier in a later pregnancy (by about 19 weeks, PBB second trimester); regular by 28 weeks"
      judgement: unsupported
      source_says: "Ok: 'by week 20 (or earlier if this is not your first pregnancy)', regular by week 28. The 'about 19 weeks' figure is not on either cited page; the PBB second-trimester page is not in the sources. Also, the 24-week threshold (the point of the entry) is on the Braxton Hicks page banner only, not on the baby-movements page."
