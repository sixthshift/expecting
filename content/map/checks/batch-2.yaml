- id: asthma-inhalers
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "flu and whooping cough vaccines matter more with asthma"
      judgement: unsupported
      source_says: "PBB says only 'stay up to date with your vaccinations... asthma can increase your risk of having complications from some illnesses' and names no vaccine. MotherSafe names the flu vaccine and COVID-19 vaccination as important for asthma. Whooping cough is on neither page."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/asthma-and-pregnancy

- id: antidepressants
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "partners can be on them too; nothing to change"
      judgement: unsupported
      source_says: "Neither page says anything about a partner taking antidepressants. Both pages are about the person who is pregnant or breastfeeding."
      url: https://www.healthdirect.gov.au/medicines/antidepressants

- id: folic-acid
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "after 12 weeks it can stop, though most keep taking a pregnancy multivitamin"
      judgement: unsupported
      source_says: "The 'it can stop' half is ok (FSANZ: 'You don't need to take folic acid supplements after that'). 'Most keep taking a pregnancy multivitamin' is on neither page. FSANZ also says one month before and three months after conception; PBB says throughout the first trimester, and 12 weeks only for the 5 mg higher dose."
      url: https://www.foodstandards.gov.au/consumer/nutrition/pregnancy/folic-acidfolate-and-pregnancy

- id: iodine
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "most pregnancy multivitamins contain it: check the label, don't double up"
      judgement: unsupported
      source_says: "Neither the NHMRC page nor FSANZ says anything about multivitamins containing iodine or doubling up. (The 'don't double up' advice is on the PBB folate page, for folic acid.)"
      url: https://www.foodstandards.gov.au/consumer/nutrition/pregnancy/iodine-and-pregnancy

- id: herbal-supplements
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "labels may not match contents; contamination with heavy metals, pesticides or drugs has been found"
      judgement: unsupported
      source_says: "The first half is ok (MotherSafe: ingredients on the label 'may not always accurately reflect the actual contents'). Contamination with heavy metals, pesticides or drugs is not on any cited page."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/MSHerbalApril2020.pdf
    - covers: "some herbs can trigger contractions or interact with prescribed medicines"
      judgement: unsupported
      source_says: "The interaction half is ok (MotherSafe: herbal medicines 'may interact with other medicines'; St John's wort interacts with many). Triggering contractions is not said on any cited page; PBB mentions raspberry leaf only as taken to prepare for birth, MotherSafe as safe but ineffective."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/MSHerbalApril2020.pdf
    - covers: "tell every practitioner you're pregnant"
      judgement: unsupported
      source_says: "The pages say to discuss herbal products with your doctor, midwife or obstetrician (MotherSafe, PBB) and to ask a practitioner whether a treatment is safe in pregnancy. None says to tell every practitioner you are pregnant."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/complementary-therapy-during-pregnancy

- id: nicotine-replacement
  file: can-i-consume.yaml
  verdict: fix
  problems:
    - covers: "Champix and Zyban: not enough safety data; a doctor's decision"
      judgement: unsupported
      source_says: "Minor. MotherSafe: 'little research regarding the effectiveness of either during pregnancy and there is inadequate safety data on varenicline' (Champix). It does not say Zyban (bupropion) lacks safety data. 'Consult with your doctor if NRT is ineffective' is ok."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/Factsheets/SmokNRTPregBfeedFeb23.pdf
    - covers: "Quitline 13 7848; the partner quitting too doubles the odds"
      judgement: unsupported
      source_says: "Quitline 13 7848 is ok. MotherSafe says only 'it is always easier to quit if your partner stops smoking with you' and that second-hand smoke is a risk. 'Doubles the odds' is a number on neither page."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/Factsheets/SmokNRTPregBfeedFeb23.pdf

