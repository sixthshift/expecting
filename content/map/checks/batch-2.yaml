- id: swollen-feet-and-ankles
  file: symptoms.yaml
  verdict: fix
  problems:
    - covers: "healthdirect: see doctor or midwife as soon as possible for swelling in the legs that doesn't improve overnight"
      judgement: wrong
      source_says: "The healthdirect page lists this twice. Under 'see your doctor or midwife as soon as possible' (any time in pregnancy) it appears, but under 'Later pregnancy (after 20 weeks): contact your doctor, midwife or hospital immediately' it also appears ('swelling in your legs that doesn't improve overnight'). After 20 weeks the stronger urgency applies, so 'as soon as possible' understates it for most of the pregnancy when swelling is common."
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy

