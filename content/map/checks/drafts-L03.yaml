  verdict: fix
  problems:
    - claim: "Neither source puts bending, squatting or everyday housework off limits. / The sources don't ban bending or housework"
      judgement: wrong
      source_says: "Backache: Avoid heavy lifting and housework. Avoid prolonged standing. Rest frequently with legs elevated. (Royal Women's) / If you can, try to avoid heavy lifting, housework, and long periods of standing. (PBB sleep page). Neither page mentions bending or squatting."
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/common-concerns-in-early-pregnancy
      fixed_to: "Summary and intro now say the sources don't mention bending or squatting, and that the backache advice includes avoiding housework."
