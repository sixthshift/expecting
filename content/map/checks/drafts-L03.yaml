# Fact-check of drafts for batch L03 (41 Library drafts), checked against the pages in each draft's sources.
# Date: 2026-10-29. Source copies fetched by the drafter and re-read in full.
- id: microwaves-and-devices
  file: content/drafts/microwaves-and-devices.md
  verdict: fix
  problems:
    - claim: "Radiation from phones, wifi and microwave ovens is the non-ionising kind, and the evidence doesn't link it to problems in pregnancy."
      judgement: unsupported
      source_says: "The ARPANSA review covers mobile phone use, distance to mobile base stations and some jobs; the microwave fact sheet covers microwave ovens. Neither page mentions wifi, laptops or 'non-ionising'."
      url: https://www.arpansa.gov.au/effects-radiofrequency-electromagnetic-field-exposure-adverse-pregnancy-outcomes-human-observational-studies
      fixed_to: "Intro rewritten to what the two pages say, and notes the sources do not cover wifi or laptops specifically."
    - claim: "there was a small association with a baby being small for gestational age"
      judgement: unsupported
      source_says: "there was an association with SGA (RR 1.13, 95 % CI 1.02-1.24)"
      url: https://www.arpansa.gov.au/effects-radiofrequency-electromagnetic-field-exposure-adverse-pregnancy-outcomes-human-observational-studies
      fixed_to: "an association ... (relative risk 1.13); 'small' dropped"
- id: reaching-above-your-head
  file: content/drafts/reaching-above-your-head.md
  verdict: fix
  problems:
    - claim: "The idea that raising your arms wraps the cord around the baby's neck is a common myth. Nothing you do when you stretch up, hang out the washing or reach for a high shelf acts on the cord."
      judgement: unsupported
      source_says: "Is it unsafe to hang washing on the line? Reaching up above your head and hanging washing on the line is safe. It is unlikely that it will affect your baby's umbilical cord in any way."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/common-myths-about-pregnancy
      fixed_to: "Rewritten to the page's own question and answer; the neck and 'high shelf' claims removed."
- id: bending-and-housework
