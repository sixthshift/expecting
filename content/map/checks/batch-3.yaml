- id: hot-weather
  file: can-i-do.yaml
  verdict: fix
  problems:
    - covers: "verdict: you run hotter in pregnancy and are on every state's at-risk list; plan the day around it"
      judgement: unsupported
      source_says: "The first half is ok (PBB: metabolism rises, body temperature rises, 'more sensitive to hot weather'; SA Health: higher body temperature). Only NSW Health lists pregnant women among those at risk of serious problems in hot weather. PBB and SA Health name no at-risk list, and no other state is cited."
      url: https://www.health.nsw.gov.au/environment/beattheheat/Pages/health-in-hot-weather.aspx
    - covers: "first-trimester overheating and development; later, blood goes to the skin not the placenta"
      judgement: unsupported
      source_says: "First half ok (PBB: in the first trimester overheating 'can affect your baby's growth and development'). The blood-flow point is made for any overheating ('more blood flows to your skin... less goes to other parts including your placenta'), not for later pregnancy."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/dealing-with-hot-weather-during-pregnancy-and-breastfeeding
    - covers: "move exercise to early or late; swim or walk, not run"
      judgement: unsupported
      source_says: "Minor. PBB: exercise early morning or later in the day; swimming, walking, gentle cycling, pilates, yoga are less likely to cause overheating. It does not say not to run."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/dealing-with-hot-weather-during-pregnancy-and-breastfeeding

