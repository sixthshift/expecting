- id: vaccines-in-pregnancy
  file: can-i-do.yaml
  verdict: fix
  problems:
    - covers: "verdict: non-live vaccines yes (flu, whooping cough, RSV in their windows; COVID, tetanus, hep B if needed); live vaccines no (MMR, varicella, yellow fever, live JE, BCG)"
      judgement: wrong
      source_says: "Only flu (any time), whooping cough (preferably 20 to 32 weeks) and RSV (from 28 weeks, preferably 28 to 36) are routinely recommended. The Handbook says most other non-live vaccines (COVID-19, hepatitis B, and so on) are 'not routinely recommended' in pregnancy, though pregnancy is not an absolute contraindication and they can be given when benefits outweigh risks. Live attenuated vaccines (MMR, varicella, BCG, Imojev) are contraindicated; yellow fever is not recommended unless travel is unavoidable. 'Tetanus' alone is not named; the pertussis vaccine is the dTpa."
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
    - covers: "COVID: safe at any stage; a further dose not routinely recommended if already vaccinated"
      judgement: wrong
      source_says: "Handbook: COVID-19 vaccine is 'not routinely recommended, but all pregnant women can consider a dose from 20 weeks gestation in each pregnancy'; safe use of mRNA vaccines has been shown. 'At any stage' is not said. PBB: if already vaccinated you do not need to be vaccinated again during pregnancy, but can choose to."
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding

- id: travel-in-pregnancy
  file: can-i-do.yaml
  verdict: fix
  problems:
    - covers: "who shouldn't: bleeding, multiples, pre-eclampsia or high blood pressure, placental problems, previous preterm labour, poorly controlled diabetes; ask first"
      judgement: unsupported
      source_says: "MotherSafe lists the high-risk factors as placental abnormalities, incompetent cervix, history of premature labour, diabetes (not 'poorly controlled'), multiple pregnancy, and high blood pressure in the current or a previous pregnancy, plus some medical conditions. Bleeding and pre-eclampsia are not named on any cited page. PBB: with a high chance of complications it may not be safe; ask your doctor or midwife."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/Factsheets/TravelInPregFeb23.pdf
    - covers: "Australia: Medicare travels with you, but rural maternity care is thin"
      judgement: unsupported
      source_says: "First half ok (PBB: within Australia you can receive care throughout the country with your Medicare card or private health insurance). Nothing on any cited page says rural maternity care is thin."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/travel-and-pregnancy

- id: airline-pregnancy-limits
  file: can-i-do.yaml
  verdict: fix
  problems:
    - covers: "overseas carriers set their own rules, often earlier (Smartraveller says many stop at 28 weeks); check before you book, and the return leg counts"
      judgement: wrong
      source_says: "Smartraveller says 'Most airlines won't let you fly beyond 28 weeks of pregnancy', not 'many'. MotherSafe says to check the airline's cut-off: generally 36 weeks for local flights and from 32 weeks for international. 'The return leg counts' is on none of the cited pages. Qantas and Virgin limits, the 28-week letter, the 10-day date for Virgin, medical clearance for complications and the 'minimum, not a safety endorsement' line are all ok. Qantas says submit the clearance form no later than five days before departure."
      url: https://www.smartraveller.gov.au/before-you-go/health/pregnancy

