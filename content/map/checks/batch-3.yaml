      judgement: wrong
      source_says: "MotherSafe: 'Avoid iodine to purify water after 10 weeks of pregnancy as it can affect your unborn baby's thyroid' and chlorine-based tablets can be used. It is not a blanket ban. 'Boil, cook, bottle, peel' and traveller's diarrhoea leading to 'dehydration, low blood pressure and shock in pregnancy' are ok."
