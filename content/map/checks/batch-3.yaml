      judgement: unsupported
      source_says: "PBB says that if you are pregnant and unvaccinated you have a higher risk of severe illness and hospital admission with COVID-19 or flu, and to ask your doctor if travel vaccinations are safe for you. MotherSafe: talk with your maternity provider before travelling. Neither says to be vaccinated before you go."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/travel-and-pregnancy

- id: zika
  file: can-i-do.yaml
  verdict: fix
  problems:
