      judgement: wrong
      source_says: "healthdirect: 'The Department of Health advises anyone who is pregnant or planning pregnancy to consider delaying travelling to countries where the virus outbreak has been detected.' It says 'consider delaying', not 'defer', and does not say 'non-essential'."
      url: https://www.healthdirect.gov.au/conditions/viral-infections/zika-virus
    - covers: "spread by mosquitoes and sexually; condoms for the trip and after"
      judgement: unsupported
      source_says: "Spread by mosquitoes and sexually is ok. healthdirect says to use condoms during sex while in the affected region. 'And after' is not said."
      url: https://www.healthdirect.gov.au/conditions/viral-infections/zika-virus
    - covers: "the partner who travels alone: condoms for the rest of the pregnancy; planning a pregnancy, wait six months after leaving the area"
      judgement: unsupported
      source_says: "The six months for planning a pregnancy is ok. Condoms for the rest of the pregnancy is not on any cited page. healthdirect says that anyone who is pregnant, planning a pregnancy or with a pregnant partner who has recently travelled to a Zika-affected area should see a doctor to discuss testing and prevention of transmission, even without symptoms."
      url: https://www.healthdirect.gov.au/conditions/viral-infections/zika-virus
    - covers: "where: check the Smartraveller country page and the Department of Health list; the Pacific and Southeast Asia include places Australians go"
      judgement: wrong
      source_says: "healthdirect: 'For an up-to-date list of countries with a risk of Zika, check the US Centers for Disease Control and Prevention website', and to check smartraveller.org.au for travel advice. It does not point to a Department of Health list. It names parts of Africa, South and Central America, Asia, the Caribbean, the Pacific Islands and Mexico."
      url: https://www.healthdirect.gov.au/conditions/viral-infections/zika-virus

