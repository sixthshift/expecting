- id: motorbikes-and-scooters
  file: content/drafts/motorbikes-and-scooters.md
  verdict: fix
  problems:
    - claim: "After any injury, even a less urgent one, go to hospital if the baby is moving less than normal, or you have vaginal bleeding or pain in your abdomen."
      judgement: wrong
      source_says: "Even after a minor injury during pregnancy, go to hospital straight away if your baby is not moving as much as normal, you have vaginal bleeding or if you have pain in your abdomen. Also: 'If you have any injury to your abdomen, you should go to the nearest hospital.' Warning banner: contact your midwife or doctor immediately."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy
      fixed_to: "kept 'contact your midwife or doctor immediately'; added 'go to the nearest hospital' for any abdominal injury, and 'go to hospital straight away' (urgency restored) for reduced movements, bleeding, pain"
    - claim: "most policies are void if you were breaking a local road law, including riding without the right licence"
      judgement: unsupported
      source_says: "Most policies are void if you were breaking the law when the accident occurred ... any road law like giving way. / Some insurance policies won't cover you for an accident if you're driving a vehicle without an authorised licence."
      url: https://www.smartraveller.gov.au/before-you-go/getting-around/road-safety
      fixed_to: "most policies are void if you were breaking any road law when the accident happened, and some won't cover you if you ride without an authorised licence"
- id: travel-vaccines
  file: content/drafts/travel-vaccines.md
  verdict: fix
  problems:
    - claim: "Yellow fever ... Handbook: if travel to a country with yellow fever is unavoidable, weigh the risks and benefits of the vaccine with your doctor."
      judgement: wrong
      source_says: "Handbook table: 'Not recommended. Advise pregnant women against going to rural areas where yellow fever is endemic. However, if travel to a country with a risk of yellow fever virus transmission is unavoidable, pregnant women should receive yellow fever vaccine.' Handbook text: 'weigh the risks and benefits of yellow fever vaccination, and discuss other strategies ... such as avoiding mosquitoes.' MotherSafe: 'only be given when the risk of contracting the disease is substantial and travel is unavoidable.' Better Health: 'Some vaccines, such as for yellow fever, may cautiously be given after the first trimester.'"
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
      fixed_to: "kept all three, each credited; the Handbook's two statements both given (table 'should receive', text 'weigh the risks and benefits')"
    - claim: "See your doctor 6 to 12 weeks before you go"
      judgement: wrong
      source_says: "healthdirect: 'at least 6 weeks (and preferably 12 weeks) before you leave Australia'"
      url: https://www.healthdirect.gov.au/procedures/immunisation-and-vaccinations/travel-vaccinations
      fixed_to: "at least 6 weeks, and preferably 12 weeks"
