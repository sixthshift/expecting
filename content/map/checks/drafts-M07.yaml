# M07 drafts check: claims in each draft checked against the pages in its sources, 2026-10-29.
- id: home-birth
  file: content/drafts/home-birth.md
  verdict: fix
  problems:
    - claim: "freebirth line rests only on PBB 'can increase the chance of health problems'"
      judgement: unsupported
      source_says: "RANZCOG/ACM joint statement 3 Nov 2025: 'The absence of appropriate clinical support during freebirth has led to preventable harm and loss of life.' Freebirth 'is the intentional practice of giving birth without a registered healthcare professional, such as a midwife or doctor, present. It is different from a homebirth, which is a planned birth at home with a registered healthcare provider.' RANZCOG Home Births C-Obs 2 (July 2023) puts freebirths out of scope, so it adds no position on them."
      url: https://ranzcog.edu.au/news/ranzcog-acm-call-on-health-ministers-to-end-freebirth-deaths/
      fixed_to: "added the joint statement's wording, credited, and added it to sources. PBB line kept (page says it)."
    - claim: "public program (free with Medicare, needs a GP referral)"
      judgement: wrong
      source_says: "Medicare covers care in a publicly funded homebirth program; referral 'from your doctor' to see a midwife in a public hospital"
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/medicare-during-pregnancy
      fixed_to: "covered by Medicare, needs a referral from your doctor"
