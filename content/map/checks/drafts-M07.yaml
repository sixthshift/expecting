- id: flying
  file: content/drafts/flying.md
  verdict: fix
  problems:
    - claim: "week limits listed from PBB, MotherSafe, Smartraveller, RANZCOG, Better Health (Better Health's own limit missing)"
      judgement: unsupported
      source_says: "Better Health: 'some airlines won't allow a woman over 35 weeks to fly at all, or they require a doctor's note'. PBB: 'most airlines won't let you travel with them after 32 to 36 weeks'. MotherSafe: 'For local flights, it is generally 36 weeks, and international flights from 32 weeks.' Smartraveller: 'Most airlines won't let you fly beyond 28 weeks'. RANZCOG: 'Travel beyond 36 weeks' gestation is not recommended.' (all re-fetched and confirmed; each is credited by name in the draft)"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-travel
      fixed_to: "added Better Health's over-35-weeks wording, credited. Other limits unchanged."
- id: dvt-and-compression-stockings
  file: content/drafts/dvt-and-compression-stockings.md
  verdict: fix
  problems:
    - claim: "Call triple zero (000) ... chest pain, trouble breathing or short of breath, palpitations, dizzy or faint, cough up blood (missing PBB's stroke/heart attack trigger)"
      judgement: unsupported
      source_says: "PBB: 'See a doctor immediately if you have signs of a deep vein thrombosis (redness, swelling or pain in your lower leg). Call triple zero (000) and ask for an ambulance if you have chest pain, trouble breathing or symptoms of stroke or heart attack.' healthdirect: DVT suspected 'see your doctor straight away'; 000 if short of breath, chest pain, heart palpitations, dizzy or faint, cough up blood."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/travel-and-pregnancy
      fixed_to: "kept both levels as the sources give them (see a doctor immediately for leg signs; 000 for the chest/breathing list), added 'or have symptoms of a stroke or heart attack' from PBB"
