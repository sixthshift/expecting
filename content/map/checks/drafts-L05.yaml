- id: how-your-body-changes
  file: content/drafts/how-your-body-changes.md
  verdict: fix
  problems:
    - claim: "Cravings, constipation, and \"brain fog\", especially in the third trimester, are also usual."
      judgement: unsupported
      source_says: "Hormonal changes during pregnancy can also cause symptoms: food cravings, constipation; 'Brain fog' - pregnancy can affect brain function and memory, especially in the third trimester"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/changes-to-your-body-during-pregnancy
      fixed_to: "Hormonal changes can also cause food cravings and constipation, and pregnancy can affect brain function and memory (brain fog), especially in the third trimester."
    - claim: "A range of emotions, positive and negative, is normal, including mood swings."
      judgement: wrong
      source_says: "a range of emotions ... All of these are normal. You may also experience strong emotions and mood swings, such as anxiety or depression."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/changes-to-your-body-during-pregnancy
      fixed_to: "range of emotions normal; separately, you may also have strong emotions and mood swings, such as anxiety or depression"
