      judgement: unsupported
      source_says: "When you register your newborn for Medicare, you can get a My Health Record for them as well."
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/my-health-record
      fixed_to: "registering your newborn when you enrol your baby for Medicare"
