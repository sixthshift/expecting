      judgement: unsupported
      source_says: "MotherSafe: 'Retinol in skin care products is poorly absorbed through the skin and is not anticipated to be a concern in pregnancy.' (tretinoin on prescription and isotretinoin are different: see isotretinoin entry.)"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/VitaminsmineralspandbupdateSept19.pdf
      fixed_to: "Heading changed to 'Retinol in skin care: MotherSafe says...'."
  note: "10,000 IU limit, beta-carotene, cod liver oil confirmed."
