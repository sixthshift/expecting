# Fact-check of drafted Library entries, batch M04 (20 drafts: medicines, supplements, exercise), checked 2026-10-29.
# Each claim checked against the pages in the draft's sources:.
- id: isotretinoin
  file: content/drafts/isotretinoin.md
  verdict: fix
  problems:
    - claim: "Isotretinoin is not considered safe during pregnancy: if you're taking it and find you're pregnant, talk to your doctor or pharmacist about it."
      judgement: unsupported
      source_says: "If you become pregnant while taking Roaccutane, stop taking it and tell your doctor immediately. Roaccutane can cause birth defects (damage to unborn babies)... If you fall pregnant while taking Roaccutane there is an extremely high risk of having a baby that is severely deformed."
      url: https://www.safetyandquality.gov.au/medicine-finder/roaccutane
      fixed_to: "Summary, opening line, Why and What to do rewritten to the Roaccutane CMI's wording (birth defects; stop and tell your doctor immediately; strict birth control from 1 month before, during, and 1 month after). Page added to sources. healthdirect's own line kept, credited. Note: healthdirect's generic isotretinoin page also says 'Do not stop taking this medicine abruptly without medical advice', which conflicts with the CMI's 'stop taking it'; not repeated in the entry. The TGA CMI licence gate was not clicked through; the Commission's page shows the CMI inline."
    - claim: "MotherSafe says tretinoin ... should not be used in pregnancy"
      judgement: ok
      source_says: "Minoxidil for hair growth or tretinoin for acne are skin products requiring a prescription and should also not be used."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/skinhaircareandcosmetictreatmentsapril2021.pdf
      fixed_to: "confirmed, no change"
  note: "Other claims ok (retinol minimally absorbed, benzoyl peroxide/salicylic/glycolic considered safe, acne worsens with hormone changes, MotherSafe numbers). checked left on: every claim confirmed on a loaded page."
- id: anti-diarrhoea-medicines
  file: content/drafts/anti-diarrhoea-medicines.md
  verdict: fix
  problems:
    - claim: "loperamide ... avoided in the first trimester and after that only on your doctor's advice ... never for moderate to severe (summary)"
      judgement: wrong
      source_says: "healthdirect: avoid loperamide in the first trimester; can be used after on the advice of your doctor. MotherSafe: for mild diarrhoea during social inconvenience loperamide is most often recommended; anti-diarrhoeal medications should be avoided for moderate to severe diarrhoea (no 'never', no trimester limit)."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/Factsheets/GastroPregBfeedFeb23.pdf
      fixed_to: "Summary and opening reworded to credit each source; 'never' changed to 'avoided'."
  note: "All other claims ok (fluids, diet, urgent treatment, labour, phone numbers)."
- id: thrush-treatments
  file: content/drafts/thrush-treatments.md
  verdict: fix
  problems:
    - claim: "Pregnancy, Birth and Baby and KEMH both say not to take it unless your doctor advises it."
      judgement: wrong
      source_says: "KEMH: 'A single dose of oral fluconazole is not routinely recommended during pregnancy unless it is advised by your doctor.' PBB: 'Don't use the single dose oral tablet for thrush during pregnancy unless your doctor tells you to.' MotherSafe: not a recommended treatment in the first trimester; second-line after the first trimester; reassuring about an inadvertent single 150 mg dose."
      url: https://kemh.health.wa.gov.au/Pregnancy-and-Birth/After-your-pregnancy/Pharmacy/Medicines-in-pregnancy
      fixed_to: "Each source credited with its own wording (KEMH 'not routinely recommended')."
  note: "Disagreements: fluconazole and the applicator are both credited to each source (PBB: best not to use applicator with pessaries; MotherSafe and KEMH: applicators may be used with care). All other claims ok."
- id: uti-remedies
  file: content/drafts/uti-remedies.md
  verdict: ok
  note: "All claims confirmed on MotherSafe and Pregnancy, Birth and Baby (including 'risk goes away when treated', PBB)."
- id: sleeping-pills
  file: content/drafts/sleeping-pills.md
  verdict: fix
  problems:
    - claim: "Doxylamine (Restavit) ... hasn't been linked with any increased risk to the baby (presented without the other source's view)"
      judgement: unsupported
      source_says: "healthdirect (general, not pregnancy-specific): sedating antihistamines such as doxylamine 'are not sleeping pills — they are anti-allergy medicines which have a side effect of making you feel drowsy. They should not be used to help you sleep.' MotherSafe: doxylamine widely used at all stages of pregnancy, not associated with increased risk to the baby, not habit forming."
      url: https://www.healthdirect.gov.au/medicines/safe-use-of-sleeping-pills
      fixed_to: "Kept MotherSafe's line and added healthdirect's, each credited."
  note: "Everything else ok (MotherSafe insomnia sheet)."
- id: melatonin
  file: content/drafts/melatonin.md
  verdict: fix
  problems:
    - claim: "Doxylamine (Restavit) has been widely used in pregnancy without increased risk to the baby, and is not habit-forming (suggested as an alternative)"
      judgement: unsupported
      source_says: "healthdirect: sedating antihistamines such as doxylamine 'should not be used to help you sleep' (general advice). MotherSafe: widely used in pregnancy, no increased risk to baby."
      url: https://www.healthdirect.gov.au/medicines/safe-use-of-sleeping-pills
      fixed_to: "healthdirect's view added, both credited."
  note: "Melatonin claims ok (MotherSafe: little information, no evidence of harm, may be preferable to use one with more evidence; homeopathic version minute amounts). healthdirect's page also says pharmacists can provide melatonin to adults over 55 or for jet lag: not used in draft."
- id: high-dose-folic-acid
  file: content/drafts/high-dose-folic-acid.md
  verdict: fix
  problems:
    - claim: "5 mg 'throughout the pregnancy, not just the first 3 months'"
      judgement: unsupported
      source_says: "MotherSafe: for those at increased risk of folate deficiency, 'taking 5mg of folic acid throughout the pregnancy should be considered.' No source gives a duration for the other 5 mg groups."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/VitaminsmineralspandbupdateSept19.pdf
      fixed_to: "'not just the first 3 months' cut."
    - claim: "ask your doctor ... ideally before you're pregnant or as early as you can"
      judgement: unsupported
      source_says: "PBB gives 'at least one month before a planned pregnancy' for 0.5 mg only."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/vitamins-and-supplements-during-pregnancy
      fixed_to: cut
    - claim: "Ask how long to take it. For some it's the first 3 months; for others, the whole pregnancy."
      judgement: unsupported
      source_says: "Only MotherSafe's 'throughout the pregnancy should be considered' for some."
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Mothersafe/documents/VitaminsmineralspandbupdateSept19.pdf
      fixed_to: "Reworded to MotherSafe's line."
- id: iron
  file: content/drafts/iron.md
  verdict: fix
  problems:
    - claim: "[anaemia] may make it harder for your body to cope with blood loss at the birth"
      judgement: wrong
      source_says: "PBB: 'Severe iron-deficiency anaemia (haemoglobin concentration <70 mg/dL) can cause cardiac (heart) failure. It may also mean that your body is less able to cope with blood loss at birth.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/anaemia-in-pregnancy
      fixed_to: "Made 'severe iron-deficiency anaemia'."
    - claim: "Expect dark poo. Iron can also cause constipation or nausea."
      judgement: wrong
      source_says: "healthdirect: iron supplements 'may make your stools (poo) dark and can also cause constipation'; PBB: some people get nausea or constipation."
      url: https://www.healthdirect.gov.au/iron-deficiency
      fixed_to: "'Iron may make your poo dark. It can also cause constipation, and some people get nausea.'"
  note: "Other claims ok (1 in 4, blood tests at first visit and about 28 weeks, medical supervision/iron poisoning, absorption, foods)."
