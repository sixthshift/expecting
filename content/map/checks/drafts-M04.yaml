- id: exercise-in-pregnancy
  file: content/drafts/exercise-in-pregnancy.md
  verdict: fix
  problems:
    - claim: "Summary: aim for about 30 minutes of moderate activity on most days (one source's figure stated as the answer)"
      judgement: wrong
      source_says: "BHC: at least 30 minutes on most, if not all, days. RWH: a session on all or most days, or at least 150 minutes a week. RANZCOG: 20-30 minutes four to five times a week. PBB: try to be active each day of the week, strengthening twice a week."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/exercising-during-pregnancy
      fixed_to: "Summary says it differs by source; PBB added to the 'How much' paragraph."
    - claim: "exercising lying flat on your back: RWH says after 16 weeks; PBB says particularly after 28 weeks (BHC omitted)"
      judgement: unsupported
      source_says: "RWH: 'After 16 weeks of pregnancy, it is best to avoid exercises lying on your back'. PBB: 'Lying flat on your back, particularly after 28 weeks, can be dangerous.' BHC: avoid supine exercise position, no week given."
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
      fixed_to: "Each source credited with its own wording, BHC added."
  note: "Other claims ok (benefits, talk test, resting heart rate, avoid list, stop-and-see-doctor list, check first list)."
