- id: pregnancy-multivitamins
  file: content/drafts/pregnancy-multivitamins.md
  verdict: fix
  problems:
    - claim: "High-dose vitamins only if your doctor recommends them."
      judgement: unsupported
      source_says: "PBB: high doses of vitamins A, C and E can be dangerous; 'It's best not to take these vitamins as supplements during pregnancy.' No source says 'unless your doctor recommends'."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/vitamins-and-supplements-during-pregnancy
      fixed_to: "Reworded to PBB's line."
  note: "Other claims ok (folic acid 0.5 mg/400 mcg, iodine 150 mcg per PBB; MotherSafe not all contain iodine; KEMH take at night with a snack, keep folic acid and iodine). MotherSafe's RDI for iodine is 220 mcg a day intake, PBB says look for a 150 mcg supplement: draft uses PBB only."
