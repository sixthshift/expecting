# Drafts batch 7 (B7): money-and-work and body-and-baby drafts, fact-checked against their cited pages.
# Checked 2026-10-29. Figure-bearing pages (Services Australia, Fair Work) re-fetched the same day.

- id: medicare-enrol-baby
  file: content/drafts/medicare-enrol-baby.md
  verdict: fix
  problems:
    - claim: "Before the birth. If either of you is still on your own parents' Medicare card, you need to move to your own card before you can enrol the baby."
      judgement: unsupported
      source_says: "If you're on the same Medicare card as your parents, you need to transfer to your own Medicare card before enrolling your baby. (Nothing about 'before the birth' or 'either of you'.) All other claims ok: as soon as possible, Parent Pack, last page signed, 3 to 4 weeks, digital card in myGov app, 2 cards at most, lost-declaration proofs."
      url: https://www.servicesaustralia.gov.au/enrolling-your-baby-medicare
      fixed_to: "Your own card first. If you're still on your own parents' Medicare card, you need to transfer to your own card before you can enrol the baby."

- id: unpaid-parental-leave
