- id: cost-of-having-a-baby
  file: content/drafts/cost-of-having-a-baby.md
  verdict: fix
  problems:
    - claim: "Medicare covers doctor and midwife visits, routine ultrasounds, blood tests and having your baby in an approved facility."
      judgement: unsupported
      source_says: "PBB Medicare during pregnancy: 'Medicare covers many of the health care costs of having a baby, including doctor and midwife visits, ultrasounds, blood tests and having your baby in an approved facility.'"
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/medicare-during-pregnancy
      fixed_to: "Medicare covers many of the costs of having a baby, including ..."
    - claim: "hospital fees are separate, and depend on your cover and whether the hospital has an agreement with your insurer"
      judgement: unsupported
      source_says: "privatehealth.gov.au: medical fees are separate to hospital fees for accommodation, time in theatre and other hospital services; you may incur out-of-pocket costs for hospital fees. Nothing says they depend on a hospital-insurer agreement."
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/out_of_pocket.htm
      fixed_to: "hospital fees (such as accommodation and theatre) are separate from the doctors' fees, and you may have out-of-pocket costs for them"
    - claim: "The Medicare Safety Net. Register for it"
      judgement: unsupported
      source_says: "PBB: 'You may want to register for the Medicare Safety Net.'"
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/private-health-insurance-and-pregnancy
      fixed_to: "You may want to register for it"
  note: "Ok: 75% MBS and insurer 25%, doctors free to charge more and 'no cap', gap, excess or co-payment, baby's nursery charged separately, uncovered items, high out-of-pocket without cover, private patient in a public hospital (no guaranteed single room), MBS item numbers and written estimate, 1800 882 436."

