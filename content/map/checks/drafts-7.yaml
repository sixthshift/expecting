- id: registering-the-birth
  file: content/drafts/registering-the-birth.md
  verdict: fix
  problems:
    - claim: "SA, Tasmania and the NT: myGov says you need to register within 60 days in all states and territories."
      judgement: unsupported
      source_says: "myGov: 'within 60 days ... required by Births, Deaths and Marriages Registries in all states and territories', but Access Canberra says 6 months for the ACT. The two disagree; both kept, each credited. SA, Tasmanian and NT registry pages are not cited and were not checked."
      url: https://my.gov.au/en/services/raising-kids/having-a-baby/when-your-baby-is-born/register-your-baby-s-birth-and-get-their-birth-certificate
      fixed_to: "myGov says births must be registered within 60 days in all states and territories (the ACT's own registry says 6 months, above)."
  note: "Ok against fresh pages: myGov 60 days and free; NSW 'should' within 60 days, never too late, hospitals won't register, online form; Vic 'must' within 60 days, Service Victoria account, each parent separately; Qld 'must' 60 days, online/post/in person, both parents verify ID; WA 60 days, hospital or midwife gives information; ACT 6 months, Newborn Enrolment Trial at Centenary or North Canberra with consent form; PLP needs birth registered or applied to register; 'register as soon as possible, if you don't we may not be able to pay you'; NSW and WA passport use."

