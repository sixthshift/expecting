- id: cot-and-safe-sleep-standards
  file: content/drafts/cot-and-safe-sleep-standards.md
  verdict: unchecked
  problems:
    - claim: "Red Nose says the standard is noted in the cot's instructions and often on a label"
      judgement: unchecked
      source_says: "Red Nose blocks automated fetches (bot check), and Product Safety Australia returned Access Denied, so this could not be confirmed. PBB says only that all new and second-hand cots must comply with AS/NZS 2172:2003 and that second-hand cots 'do not require safety labels' (that part is ok)."
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/newborn-to-1-year/what-is-a-safe-cot/
      fixed_to: "kept, credited to Red Nose, unchecked"
    - claim: "Red Nose: use a single firm, flat mattress that fits within 20 mm of the cot's sides and ends."
      judgement: unchecked
      source_says: "Red Nose page not loadable. PBB (checked): firm mattress, gap no more than 2 cm centred and no more than 4 cm pushed to one side."
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/newborn-to-1-year/what-is-a-safe-cot/
      fixed_to: "kept, credited, unchecked"
    - claim: "There are no current safety standards for bassinets in Australia."
      judgement: wrong
      source_says: "PBB safe sleep: 'Unlike cots, there are no current safety standards for bassinets in Australia.' Not attributed in the draft; now credited. (The map check noted no cited page gives a 19 January 2026 standard; Product Safety Australia could not be loaded to see whether anything newer applies.)"
      url: https://www.pregnancybirthbaby.org.au/babies/sleep-and-settling/safe-sleep-for-babies
      fixed_to: "Pregnancy, Birth and Baby says that, unlike cots, there are no current safety standards for bassinets in Australia."
    - claim: "Checking the cot: bar spaces, gaps, protrusions apply to every cot"
      judgement: unsupported
      source_says: "PBB: 'a few different rules for used or second-hand cots: parts sticking out can be up to 8cm long, gaps between 3cm and 5cm are allowed, they do not require safety labels.'"
      url: https://www.pregnancybirthbaby.org.au/babies/sleep-and-settling/cots
      fixed_to: "added a sentence giving the second-hand differences, and said the checks are for buying a cot"
  note: "Ok against PBB: AS/NZS 2172:2003 for new and second-hand cots, not all cots meet it, unsafe cot can cause injury or death, bar spaces 5 to 9.5 cm, gaps 3 to 5 cm and over 9.5 cm, protrusions over 5 cm, toeholds, depths 60 cm and 40 cm, plastic wrapping, no bumpers, pillows, doonas, loose bedding, lambswool or sheepskin, soft toys, room sharing 6 to 12 months, back sleeping, face and head uncovered, cot placement away from curtains and cords, mobiles, pictures and mirrors. The last mattress source (Red Nose second-hand mattress) is not used in the body."

- id: second-hand-baby-gear
  file: content/drafts/second-hand-baby-gear.md
  verdict: unchecked
  problems:
    - claim: "Red Nose says using second-hand nursery furniture can reduce costs, but make sure the product is safe. Just because someone else owned it doesn't mean it's up to current safety standards."
      judgement: unchecked
      source_says: "Red Nose blocked (bot check). Supported by PBB only in part: 'you can save money by buying second hand, borrowing or recycling pre-used baby furniture and equipment', and for cots 'just because someone else owned the cot before you, it does not mean that it is up to current safety standards'."
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/pregnancy-to-birth/second-hand-nursery-furniture/
      fixed_to: "kept, unchecked"
    - claim: "Check every item: full instructions and all parts, sturdy and stable, no rough repairs, damage or accident history. Check for recalls on the Product Safety Australia recalls list."
      judgement: unchecked
      source_says: "Not on the PBB pages loaded. Red Nose is blocked and Product Safety Australia returned Access Denied. (PBB, for second-hand cots only: all parts in good working order, full instructions, repair broken or loose bars, check old cots for lead-based paint.)"
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/pregnancy-to-birth/second-hand-nursery-furniture/
      fixed_to: "kept, unchecked"
    - claim: "A used mattress is fine if it's firm, flat, clean, in good condition, right size, fitting within 20 mm of the sides."
      judgement: unchecked
      source_says: "Red Nose second-hand mattress page not loadable. PBB: 'a clean, firm mattress that fits tightly against the cot or bassinette sides'; gap no more than 2 cm centred, 4 cm pushed to one side."
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/pregnancy-to-birth/is-it-safe-to-use-a-second-hand-mattress/
      fixed_to: "kept, unchecked"
  note: "Ok against PBB: second-hand cots must meet AS/NZS 2172:2003 and do not require safety labels; check old cots for lead-based paint; use only with all parts working and full instructions. PBB says to use a portable cot only if it meets the Australian standard (the draft's 'sold in Australia must meet' for portable cots rests on Red Nose)."

- id: sleep-in-pregnancy
  file: content/drafts/sleep-in-pregnancy.md
  verdict: fix
  problems:
    - claim: "you start snoring, or have pauses in your breathing while you sleep"
      judgement: wrong
      source_says: "PBB fatigue page: 'you start snoring or have more pauses in your breathing during sleep'."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/dealing-with-fatigue-during-your-pregnancy
      fixed_to: "you start snoring, or have more pauses in your breathing while you sleep"
    - claim: "heartburn or restless legs keep disturbing your sleep, or you still can't sleep after trying these tips"
      judgement: unsupported
      source_says: "Fatigue page: 'your sleep is disturbed by a health condition such as heartburn or restless legs syndrome'. Sleep page: see your doctor 'if you have trouble sleeping and you are worried it is affecting yours or your baby's health'. 'Still can't sleep after trying these tips' is not said."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/sleep-during-pregnancy
      fixed_to: "your sleep is disturbed by a health condition such as heartburn or restless legs, or you have trouble sleeping and you're worried it's affecting your or your baby's health"
  note: "Ok: more sleep needed, lighter sleep, from 28 weeks sleep on your side (night and naps, either side), back-lying and stillbirth wording, pillows, sleep hygiene points, heartburn red flags, 000, Lifeline 13 11 14, PANDA 1300 726 306."

- id: pregnancy-supplements
  file: content/drafts/pregnancy-supplements.md
  verdict: fix
  problems:
    - claim: "Calcium: ... If you don't eat dairy or calcium-fortified milks, ask whether you need one."
      judgement: unsupported
      source_says: "PBB: your midwife or doctor may suggest calcium 'if your usual diet does not have enough or you have certain medical conditions'. Dairy and fortified milks are not mentioned in that context."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/vitamins-and-supplements-during-pregnancy
      fixed_to: "Your midwife or doctor may suggest one if your usual diet doesn't have enough or you have certain medical conditions."
    - claim: "Vitamin B12: recommended if you follow a vegetarian or vegan diet."
      judgement: wrong
      source_says: "PBB: midwife or doctor 'may suggest' B12 if you follow a vegetarian or vegan diet. Royal Women's: 'If you do not eat animal foods you will need to take a vitamin B12 supplement.' Wording differs; both kept, each credited."
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/food-nutrition-in-pregnancy
      fixed_to: "your midwife or doctor may suggest it ... The Royal Women's Hospital says that if you eat no animal foods you will need to take it."
  note: "Vitamin D disagreement kept separate and ok: PBB (some people; test, then maybe a supplement) vs Royal Women's (all pregnant women 400 IU / 10 mcg a day, extra tablet if blood test low). Folic acid 0.5 mg one month before and first 3 months, 400 mcg alternative, 5 mg higher dose list, iodine 150 mcg, kelp, iron, omega-3 and fish liver oils, multivitamin, avoid vitamins A, C, E, 10,000 IU vitamin A limit all ok."

