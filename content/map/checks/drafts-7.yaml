  verdict: fix
  problems:
    - claim: "If you've changed jobs, the 12 months starts again with the new employer: this is the rule that catches people who moved jobs while pregnant."
      judgement: unsupported
      source_says: "If, between having another child, they have started work with a new employer, they will need to work with that employer for at least 12 months before they can take parental leave. ('Catches people who moved jobs while pregnant' is not said.) 12 months + 12 requested, 130 days from 1 July 2026, 6 weeks before, end within 24 months, 10 weeks / 4 weeks, accrual and long service leave all ok."
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
      fixed_to: "If you started with a new employer between children, you need to work for that employer for at least 12 months before you can take parental leave."

