# Fact-check of drafted Library entries (red-flag symptoms and food-safety can-i), batch B2.
# Checked 2026-10-29 against the pages in each draft's `sources:`, fetched that day.
# verdict: ok = every claim supported; fix = edited to what the source says.
- id: feeling-very-unwell
  file: content/drafts/feeling-very-unwell.md
  verdict: fix
  problems:
    - claim: "summary: with an infection plus fever or trouble breathing, see a doctor urgently, go to emergency or call 000"
      judgement: wrong
      source_says: "If you have symptoms of sepsis such as infection, fever or difficulty breathing, see your doctor urgently, or go to your nearest emergency department or call triple zero (000) and ask for an ambulance."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/sepsis-during-pregnancy-and-after-childbirth
      fixed_to: "with signs such as infection, fever or difficulty breathing, see your doctor urgently, go to emergency or call 000"
  note: "The source gives one combined warning (doctor urgently / emergency / 000), kept under Call 000 in its own words. Other levels confirmed against healthdirect Warning signs."
- id: chest-pain
  file: content/drafts/chest-pain.md
  verdict: fix
  problems:
    - claim: "summary: ... or chest pain with trouble breathing, means calling 000"
      judgement: wrong
      source_says: "If you or someone else is having trouble breathing or chest pain, call triple zero (000) and ask for an ambulance."
      url: https://www.healthdirect.gov.au/pulmonary-embolism
      fixed_to: "means calling 000, and so does chest pain or trouble breathing"
  note: "The 10-minute rule is on healthdirect Chest pain (a general page, not pregnancy-specific), which is cited. That page also says see a doctor right away for chest pain over 10 minutes while resting; kept as in source."
- id: painful-swollen-leg
  file: content/drafts/painful-swollen-leg.md
  verdict: ok
  problems: []
  note: "Hospital-now line matches PBB Swelling (pain, redness or warm limb: contact doctor, midwife or maternity hospital straightaway) and healthdirect Warning signs (pain or swelling in one leg: immediately). 'See your doctor immediately' line is PBB Leg cramps."
- id: fall-or-blow-to-the-belly
  file: content/drafts/fall-or-blow-to-the-belly.md
  verdict: fix
  problems:
    - claim: "If you're the partner and you were there, or driving, the same applies to the pregnant parent: get them checked."
      judgement: unsupported
      source_says: "(no cited page says this)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/injuries-during-pregnancy
      fixed_to: cut
  note: "Three levels confirmed: 000 (pain, firm/tightening uterus or vaginal bleeding after belly injury; PBB Injuries), hospital straight away (less movement, bleeding, pain after minor injury; nearest hospital for any injury; healthdirect: contact immediately), contact doctor (contractions, waters breaking)."
