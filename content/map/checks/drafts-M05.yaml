- id: skiing
  file: content/drafts/skiing.md
  verdict: fix
  problems:
    - claim: "\"Above 3,000 metres, Better Health says, there's less oxygen ... and you're more vulnerable to altitude sickness\" (and 2,000 m credited to 'Better Health')"
      judgement: wrong
      source_says: "Exercise page: 'high-altitude training at over 2000 m'. Travel page: 'High-altitude activities such as mountain climbing – at heights over 3,000 metres, the oxygen level in the air is low. This reduces the oxygen available to your baby. Pregnant women are also more vulnerable to developing altitude sickness.' PBB: 'avoid exercise at more than 2,000 metres above sea level until you have acclimatised.'"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-travel
      fixed_to: "2,000 m credited to PBB and Better Health's exercise page; 3,000 m to Better Health's travel page, worded as it says."
    - claim: "Check the altitude of any overseas resort before you book."
      judgement: unsupported
      source_says: "(no page says this)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/exercising-during-pregnancy
      fixed_to: "Compare the altitude of any resort with the 2,000 and 3,000 metre figures above."
  # Verified: downhill skiing a fall risk (PBB, BH exercise, RANZCOG); Royal Women's lists 'water and snow skiing'; water-skiing line (BH travel); tummy-injury line (PBB bleeding page: 'contact your midwife or doctor immediately').
