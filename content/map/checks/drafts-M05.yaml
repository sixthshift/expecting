# Batch M05: fact-check of 20 can-i drafts (exercise, activities, sex, skin) against their cited pages.
# Checked 2026-10-29. Pages fetched fresh into the p2 scratch folder; MotherSafe/RANZCOG PDFs read as text.
- id: scuba-diving
  file: content/drafts/scuba-diving.md
  verdict: fix
  problems:
    - claim: "diving to less than 18 metres is \"reasonably safe, but check with your doctor first\". It's the only Australian source we found that says so"
      judgement: unsupported
      source_says: "Activities to avoid include: ... Scuba diving – the changes in blood gases may harm your baby. Snorkelling is fine and scuba diving to depths of less than 18 metres (60 feet) is reasonably safe, but check with your doctor first."
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-travel
      fixed_to: "Quoted exactly, as Better Health's travel page only, same bullet, under 'Activities to avoid include'; 'only source we found' replaced by 'none of the other sources listed here makes a depth exception'. Entry still leads with avoid (PBB, Royal Women's, Better Health exercise page all list scuba diving to avoid; verified)."
- id: exercise-intensity-and-heart-rate
  file: content/drafts/exercise-intensity-and-heart-rate.md
  verdict: fix
  problems:
    - claim: "Better Health says not to use a target heart rate ... It also says to stay under 75 per cent of your maximum heart rate."
      judgement: unsupported
      source_says: "\"don't use your target heart rate to work out the intensity of your exercise ... always work at less than 75 per cent of your maximum heart rate\" (both on the same page, not reconciled)"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
      fixed_to: "Quoted the 75 per cent line and said the page gives both lines and doesn't reconcile them."
    - claim: "Skip hot or humid days"
      judgement: wrong
      source_says: "Reduce your level of exercise on hot or humid days. Stay well hydrated."
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
      fixed_to: "Cut back on hot or humid days, stay well hydrated"
- id: running
  file: content/drafts/running.md
  verdict: fix
  problems:
    - claim: "Expect to do less as the pregnancy goes on."
      judgement: unsupported
      source_says: "continue this level of activity throughout pregnancy, or until it becomes uncomfortable for you to do so"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
      fixed_to: "Carry on only while it's comfortable (Better Health quote)."
    - claim: "If you didn't run before, start with lower-effort activities such as walking or swimming"
      judgement: unsupported
      source_says: "\"choose one that needs less effort\" (PBB sport); BH lists walking, swimming as generally safe, even for beginners"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/playing-sport-during-pregnancy
      fixed_to: "choose something that needs less effort; Better Health lists walking and swimming as generally safe, even for beginners"
    - claim: "Skip hot or humid days"
      judgement: wrong
      source_says: "\"Reduce your level of exercise on hot or humid days\" (BH)"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
      fixed_to: "Cut back on hot or humid days, stay well hydrated"
  # Verified: BH lists jogging as generally safe; Royal Women's lists running among high-impact exercise to avoid; PBB exercise page says avoid high-impact/jumping/bouncing; all credited in the body. MotherSafe (not cited) also says to avoid high impact sport.
- id: exercise-lying-on-your-back
  file: content/drafts/exercise-lying-on-your-back.md
  verdict: fix
  problems:
    - claim: "summary: From about 16 weeks ... reducing blood flow to the baby"
      judgement: wrong
      source_says: "\"Lying flat on your back, particularly after 28 weeks, can be dangerous ... reduce blood flow to your baby\" (the blood-flow line is only on the 28-week PBB page; the 16-week pages say light-headed/nauseous/dizzy)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/exercising-during-pregnancy
      fixed_to: "summary now says the weight can press on the big blood vessels and make you feel faint or light-headed (blood-flow line stays in the body, credited to the 28-week page)"
    - claim: "Better Health says many exercises can be done lying on your side instead."
      judgement: wrong
      source_says: "some of these exercises can be modified by lying on your side"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-and-exercise
      fixed_to: "Better Health says some of these exercises can be modified by lying on your side; core exercises also given sitting, standing and hands-and-knees versions"
    - claim: "If you feel faint on your back, turn onto your side."
      judgement: unsupported
      source_says: "(no cited page says this)"
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/active-pregnancy
      fixed_to: "cut"
  # Verified: 16 weeks (Royal Women's, MotherSafe, PBB sport page); 28 weeks 'particularly' (PBB exercise page); both credited in the body.
