- id: term-iol
  file: content/drafts/term-iol.md
  verdict: fix
  problems:
    - claim: "a broad term for any medical intervention that starts labour artificially; might involve medication to open your cervix, breaking your waters, medicine to start contractions, or a combination"
      judgement: unsupported
      source_says: "BHC: Induced - when a healthcare professional tries to artificially 'start' a woman's labour. PBB glossary: ARM is a form of labour induction; a balloon catheter is a type of induction of labour."
      url: https://www.betterhealth.vic.gov.au/health/servicesandsupport/medical-terms-and-definitions-during-pregnancy-and-birth
      fixed_to: "rewritten to the BHC definition plus ARM and balloon catheter as given by the PBB glossary; summary reworded to match"
