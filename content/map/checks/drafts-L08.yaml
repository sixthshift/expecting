      judgement: wrong
      source_says: "Babies are considered 'full term' if they are born at any time from 37 weeks of pregnancy (visible page text; the page's FAQ markup separately says 'between 39 and 41 weeks')."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/working-out-your-due-date
      fixed_to: "from 37 weeks of pregnancy"
