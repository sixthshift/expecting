- id: mood-swings
  file: content/drafts/mood-swings.md
  verdict: fix
  problems:
    - claim: "Abrupt mood swings are on its list of feelings that can come with the big changes of pregnancy."
      judgement: wrong
      source_says: "'Look out for these symptoms of anxiety and depression: ... abrupt mood swings ...'; usual: 'It's normal for expectant parents to experience ups and downs'; partner: 'Your partner may have mood swings during pregnancy. Try not to take this personally.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/feelings-relationships-and-pregnancy
      fixed_to: "cut (abrupt mood swings stay only in the anxiety/depression symptom list under See your doctor or midwife)"
    - claim: "help lines (PANDA 1300 726 306, Lifeline 13 11 14, Beyond Blue 1300 22 4636) sat under 'See your doctor or midwife'"
      judgement: wrong
      source_says: "Warning: If you are worried you might hurt yourself or your baby, you can call PANDA (1300 726 306), Lifeline (13 11 14), or Beyond Blue (1300 22 4636). If your life is in danger, call triple zero (000)."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/feelings-relationships-and-pregnancy
      fixed_to: "000 stays under its own 'Call 000 or go to emergency' heading; the three help lines (numbers confirmed exact) moved under their own heading 'If you're worried you might hurt yourself or your baby', not merged with the see-your-GP level (2 weeks or worried: talk to your GP or midwife, confirmed)."
