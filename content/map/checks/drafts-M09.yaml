- id: covid-vaccine-in-pregnancy
  file: content/drafts/covid-vaccine-in-pregnancy.md
  verdict: fix
  problems:
    - claim: "The Handbook, updated in October 2026, says all pregnant people can consider a dose..."
      judgement: unsupported
      source_says: "Handbook table: 'Not routinely recommended, but all pregnant women can consider a dose of COVID-19 vaccine from 20 weeks gestation in each pregnancy.' COVID-19 chapter 'updated on 01 October 2026'."
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/covid-19
      fixed_to: "Handbook wording quoted, with the chapter's update date."
    - claim: "PBB says if already vaccinated, another dose isn't routinely recommended, but you can still choose one, especially if you're in a high-risk group."
      judgement: wrong
      source_says: "PBB (last reviewed July 2025): 'If you are already vaccinated for COVID-19, you do not need to be vaccinated again during pregnancy. You can still choose to have the COVID-19 vaccine if that is your preference, or if you are in a high risk group.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/vaccinations-and-pregnancy
      fixed_to: "Credited to PBB with its review date, noted as differing from the Handbook; 'you don't need another dose... can still choose one if you're in a high-risk group or it's your preference'."
    - claim: "that risk appears much lower in those who have been vaccinated"
      judgement: wrong
      source_says: "'This risk appears to be substantially reduced during the Omicron period in women who have been vaccinated.'"
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/covid-19
      fixed_to: "appears substantially reduced in those who have been vaccinated (in the Omicron period)"
    - claim: "Babies under 6 months have been hospitalised more than older children in some countries, though their illness has mostly been mild."
      judgement: wrong
      source_says: "'Hospitalisation rates among infants aged <6 months in some countries during the Omicron period were higher than any other paediatric age groups however overall infant disease severity remained low.'"
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/covid-19
      fixed_to: "In some countries babies under 6 months were hospitalised more than any other age group of children, though overall their illness severity stayed low."
    - claim: "Side effects are similar...; pregnant people are slightly more likely to have a sore arm, and less likely to have a fever or tiredness."
      judgement: unsupported
      source_says: "Applies to 'an original mRNA COVID-19 vaccine'; 'slightly more likely to report injection site pain, and less likely to report generalised symptoms such as fever or tiredness.'"
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/covid-19
      fixed_to: "reworded to 'after an original mRNA vaccine... were... report'."
- id: live-vaccines-to-avoid
  file: content/drafts/live-vaccines-to-avoid.md
  verdict: fix
  problems:
    - claim: "Contraindicated list (no rotavirus)"
      judgement: unsupported
      source_says: "Handbook table 'contraindicated in pregnancy: live attenuated vaccines' also lists Rotavirus: 'not registered or recommended for use in adolescents or adults.'"
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
      fixed_to: "added 'rotavirus (not registered or recommended for adults anyway)'"
    - claim: "yellow fever: If travel ... is unavoidable, the Handbook says to weigh the risks and benefits of the vaccine."
      judgement: unsupported
      source_says: "Table ('Not recommended'): 'if travel to a country with a risk of yellow fever virus transmission is unavoidable, pregnant women should receive yellow fever vaccine.' Text section: 'weigh the risks and benefits of yellow fever vaccination.'"
      url: https://immunisationhandbook.health.gov.au/contents/vaccination-for-special-risk-groups/vaccination-for-women-who-are-planning-pregnancy-pregnant-or-breastfeeding
      fixed_to: "Both given: the table says pregnant women should receive the vaccine, the guidance says to weigh risks and benefits."
- id: partner-flu-vaccine
  file: content/drafts/partner-flu-vaccine.md
  verdict: fix
  problems:
    - claim: "task get-partner-flu-vaccine (opens 4, who partner)"
      judgement: unsupported
      source_says: "Duplicate: content/items/partner-prep.md already has task partner-vaccines ('Get the whooping cough booster (if due) and this year's flu vaccine', opens 28, due 36, who partner), and its body covers the flu vaccine."
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/influenza-flu
      fixed_to: "cut (tasks block removed)"
    - claim: "Pregnant people are one of those groups [high risk], and babies are among those more likely to get severe flu."
      judgement: unsupported
      source_says: "Handbook says household contacts of people in high-risk groups are recommended annual vaccine because they 'can transmit influenza to people who have a higher risk of complications'; it doesn't call pregnancy a high-risk group in that sentence (it separately recommends vaccine in each pregnancy and notes increased risk of illness/death for women with flu in pregnancy). Nothing on babies being more likely to get severe flu."
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/influenza-flu
      fixed_to: "reworded to the Handbook's household-contact and pregnancy statements; baby claim cut; summary reworded"
    - claim: "If you had last year's vaccine late in the year, you're still recommended to get the new season's one."
      judgement: unsupported
      source_says: "Handbook says protection requires annual vaccination; the 'late in the year' case is not stated for partners."
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/influenza-flu
      fixed_to: "cut"
    - claim: "Where, and the cost: free under the NIP for certain groups...; a fee may be charged"
      judgement: unsupported
      source_says: "Handbook says NIP-funded for specific groups, none of which is a partner; no statement about fees on the page. Off topic for household contacts."
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/influenza-flu
      fixed_to: "cut"
