      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/rhesus-d-negative-pregnancy
      fixed_to: "predict RhD positive or negative; if negative, you might not need anti-D injections."
- id: third-trimester-bloods
  file: content/drafts/third-trimester-bloods.md
  verdict: fix
  problems:
    - claim: "You can catch it after a negative test"
      judgement: unsupported
      source_says: "Page only says 'If you have had syphilis and recovered in the past, you can still get it again.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/syphilis-and-pregnancy
      fixed_to: "cut"
    - claim: "Most of your blood tests are done at the first antenatal visit"
      judgement: unsupported
      source_says: "'In early pregnancy, usually at your first antenatal visit, you will have tests for' blood type, iron/haemoglobin, infections."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/blood-tests-during-pregnancy
      fixed_to: "Many of your blood tests are done early in pregnancy, usually at your first antenatal visit, but a few are repeated around the third trimester."
- id: growth-scans
  file: content/drafts/growth-scans.md
  verdict: fix
  problems:
    - claim: "If the baby isn't growing as expected, closer monitoring with more scans, and sometimes advice to give birth at a major hospital, or an induction or caesarean..."
      judgement: unsupported
      source_says: "'If your doctor suspects that you have placental insufficiency, they will closely monitor...extra ultrasound scans...may recommend that you give birth in a major hospital...' and induction/caesarean 'if there are signs that your baby is not well'."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placental-insufficiency
      fixed_to: "If your doctor suspects placental insufficiency (the placenta not working well), closer monitoring with more scans, sometimes advice to give birth at a major hospital, and an induction or caesarean before your due date if there are signs the baby isn't well."
