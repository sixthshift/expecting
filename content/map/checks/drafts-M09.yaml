# Fact-check of 20 drafted Library entries (batch M09) against their listed sources,
# fetched 2026-10-29. Note: the Royal Women's genetic-testing page is undated and
# older (it says NIPT is only in specialist centres), so its miscarriage figures
# were cut rather than kept. ok = every claim supported; fix = edited to match sources.
# All 20 carry checked: 2026-10-29.
- id: high-chance-result
  file: content/drafts/high-chance-result.md
  verdict: ok
- id: cvs
  file: content/drafts/cvs.md
  verdict: fix
  problems:
    - claim: "The Royal Women's Hospital puts it at 1 in 100."
      judgement: unsupported
      source_says: "PBB (current): 'Having a CVS can slightly increase that risk' (no figure). RWH page is undated and outdated on genetic testing (says NIPT only in some specialist centres), so its 1% figure can't be credited as current."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/antenatal-care-and-tests/chorionic-villus-sampling-cvs
      fixed_to: "cut (RWH source removed from sources:)"
