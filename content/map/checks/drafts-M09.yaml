      judgement: wrong
      source_says: "Before an ECV 'You will be connected to a fetal monitor (CTG)... for 20 to 40 minutes'; after, heart rate is also monitored (no duration given)."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/external-cephalic-version-ecv
      fixed_to: "before turning a breech baby (ECV), for example, for 20 to 40 minutes."
