- id: oral-decongestants
  file: content/drafts/oral-decongestants.md
  verdict: fix
  problems:
    - claim: "KEMH and healthdirect say they're not recommended, naming pseudoephedrine and phenylephrine"
      judgement: wrong
      source_says: "KEMH: 'Oral medicines to treat a blocked nose, such as pseudoephedrine or phenylephrine, are not recommended in pregnancy.' healthdirect: 'You should not use oral decongestants such as phenylephrine.' PBB: 'Oral decongestant medicines are not safe to use during pregnancy.'"
      url: https://www.healthdirect.gov.au/medicines/medicines-during-pregnancy
      fixed_to: "each source now credited in its own words (PBB 'not safe', KEMH 'not recommended', healthdirect 'should not use ... such as phenylephrine'); MotherSafe's measured view kept separate"
    - claim: "summary: oral decongestants 'aren't recommended' (merged all four sources)"
      judgement: wrong
      source_says: "MotherSafe: no conclusive data of harm in the first trimester; do not use in the 2nd and 3rd trimester if you have high blood pressure"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/docs/Cold%20in%20pregnancy%20and%20breastfeeding%20.pdf
      fixed_to: "summary names PBB, KEMH and healthdirect and says MotherSafe is more measured"
    - claim: "'Pseudoephedrine and phenylephrine narrow blood vessels...' unattributed; breastfeeding line unattributed"
      judgement: unsupported
      source_says: "blood-vessel line is MotherSafe's; breastfeeding line (reduce milk supply, irritable baby) is PBB's cold and flu page"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/cold-and-flu-during-pregnancy
      fixed_to: "attributed to MotherSafe and PBB respectively"
    - claim: "nasal-spray safety and limits (3 days KEMH/healthdirect, 5 days MotherSafe), accidental exposure, steam/saline, check ingredients"
      judgement: ok
      source_says: "confirmed in KEMH, healthdirect, MotherSafe"
      url: https://kemh.health.wa.gov.au/Pregnancy-and-Birth/After-your-pregnancy/Pharmacy/Medicines-in-pregnancy
      fixed_to: "unchanged"

