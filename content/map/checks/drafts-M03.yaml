  verdict: fix
  problems:
    - claim: "Lots of people take something before they find out they're pregnant. It's often reassuring"
      judgement: unsupported
      source_says: "KEMH: in very early pregnancy a harmful exposure is most likely 'all or nothing' (miscarriage or no significant effect); first trimester birth defects; later growth problems, preterm birth, newborn withdrawal. No source says it is common or 'often reassuring'."
      url: https://kemh.health.wa.gov.au/Pregnancy-and-Birth/After-your-pregnancy/Pharmacy/Medicines-in-pregnancy
      fixed_to: "'If you took something before you found out you're pregnant, the answer depends on the medicine and when you took it...'"
    - claim: "if you took [an anti-inflammatory] accidentally, MotherSafe says you can generally be reassured"
      judgement: unsupported
      source_says: "'Women who have accidentally used anti-inflammatory medicines can be generally reassured but there are various reasons to avoid NSAIDs at different stages of pregnancy.'"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Pain%20in%20Pregnancy.pdf
      fixed_to: "added 'though there are various reasons to avoid them at different stages of pregnancy'"
    - claim: "MotherSafe herbal-medicines page listed in sources"
      judgement: unsupported
      source_says: "no claim in the body comes from it"
