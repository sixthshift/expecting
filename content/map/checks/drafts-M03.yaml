      source_says: "PBB: 'Fermented drinks can contain small amounts of alcohol... These drinks include: kombucha, kefir, ginger beer' (no kvass). NSW Food Authority: 'Fermented drinks like kombucha, kvass, kefir and ginger beer can contain residual alcohol'; 'certain drinks that also present a higher risk'."
      url: https://www.foodauthority.nsw.gov.au/consumer/life-events-and-food/pregnancy/why-avoid-certain-foods
      fixed_to: "NSWFA credited with all four; PBB credited with kombucha, kefir and ginger beer"
  # Level note (not changed): no source tells you to avoid shop-bought kombucha outright. PBB: no safe level of alcohol; NSWFA:
