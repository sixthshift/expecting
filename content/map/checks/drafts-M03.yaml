# Fact-check of drafted Library entries, batch M03 (can-i: drinks and medicines): 20 drafts in
# content/drafts/, every claim checked against the pages in `sources:` (fetched/re-read 2026-10-29).
# verdict "fix" = text rewritten to the source; "ok" = no change; `checked: 2026-10-29` added
# only where every claim was confirmed against a loaded page.

- id: cough-medicines
  file: content/drafts/cough-medicines.md
  verdict: fix
  problems:
    - claim: "Pregnancy, Birth and Baby still lists pholcodine as safe for a dry cough (placed after the answer, summary led with the safe medicines)"
      judgement: wrong
      source_says: "TGA: 55 pholcodine-containing products are being cancelled from the ARTG and those on shelves recalled (cancellation effective 29 March 2023); MotherSafe: 'pholcodine has been recalled in Australia due to interactions with some agents used during general anaesthesia, resulting in anaphylaxis'. (PBB/healthdirect medicines page, last reviewed June 2024, still lists 'pholcodine or dextromethorphan' as safe.)"
      url: https://www.tga.gov.au/news/media-releases/pholcodine-cough-medicines-cancelled-tga-and-recalled-pharmacies-safety-reasons
      fixed_to: "Body now leads with 'Pholcodine is no longer sold in Australia' (TGA cancelled 55 products in March 2023, shelf stock recalled), mentions only 'Some older pages still list it', and gives the anaesthesia reason and the 12-month advice (TGA/WA Health). Summary says no longer sold. TGA page added to sources; PBB medicines page removed from sources (no longer used)."
    - claim: "cold and flu combinations contain oral decongestants 'that aren't recommended in pregnancy'"
      judgement: unsupported
      source_says: "MotherSafe: pseudoephedrine and phenylephrine are the oral decongestants in many combination cold and flu tablets; best to check ingredients with MotherSafe, doctor or pharmacist. (Views on oral decongestants differ by source; see oral-decongestants.)"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/docs/Cold%20in%20pregnancy%20and%20breastfeeding%20.pdf
      fixed_to: "'which contain several ingredients, including in many cases an oral decongestant (see Sudafed and oral decongestants)'"
    - claim: "all other claims (dextromethorphan dry cough; bromhexine/guaifenesin chesty; MotherSafe no large studies but widely used; dihydrocodeine; rest, fluids, honey and lemon; recommended dose; flu see doctor, antiviral earlier)"
      judgement: ok
      source_says: "confirmed in KEMH, MotherSafe cold factsheet and PBB cold and flu page"
      url: https://kemh.health.wa.gov.au/Pregnancy-and-Birth/After-your-pregnancy/Pharmacy/Medicines-in-pregnancy
      fixed_to: "unchanged"

