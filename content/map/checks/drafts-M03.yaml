- id: cooking-with-alcohol
  file: content/drafts/cooking-with-alcohol.md
  verdict: fix
  problems:
    - claim: "the baby's blood alcohol reaches the same level as yours"
      judgement: wrong
      source_says: "'crosses the placenta producing levels in the developing baby's bloodstream that are as high as those in the mother'"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Alcohol%20in%20Pregnancy.pdf
      fixed_to: "'producing levels in the baby's bloodstream as high as yours'"
    - claim: "summary: any small amount before you knew is likely low risk"
      judgement: wrong
      source_says: "'likely to be low if a woman has consumed only small amounts of alcohol before she knew she was pregnant or during pregnancy'"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Alcohol%20in%20Pregnancy.pdf
      fixed_to: "'after only small amounts of alcohol before you knew you were pregnant or during pregnancy'"
    - claim: "If you're unsure about a dish, leave it"
      judgement: unsupported
      source_says: "sheet gives advice on alcohol intake only; says discuss concerns with doctor or midwife"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Alcohol%20in%20Pregnancy.pdf
      fixed_to: "'ask your doctor or midwife'"
    - claim: "If you've already eaten something, MotherSafe says the risk from small amounts is likely to be low (applied the drinking advice to food)"
      judgement: unsupported
      source_says: "the sheet covers alcohol consumed, not food cooked with it"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Alcohol%20in%20Pregnancy.pdf
      fixed_to: "rewritten to 'already had some alcohol', adds that the sheet is about alcohol itself, not food cooked with it"
    - claim: "'risk of harm grows with frequent drinking and large amounts in a short time'"
      judgement: ok
      source_says: "'risk of harm increases when alcohol is consumed frequently and in large amounts over a short period' (wording tightened)"
      url: https://www.seslhd.health.nsw.gov.au/sites/default/files/groups/Royal_Hospital_for_Women/Alcohol%20in%20Pregnancy.pdf
      fixed_to: "tightened to the source wording"

