# Fact-check of drafted Library entries, batch M14 (20 drafts in mind-and-circumstances), checked 2026-10-29
# against the pages in each draft's sources: (re-fetched 2026-10-29).
- id: epilepsy-pointer
  file: content/drafts/epilepsy-pointer.md
  verdict: fix
  problems:
    - claim: "Epilepsy is on the list of conditions that make a pregnancy higher risk, which means closer care: more frequent appointments with both your obstetrician and your neurologist."
      judgement: wrong
      source_says: "PBB: pre-existing medical conditions (such as epilepsy ...) may increase the chance of complications. EAA: more frequent appointments with both obstetrician and neurologist only 'if someone has had frequent seizures during pregnancy, especially during the third trimester'; otherwise 'They will want to monitor you closely throughout.'"
      url: https://www.epilepsy.org.au/epilepsy-pregnancy/
      fixed_to: "PBB lists epilepsy among pre-existing conditions that may make a pregnancy higher risk; EAA says talk to neurologist/GP/obstetrician and they will want to monitor you closely; the frequent-appointments line moved to The birth, with its condition."
    - claim: "doctors may monitor blood levels and raise a dose even if you're not having seizures. It usually goes back down soon after the birth."
      judgement: wrong
      source_says: "Some medications may deplete; doctor may need to monitor and increase regardless of seizures. 'most likely to be returned to pre-pregnancy levels shortly after delivery'"
      url: https://www.epilepsy.org.au/epilepsy-pregnancy/
      fixed_to: "wording as the source, 'most likely'"
    - claim: "a fall can cause injury"
      judgement: wrong
      source_says: "Injury to the foetus if the mother has a severe fall or serious injury"
      url: https://www.epilepsy.org.au/epilepsy-pregnancy/
      fixed_to: "a severe fall or serious injury can injure the baby"
    - claim: "The aim is usually one medicine at the lowest dose"
      judgement: wrong
      source_says: "ideally aim to use one medication at the lowest possible dose"
      url: https://www.epilepsy.org.au/epilepsy-pregnancy/
      fixed_to: "'ideally aim' wording"
    - claim: "Valproate paragraph lacked the regulator's statement"
      judgement: unsupported
      source_says: "TGA: It is well known that valproate can cause malformations and neurodevelopmental disorders in babies born to women taking valproate before and during pregnancy. Because of this, women and people who can give birth to children are advised to avoid taking this medicine at those times."
      url: https://www.tga.gov.au/safety/safety-monitoring-and-information/safety-alerts/valproate-safety-alert
      fixed_to: "added, credited to the TGA beside EAA's 'do not stop taking your medications' advice (both kept, each credited); TGA page added to sources. Also added EAA's valproate prescribing line and the labour/delivery seizure risk and 'report to neurologist' detail."
- id: loss-and-work
  file: content/drafts/loss-and-work.md
  verdict: fix
  problems:
    - claim: "taken as 2 days together, 2 separate days, or as agreed with your employer"
      judgement: wrong
      source_says: "a single continuous 2 day period; 2 separate periods of 1 day each; any separate periods as agreed with their employer"
      url: https://www.fairwork.gov.au/leave/compassionate-and-bereavement-leave
      fixed_to: "wording as Fair Work's page"
    - claim: "This applies to deaths on or after 7 November 2025."
      judgement: wrong
      source_says: "This protection applies where a child is stillborn or dies on or after 7 November 2025."
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/stillbirth-premature-birth-or-death-of-a-child
      fixed_to: "'This protection applies where a child is stillborn or dies on or after 7 November 2025.' (it covers employer-funded paid parental leave only; 2 days compassionate leave, 12 months unpaid parental leave and the casual-unpaid rule all confirmed on the Fair Work pages; Miscarriage Australia says '2 days of paid' without the casual exception, Fair Work's casual-unpaid wording kept)"
- id: ivf-pregnancy
  file: content/drafts/ivf-pregnancy.md
  verdict: fix
  problems:
    - claim: "Counselling, on your own or as a couple, can help."
      judgement: unsupported
      source_says: "Gidget: If your relationship is struggling, consider seeing someone who specialises in couple's therapy."
      url: https://www.gidgetfoundation.org.au/fact-sheets/assisted-reproduction
      fixed_to: "If your relationship is struggling, Gidget Foundation suggests seeing someone who specialises in couple's therapy. (PBB's complication list confirmed item for item: vaginal bleeding, blood clots in early pregnancy, high blood pressure, gestational diabetes, premature birth, birth by caesarean, child with a congenital disorder; higher chance of multiples if more than one embryo transferred. PANDA 75% and Gidget GP-referral/bulk-billed lines confirmed.)"
- id: surrogacy
  file: content/drafts/surrogacy.md
  verdict: fix
  problems:
    - claim: "It's illegal to pay a surrogate. The intended parents pay the surrogate's pregnancy-related costs. / The surrogate can make the intended parents repay their costs."
      judgement: wrong
      source_says: "PBB: 'surrogacy arrangements must be altruistic. Altruistic surrogacy means that the surrogate is not paid for carrying the pregnancy. However, the intended parents must pay for the surrogate's pregnancy-related costs. This is legal in Australia.' and 'the surrogate can force the intended parents to pay them back for any costs involved in the process.' (PBB page does not use the word 'refund'; both the 'must pay' and the 'pay them back' statements are kept, as PBB words them.)"
      url: https://www.pregnancybirthbaby.org.au/parenting-and-family/adoption-and-surrogacy/surrogacy
      fixed_to: "'must be altruistic: the surrogate is not paid for carrying the pregnancy' + 'the intended parents must pay for the surrogate's pregnancy-related costs' + 'the surrogate can force the intended parents to pay them back'; commercial surrogacy defined as PBB does; summary reworded to match. Everything else (rules by state, counselling, $55,000-$75,000, Medicare, parentage order, Rainbow Families relationship-centred line, Attorney-General's site) confirmed."
- id: twins-and-multiples-support
  file: content/drafts/twins-and-multiples-support.md
  verdict: fix
  problems:
    - claim: "Parents of multiples are more likely to become depressed...: AMBA cites research finding clinical anxiety three times and depression five times as common in birth parents of twins as in those with one baby."
      judgement: wrong
      source_says: "mothers of twins experience rates of clinical anxiety ... three times higher than among mothers of singletons and rates of depression five times higher"
      url: https://www.amba.org.au/support/information/perinatal-mental-health
      fixed_to: "kept the source's subject: 'mothers of twins' vs 'mothers of singletons'; 'mothers of multiples' for the general risk statement"
    - claim: "if you're struggling, talk to your GP, child health nurse or hospital social worker; accept help"
      judgement: unsupported
      source_says: "Gidget: 'Speaking to the hospital social worker or someone at AMBA may help'; 'ask for help if needed'. No listed page names GP or child health nurse."
      url: https://www.gidgetfoundation.org.au/fact-sheets/multiple-births
      fixed_to: "hospital social worker or someone at AMBA; ask for help if you need it"
    - claim: "When to get help: Contact your doctor immediately if your tummy feels tight, hurts or suddenly gets bigger, if you put on weight very quickly, or if you're short of breath (signs of TTTS)"
      judgement: unsupported
      source_says: "PBB on TTTS: rare condition in identical twins sharing a placenta and sac; blood flows from one twin to the other; can be very severe; care transferred to specialists. No listed page gives these symptoms or an urgency level; Royal Women's TTTS page did not load usable text and web search was unavailable."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/multiple-pregnancy/twin-pregnancy
      fixed_to: "cut the symptom list and 'immediately'; replaced the section with PBB's TTTS description. NOTE FOR CALLER: this removes a red-flag list; if wanted, source it from Royal Women's / Better Health TTTS pages in a later pass."
