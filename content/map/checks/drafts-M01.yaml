  file: content/drafts/breathlessness.md
  verdict: fix
  problems:
    - claim: "summary: breathlessness that is new, getting worse, or comes with chest pain or a racing heart needs help straight away"
      judgement: unsupported
      source_says: "healthdirect warning signs: contact your doctor, midwife or hospital immediately if you have shortness of breath or a racing heartbeat. healthdirect SOB page: call 000 if can't speak, chest/arm/jaw pain, sweaty and pale, blue lips, drowsy or confused; unexplained breathing problems: see your doctor as soon as possible. No page frames 'new' breathlessness as urgent."
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
      fixed_to: "summary reworded to the two levels the pages give (contact doctor/midwife/hospital immediately about shortness of breath or racing heartbeat; call 000 if you can't speak, have chest pain or blue lips)"
    - claim: "you ... need more of your usual asthma medicine"
      judgement: wrong
      source_says: "you are needing more of your usual asthma or lung medications"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/pregnancy-rhinitis
      fixed_to: "asthma or lung medications"
    - claim: "'(as soon as possible)' under See your doctor; list without lead-in"
      judgement: unsupported
      source_says: "If you have unexplained breathing problems, see your doctor as soon as possible"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/pregnancy-rhinitis
      fixed_to: "added lead-in 'See your doctor if:' and 'see your doctor as soon as possible'. Heading changed to the README's 'Call 000 or go to emergency'. Other claims (week 20/29/36 notes, both healthdirect lists, rhinitis 000 line) confirmed."
