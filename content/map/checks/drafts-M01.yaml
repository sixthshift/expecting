      judgement: wrong
      source_says: "healthdirect: see your doctor or midwife as soon as possible if you have weight loss. RWH: contact your doctor or the hospital if you have lost a lot of weight quickly (ongoing vomiting plus continued loss is 'talk with your dietitian or doctor')."
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
      fixed_to: "summary now 'as soon as possible ... if you've lost a lot quickly, contact your doctor or the hospital'. Heartburn ('see your doctor immediately' if losing weight) and pelvic pain ('immediately', losing weight without trying) lines confirmed; RWH 'contact your doctor or the hospital' list confirmed."
- id: hard-and-safe-cheeses
  file: content/drafts/hard-and-safe-cheeses.md
  verdict: fix
  problems:
    - claim: "Pasteurised cream cheese, plain cottage cheese, cheese spreads and processed cheese are fine too, with a little care. (summary and opening stated them as fine; sources differ)"
      judgement: wrong
      source_says: "NSW Food Authority: 'Processed cheese, cheese spreads, cottage cheese, cream cheese, etc. Eat with caution: store in the fridge; eat within two days of opening.' PBB (foods to avoid page): 'Other types of cheese that you can eat are: cream cheese, cheese spreads, plain cottage cheese. These should be stored in the fridge and eaten within 2 days of opening.' PBB food guide: processed cheese, cottage and cream cheese (pasteurised): Yes. FSANZ: safer alternatives include pasteurised cream cheese, plain cottage cheese."
      url: https://www.foodauthority.nsw.gov.au/consumer/life-events-and-food/pregnancy/foods-to-eat-or-avoid-when-pregnant
      fixed_to: "summary, opening and What to do now credit each: NSW 'eat with caution', PBB 'fine', FSANZ 'safer alternatives'; the 2-day fridge rule credited to NSW and PBB only (FSANZ says only to store in the fridge)."
    - claim: "Food Standards Australia New Zealand lists mozzarella ... among the higher-risk soft and semi-soft cheeses, unless cooked to 75 °C inside. ... If you'd rather be cautious, eat mozzarella only cooked to at least 75 °C and eaten straight away"
      judgement: unsupported
      source_says: "FSANZ: higher risk: 'soft, semi soft and surface ripened cheeses, pre-packaged and delicatessen (e.g. brie, camembert, mozzarella, ricotta, feta and blue)'; safer alternatives: 'hard cheeses, pasteurised cream cheese, plain cottage cheese, baked soft cheeses (cooked to an internal temperature of 75°C)'. NSW: soft cheeses 'do not eat (high risk) unless thoroughly cooked to at least 75°C and eaten soon afterwards'. PBB: soft cheeses 'can eat if cooked to at least 75°C and eaten straight away'. Only FSANZ names mozzarella; PBB's food guide lists pasteurised mozzarella, halloumi and paneer as Yes (kept)."
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/Food-safety-for-vulnerable-populations
      fixed_to: "FSANZ credited with 'baked soft cheeses cooked to 75 °C' as its safer alternative; the 'eaten straight away' advice credited to NSW/PBB for soft cheeses in general, not to mozzarella. Hard cheeses, listeria harms, pasteurised only, manufacturer-packaged (FSANZ), PBB mozzarella/haloumi/paneer Yes, and 'neither FSANZ nor NSW mentions haloumi or paneer' confirmed."
