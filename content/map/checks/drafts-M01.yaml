      judgement: wrong
      source_says: "PBB HG: Contact your midwife or doctor if you: experience frequent or uncontrollable vomiting; have ongoing nausea that makes it difficult to eat and drink enough; you are losing weight (three separate triggers). RWH: if ongoing vomiting and continue to lose weight, talk with your dietitian or doctor; your dietitian may recommend supplements."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/severe-vomiting-during-pregnancy-hyperemesis-gravidarum
      fixed_to: "the three triggers listed separately as the page gives them; RWH wording for the dietitian/supplements line"
