- id: weight-loss
  file: content/drafts/weight-loss.md
  verdict: fix
  problems:
    - claim: "## Go to emergency: The Royal Women's Hospital says to go to emergency if you can't keep food or fluids down."
      judgement: wrong
      source_says: "If you can't keep food or fluids down, go to the Women's Emergency Centre. (RWH advice to its own patients, naming its own centre; the generic line is 'If you or your baby require urgent medical attention, please contact your nearest emergency department.')"
      url: https://www.thewomens.org.au/images/uploads/fact-sheets/Nausea_vomiting_hyperemesis_in_pregnancy_260721.pdf
      fixed_to: "Heading is the README's 'Call 000 or go to emergency'; sentence now credits it as RWH telling its own patients to go to its Women's Emergency Centre"
