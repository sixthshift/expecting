- id: anti-d
  file: care.yaml
  verdict: fix
  problems:
    - covers: "also after any sensitising event, bleeding, a fall or knock, amniocentesis, within 72 hours"
      judgement: wrong
      source_says: "PBB: 'There is not enough evidence to say that RhD negative women who bleed in their first 12 weeks of pregnancy need anti-D. However, if the bleeding happens again, is heavy or comes with stomach pain or serious injuries to the pelvis, anti-D may be recommended.' Sensitising events listed: CVS or amniocentesis, miscarriage, termination at 10 weeks or more, obstetric haemorrhage, injury or accident to the abdomen, ECV, labour, ectopic or molar pregnancy. Anti-D 'should be given within 72 hours... However, it can still be given after this time.'"
