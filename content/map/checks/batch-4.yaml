- id: epidural
  file: labour-and-birth.yaml
  verdict: fix
  problems:
    - covers: "the most effective relief, usually within 20 to 30 minutes, and you stay awake and aware"
      judgement: wrong
      source_says: "PBB: 'It usually takes between 25 to 40 minutes for the epidural to be set up and take full effect so that you are pain free.' It calls an epidural 'very effective', not the most effective. Awake and aware is ok."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/pain-relief/epidural
    - covers: "the trade-offs, a drip, continuous CTG, a catheter, less or no mobility, a longer second stage and a higher chance of forceps or vacuum"
      judgement: wrong
      source_says: "PBB: an epidural 'may extend the second stage of labour and increase your chance of needing an assisted delivery' and does not make a caesarean more likely. RANZCOG: 'Modern epidural techniques may slightly lengthen your labour but do not impact the chance of you needing assistance with the birth or caesarean birth.' The sources disagree, and PBB says 'may', not 'higher'. Drip, continuous CTG, catheter and staying in bed are ok."
      url: https://ranzcog.edu.au/wp-content/uploads/Pain-Relief-Labour-Childbirth.pdf
    - covers: "side effects, a drop in blood pressure, itching, shivering, fever, patchy relief, a headache in about 1 in 100"
      judgement: wrong
      source_says: "PBB lists: blood pressure may fall, you may shake or feel itchy, may be harder to push, may not get full pain relief, back bruised for a couple of days; complications: 'rarely' a bad headache within 24 to 48 hours, a small chance of skin infection, 'very rarely' permanent nerve damage or paralysis. No fever and no 1 in 100 figure on any cited page."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/pain-relief/epidural
    - covers: "you can ask for one at most points but not always get it at once, the anaesthetist may be in theatre"
      judgement: unsupported
      source_says: "PBB: you can have one 'at any stage of labour if there are no medical reasons', and not in birth centres or at home births. Nothing about delays or the anaesthetist being in theatre."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/pain-relief/epidural
    - covers: "notes: the assisted-birth link is [shown]"
      judgement: wrong
      source_says: "The note says current sources show the assisted-birth link. PBB says it may increase the chance; RANZCOG says it does not change it. Note reworded to say the sources disagree. (Twins, high blood pressure, a likely caesarean, and prolonged labour as reasons it may be recommended are ok; so is anaesthetist, local anaesthetic and an opioid, topped up.)"
      url: https://ranzcog.edu.au/wp-content/uploads/Pain-Relief-Labour-Childbirth.pdf

- id: induction
  file: labour-and-birth.yaml
  verdict: fix
  problems:
    - covers: "why it is offered (overdue, waters broken without labour, diabetes, high blood pressure, growth concerns, age) and that it is an offer"
      judgement: unsupported
      source_says: "Age is not a listed reason on PBB, RANZCOG or the Women's. The others are ok (PBB: overdue at 41 to 42 weeks, waters broken without contractions after 24 to 48 hours, diabetes, blood pressure problems, growth concerns)."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/induced-labour
    - covers: "the methods in order, a sweep, prostaglandin gel or pessary, a balloon catheter, breaking the waters, an oxytocin drip"
      judgement: wrong
      source_says: "The sources give no fixed order: the method is chosen after an examination of the cervix and may be one or a combination (PBB, RANZCOG, the Women's). A membrane sweep is not part of induction on any of the three induction pages (it is offered separately on the PBB Overdue page)."
      url: https://ranzcog.edu.au/wp-content/uploads/Induction-Labour.pdf
    - covers: "what it changes about pain relief, positions and the chance of assisted birth or caesarean"
      judgement: wrong
      source_says: "PBB: with induction there is a higher chance of continuous monitoring, more vaginal examinations and seeking pain relief sooner; 'no difference in how often forceps or vacuum is used'; 'no restriction on the type of pain relief'. RANZCOG: 'does not increase the chances of obstetric interventions' when performed appropriately. The Women's: induction for reasons other than prolonged pregnancy 'may increase the chance that you will need an emergency caesarean', and oxytocin plus CTG makes it hard to move around."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour-complications/induced-labour
    - covers: "notes: induction rates are high and rising in Australia"
      judgement: unsupported
      source_says: "The Women's says 'approximately one-third of women have an induction of labour'. Nothing about a rising rate. Note reworded. (A day or more, staying in hospital, contractions that can be stronger, and the questions to ask are ok.)"
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/labour-birth/induction-of-labour

- id: overdue
  file: labour-and-birth.yaml
  verdict: fix
  problems:
    - covers: "extra monitoring (a CTG, an ultrasound of the fluid) from about 41 weeks, a sweep then an induction are offered and when each hospital offers them"
