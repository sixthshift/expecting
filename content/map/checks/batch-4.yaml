- id: whooping-cough-vaccine
  file: care.yaml
  verdict: fix
  problems:
    - covers: "it cuts whooping cough in young babies by about 90 percent until their own vaccines at 6 weeks"
      judgement: wrong
      source_says: "Handbook: vaccination in pregnancy 'reduces the risk of pertussis in young infants (aged 3-4 months) by 90%'. Department of Health: 'Babies will have some protection until they can have their first immunisations at 6 weeks of age.' The 90 percent figure is not tied to the 6-week window."
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/pertussis-whooping-cough
    - covers: "at the GP, a pharmacy or the antenatal clinic"
      judgement: unsupported
      source_says: "Neither page says where to get the vaccine (the Department page only points to a 'Getting vaccinated' page). (20 to 32 weeks every pregnancy, free under the NIP, and 'as soon as possible and at any time up to delivery' if missed are ok; the Handbook adds that given within 2 weeks of delivery the newborn may not be adequately protected.)"
      url: https://www.health.gov.au/topics/immunisation/when-to-get-vaccinated/immunisation-for-pregnancy

- id: rsv-vaccine
  file: care.yaml
  verdict: fix
  problems:
    - covers: "Abrysvo, a single dose from 28 weeks, best by the end of 36, free under the NIP since 2025"
      judgement: unsupported
      source_says: "Single dose from 28 weeks, 'administration by the end of 36 weeks gestation is encouraged', and funded under the NIP are ok. 'Since 2025' is not stated on either page."
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/respiratory-syncytial-virus-rsv
    - covers: "protects the baby from birth for about 6 months against RSV, the top cause of hospital stays in babies"
      judgement: wrong
      source_says: "Handbook: RSV 'is a leading cause of lower respiratory tract disease hospitalisation in infants aged <12 months', not the top cause. Maternal vaccination 'reduces the risk of severe RSV disease in infants <6 months of age by around 70%'. The Department page says it protects the baby 'from birth' and 'in their vulnerable early months'."
      url: https://immunisationhandbook.health.gov.au/contents/vaccine-preventable-diseases/respiratory-syncytial-virus-rsv

