      source_says: "PBB: if overdue (42 weeks) checks may include an ultrasound scan and a CTG, perhaps twice a week; it does not say the scan measures fluid. Better Health Channel: from one week past the due date, closely monitored with CTG and ultrasound. A sweep and then induction are offered (ok). When each hospital offers them is not on any page."
      url: https://www.pregnancybirthbaby.org.au/labour-and-birth/labour/overdue
    - covers: "notes: induction offered at 41 weeks at most hospitals, 41+3 or later at some"
      judgement: unsupported
      source_says: "Better Health Channel: overdue babies are 'generally induced once it is 2 weeks past its expected date'. PBB induction: overdue 41 to 42 weeks. The Women's: more than 10 to 12 days beyond the due date. The 41+3 figure is not on any page. Note reworded to the source figures. (Full term 37 to 42, overdue past 42, about 5 in 100 babies, home remedies without evidence, and your choice are ok.)"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/baby-due-date

- id: assisted-birth
  file: labour-and-birth.yaml
  verdict: fix
  problems:
    - covers: "the higher chance of a serious tear"
      judgement: wrong
      source_says: "PBB lists 'a perineal tear (injury to the skin or muscle between your vagina and anus)' among risks, with bruising and pelvic floor injury; it does not say serious or a higher chance. RANZCOG: bruising might 'not be any worse than a spontaneous birth', and an episiotomy is used 'to minimise any tearing'. (About 1 in 10, first birth, vacuum, forceps, episiotomy and marks that fade are ok; RANZCOG says it is sometimes done in theatre, which the entry's 'usually in the birth room' does not say.)"
