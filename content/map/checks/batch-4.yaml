- id: when-to-go-to-hospital
  file: labour-and-birth.yaml
  verdict: fix
  problems:
    - covers: "call straight away if the waters break, for bleeding, for green or brown fluid, or if the baby's movements change"
      judgement: wrong
      source_says: "Better Health Channel: 'If your waters break or if you start bleeding from the vagina, go immediately to hospital.' PBB Going to hospital lists waters breaking, bleeding, fever, any change in baby's movements and contractions before 37 weeks as reasons to go to hospital or birth centre. KEMH: waters breaking, regular contractions or blood loss, 'call KEMH or your midwife immediately'. PBB waters page: green, brown or blood-coloured fluid, call immediately for advice, or go to hospital. So the sources say call or go, not just call. (The 5 minutes apart / far away / not comfortable at home line is Better Health Channel and is ok; PBB gives a different rule for the first labour, at least 3 contractions in 10 minutes.)"
      url: https://www.betterhealth.vic.gov.au/health/healthyliving/pregnancy-labour

