      judgement: unsupported
      source_says: "'A blood product made from plasma' is ok. Cost is not mentioned for anti-D on either page (the free RhD NIPT is also not stated; PBB says only that Medicare changes made the RhD NIPT easier to get)."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/rhesus-d-negative-pregnancy

