# Fact-check of drafted Library entries, batch B1 (red-flag symptoms): 21 drafts in
# content/drafts/, every claim and each warning's level checked against the pages in
# `sources:` (fetched 2026-10-29). verdict "fix" = text rewritten to the source and
# `checked: 2026-10-29` added; "ok" = no change needed, `checked` added.
# Level notes (not changed, for the owner):
#  - PBB "Bleeding during pregnancy" puts 2 pads/hour under "contact your obstetrician or
#    call an ambulance" and "contact your doctor urgently or ED"; its miscarriage page puts
#    1+ pads/hour under "call 000 or go to ED". heavy-bleeding / spotting go by 1 and say
#    so; bleeding-after-20-weeks now states the 2 vs 1 difference too.
#  - PBB's sepsis banner offers "see your doctor urgently, or ED, or 000" in one sentence;
#    fever keeps that wording under Call 000. healthdirect's fever page says "go to the
#    nearest hospital emergency department immediately" (ED, not 000) for fever with
#    seizures, confusion or difficulty breathing; fever now says so, still under Call 000.
#  - PBB/healthdirect early-pregnancy dizziness/fainting: PBB low-BP and ectopic pages say
#    ED or 000; healthdirect's warning-signs page says contact doctor/midwife/hospital
#    immediately. dizziness-and-fainting gives both, as drafted.

- id: swollen-feet-and-ankles
  file: content/drafts/swollen-feet-and-ankles.md
  verdict: fix
  problems:
    - claim: "sudden swelling of your face, hands or feet, or swelling with a very severe headache ... changes to your vision, severe pain just below your ribs, feeling sick or vomiting, or heartburn that antacids don't ease"
      judgement: wrong
      source_says: "You should immediately contact your doctor, midwife or maternity hospital if you develop sudden swelling of your face, hands or feet or any of these symptoms: a very severe or dull headache that does not go away; changes to your vision ...; severe pain just below your ribs; feeling sick or vomiting; high blood pressure; heartburn that does not go away with antacids"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/swelling-during-pregnancy
      fixed_to: "reworded to the source's list (each symptom on its own, 'very severe or dull', adds high blood pressure, 'symptoms of pre-eclampsia, a very dangerous complication')"
    - claim: "all other claims (8 in 10, usually down overnight, compression stockings, one limb more swollen with pain/redness/warmth, legs not improving overnight after 20 weeks vs as soon as possible earlier, tell doctor if more than slight)"
      judgement: ok
      source_says: "confirmed in PBB swelling page, Royal Women's fact sheet (PDF read with unpdf), healthdirect warning signs"
      url: https://www.healthdirect.gov.au/warning-signs-during-pregnancy
      fixed_to: "no change"

- id: headaches
  file: content/drafts/headaches.md
  verdict: fix
  problems:
    - claim: "Call triple zero (000) and ask for an ambulance if you have a sudden, severe headache, or a headache with vomiting, confusion, a stiff neck or changes in your vision."
      judgement: wrong
      source_says: "call triple zero (000) and ask for an ambulance or go to your nearest hospital emergency department"
      url: https://www.healthdirect.gov.au/headaches
      fixed_to: "added 'or go to your nearest hospital emergency department'"

- id: dizziness-and-fainting
  file: content/drafts/dizziness-and-fainting.md
  verdict: fix
  problems:
    - claim: "fainting or dizziness alone in early pregnancy -> go straight to emergency or call 000 (drafter note)"
      judgement: ok
      source_says: "If you're in early pregnancy and you faint, feel dizzy, or have bleeding or abdominal pain, this could be a sign of an ectopic pregnancy ... Go straight to your nearest emergency department, or call triple zero (000) for an ambulance.' (PBB low blood pressure). healthdirect ectopic page: 'dizziness or fainting' -> ED or 000."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/low-blood-pressure-during-pregnancy
      fixed_to: "kept; added healthdirect ectopic page to sources and a note that it says the same"
    - claim: "To avoid it: ... eat at regular times, ... move your legs or wear support stockings"
      judgement: wrong
      source_says: "Stand up slowly after sitting or when getting out of bed or the bath ... leg exercises and support stockings can improve your blood flow. Have something to eat at regular intervals ..."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/low-blood-pressure-during-pregnancy
      fixed_to: "reworded to the source; also added that low BP is common and not usually a concern but rarely can be dangerous"
    - claim: "chair or hot bath / late pregnancy lying on back / frequent dizziness contact doctor"
      judgement: ok
      source_says: "Royal Women's: 'faint ... if you get up quickly from a chair or hot bath or if you stand for too long ... In late pregnancy, lying on your back can make you feel faint ... Contact your doctor or midwife if you have frequent dizziness or fainting.'"
      url: https://www.thewomens.org.au/health-information/pregnancy-and-birth/a-healthy-pregnancy/common-concerns-in-early-pregnancy
      fixed_to: "no change"

