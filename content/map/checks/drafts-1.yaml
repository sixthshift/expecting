- id: not-felt-baby-move-yet
  file: content/drafts/not-felt-baby-move-yet.md
  verdict: fix
  problems:
    - claim: "(under What's usual) If you're ever worried about it, or notice the movements slowing down, contact your midwife, hospital birth unit or doctor immediately; don't wait until the next day."
      judgement: wrong
      source_says: "At any point, if you are concerned about your baby's movement pattern or notice a decrease in their movements, contact your midwife, hospital birth unit or doctor immediately. Do not wait until the next day. If you are not able to reach your maternity care provider, please go to your nearest hospital birthing or emergency unit."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/baby-movements-during-pregnancy
      fixed_to: "moved under a new '## Contact your hospital now' heading (an immediate-level warning was sitting under What's usual); added the can't-reach-them line"
    - claim: "24-week threshold (drafter note)"
      judgement: ok
      source_says: "If you have not felt your baby move by 24 weeks, contact your doctor or midwife. (banner, Braxton Hicks page)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/braxton-hicks-contractions
      fixed_to: "no change"

- id: spotting-and-bleeding-in-early-pregnancy
  file: content/drafts/spotting-and-bleeding-in-early-pregnancy.md
  verdict: fix
  problems:
    - claim: "(Call 000 list) a fever or chills; ... trouble breathing, or a fast heartbeat"
      judgement: wrong
      source_says: "Banner: Call 000 or go to nearest ED immediately if heavy bleeding (1+ pads in an hour...), severe abdominal pain, shoulder-tip pain, smelly vaginal discharge, a fever, or feel faint, dizzy or unwell. Body: call 000 for 'unwell, dizzy or faint, or trouble breathing'; go to ED for 'a fever or chills ... shortness of breath or a fast heartbeat'."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/miscarriage/what-should-i-do-if-i-think-im-having-a-miscarriage
      fixed_to: "000 list now 'a fever' and 'faint, dizzy or unwell, or trouble breathing'; chills and a fast heartbeat moved to a separate 'go to your nearest emergency department immediately' sentence"
    - claim: "1 in 4 bleed; 1 vs 2 pads note; anti-D; EPAS; GP"
      judgement: ok
      source_says: "confirmed (Royal Women's 'One in four'; PBB bleeding page 2 pads; miscarriage page 1+ pads)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/bleeding-during-pregnancy
      fixed_to: "no change"

