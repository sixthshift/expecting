# M02: fact-check of 20 can-i food drafts against their cited pages (NSW Food Authority, FSANZ, Pregnancy Birth and Baby), fetched fresh 2026-10-29.
# All verdicts confirmed against the sources (liver: PBB says both 'avoid' and 'try to limit', both kept). Every draft now has checked: 2026-10-29.

- id: bacon-and-cooked-ham
  file: content/drafts/bacon-and-cooked-ham.md
  verdict: fix
  problems:
    - claim: "Ham on a pizza, in a toastie or fried with eggs is fine when it's piping hot all the way through"
      judgement: unsupported
      source_says: "PBB: processed meats OK if cooked to at least 75°C and eaten straight away; no pizza/toastie example"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/foods-to-avoid-when-pregnant
      fixed_to: "Ham, salami and luncheon meat are fine when they're cooked to at least 75 °C and eaten straight away."
    - claim: "Don't let it sit. Eat it soon after cooking rather than leaving it out"
      judgement: unsupported
      source_says: "NSW: eaten soon afterwards"
      url: https://www.foodauthority.nsw.gov.au/consumer/life-events-and-food/pregnancy/foods-to-eat-or-avoid-when-pregnant
      fixed_to: "Eat it soon after cooking. It's the cold, stored version that's the risk."
- id: hot-takeaway-chicken
  file: content/drafts/hot-takeaway-chicken.md
  verdict: ok
- id: pate
  file: content/drafts/pate.md
  verdict: fix
  problems:
    - claim: "liver pâté is also very high in vitamin A / Liver is very high in vitamin A"
      judgement: wrong
      source_says: "PBB: liver and liver products contain a lot of vitamin A; foods very high in vitamin A 'might include liver and pâté'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/vitamins-and-supplements-during-pregnancy
      fixed_to: "liver pâté 'may also be' very high; liver 'contains a lot of' vitamin A"
    - claim: "outbreaks ... mostly from campylobacter"
      judgement: unsupported
      source_says: "FSANZ: livers need cooking all the way through, particularly for Campylobacter; page does not say outbreaks were mostly campylobacter"
      url: https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/poultryliver
      fixed_to: "Reworded to the page: cook through to kill microorganisms, particularly campylobacter; searing not enough"
    - claim: "Liver pâté of any kind still carries the vitamin A concern"
      judgement: wrong
      source_says: "PBB: foods very high in vitamin A might include liver and pâté"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/vitamins-and-supplements-during-pregnancy
      fixed_to: "Pâté made from liver may also be very high in vitamin A."
- id: liver
  file: content/drafts/liver.md
  verdict: fix
  problems:
    - claim: "so treat liver as something to leave off the menu, not something to panic over"
      judgement: unsupported
      source_says: "PBB gives 'Avoid liver or liver products' and, further down, 'Try to limit how much you eat during pregnancy' (both confirmed, both kept)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/foods-to-avoid-when-pregnant
      fixed_to: "cut the reassurance clause"
    - claim: "Ask your pharmacist, doctor or midwife before taking any vitamin."
      judgement: unsupported
      source_says: "PBB: check the label or ask your pharmacist, midwife or doctor if a pregnancy multivitamin is suitable"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/nutrition-and-lifestyle/vitamins-and-supplements-during-pregnancy
      fixed_to: "Check the label or ask your pharmacist, midwife or doctor if a pregnancy multivitamin is suitable for you."
