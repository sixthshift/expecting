- id: loss-support-services
  file: content/drafts/loss-support-services.md
  verdict: fix
  problems:
    - claim: "Red Nose Grief and Loss: ... Free counselling and support groups after miscarriage, ectopic pregnancy, termination for medical reasons, stillbirth, the death of a newborn, and SIDS."
      judgement: unchecked
      source_says: "PBB: 'Red Nose Grief and Loss provides support for people affected by pregnancy loss. Call 1300 308 307 - 24 hours a day 7 days a week.' (another PBB page: 'pregnancy loss, stillbirth, baby or child death'). The detailed list rests only on the Red Nose page, which blocks automated fetches."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/pregnancy-loss-and-miscarriage/miscarriage-and-pregnancy-loss-support-services
      fixed_to: "Free support by phone for people affected by pregnancy loss, stillbirth, or the death of a baby or child; Red Nose URL removed from sources; summary reworded to match."
    - claim: "Bears of Hope has grief counsellors who have been through loss themselves ... guides for family, friends and employers who don't know what to say."
      judgement: unsupported
      source_says: "'Our grief counsellors ... They know this pain ... Free of charge.' Resource heading: 'For Family, Friends & Colleagues'."
      url: https://www.bearsofhope.org.au/
      fixed_to: "grief counsellors, free of charge, walk and talk groups, a guide for family, friends and colleagues."
    - claim: "Gidget Foundation offers therapy ... for birthing and non-birthing parents, after pregnancy loss and stillbirth."
      judgement: unsupported
      source_says: "Gidget stillbirth fact sheet: 'Individual psychological therapy for parents affected by stillbirth ... Support is available to birthing and non-birthing parents.'"
      url: https://www.gidgetfoundation.org.au/fact-sheets/stillbirth
      fixed_to: "individual psychological therapy with a perinatal mental health clinician; for stillbirth, birthing and non-birthing parents."
  notes: "Confirmed on PBB: Red Nose 1300 308 307 24/7; Pink Elephants Pregnancy Loss Helpline (PANDA) 1300 726 306 Mon-Fri 9am-7:30pm, Sat and public holidays 9am-4pm AEST; ForWhen 1300 24 23 22, 9am-4:30pm weekdays; Beyond Blue 1300 22 4636; 13YARN 13 92 76; Red Nose groups for non-birthing parents; Miscarriage Australia men's page. Pink Elephants moderated groups (miscarriage, TFMR, trying again, PAL) and Miscarriage Australia pages (women, men, LGBTIQA+, partners, family and friends) confirmed. Lifeline 13 11 14 on Gidget. checked set."
