# Fact-check of drafted Library entries, batch B6 (loss, early birth and NICU, birth trauma,
# family violence, three cards, Services Australia payments). Checked 2026-10-29 against the
# pages in each draft's sources (fetched that day).
- id: miscarriage
  file: content/drafts/miscarriage.md
  verdict: fix
  problems:
    - claim: "Partners can be deeply affected too, and the two of you may react in different ways."
      judgement: unsupported
      source_says: "Pregnancy loss can also affect your partner and children. ... You and your partner, if you have one, may react in different ways."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/pregnancy-loss/experiencing-a-pregnancy-loss
      fixed_to: "Pregnancy loss can affect your partner too, and the two of you may react in different ways. (PBB pregnancy-loss page added to sources.)"
  notes: "All other claims confirmed: 1 in 4 before 14 weeks, 50-80% chromosomal, over 35, high chance of healthy pregnancy, types, 000 for very heavy bleeding/strong pain/unwell, Medicare Mental Health 1800 595 212 (PBB), Beyond Blue 1300 22 4636 (Gidget). checked set."
- id: miscarriage-signs-what-to-do
  file: content/drafts/miscarriage-signs-what-to-do.md
  verdict: fix
  problems:
    - claim: "heavy bleeding (soaking more than 2 pads an hour) or you're passing large clots"
      judgement: wrong
      source_says: "Two PBB pages differ. 'What really happens' (and the PBB body list): 'heavy vaginal bleeding (soaking more than 2 pads per hour or passing large clots)'; the alert at the top of 'What should I do if I think I'm having a miscarriage?': 'heavy vaginal bleeding (soaking 1 or more sanitary pads in an hour, or bleeding you can't catch or contain)', with 000 or emergency."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/miscarriage/what-should-i-do-if-i-think-im-having-a-miscarriage
      fixed_to: "heavy bleeding or passing large clots, with both PBB wordings given and credited."
  notes: "Confirmed: 000 for unwell/dizzy/faint/trouble breathing; ED list (shoulder-tip, fever or chills, smelly discharge, shortness of breath or fast heartbeat, any concerns); EPAS in major cities, rural note; healthdirect 1800 022 222 24/7 and PBB 1800 882 436 7am-midnight (Miscarriage Australia page); pads not tampons, paracetamol, heat pack; 1 in 4 bleed in first trimester. checked set."
- id: miscarriage-management-options
  file: content/drafts/miscarriage-management-options.md
  verdict: ok
  problems: []
  notes: "Every figure confirmed on the PBB expectant, medical, surgical and miscarriage pages: bleeding 7-14 days, eases in 1-2 days, spotting about 2 weeks, follow-up 7-10 days; misoprostol alone or with mifepristone, 4-6 hours, up to 2 weeks, blood test a week later; D&C about 10 minutes, 7-14 days, up to 3 in 100 infection; the see-doctor-or-ED list (1-2 pads an hour, golf-ball clots, 38 C, over 2 weeks); 4-6 week follow-up. checked set."
- id: after-a-miscarriage
  file: content/drafts/after-a-miscarriage.md
  verdict: fix
  problems:
    - claim: "Every state and territory offers an optional certificate recognising early pregnancy loss, through its Births, Deaths and Marriages registry; Red Nose has information on applying."
      judgement: unsupported
      source_says: "You can ask for an optional certificate recognising early pregnancy loss. Red Nose Grief and Loss has information on applying for an early pregnancy loss certificate with your state or territory's Births, Deaths and Marriage Registry."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/miscarriage/what-happens-after-miscarriage
      fixed_to: "You can ask for an optional certificate ... from your state or territory's registry; PBB says Red Nose has information on applying. (Rests on PBB's wording, not on a Red Nose page.)"
    - claim: "PBB says it's safe to get pregnant again soon ... no medical need to wait, though your health team may suggest waiting until you feel emotionally and physically ready."
      judgement: unchecked
      source_says: "Same PBB page, in its funeral/legal section, also says: 'Your health team may recommend you wait until after you have had at least one normal menstrual cycle before trying for another pregnancy'. Surgical page: 'wait a few months to allow your menstrual cycle to re-establish'."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/miscarriage/what-happens-after-miscarriage
      fixed_to: "kept the current advice and added the one-normal-cycle line as PBB's other wording; D&C 'few months' kept (surgical page)."
  notes: "Confirmed: bleeding up to 2 weeks; symptoms resolve; breasts may make milk near 20 weeks; see doctor within 6 weeks; check if miscarried at home; negative blood type and anti-D; ovulation before first period; 2 or more, fertility specialist; healthy pregnancy later; no legal registration under 20 weeks; funeral options; 2 days paid bereavement leave under the Fair Work Act (Miscarriage Australia's wording, includes partner); no need to tell workplace; grief triggers; health team can recommend a support group. Added from Fair Work Ombudsman (compassionate and bereavement leave): 2 days compassionate leave per occasion, unpaid for casuals, so the draft's 'paid' (Miscarriage Australia wording) now carries that caveat and the Fair Work page is in sources. checked set."
- id: ectopic-pregnancy
  file: content/drafts/ectopic-pregnancy.md
  verdict: ok
  problems: []
  notes: "All claims confirmed on PBB Ectopic pregnancy: 1 in 100, signs and weeks 4-12, nearest ED or 000 for any of them while pregnant, hCG and ultrasound, watch-and-wait conditions and its ED triggers, methotrexate, keyhole/open surgery, follow-up tests, alcohol (3 months after methotrexate), Medicare-funded counselling, Red Nose 1300 308 307 24/7 (PBB's wording), partner, fertility, higher chance of another, wait 2 months / 3-4 months, early ultrasound. checked set."
- id: stillbirth
  file: content/drafts/stillbirth.md
  verdict: fix
  problems:
    - claim: "Tell your doctor or midwife if you have heavy bleeding that doesn't stop, a fever, or painful, red, hot areas or lumps in your breasts."
      judgement: wrong
      source_says: "'See your doctor immediately if you have signs of mastitis ... a painful or warm breast, which may have a red patch on it; flu-like symptoms, such as a fever, aches or chills.' Bleeding: 'seek help from your doctor or midwife if it's more [than] 24 hours after the birth and the amount of blood suddenly increases, you notice that you are passing large blood clots, the blood becomes bright red, you feel dizzy, weak, sweaty or have trouble breathing, you have a high temperature, you are worried that your bleeding is not normal.' No mention of lumps."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/stillbirth-and-neonatal-death/your-body-after-stillbirth-or-neonatal-death
      fixed_to: "Rewritten to the source's urgency: mastitis signs, see your doctor immediately; bleeding signs, seek help from doctor or midwife."
  notes: "Confirmed: 20 weeks / 400 g definition, about 6 a day, often cause unknown, diagnosis by ultrasound, care team members, induce vaginal birth, go home a day or 2, time with baby and keepsakes, rituals, no rush, tests incl. autopsy, registration/Centrelink support, milk and easing, bleeding up to 6 weeks, doctor 8-12 weeks, parents at higher risk of anxiety/depression/PTSD, Red Nose 1300 308 307 (24/7 hours from PBB ectopic page, which is a PBB page), Gidget therapy for birthing and non-birthing parents, Lifeline 13 11 14, Safer Baby Bundle national initiative, side sleeping from 28 weeks, smoking. checked set."
- id: when-the-baby-comes-early
  file: content/drafts/when-the-baby-comes-early.md
  verdict: ok
  problems: []
  notes: "Confirmed on PBB Premature baby: before 37 weeks, about 8 in 100, contact midwife/doctor/birthing centre immediately, slow or stop labour, each day inside better, 32-37 weeks SCN and most no serious long-term problems, before 32 weeks higher risk, help breathing, usually NICU at first, neonatal team at birth, transfer, kangaroo care, coping lines, regular checks, twins raise chance; corticosteroid injections mentioned. Miracle Babies Nurture Line 1300 622 243, free, 24 hour, run by parents (Miracle Babies page); Life's Little Treasures 1300 697 736 and PIPA 1300 773 672 (PBB). checked set."
- id: baby-in-the-nicu
