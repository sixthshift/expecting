# Fact-check of drafts-M19 (20 term drafts, body-and-baby.yaml), 2026-10-29.
# Every claim checked against the pages in each draft's sources (re-fetched today).
# Key points: low-lying placenta vs praevia now says only what PBB and RWH say; ECV timing credits
# RANZCOG (36), PBB ECV page (after 37, first baby after 36) and PBB glossary (after 37); waters-breaking
# urgency is each page's own (malpresentation "seek medical help immediately", breech "call 000",
# cord prolapse "go to hospital urgently", with 000 first for a felt cord).
# term-ecv has no `checked:`: the RANZCOG leaflet PDF could not be read in full by text extraction, so its
# "discuss at 36 weeks" line was not re-confirmed by this checker (an earlier checker, drafts-M11, recorded it as verified).

