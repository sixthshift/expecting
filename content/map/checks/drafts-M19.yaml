- id: term-single-umbilical-artery
  file: content/drafts/term-single-umbilical-artery.md
  verdict: fix
  problems:
    - claim: "you'll have repeat scans to check the baby's growth, and a check after birth, often with a kidney ultrasound"
      judgement: wrong
      source_says: "'Isolated SUA should have close clinical follow up to assess intrauterine growth with repeat ultrasound scans as indicated clinically'; 'Follow-up should include a renal ultrasound unless adequate antenatal ultrasound imaging of the kidneys is available.'"
      url: https://www.safercare.vic.gov.au/clinical-guidance/neonatal/single-umbilical-artery
      fixed_to: "the page's wording"
    - claim: "It can show on an ultrasound"
      judgement: unsupported
      source_says: "'Antenatal diagnosis of a single umbilical artery may be impeded by fetal position.'"
      url: https://www.safercare.vic.gov.au/clinical-guidance/neonatal/single-umbilical-artery
      fixed_to: "may be associated with other birth defects, and can be hard to see depending on the baby's position"
    - claim: "(page not flagged as dated)"
      judgement: unsupported
      source_says: "First published December 2017, review by December 2020; 'some guidelines may be past their review date. The review process is currently paused.'"
      url: https://www.safercare.vic.gov.au/clinical-guidance/neonatal/single-umbilical-artery
      fixed_to: "dated status stated in the body"
