- id: term-low-lying-placenta
  file: content/drafts/term-low-lying-placenta.md
  verdict: fix
  problems:
    - claim: "Placenta praevia is when it covers the cervix; the two terms are sometimes used for each other."
      judgement: wrong
      source_says: "PBB: praevia is 'very close to your cervix, or covers it entirely' and 'sometimes called a low-lying placenta'; its list of terms gives low-lying as 'close to the cervix (within 2cm) without covering it' and 'placenta previa' as covering it. RWH heads one problem 'Low lying placenta (Placenta praevia)': some or all of the placenta in the lower uterus."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placenta-praevia
      fixed_to: "Both pages' usage stated and credited (PBB's definitions and its 'sometimes called', RWH's combined heading)."
    - claim: "as your uterus stretches, the placenta generally moves higher"
      judgement: wrong
      source_says: "PBB: 'the placenta can move up away from your cervix ... it may resolve'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placenta-praevia
      fixed_to: "the placenta can \"move up\" away from your cervix"
    - claim: "summary: often moves up before the baby is due"
      judgement: wrong
      source_says: "PBB: 'it resolves before your baby is due'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placenta-praevia
      fixed_to: "often resolves before the baby is due"
- id: term-placenta-praevia
  file: content/drafts/term-placenta-praevia.md
  verdict: fix
  problems:
    - claim: "If it's heavy, or comes with pain or contractions, call triple zero (000) for an ambulance or go to emergency."
      judgement: wrong
      source_says: "PBB warnings: 'If you experience bleeding ... contact your midwife or doctor immediately. If the bleeding or pain are severe, call triple zero (000) and ask for an ambulance.' and 'If the bleeding is heavy and if you have pain or contractions with the bleeding call triple zero (000) and ask for an ambulance or go to your nearest hospital emergency department.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placenta-praevia
      fixed_to: "both PBB warnings given in their own wording"
    - claim: "summary: a caesarean is often needed; body: the Royal Women's Hospital says that in most cases you will need a caesarean"
      judgement: unsupported
      source_says: "PBB: 'In some cases of placenta praevia, it will be safest to birth your baby via caesarean section.' RWH: 'In most cases you will need a caesarean birth.'"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placenta-praevia
      fixed_to: "summary 'a caesarean may be needed'; body gives PBB 'some cases' and RWH 'most cases', each credited"
