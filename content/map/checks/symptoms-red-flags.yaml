- id: shoulder-tip-pain
  verdict: fix
  problems:
    - covers: "go to emergency or call 000: shoulder tip pain with bleeding, belly pain, dizziness or fainting"
      judgement: wrong
      source_says: "healthdirect ectopic page: 'If you have any of these symptoms while pregnant, go to the nearest emergency department or call triple zero (000)', and the symptoms listed include shoulder tip pain on its own (also spotting, tummy pain, back pain, fast heart rate, dizziness). It is not conditional on a combination. The entry's other phrase (contact doctor/hospital 'especially with bleeding', from the warning-signs page) is a softer urgency than the ectopic page gives for the same symptom, so the entry should lead with the ectopic page's emergency/000 advice."
      url: https://www.healthdirect.gov.au/ectopic-pregnancy

