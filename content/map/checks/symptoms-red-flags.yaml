- id: fever
  verdict: fix
  problems:
    - covers: "healthdirect fever page: see doctor as soon as possible if you have a fever and are pregnant; emergency if fever with seizures, confusion or difficulty breathing"
      judgement: wrong
      source_says: "The healthdirect Fever page has no pregnancy advice. Its 'see your doctor as soon as possible' list (recent hospital stay or surgery, overseas travel, cancer or immune-suppressing treatment, sensitivity to light, unusual rash, severe headache, other concerns) does not include pregnancy. The emergency half is ok (fever with confusion or drowsiness, difficulty breathing, seizures). For pregnancy the urgency comes from the warning-signs page: 'contact your doctor, midwife or hospital immediately if you have fever or chills', which is stronger than 'as soon as possible'."
      url: https://www.healthdirect.gov.au/fever

