- id: spotting-and-bleeding-in-early-pregnancy
  verdict: fix
  problems:
    - covers: "causes: implantation bleeding, the cervix, miscarriage, ectopic pregnancy, molar pregnancy"
      judgement: unsupported
      source_says: "Early-pregnancy causes listed are implantation bleeding, miscarriage, ectopic pregnancy and molar pregnancy. The cervix is not named as a cause of early bleeding (it appears only in the placenta praevia and vasa praevia descriptions)."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/bleeding-during-pregnancy
    - covers: "Rh negative: ask about anti-D"
      judgement: unsupported
      source_says: "Only the miscarriage page mentions it, and only after a miscarriage: 'If you have a negative blood type, check with your doctor whether you need a dose of anti-D after your miscarriage.' Nothing about anti-D for spotting in general."
      url: https://www.pregnancybirthbaby.org.au/pregnancy-and-infant-loss/miscarriage/what-should-i-do-if-i-think-im-having-a-miscarriage

- id: bleeding-after-20-weeks
  verdict: fix
  problems:
    - covers: "call 000: bleeding that is heavy (soaking 2 pads an hour or clots), strong pain in the tummy or shoulder, dizzy or faint, short of breath, or feeling very unwell; heavy bleeding with pain or contractions"
      judgement: wrong
      source_says: "PBB bleeding page reserves 000 for 'very heavy bleeding, strong pain or feel very unwell'. Soaking 2 pads an hour or clots, strong tummy or shoulder pain, dizzy or faint, short of breath are listed under 'contact your obstetrician, birth unit or call an ambulance immediately' and, in a second list, 'contact your doctor urgently, or visit the nearest emergency department'. Abruption page: 'if the bleeding or pain is severe, call 000'. Praevia page: 000 or ED if bleeding is heavy and with pain or contractions. The 000 list as written merges these and states a lower trigger for 000 than the sources do."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/bleeding-during-pregnancy
    - covers: "placental abruption (bleeding with constant pain, back pain, a tight uterus, fewer movements)"
      judgement: unsupported
      source_says: "Abruption symptoms listed: vaginal bleeding, abdominal pain (constant, not in waves), contractions, lower back pain, vaginal or pelvic pain, baby moving less, dizziness. No 'tight uterus' (a firm or tightening uterus appears only on the injuries page, after trauma). Also pain is 'usually severe' but may be mild or absent."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/placental-abruption

