- id: pregnancy-supplements
  file: body-and-baby.yaml
  verdict: ok
  # PBB: all pregnant women recommended folic acid and iodine; 0.5 mg folic acid daily from at least a month before and for the first 3 months (or 400 mcg); 5 mg only if the doctor recommends it (diabetes, overweight or obesity, anticonvulsants, neural tube defect in the family, poor absorption); iodine 150 mcg; vitamin A not above 10,000 IU a day. The map states none of these doses.

- id: braxton-hicks-contractions
  file: body-and-baby.yaml
  verdict: fix
  problems:
    - covers: "before 37 weeks painful or regular tightenings need a call, if unsure call anyway"
      judgement: wrong
      source_says: "PBB: 'If you're less than 37 weeks pregnant, contractions can be a sign of premature labour. Contact your doctor or midwife immediately if you feel pain or discomfort in your pelvis, abdomen or lower back.' Also contact immediately for persistent abdominal pain, bleeding or concern about movements. 'Immediately' is the urgency; 'painful or regular' is not the wording."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/braxton-hicks-contractions
    # ok in substance: 20 to 90 seconds is from the uterus page; the Braxton Hicks page says about 30 seconds, up to 2 minutes, and 'usually aren't painful'. Not felt until the second trimester, most often the third; eased by changing position, walking, a bath, water; do not dilate the cervix.

- id: baby-movements
  file: body-and-baby.yaml
  verdict: fix
  problems:
    - covers: "the partner's part"
      judgement: unsupported
      source_says: "Neither page says anything about the partner's part in baby movements."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/health-conditions-and-complications/baby-movements-during-pregnancy
    # ok: usually by week 20 (earlier if not the first); regular by week 28; no set number, counting kicks no longer recommended; babies keep moving until birth; 'contact ... immediately. Do not wait until the next day'; home dopplers not approved for sale and not recommended. Worth adding: PBB (Braxton Hicks page) says if you have not felt the baby move by 24 weeks, contact your doctor or midwife.

