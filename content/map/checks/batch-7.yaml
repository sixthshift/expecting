  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "the hospital or midwife gives a Parent Pack with a Newborn Child Declaration; the doctor or midwife signs the back page before you go home"
      judgement: unsupported
      source_says: "Services Australia: 'You'll get a Parent Pack from your hospital or midwife ... Make sure your doctor or midwife completes the Proof of Birth declaration on the back page.' 'Before you go home' is not said."
