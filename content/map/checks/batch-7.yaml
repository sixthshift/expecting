      url: https://www.servicesaustralia.gov.au/claiming-timeframes-for-parental-leave-pay
    - covers: "add your CRN and Medicare number on the back page; upload it in myGov under Add Newborn or in the Express Plus app"
      judgement: unsupported
      source_says: "Services Australia says to include the Customer Reference Number and Medicare numbers on the back page. Nothing on the cited pages about uploading in myGov, 'Add Newborn' or the Express Plus app."
      url: https://www.servicesaustralia.gov.au/when-your-baby-arrives

- id: cost-of-having-a-baby
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "public patient in a public hospital or birth centre: the care and the stay are covered by Medicare; gaps only where a provider charges above the schedule (some scans, NIPT)"
      judgement: wrong
      source_says: "PBB: with a Medicare card at a public hospital, birth centre or public homebirth program, 'most of your pregnancy care costs are covered by Medicare. Sometimes, you may have to pay an out-of-pocket cost if the complete cost of the service is not covered.' Routine ultrasounds are covered; some antenatal tests such as NIPT are not. 'Gaps only where a provider charges above the schedule' is not said."
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/what-is-the-difference-between-public-and-private-care-in-pregnancy
    - covers: "private: Medicare pays 75% of the schedule fee in hospital and the fund the rest of the schedule, but the obstetrician's and anaesthetist's fees above it, the management fee, the excess and the baby's own admission are yours"
      judgement: unsupported
      source_says: "privatehealth.gov.au: Medicare pays 75% of the MBS fee and the insurer the other 25% 'if you are eligible'; doctors can charge more with no cap (the gap); hospital fees and any excess or co-payment are separate. No 'management fee'. The baby's nursery care being charged separately is on the PBB private health page (already in the map, now added as a source)."
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/out_of_pocket.htm
    - covers: "what to ask for: informed financial consent and an itemised estimate before booking; the Safety Net for out-of-hospital costs"
      judgement: unsupported
      source_says: "privatehealth.gov.au: ask before going to hospital for the MBS item numbers and an estimate, 'preferably ... in writing', and see the Ombudsman's Informed Financial Consent factsheet. 'Itemised' and 'out-of-hospital' are not said; the Medicare Safety Net (more back once you spend above a certain amount in a calendar year) is on the PBB private health page."
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/out_of_pocket.htm
    - covers: "the things nobody budgets: classes, a capsule, the pram, the parking"
      judgement: unsupported
      source_says: "None of the cited pages lists classes, a capsule, a pram or parking. PBB only points to the Royal Women's Hospital page on hidden costs."
      url: https://www.pregnancybirthbaby.org.au/healthcare-and-services/medicare-insurance-and-digital-services/what-is-the-difference-between-public-and-private-care-in-pregnancy
    # ok: private patient in a public hospital: no single room guaranteed, still responsible for hospital, medical and diagnostic costs.

- id: private-health-waiting-periods
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "switching funds at the same or lower level doesn't restart the wait"
      judgement: unsupported
      source_says: "None of the four pages mentions switching funds. They say waiting periods apply when you start a policy or increase your level of cover."
      url: https://www.privatehealth.gov.au/health_insurance/howitworks/waiting_periods.htm
    # ok: 12 months maximum for pregnancy and birth; only Gold includes pregnancy and birth (Silver and Bronze optional); LHC loading after the 1 July following the 31st birthday; Medicare Levy Surcharge; rebate; baby cover a separate question.

