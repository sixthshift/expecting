- id: car-seat
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "must meet AS/NZS 1754; babies under 6 months travel rear-facing in an approved restraint with an inbuilt harness, by law"
      judgement: wrong
      source_says: "PBB: 'Babies up to 6 months of age must be secured in an approved rear-facing car seat'; the restraint must meet AS/NZS 1754. 'Inbuilt harness' appears only for forward-facing seats for ages 4 to under 7."
      url: https://www.pregnancybirthbaby.org.au/car-safety-for-babies
    - covers: "some hospitals check it before discharge"
      judgement: unsupported
      source_says: "KEMH's going-home checklist lists 'Transport and baby car seat arranged'; it does not say the hospital checks the seat."
      url: https://www.kemh.health.wa.gov.au/Pregnancy-and-Birth/After-your-pregnancy/Going-home
    # ok: rear-facing as long as possible (height-based); fitted by instructions or an authorised fitting station; a rear-facing seat can't be used in the front with a passenger airbag; never swaddle in the restraint; must have a restraint secured in the car before the baby arrives (PBB, what you will need). The Kidsafe NSW page is a thin index and states none of these.

- id: cot-and-safe-sleep-standards
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "cots sold in Australia, new or second-hand, must meet the mandatory standard (AS/NZS 2172) and carry the label; from 19 January 2026 new mandatory standards cover infant sleep products including bassinets"
      judgement: wrong
      source_says: "PBB: all new and second-hand cots must comply with AS/NZS 2172:2003, and second-hand cots 'do not require safety labels'. Red Nose: the standard is noted in the instructions and often on a label. Neither gives 19 January 2026, and PBB says 'there are no current safety standards for bassinets in Australia'."
      url: https://www.pregnancybirthbaby.org.au/babies/sleep-and-settling/cots
    - covers: "one firm, flat mattress fitting within 20 mm of the sides; no second mattress, bumpers, pillows or soft bedding"
      judgement: unsupported
      source_says: "Red Nose: a single firm, flat mattress within 20 mm of sides and ends; no bumpers or soft bedding. PBB lists pillows, doonas and bumpers as items to keep out. 'No second mattress' is not said. (PBB gives the gap as no more than 2 cm centred, 4 cm pushed to one side.)"
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/newborn-to-1-year/what-is-a-safe-cot/
    # ok: no gaps (3 to 5 cm, over 9.5 cm), toeholds or protrusions (over 5 cm); depth at least 60 cm at the lower height, 40 cm at the upper; own cot in the parents' room for the first 6 to 12 months, on the back, face and head uncovered; never a cot not known to meet the standard.

- id: second-hand-baby-gear
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "yes for most things, and it saves a lot; the exceptions are anything that holds the baby in a car or asleep unless it meets the current standard and shows it"
      judgement: unsupported
      source_says: "Red Nose: 'Using second-hand nursery furniture can reduce costs, but make sure the product is safe' and 'a great option'. It names no exceptions. PBB says to save money by buying second hand but check cots and bassinets are safe."
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/pregnancy-to-birth/second-hand-nursery-furniture/
    - covers: "cots, portacots and prams must meet their standards even second-hand; look for the label and the instructions"
      judgement: unsupported
      source_says: "Red Nose: all new and second-hand cots sold in Australia must meet the standard for cots or portacots, noted in the instructions and 'often on a label'. Prams are not mentioned on any cited page."
      url: https://rednose.org.au/safe-sleep-and-safer-pregnancy/pregnancy-to-birth/second-hand-nursery-furniture/
    # ok: check Product Safety Australia for recalls; used mattress firm, flat, clean, good condition, within 20 mm; rough repairs and chipped old paint (lead risk); car seats a separate answer (PBB: unknown history, under 10 years, undamaged).

