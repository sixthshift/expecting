# Batch 7: money-and-work (employer leave, partner leave, registering the birth, proof of birth, cost, private
# health waiting periods, childcare waitlists, car seat, cot, second-hand gear) and body-and-baby (sleep,
# supplements, Braxton Hicks, baby movements, four terms and cards).
# Checked 2026-10-29 against the pages as they read that day. Fixes applied to the map the same day.
# Services Australia figures on the cited pages (130 days from 1 July 2026, 20 reserved, up to 20 at the same
# time, $200.94 a day, 56 days to tell, 14 weeks or 100 days) match the map. The SA, Tasmanian and NT registry
# pages are not cited and were not checked. The Product Safety Australia pages are not cited.

- id: employer-paid-parental-leave
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "comes from an award, enterprise agreement, contract or policy, not the law; some pay nothing, some pay months at full pay"
      judgement: unsupported
      source_says: "FWO: 'Employers can provide parental leave payments in agreements, employment contracts, or workplace policies. The rules ... will depend on the relevant agreement, contract or policy.' No award is named, and nothing says some pay nothing or pay months at full pay (the example is 12 weeks at usual wage)."
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/payment-during-parental-leave
    - covers: "can be taken before, after or alongside Parental Leave Pay, and often requires a minimum service period and a return-to-work promise"
      judgement: unsupported
      source_says: "Services Australia: you can take Parental Leave Pay 'before, during or after any paid or unpaid employer funded leave' (maternity or parental leave, annual leave, long service leave). Neither page mentions a minimum service period or a return-to-work promise."
      url: https://www.servicesaustralia.gov.au/claiming-timeframes-for-parental-leave-pay
    - covers: "paid leave may accrue annual leave; check the policy"
      judgement: unsupported
      source_says: "The FWO page only links to 'Accruing and taking other leave during parental leave'; it says nothing about accrual itself."
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/payment-during-parental-leave
    - covers: "some employers top the government payment up to full pay, and some require you to claim it to get the top-up"
      judgement: unsupported
      source_says: "Neither page mentions top-ups or a requirement to claim to get one. FWO's example has both payments received during the leave period."
      url: https://www.fairwork.gov.au/leave/parental-leave/during-parental-leave/payment-during-parental-leave

- id: partner-parental-leave
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "the same 12 months of unpaid leave, the same 10-week and 4-week notice, and the same 12-months-of-service rule"
      judgement: unsupported
      source_says: "FWO: at least 10 weeks' written notice, confirm dates at least 4 weeks before, and at least 12 months with the employer. The cited pages do not state the 12 months of unpaid leave (12 months appears only as one person's plan in an example)."
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
    - covers: "the two of you can be on unpaid leave at the same time, for as long as you like"
      judgement: unsupported
      source_says: "Nothing on the cited FWO pages about both parents being on unpaid leave together or for how long."
      url: https://www.fairwork.gov.au/leave/parental-leave
    - covers: "the common shape: a block around the birth, then flexible days later"
      judgement: unsupported
      source_says: "FWO has an example of flexible days taken after a return to work, but nothing about a 'common shape'."
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
    - covers: "a casual or self-employed partner has the leave pay but not the leave entitlement"
      judgement: wrong
      source_says: "FWO: casual employees are eligible for unpaid parental leave if they have worked on a regular and systematic basis for at least 12 months with a reasonable expectation of continuing work. Self-employed people are not covered on the cited pages. (The 20 reserved days and up to 20 days at the same time match Services Australia.)"
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave

- id: registering-the-birth
  file: money-and-work.yaml
  verdict: fix
  problems:
    - covers: "Parental Leave Pay requires the birth registered or applied for, and a Medicare enrolment and the passport need the certificate"
      judgement: wrong
      source_says: "Services Australia: Parental Leave Pay needs the birth registered or applied to register. For Medicare enrolment, proof of birth can be the Newborn Child Declaration or a birth certificate, so the certificate is not required. NSW and WA say the registration or certificate is used for a passport."
      url: https://www.servicesaustralia.gov.au/when-your-baby-arrives
    - covers: "online in most states with the hospital's record; the baby's name goes on it, so decide the name first"
      judgement: unsupported
      source_says: "NSW and Queensland have online forms; the ACT has an online form and the trial. WA says the hospital or midwife gives information on how to register. Nothing says registration uses the hospital's record. NSW says registration records the baby's given names."
      url: https://www.nsw.gov.au/family-and-relationships/births/register-a-birth
    # ok: parents register not the hospital (NSW); free (myGov, NSW, Vic, Qld); 60 days (myGov, NSW, Vic, Qld, WA), ACT 6 months, late still accepted (NSW); ACT Newborn Enrolment Trial. myGov says 60 days in all states and territories, which the ACT page contradicts.

