# Fact-check of the week notes content/weeks/22.md to 42.md (pregnancy weeks 22-42).
# Checked 2026-10-29 against each note's source page (loaded with curl): Pregnancy, Birth and Baby
# "Pregnancy at week N" pages for 22-40, the PBB "Overdue" page for 41-42, and the PBB "How big is your
# baby" infographic for the fruit comparisons. Task mentions checked against the already-checked items in
# content/items/ (antenatal-classes, employer-leave-notice, partner-reserved-days, parental-leave-pay-claim,
# rsv-vaccine, whooping-cough-vaccine, anti-d, glucose-tolerance-test, baby-movements, car-seat,
# feeding-plan, numbers-to-save, group-b-strep-swab, hospital-bag).
# Common fix: "call the birth unit" became the source's own wording (contact/tell your doctor or midwife,
# immediately or straight away as the source says). "she/her" for the pregnant parent became "the pregnant parent".
# Weeks 22-27 and 29-40 carry no size figures. Week 28's length and weight are the one unchecked claim.
- id: week-22
  file: content/weeks/22.md
  verdict: fix
  problems:
    - claim: "\"Haemorrhoids can start about now\""
      judgement: unsupported
      source_says: "\"Some women may develop haemorrhoids during pregnancy.\" (no week given)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-22
      fixed_to: "\"Some people develop haemorrhoids during pregnancy\""
    - claim: "\"Bloating, varicose veins, backache, bleeding gums and stretch marks are all common\""
      judgement: unsupported
      source_says: "\"You may also have a range of pregnancy discomforts, including bloating and gas, varicose veins, backache, bleeding gums and stretch marks.\""
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-22
      fixed_to: "\"are among the discomforts you may have\""
    - claim: "\"painful, regular or getting stronger contractions, or pain or pressure in the pelvis, tummy or lower back, are a call to the birth unit\""
      judgement: wrong
      source_says: "\"could be a sign of premature labour. Always contact your doctor or midwife if you have contractions along with pain, pressure or discomfort in your pelvis, abdomen or lower back.\""
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-22
      fixed_to: "\"contact your doctor or midwife wording; partner section says call the doctor or midwife\""
    - claim: "\"Antenatal classes are best booked by this week\""
      judgement: unsupported
      source_says: "\"Not on the week-22 page. The checked antenatal-classes item (PBB Antenatal classes) says book a course for around 28 weeks, and book early because classes often fill up quickly.\""
      url: https://www.pregnancybirthbaby.org.au/antenatal-classes
      fixed_to: "\"Antenatal classes often fill up quickly, so book now for a course around 28 weeks.\""
    - claim: "\"Lifeline is 13 11 14\""
      judgement: ok
      source_says: "\"Lifeline on 131 114 (same number, written the usual way)\""
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-22
      fixed_to: "\"unchanged\""
