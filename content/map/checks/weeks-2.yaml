- id: week-24
  file: content/weeks/24.md
  verdict: fix
  problems:
    - claim: "\"title: Movements you can count on\""
      judgement: unsupported
      source_says: "\"Safer Baby advice (checked baby-movements item) is not to count kicks; get to know the baby's own pattern.\""
      url: https://www.saferbaby.org.au/preventative-steps/your-babys-movements-matter/
      fixed_to: "\"Feeling the baby move\""
    - claim: "\"A baby born now has about a one in two chance of surviving ... the weeks ahead matter.\""
      judgement: unsupported
      source_says: "\"Preterm babies born at 24 weeks have about a 1 in 2 chance of surviving if they are delivered in hospital and receive expert care in a neonatal unit. However, they would have a high chance of having a disability.\" Nothing on 'the weeks ahead matter'."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-24
      fixed_to: "\"figure kept with the source's conditions; last clause cut\""
    - claim: "\"if you have not [felt the baby move], that is a call\""
      judgement: wrong
      source_says: "\"If you haven't felt your baby moving yet \u2013 see your doctor or midwife.\""
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-24
      fixed_to: "\"see your doctor or midwife\""
    - claim: "\"Contractions getting stronger ... or the baby's movements slowing or stopping: call the birth unit\""
      judgement: wrong
      source_says: "\"Always seek medical attention if you experience: contractions that become stronger, more frequent or that last longer; persistent pain or pressure in your tummy, back or pelvis; vaginal bleeding; your baby's movements slowing or stopping\""
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-24
      fixed_to: "\"Always seek medical attention for ...\""
    - claim: "\"written notice of parental leave to each of your employers is due soon\""
      judgement: unsupported
      source_says: "\"Checked employer-leave-notice item (Fair Work): written notice at least 10 weeks before leave starts.\""
      url: https://www.fairwork.gov.au/leave/parental-leave/before-parental-leave/applying-for-parental-leave
      fixed_to: "\"needed at least 10 weeks before leave starts\""
    - claim: "\"she is allowed to say no, and so are you on her behalf\""
      judgement: unsupported
      source_says: "\"speak up if this makes you feel uncomfortable ... people ask for your verbal consent before touching you\""
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-24
      fixed_to: "\"the pregnant parent can speak up; people should ask for consent first (on-her-behalf clause cut)\""
    - claim: "\"fasting beforehand\""
      judgement: ok
      source_says: "\"after you have fasted for 8 to 12 hours\" (figure added)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/pregnancy-stages/pregnancy-at-week-24
      fixed_to: "\"fasting for 8 to 12 hours\""
