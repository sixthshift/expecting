- id: antacids
  file: content/drafts/antacids.md
  verdict: fix
  problems:
    - claim: "It tends to get worse late in pregnancy."
      judgement: unsupported
      source_says: "(no statement about timing)"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/indigestion-and-heartburn-in-pregnancy
      fixed_to: "cut"
    - claim: "avoid lying down or exercising for 2 or 3 hours after eating"
      judgement: wrong
      source_says: "Avoid eating for 2 or 3 hours before exercising or going to bed ... don't lie down right after a meal."
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/indigestion-and-heartburn-in-pregnancy
      fixed_to: "avoid eating for 2 or 3 hours before exercising or going to bed, don't lie down right after a meal"
    - claim: "vomiting blood"
      judgement: wrong
      source_says: "vomiting up blood"
      url: https://www.pregnancybirthbaby.org.au/pregnancy/body-changes-and-anatomy/indigestion-and-heartburn-in-pregnancy
      fixed_to: "vomiting up blood"
