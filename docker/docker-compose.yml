# expecting — one service, one data folder, run from this folder:
# `cd docker && docker compose up -d`. The image is the one GitHub Actions
# publishes (.github/workflows/docker.yml); nothing is built here. Set
# EXPECTING_IMAGE to run another, e.g. one built locally with
# `docker build -f docker/Dockerfile -t expecting:local .`. No `version` key:
# Compose v2 ignores it. Each of you has your own password: the first visit
# sets up whichever of you comes first, and the other joins by an invite from
# Settings. EXPECTING_LOGIN=off in docker/.env does without passwords, and
# EXPECTING_TZ sets where you are (Australia/Perth; Sydney's otherwise).
# test/docker/compose.test.ts asserts the image, service name, port, volume,
# DATA_DIR, EXPECTING_LOGIN and TZ.
services:
  expecting:
    image: ${EXPECTING_IMAGE:-ghcr.io/sixthshift/expecting:latest}
    ports:
      - "9966:9966"
    volumes:
      # expecting.db lives here. EXPECTING_DATA_DIR sets the host folder (default ./data).
      - ${EXPECTING_DATA_DIR:-./data}:/data
    environment:
      DATA_DIR: /data
      # on (the default) asks each of you for your own password; off lets
      # anyone who reaches it in, for a LAN you trust. Each phone still says
      # which of you is holding it either way.
      EXPECTING_LOGIN: ${EXPECTING_LOGIN:-on}
      # Where you are (EXPECTING_TZ), so the day Claude keeps things on is
      # yours: a phone says its own day, Claude has none (docs/development.md).
      TZ: ${EXPECTING_TZ:-Australia/Sydney}
    restart: unless-stopped
