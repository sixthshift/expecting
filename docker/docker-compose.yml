# expecting — one service, one data folder, run from this folder:
# `cd docker && docker compose up -d`. The image is the one GitHub Actions
# publishes (.github/workflows/docker.yml); nothing is built here. Set
# EXPECTING_IMAGE to run another, e.g. one built locally with
# `docker build -f docker/Dockerfile -t expecting:local .`. No `version` key:
# Compose v2 ignores it. The household password is chosen on the first visit
# and kept in the database; EXPECTING_LOGIN=off in docker/.env does without it.
# test/docker/compose.test.ts asserts the image, service name, port, volume,
# DATA_DIR and EXPECTING_LOGIN.
services:
  expecting:
    image: ${EXPECTING_IMAGE:-ghcr.io/sixthshift/expecting:latest}
    ports:
      - "9966:9966"
    volumes:
      # expecting.db lives here. EXPECTING_DATA_DIR sets the host folder (default ./data).
      - ${EXPECTING_DATA_DIR:-./data}:/data
    environment:
      DATA_DIR: /data
      # on (the default) asks for the household password, chosen on the first
      # visit; off lets anyone who reaches it in, for a LAN you trust. Each
      # phone still says who's holding it either way.
      EXPECTING_LOGIN: ${EXPECTING_LOGIN:-on}
    restart: unless-stopped
