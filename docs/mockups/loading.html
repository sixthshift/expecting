<!doctype html>
<!--
  Loading animation mockups: a gallery of ideas in different styles, to browse
  and shortlist. Open the file in a browser; it reads the real theme tokens from
  src/styles/theme/ by relative path. Hearts are kept in this browser only.
-->
<html lang="en-AU" data-expecting-theme="baby-purple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading mockups</title>
<link rel="stylesheet" href="../../src/styles/theme/palette.css">
<link rel="stylesheet" href="../../src/styles/theme/baby-purple.css">
<link rel="stylesheet" href="../../src/styles/theme/baby-blue.css">
<link rel="stylesheet" href="../../src/styles/theme/baby-pink.css">
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/figtree/index.css">
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/fraunces/soft.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--expecting-page);
    color: var(--fg-normal);
    font-family: "Figtree Variable", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 80px; }
  h1, h2, h3 { font-family: "Fraunces Variable", Georgia, serif; font-variation-settings: "SOFT" 100; font-weight: 500; margin: 0; }
  h1 { font-size: 2rem; }
  h2 { font-size: 1.4rem; }
  h3 { font-size: 1.05rem; }
  .lede { color: var(--fg-subtle); margin: 6px 0 0; max-width: 62ch; }

  .bar {
    position: sticky; top: 0; z-index: 2;
    background: var(--expecting-page);
    border-bottom: 1px solid var(--border-normal);
    margin: 20px -16px 0; padding: 12px 16px;
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    font-size: .9rem; color: var(--fg-subtle);
  }
  .themes { display: inline-flex; gap: 6px; }
  .themes button {
    font: inherit; border: 1px solid var(--border-normal); background: var(--expecting-page); color: var(--fg-normal);
    border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .themes button[aria-pressed="true"] { background: var(--bg-brand-subtle); color: var(--fg-brand); border-color: transparent; font-weight: 600; }
  .bar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .shortlist { margin-left: auto; }
  .shortlist b { color: var(--fg-brand); font-weight: 600; }

  section { margin-top: 44px; }
  .group-note { color: var(--fg-subtle); margin: 4px 0 16px; max-width: 70ch; font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .card {
    position: relative;
    border: 1px solid var(--border-normal);
    border-radius: 20px;
    padding: 24px 16px 14px;
    display: grid; gap: 10px; align-content: start;
  }
  .card.loved { border-color: var(--fg-brand); box-shadow: 0 0 0 1px var(--fg-brand) inset; }
  .stage { display: grid; place-items: center; height: 128px; }
  .art { display: inline-grid; place-items: center; }
  .art > * { width: 100%; height: 100%; }
  .stage .art { width: 112px; height: 112px; }
  .card p { margin: 0; color: var(--fg-subtle); font-size: .88rem; }
  .row { display: flex; align-items: center; gap: 12px; justify-content: space-between; color: var(--fg-subtle); font-size: .8rem; margin-top: 4px; }
  .row .small .art { width: 24px; height: 24px; }
  .button {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg-brand-subtle); color: var(--fg-brand);
    border-radius: 999px; padding: 5px 12px 5px 7px; font-weight: 600;
  }
  .button .art { width: 20px; height: 20px; }
  .love {
    position: absolute; top: 10px; right: 10px;
    border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 999px;
    color: var(--fg-subtle); font-size: 1.1rem; line-height: 1;
  }
  .love[aria-pressed="true"] { color: var(--fg-brand); }

  svg { display: block; overflow: visible; }

  /* Every animation stops when motion is reduced, by the OS or the toggle. */
  .still * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }

  /* Shared strokes and fills */
  .ink { fill: none; stroke: var(--fg-brand); stroke-linecap: round; stroke-linejoin: round; }
  .pale { fill: none; stroke: var(--bg-brand-subtle); }
  .solid { fill: var(--fg-brand); }
  .vb { transform-box: view-box; }

  /* ── Soft and abstract ─────────────────────────────────────────── */

  /* Two become three */
  .two-l { animation: two-l 3.6s ease-in-out infinite; }
  .two-r { animation: two-r 3.6s ease-in-out infinite; }
  .two-c { transform-origin: 50px 74px; animation: two-c 3.6s ease-in-out infinite; }
  @keyframes two-l { 0%, 100% { transform: translateX(-4px); } 35%, 78% { transform: translateX(8px); } }
  @keyframes two-r { 0%, 100% { transform: translateX(4px); } 35%, 78% { transform: translateX(-8px); } }
  @keyframes two-c { 0%, 38% { opacity: 0; transform: scale(0); } 52%, 76% { opacity: 1; transform: scale(1); } 92%, 100% { opacity: 0; transform: scale(0); } }

  /* Breathing gradient */
  .blob-wrap { display: grid; place-items: center; }
  .blob {
    width: 80%; height: 80%;
    background: linear-gradient(135deg, var(--expecting-accent-from), var(--expecting-accent-to));
    animation: morph 7s ease-in-out infinite, turn 12s linear infinite;
    border-radius: 58% 42% 36% 64% / 56% 38% 62% 44%;
  }
  .blob.small-blob { width: 100%; height: 100%; }
  @keyframes morph {
    0%, 100% { border-radius: 58% 42% 36% 64% / 56% 38% 62% 44%; scale: .94; }
    33% { border-radius: 40% 60% 62% 38% / 44% 58% 42% 56%; scale: 1.02; }
    66% { border-radius: 64% 36% 48% 52% / 38% 52% 48% 62%; scale: .98; }
  }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* Ripple */
  .ripple { transform-origin: 50px 50px; animation: ripple 2.7s cubic-bezier(.2, .6, .35, 1) infinite; opacity: 0; }
  .ripple:nth-of-type(2) { animation-delay: -.9s; }
  .ripple:nth-of-type(3) { animation-delay: -1.8s; }
  @keyframes ripple { 0% { transform: scale(.24); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
  .ripple-core { transform-origin: 50px 50px; animation: core 2.7s ease-in-out infinite; }
  @keyframes core { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.12); } 30% { transform: scale(1); } }

  /* Forty weeks */
  .week-dot { transform-box: fill-box; transform-origin: center; animation: tick 2.4s linear infinite; opacity: .2; }
  @keyframes tick { 0% { opacity: 1; transform: scale(1.7); } 22% { opacity: .2; transform: scale(1); } 100% { opacity: .2; transform: scale(1); } }

  /* Moon phases */
  .moon-shadow { animation: wax 5s ease-in-out infinite; }
  @keyframes wax {
    0% { transform: translateX(0); }
    45%, 50% { transform: translateX(72px); }
    50.01% { transform: translateX(-72px); }
    100% { transform: translateX(0); }
  }
  .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
  .twinkle:nth-of-type(2) { animation-delay: -.7s; }
  .twinkle:nth-of-type(3) { animation-delay: -1.4s; }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }

  /* Heartbeat */
  .heart { transform-origin: 50px 54px; animation: lubdub 1.4s ease-in-out infinite; }
  @keyframes lubdub { 0%, 40%, 100% { transform: scale(1); } 10% { transform: scale(1.12); } 22% { transform: scale(1.02); } 30% { transform: scale(1.08); } }

  /* ── From the logo ─────────────────────────────────────────────── */

  .tile-breathe { transform-origin: 50px 52px; animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(.96); } 50% { transform: scale(1.03); } }
  .zz { animation: zz 3.4s ease-out infinite; opacity: 0; font-family: "Fraunces Variable", Georgia, serif; font-weight: 600; }
  .zz.two { animation-delay: -1.7s; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 6px); } 20% { opacity: 1; } 80% { opacity: 0; transform: translate(8px, -14px); } 100% { opacity: 0; } }

  .tile-level { animation: level 4s ease-in-out infinite; }
  @keyframes level { 0% { transform: translateY(84px); } 70%, 86% { transform: translateY(30px); } 100% { transform: translateY(84px); } }

  /* Shared wave: slides one period sideways forever. */
  .wave { animation: wave 1.6s linear infinite; }
  .wave.slow { animation-duration: 2.6s; }
  .wave.back { animation-direction: reverse; }
  @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-40px); } }

  /* ── Nursery ───────────────────────────────────────────────────── */

  /* Mobile */
  .mobile-bar { transform-origin: 50px 6px; animation: sway 4.4s ease-in-out infinite; }
  .hang { animation: sway 3s ease-in-out infinite; }
  .hang.h1 { transform-origin: 22px 18px; animation-duration: 3.3s; }
  .hang.h2 { transform-origin: 50px 18px; animation-duration: 2.7s; animation-delay: -1s; }
  .hang.h3 { transform-origin: 78px 18px; animation-duration: 3.7s; animation-delay: -2s; }
  @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  /* Pram */
  .pram { animation: bob .7s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
  .wheel { transform-box: fill-box; transform-origin: center; animation: roll 1.1s linear infinite; }
  @keyframes roll { to { transform: rotate(360deg); } }
  .road { animation: road .55s linear infinite; }
  @keyframes road { to { stroke-dashoffset: 14; } }

  /* Bottle */
  .milk-level { animation: fill 4s ease-in-out infinite; }
  @keyframes fill { 0% { transform: translateY(92px); opacity: 1; } 70%, 86% { transform: translateY(50px); opacity: 1; } 100% { transform: translateY(50px); opacity: 0; } }

  /* Duck */
  .duck { transform-origin: 52px 60px; animation: paddle 2.2s ease-in-out infinite; }
  @keyframes paddle { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3px) rotate(4deg); } }

  /* Footprints */
  .step { opacity: 0; animation: step 2.8s ease-in-out infinite; }
  .step.f2 { animation-delay: .35s; }
  .step.f3 { animation-delay: .7s; }
  .step.f4 { animation-delay: 1.05s; }
  @keyframes step { 0% { opacity: 0; } 10%, 55% { opacity: 1; } 75%, 100% { opacity: 0; } }

  /* ── Growing ───────────────────────────────────────────────────── */

  .sprout { animation: sprout-fade 3.6s ease-in-out infinite; }
  .stem { stroke-dasharray: 1; stroke-dashoffset: 1; animation: stem 3.6s ease-in-out infinite; }
  .leaf { transform-origin: 50px 46px; transform: scale(0); }
  .leaf.l { animation: leaf 3.6s ease-out infinite; animation-delay: 0s; }
  .leaf.r { transform-origin: 50px 52px; animation: leaf2 3.6s ease-out infinite; }
  @keyframes stem { 0% { stroke-dashoffset: 1; } 30%, 100% { stroke-dashoffset: 0; } }
  @keyframes leaf { 0%, 26% { transform: scale(0); } 44%, 100% { transform: scale(1); } }
  @keyframes leaf2 { 0%, 34% { transform: scale(0); } 52%, 100% { transform: scale(1); } }
  @keyframes sprout-fade { 0%, 82% { opacity: 1; } 96%, 100% { opacity: 0; } }

  /* ── Waiting and getting ready ─────────────────────────────────── */

  /* Bun in the oven */
  .bun { transform-origin: 50px 70px; animation: rise 3.6s ease-in-out infinite; }
  @keyframes rise { 0% { transform: scale(.8, .55); } 70%, 88% { transform: scale(1, 1); } 100% { transform: scale(.8, .55); } }
  .oven-glow { animation: glow 1.8s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .25; } to { opacity: .75; } }
  .timer-hand { transform-origin: 72px 23px; animation: turn 3.6s linear infinite; }

  /* Circling the date */
  .ring-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ring-draw 3.2s ease-in-out infinite; }
  @keyframes ring-draw { 0%, 10% { stroke-dashoffset: 1; opacity: 1; } 45%, 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .the-day { transform-box: fill-box; transform-origin: center; animation: the-day 3.2s ease-in-out infinite; }
  @keyframes the-day { 0%, 40% { transform: scale(1); } 50% { transform: scale(1.5); } 60%, 100% { transform: scale(1); } }

  /* Knitting */
  .needles { transform-origin: 50px 32px; animation: click .5s ease-in-out infinite alternate; }
  .needles .n2 { transform-origin: 50px 32px; animation: click .5s ease-in-out infinite alternate-reverse; }
  @keyframes click { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .knit-row { opacity: 0; animation: knit 3.6s ease-out infinite; }
  @keyframes knit { 0% { opacity: 0; } 8%, 86% { opacity: 1; } 100% { opacity: 0; } }

  /* Packing the bag */
  .drop { animation: drop 3.6s cubic-bezier(.5, 0, .6, 1.3) infinite; }
  @keyframes drop { 0% { transform: translateY(-64px); opacity: 0; } 8% { opacity: 1; } 22%, 86% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
  .zip-tab { animation: zip 3.6s ease-in-out infinite; }
  @keyframes zip { 0%, 55% { transform: translateX(0); opacity: 1; } 75%, 86% { transform: translateX(44px); opacity: 1; } 100% { transform: translateX(44px); opacity: 0; } }
  .zip-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: zip-line 3.6s ease-in-out infinite; }
  @keyframes zip-line { 0%, 55% { stroke-dashoffset: 1; opacity: 1; } 75%, 86% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }

  /* Painting the nursery */
  .paint { transform-origin: 50px 90px; animation: paint 3.6s ease-in-out infinite; }
  @keyframes paint { 0% { transform: scaleY(0); opacity: 1; } 60%, 86% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
  .roller { animation: roller 3.6s ease-in-out infinite; }
  @keyframes roller { 0% { transform: translateY(72px); opacity: 1; } 60%, 86% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }

  /* Stork */
  .wing { transform-origin: 44px 46px; animation: flap .7s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.5); } }
  .stork { animation: glide 1.4s ease-in-out infinite alternate; }
  @keyframes glide { from { transform: translateY(-2px); } to { transform: translateY(2px); } }
  .bundle { transform-origin: 88px 35px; animation: swing 1.4s ease-in-out infinite alternate; }
  @keyframes swing { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  .cloud { animation: drift 3s linear infinite; }
  .cloud.c2 { animation-delay: -1.5s; }
  @keyframes drift { from { transform: translateX(40px); opacity: 0; } 15%, 85% { opacity: 1; } to { transform: translateX(-60px); opacity: 0; } }

  /* ── Round one: pregnancy ──────────────────────────────────────── */

  .curl-arc { transform-origin: 50px 50px; animation: turn 1.8s cubic-bezier(.45, .05, .55, .95) infinite; }
  .curl-breathe { transform-origin: 50px 52px; animation: breathe 3.2s ease-in-out infinite; }
  .scan-beam { transform-origin: 50px 10px; animation: sweep 1.8s ease-in-out infinite alternate; }
  .scan-baby { animation: surface 1.8s ease-in-out infinite; }
  @keyframes sweep { from { transform: rotate(-34deg); } to { transform: rotate(34deg); } }
  @keyframes surface { 0%, 100% { opacity: .18; } 50% { opacity: 1; } }
  .grow > * { transform-origin: 50px 50px; opacity: 0; }
  .grow .s1 { animation: s1 3.6s ease-in-out infinite; }
  .grow .s2 { animation: s2 3.6s ease-in-out infinite; }
  .grow .s3 { animation: s3 3.6s ease-in-out infinite; }
  @keyframes s1 { 0% { opacity: 0; transform: scale(.4); } 8%, 22% { opacity: 1; transform: scale(1); } 32%, 100% { opacity: 0; transform: scale(1.6); } }
  @keyframes s2 { 0%, 22% { opacity: 0; transform: scale(.6); } 32%, 48% { opacity: 1; transform: scale(1); } 58%, 100% { opacity: 0; transform: scale(1.25); } }
  @keyframes s3 { 0%, 48% { opacity: 0; transform: scale(.75); } 58%, 86% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1.04); } }
  .bump-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 3.2s ease-in-out infinite; }
  .bump-heart { transform-origin: 56px 60px; animation: warm 3.2s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 45% { stroke-dashoffset: 0; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes warm { 0%, 40% { opacity: 0; transform: scale(.5); } 55%, 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
  .test-line { animation: line 2.8s ease-in-out infinite; }
  @keyframes line { 0%, 10% { opacity: 0; } 55%, 80% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<main>
  <h1>Loading ideas</h1>
  <p class="lede">A spread of styles to browse, not a shortlist. Switch the theme, tap the heart on any you like (even a little), and tell me which: likes and dislikes both help narrow it down.</p>
  <div class="bar">
    <span class="themes" role="group" aria-label="Theme">
      <button data-theme="baby-purple" aria-pressed="true">Baby Purple</button>
      <button data-theme="baby-blue" aria-pressed="false">Baby Blue</button>
      <button data-theme="baby-pink" aria-pressed="false">Baby Pink</button>
    </span>
    <label><input type="checkbox" id="still"> Stop motion</label>
    <span class="shortlist" id="shortlist"></span>
  </div>
  <div id="groups"></div>
</main>

<script>
  let uid = 0;
  const id = (p) => `${p}${uid++}`;

  // The theme's two accent colours as an SVG gradient.
  const grad = (gid, dir = "diag") => {
    const [x2, y2] = dir === "down" ? [0, 1] : [1, 1];
    return `<linearGradient id="${gid}" x1="0" y1="0" x2="${x2}" y2="${y2}">
      <stop offset="0" stop-color="var(--expecting-accent-from)"/>
      <stop offset="1" stop-color="var(--expecting-accent-to)"/>
    </linearGradient>`;
  };

  // A filled wave whose crest is at y = 0, period 40, wide enough to slide one
  // period without showing an edge; everything below it is filled.
  const wave = (amp = 3) => {
    let d = "M-80 0";
    for (let i = 0; i < 8; i++) d += ` q10 ${-amp} 20 0 q10 ${amp} 20 0`;
    return `${d} V120 H-80 Z`;
  };

  // The logo: lucide's Baby, as in public/favicon.svg, eyes open or closed.
  const babyFace = (asleep) => `
    <path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/>
    ${asleep ? `<path d="M8 12.2q1 1 2 0"/><path d="M14 12.2q1 1 2 0"/>` : `<path d="M15 12h.01"/><path d="M9 12h.01"/>`}
    <path d="M19.38 6.813A9 9 0 0 1 20.8 10.2a2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>`;

  // The curled baby from round one.
  const curl = (cls = "") => `
    <g class="vb ${cls}">
      <circle class="solid" cx="43" cy="36" r="15"/>
      <ellipse class="solid" cx="56" cy="60" rx="16" ry="20" transform="rotate(-28 56 60)"/>
      <circle class="solid" cx="41" cy="67" r="9"/>
      <path fill="none" stroke="var(--expecting-page)" stroke-width="2.6" stroke-linecap="round" d="M47 55 C 52 58, 54 64, 50 70"/>
      <path fill="none" stroke="var(--expecting-page)" stroke-width="2.6" stroke-linecap="round" d="M36 44 C 38 47, 42 48, 45 47"/>
    </g>`;

  const star = (cx, cy, R, r = R * 0.45) => {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a = (Math.PI / 5) * i - Math.PI / 2;
      const rad = i % 2 ? r : R;
      pts.push(`${(cx + rad * Math.cos(a)).toFixed(2)},${(cy + rad * Math.sin(a)).toFixed(2)}`);
    }
    return `M${pts.join(" L")} Z`;
  };

  const sparkle = (cx, cy, s) =>
    `<path class="twinkle solid" d="M${cx} ${cy - s} Q${cx} ${cy} ${cx + s} ${cy} Q${cx} ${cy} ${cx} ${cy + s} Q${cx} ${cy} ${cx - s} ${cy} Q${cx} ${cy} ${cx} ${cy - s} Z"/>`;

  // A baby's footprint, toes up, at the origin; flip for the other foot.
  const foot = (x, y, rot, flip, cls) => `
    <g class="step ${cls}" transform="translate(${x} ${y}) rotate(${rot}) scale(${flip ? -1 : 1} 1)">
      <path class="solid" d="M-3.6 -1 C -4.6 -6, -1 -8.5, 1.6 -7.6 C 4.6 -6.6, 4.6 -2, 3.6 2.4 C 3 5.4, 2.6 8.4, -.2 8.6 C -3.4 8.8, -3.2 4.6, -3.6 -1 Z"/>
      <circle class="solid" cx="-3.4" cy="-10.6" r="1.7"/>
      <circle class="solid" cx="-.4" cy="-11.8" r="1.3"/>
      <circle class="solid" cx="2" cy="-11.2" r="1.1"/>
      <circle class="solid" cx="3.8" cy="-9.6" r="1"/>
      <circle class="solid" cx="4.9" cy="-7.6" r=".9"/>
    </g>`;

  // Animations whose timing differs per element, written here and added once.
  const generatedCss = [];
  const keyframes = (name, body) => {
    generatedCss.push(`@keyframes ${name} { ${body} }`);
    return name;
  };

  // A column that steps through `count` slots of `h` within the first `until`
  // percent of the cycle, each move quick and then a pause, then holds.
  const stepper = (name, count, h, until) => {
    let body = "0% { transform: translateY(0); }";
    for (let k = 1; k < count; k++) {
      const start = ((k - 1) / (count - 1)) * until, end = start + (until / (count - 1)) * 0.35;
      body += ` ${(start + (until / (count - 1)) * 0.65).toFixed(2)}% { transform: translateY(${-(k - 1) * h}px); }`;
      body += ` ${Math.min(end + (until / (count - 1)) * 0.65, until).toFixed(2)}% { transform: translateY(${-k * h}px); }`;
    }
    return keyframes(name, `${body} 100% { transform: translateY(${-(count - 1) * h}px); }`);
  };

  const fadeLoop = keyframes("fade-loop", "0% { opacity: 0; } 6%, 88% { opacity: 1; } 100% { opacity: 0; }");

  // The stork, facing right, around (50, 45): body, neck, head, beak, legs, a

        <p class="group-note">${g.note}</p>
        <div class="grid">
          ${g.items
            .map(
              (it) => `
            <div class="card ${loved.has(it.key) ? "loved" : ""}" data-key="${it.key}">
              <button class="love" aria-label="Like ${it.name}" aria-pressed="${loved.has(it.key)}">${loved.has(it.key) ? "♥" : "♡"}</button>
              <div class="stage"><span class="art">${it.art("big")}</span></div>
              <h3>${it.name}</h3>
              <p>${it.note}</p>
              <div class="row">
                <span class="button"><span class="art">${it.art("small")}</span>Saving</span>
                <span class="small"><span class="art">${it.art("small")}</span></span>
              </div>
            </div>`
            )
            .join("")}
        </div>
      </section>`
    )
    .join("");
  document.head.insertAdjacentHTML("beforeend", `<style>${generatedCss.join("\n")}</style>`);
  renderShortlist();

  document.getElementById("groups").addEventListener("click", (e) => {
    const btn = e.target.closest(".love");
    if (!btn) return;
    const card = btn.closest(".card");
    const key = card.dataset.key;
    loved.has(key) ? loved.delete(key) : loved.add(key);
    const on = loved.has(key);
    btn.setAttribute("aria-pressed", on);
    btn.textContent = on ? "♥" : "♡";
    card.classList.toggle("loved", on);
    try { localStorage.setItem(LOVED, JSON.stringify([...loved])); } catch {}
    renderShortlist();
  });

  document.querySelectorAll(".themes button").forEach((b) =>
    b.addEventListener("click", () => {
      document.documentElement.dataset.expectingTheme = b.dataset.theme;
      document.querySelectorAll(".themes button").forEach((o) => o.setAttribute("aria-pressed", o === b));
    })
  );

  document.getElementById("still").addEventListener("change", (e) => document.body.classList.toggle("still", e.target.checked));
</script>
</body>
</html>
